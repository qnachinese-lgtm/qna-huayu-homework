<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>臺灣生活溝通華語</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--line:#E7E0D5;--ink:#2E2A24;--muted:#8A8073;--primary:#B4694A;--soft:#F6EDE7;--green:#2F6B4F;--todo:#9A5B12;--todobg:#FFF6E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.8}
header{background:linear-gradient(135deg,#B4694A,#8E5138);color:#fff;padding:18px 20px}
.hw{max-width:940px;margin:0 auto}
.kicker{font-size:12.5px;opacity:.85;letter-spacing:.08em}
h1{margin:4px 0 0;font-size:22px}
.wrap{max-width:940px;margin:0 auto;padding:20px}
.note{background:#EFF7F1;border:1px solid #CBE3D5;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:#FBF7F1;font-weight:600;font-size:13px}
.vtabs{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
.vtab{padding:9px 20px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14.5px;font-family:inherit;color:var(--muted);font-weight:600}
.vtab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
.chipm{background:var(--soft);color:var(--primary);border-radius:999px;padding:3px 13px;font-size:12.5px;font-weight:600}
.goal{background:var(--soft);border-left:4px solid var(--primary);padding:11px 15px;border-radius:0 10px 10px 0;font-size:15.5px;margin:10px 0 18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:15px;overflow:hidden}
section>h2{margin:0;padding:12px 17px;font-size:15.5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.n{flex:none;width:25px;height:25px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:700}
.tag{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.body{padding:14px 17px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.wc{border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center;background:#FCFAF7}
.wc .ph{height:64px;border-radius:9px;background:#F1EBE1;display:flex;align-items:center;justify-content:center;color:#C3B9AB;font-size:11.5px;margin-bottom:8px}
.wc b{font-size:19px;display:block}
.wc .p{display:block;color:var(--primary);font-size:12.5px;line-height:1.5}
.wc .v{display:block;color:var(--green);font-size:13px;line-height:1.5;margin-top:1px}
.wc .ph img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.pc{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;background:#FCFAF7;display:flex;gap:12px;align-items:flex-start}
.pc .txt{flex:1;min-width:0}
.pc .zh{font-size:18px;font-weight:600}
.pc .p{color:var(--primary);font-size:13px}
.pc .v{color:var(--green);font-size:13.5px}
.au{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;width:36px;height:36px;cursor:not-allowed;color:#C3B9AB;font-size:15px}
.sub{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sub h4{margin:0 0 7px;font-size:13.5px;color:var(--muted)}
.bub{display:flex;margin-bottom:9px}
.bub.r{justify-content:flex-end}
.bub .b{max-width:78%;border-radius:16px;padding:9px 14px;background:#F1EBE1}
.bub.r .b{background:var(--soft)}
.bub .who{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.bub .zh{font-size:16px}
.bub .p{color:var(--primary);font-size:12.5px}
ol.ex,ul.ex{margin:0;padding-left:20px}
ol.ex li,ul.ex li{padding:4px 0;font-size:15px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:11px}
.tcard{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#FCFAF7;font-size:15px}
.tcard .i{color:var(--primary);font-weight:700;font-size:12px;display:block;margin-bottom:3px}
.hint{background:var(--todobg);border:1px solid #EBD6AC;border-radius:11px;padding:10px 14px;font-size:13.5px;margin-top:11px}
.mini{color:var(--muted);font-size:12.5px;margin-top:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.back{color:#fff;opacity:.9;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
a.lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:inherit;transition:.12s}
a.lcard:hover{border-color:var(--primary);box-shadow:0 3px 14px #B4694A1A}
a.lcard .no{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
a.lcard .tt{font-size:18px;font-weight:600;margin:3px 0 9px}
.vrow{display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:3px 0;border-top:1px dashed #EFE8DC}
.vrow b{color:var(--primary);min-width:52px;font-size:13px}
.vrow span{color:var(--muted)}
.stat{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.stat i{font-style:normal;background:var(--soft);color:var(--primary);border-radius:999px;padding:1px 9px}
.unit h3{font-size:15px;margin:0 0 12px;color:var(--primary);display:flex;align-items:center;gap:8px}
.unit h3::after{content:'';flex:1;height:1px;background:var(--line)}
.btn{padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--ink);text-decoration:none}
.btn.on{background:var(--primary);border-color:var(--primary);color:#fff}
.fn{display:inline-block;background:var(--soft);color:var(--primary);border-radius:999px;padding:1px 9px;font-size:11.5px;margin-bottom:3px}
.ansline{margin-top:5px;padding-top:5px;border-top:1px dashed #EFE8DC;font-size:13px;color:var(--green)}
.ansline b{color:var(--muted);font-weight:600;font-size:11.5px;margin-right:5px}
.ovw{background:#fff;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;padding:12px 15px;font-size:14px;line-height:1.85;margin-bottom:12px}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 17px;margin-top:16px}
.blk h3{margin:0 0 10px;font-size:15px;color:var(--primary)}
.blk ul{margin:0;padding-left:20px}
.blk li{font-size:13.5px;line-height:1.9;color:var(--ink)}
@media print{header,.bar,.vtabs,.note,.hint,.au{display:none!important}body{background:#fff}section{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<script src="tc2-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
var L=TC2[0],cur=0;

function secHtml(s,i){
  var b='';
  if(s.kind==='wordcard'){
    b='<div class="wgrid">'+s.rows.map(function(r){
      return '<div class="wc"><div class="ph">'+(r.img?'<img src="'+esc(r.img)+'" alt="'+esc(r.w)+'">':'圖片待補')+'</div><b>'+esc(r.w)+'</b>'+
        '<span class="p">'+esc(r.py)+'</span>'+(r.vi?'<span class="v">'+esc(r.vi)+'</span>':'')+'</div>';}).join('')+'</div>';
  }else if(s.kind==='table'){
    b='<table><tr>'+s.head.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>'+
      s.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</table>';
  }else if(s.kind==='pattern'||s.kind==='listen'){
    b=s.items.map(function(x){/*SEC_FN_V58*/
      return '<div class="pc"><button class="au" title="音檔待錄">▶</button><div class="txt">'+
        (x.fn?'<span class="fn">'+esc(x.fn)+'</span>':'')+
        '<div class="zh">'+esc(x.zh)+'</div><div class="p">'+esc(x.py)+'</div>'+
        (x.vi?'<div class="v">'+esc(x.vi)+'</div>':'')+
        (x.ans?'<div class="ansline"><b>學生回答</b>'+esc(x.ans)+'</div>':'')+
        '</div></div>';}).join('');
    if(s.sub){
      b+='<div class="sub"><h4>'+esc(s.sub.t)+'</h4>'+s.sub.items.map(function(x){
        return '<div class="pc"><button class="au" title="音檔待錄">▶</button><div class="txt">'+
          '<div class="zh">'+esc(x.zh)+'</div><div class="p">'+esc(x.py)+'</div></div></div>';}).join('')+'</div>';
    }
  }else if(s.kind==='dialog'){
    b=s.turns.map(function(t){
      var right=(t.who==='顧客'||t.who==='學生');
      return '<div class="bub'+(right?' r':'')+'"><div class="b"><div class="who">'+esc(t.who)+'</div>'+
        '<div class="zh">'+esc(t.zh)+'</div><div class="p">'+esc(t.py)+'</div></div></div>';}).join('');
  }else if(s.kind==='ol'){
    b='<ol class="ex">'+s.items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>';
  }else if(s.kind==='taskcard'){
    b='<div class="tcards">'+s.items.map(function(x,j){
      return '<div class="tcard"><span class="i">任務 '+(j+1)+'</span>'+esc(x)+'</div>';}).join('')+'</div>';
  }
  if(s.note)b+='<div class="hint">'+esc(s.note)+'</div>';
  var tagMap={wordcard:'圖片詞卡',pattern:'句型卡＋音訊',listen:'聽力題',dialog:'雙人對話氣泡',ol:'互動練習',taskcard:'情境任務卡',table:'對照表'};
  return '<section><h2><span class="n">'+(i+1)+'</span>'+esc(s.t)+
    '<span class="tag">'+(tagMap[s.kind]||'')+'</span></h2><div class="body">'+b+'</div></section>';
}

function grid(g,widths){
  widths=widths||[];
  if(!g)return '';
  if(Array.isArray(g))g={head:['版本','程度','核心能力','真實情境'],
    rows:g.map(function(c){return [c.v,c.lv,c.ability,c.real];})};
  return '<table><tr>'+g.head.map(function(hh,i){
      return '<th'+(widths[i]?' style="width:'+widths[i]+'px"':'')+'>'+esc(hh)+'</th>';}).join('')+'</tr>'+
    g.rows.map(function(r){return '<tr>'+r.map(function(c,i){
      return '<td>'+(i===0?'<b>'+esc(c)+'</b>':esc(c))+'</td>';}).join('')+'</tr>';}).join('')+'</table>';
}
function P(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}
function count(V){
  var w=0,s=0,d=0,t=0;
  V.sections.forEach(function(x){
    if(x.kind==='wordcard')w+=x.rows.length;
    if(x.kind==='pattern'||x.kind==='listen'){s+=x.items.length;if(x.sub)s+=x.sub.items.length;}
    if(x.kind==='dialog')d+=x.turns.length;
    if(x.kind==='taskcard')t+=x.items.length;
  });
  return {w:w,s:s,d:d,t:t};
}
function renderIndex(){
  var h='<header><div class="hw"><div class="kicker">QNA CHINESE</div><h1>'+esc(TC2[0].course)+'</h1>'+
    '<div style="font-size:13.5px;opacity:.9;margin-top:3px">同一個主題，三個難度版本 · 點課名進入</div></div></header><div class="wrap">';
  h+='<div class="note">每一課都分成<b>生存版／生活版／挑戰版</b>三個版本，各自是一堂完整的課，可以照學生程度分開上、分開指派作業。</div>';
  h+='<div class="unit"><h3>課程列表</h3><div class="lgrid">'+TC2.map(function(x){
      return '<a class="lcard" href="?l='+encodeURIComponent(x.id)+'"><div class="no">第 '+x.no+' 課</div>'+
        '<div class="tt">'+esc(x.title)+'</div>'+
        x.versions.map(function(v){var c=count(v);
          return '<div class="vrow"><b>'+esc(v.name)+'</b><span>'+esc(v.lv)+'　'+esc(v.time)+'</span></div>';}).join('')+
        (function(){var W=0,S=0,D=0,T=0;x.versions.forEach(function(v){var c=count(v);W+=c.w;S+=c.s;D+=c.d;T+=c.t;});
          return '<div class="stat"><i>生詞 '+W+'</i><i>句型 '+S+'</i><i>對話 '+D+' 句</i><i>任務 '+T+'</i></div>';})()+
        '</a>';}).join('')+'</div></div>';
  document.getElementById('app').innerHTML=h+'</div>';
  document.title=TC2[0].course;
}
function draw(){
  var V=L.versions[cur];
  var h='<header><div class="hw"><a class="back" href="./tc2.html">← 回課程列表</a>'+
    '<div class="kicker">'+esc(L.course)+'　·　第 '+L.no+' 課</div>'+
    '<h1>'+esc(L.title)+'</h1></div></header><div class="wrap">';
  h+='<div class="note"><b>這一課的內容完全照您提供的 Word 稿建置，逐字未改。</b>'+
     '原稿沒有越南文的段落我留白，沒有自行補譯；圖片和音檔尚未有素材，先放佔位。</div>';

  if(L.overview)h+='<div class="ovw">'+esc(L.overview)+'</div>';/*TC2_MODEL_V58*/
  h+=grid(L.compare,[110,150]);

  h+='<div class="vtabs">'+L.versions.map(function(v,i){
      return '<button class="vtab'+(i===cur?' on':'')+'" data-i="'+i+'">'+esc(v.name)+'</button>';}).join('')+
      '<button class="btn" onclick="window.print()" style="margin-left:auto">🖨 列印</button></div>';

  h+='<div class="meta"><span class="chipm">程度 '+esc(V.lv)+'</span><span class="chipm">建議時間 '+esc(V.time)+'</span></div>';
  h+='<div class="goal"><b>溝通目標：</b>'+esc(V.goal)+'</div>';
  h+=V.sections.map(secHtml).join('');

  if(L.bridge)h+='<div class="blk"><h3>三版本能力銜接</h3>'+grid(L.bridge,[110])+'</div>';
  if(L.madenote&&L.madenote.length)h+='<div class="blk"><h3>內容製作提醒</h3><ul>'+
     L.madenote.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';

  var nv=0,nvi=0;/*VI_COUNT_V58*/
  V.sections.forEach(function(s){
    if(s.kind!=='pattern'&&s.kind!=='listen')return;
    (s.items||[]).forEach(function(x){nv++;if(x.vi)nvi++;});
    if(s.sub)s.sub.items.forEach(function(x){nv++;if(x.vi)nvi++;});});
  if(nv)h+='<div class="hint">這個版本的句型卡共 '+nv+' 句，其中 '+nvi+' 句原稿有越南文、'+(nv-nvi)+' 句沒有。'+
     '要不要補越南文、由誰補，請您決定——我沒有自己加。</div>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('.vtab').forEach(function(b){
    b.onclick=function(){cur=+b.dataset.i;draw();window.scrollTo(0,0);};});
}
(function(){
  var id=P('l');
  var found=id?TC2.filter(function(x){return x.id===id;})[0]:null;
  if(found){L=found;cur=0;draw();}else{renderIndex();}
})();
</script>
</body>
</html>
