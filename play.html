<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>練習入口｜美娟華語工作室 QNA CHINESE</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
/* PLAY_V1719 免帳號練習入口：填一次名字，選「拼音練習」或「漢字闖關」。
   Quinn：「能不能做一個入口，然後出現拼音或是遊戲」「順便出現瀏覽人數，幫我統計」
   瀏覽數存在 stats/play（views 瀏覽次數、visitors 訪客人數、py／hz 各點了幾次）。 */
:root{--p:#1E4C86;--ps:#E4EDF9;--ink:#16202E;--mut:#7A8BA3;--line:#DCE4EF;--bg:#F4F7FB}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",PMingLiU,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px 32px}
.card{width:100%;max-width:440px;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(30,60,110,.10),0 2px 6px rgba(30,60,110,.05);padding:34px 30px 30px;text-align:center}
.logo{width:58px;height:58px;border-radius:14px;background:var(--p);color:#fff;font-size:30px;font-weight:700;line-height:58px;margin:0 auto 16px;box-shadow:0 4px 12px rgba(30,76,134,.28)}
h1{margin:0;font-size:24px;letter-spacing:3px}
.sub{margin:10px 0 0;font-size:15px;color:#4A5B75}
.sub2{margin:4px 0 24px;font-size:13px;color:var(--mut)}
.lbl{display:block;text-align:left;font-size:14px;font-weight:700;margin:0 0 6px}
.lbl span{font-weight:400;color:var(--mut);margin-left:4px}
input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#9AA9BD}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(30,76,134,.12)}
input.err{border-color:#C03A3A;box-shadow:0 0 0 3px rgba(192,58,58,.12)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.opt:hover{border-color:var(--p);box-shadow:0 6px 18px rgba(30,76,134,.12);transform:translateY(-2px)}
.opt i{font-style:normal;width:52px;height:52px;border-radius:14px;background:var(--ps);color:var(--p);font-size:28px;line-height:52px;font-family:"Times New Roman",serif}
.opt i.hz{font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC",serif}
.opt b{font-size:17px;letter-spacing:1px;margin-top:4px}
.opt small{font-size:12.5px;color:var(--mut)}
.none{margin-top:18px;padding:16px;border-radius:12px;background:#F5F8FD;color:#5B6B80;font-size:14px}
.or{display:flex;align-items:center;gap:12px;margin:24px 0 16px;color:var(--mut);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.acc{display:flex;align-items:center;justify-content:center;height:48px;border:1px solid var(--line);border-radius:12px;color:var(--p);font-weight:700;font-size:15px;letter-spacing:1px;text-decoration:none}
.acc:hover{background:#F5F8FD}
.stats{margin-top:22px;display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:8px 18px;font-size:13px;color:var(--mut);box-shadow:0 2px 8px rgba(30,60,110,.06)}
.stats b{font-size:17px;color:var(--p);margin:0 3px}
.stats .sep{width:1px;height:14px;background:var(--line)}
.stats[hidden]{display:none}
#role[hidden],#stu[hidden]{display:none}
.roles{margin-top:6px}.roles .opt{text-decoration:none;padding:26px 10px 22px}
.roles .opt i{font-family:"Noto Serif TC",serif;font-size:26px;width:58px;height:58px;line-height:58px}
.roles .opt b{font-size:18px}
.swap{display:block;margin:-6px auto 14px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}.swap:hover{color:var(--p)}
.tch{display:block;margin-top:16px;font-size:13.5px;color:var(--mut);text-decoration:none}.tch:hover{color:var(--p);text-decoration:underline}
.cj{display:flex;gap:8px}.cj input{flex:1;text-transform:uppercase;letter-spacing:3px;font-family:"Courier New",monospace;font-weight:700;text-align:center}
.cj input::placeholder{letter-spacing:1px;font-weight:400;font-family:"Noto Serif TC",serif}
.cj button{flex:none;height:50px;padding:0 18px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.bar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1100px)/2));z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.bl{width:34px;height:34px;border-radius:9px;background:var(--p);color:#fff;font-weight:700;font-size:18px;line-height:34px;text-align:center}
.brand b{font-size:17px;letter-spacing:1px}
.be{font-size:12px;letter-spacing:1.5px;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
.home{color:var(--p);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff}
.home:hover{background:#F5F8FD}
body{padding-top:100px!important}
.en{margin:6px 0 0;font-size:12.5px;letter-spacing:3px;color:var(--mut)}
@media(max-width:480px){.be{display:none}.brand b{font-size:15px}}
@media(max-width:420px){.card{padding:28px 20px 24px}.pick{gap:10px}}
.qf{max-width:640px;margin:40px auto 0;padding:18px 16px 8px;border-top:1px solid #DCE4EF;text-align:center;font-size:13px;line-height:1.8;color:#7A8BA3;font-family:"Noto Serif TC","Songti TC",serif}
.qf b{color:#3D4B5F}.qf a{color:#1E4C86;text-decoration:none;font-weight:700}.qf a:hover{text-decoration:underline}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="index.html"><span class="bl">美</span><b>美娟華語工作室</b><span class="be">QNA CHINESE</span></a><a class="home" href="index.html">官網 →</a></header>
<main class="card">
  <div class="logo">美</div>
  <h1>美娟華語工作室</h1>
  <p class="en">QNA CHINESE</p>
  <!-- ROLEPICK_V1725 Quinn：「先選擇身份，不要直接出現學生身份」 -->
  <div id="role">
    <p class="sub">請選擇你的身份</p>
    <p class="sub2">Who are you?</p>
    <div class="pick roles">
      <button class="opt" type="button" id="r-stu"><i>學</i><b>我是學生</b><small>Student</small></button>
      <a class="opt" href="class.html"><i>師</i><b>我是老師</b><small>Teacher</small></a>
    </div>
  </div>
  <div id="stu" hidden>
  <button class="swap" type="button" id="r-back">← 換身份 · Change</button>
  <p class="sub">填上名字，選一個開始練習</p>
  <p class="sub2">Enter your name and choose a practice</p>
  <label class="lbl" for="nm">你的名字 <span>Your name</span></label>
  <input id="nm" maxlength="40" autocomplete="off" placeholder="例如：Lan / 小明">
  <div class="pick" id="pick"></div>
  <div class="or">老師給了班級代碼？ · Class code</div>
  <div class="cj"><input id="cc" maxlength="8" autocomplete="off" placeholder="例如：K7Q2MX"><button id="ccgo" type="button">加入 · Join</button></div>
  <div class="or">或 · or</div>
  <a class="acc" href="student.html">用學生帳號登入 · Log in</a>
  </div>
</main>
<div class="stats" id="stats" hidden>累計訪客<b id="sv">0</b>人<span class="sep"></span>瀏覽<b id="sp">0</b>次</div>
<footer class="qf"><div><b>黃美娟 Quinn Huang</b>・<a href="mailto:qnachinese@gmail.com">qnachinese@gmail.com</a></div><div>有任何問題都可以聯絡我，也歡迎<a href="mailto:qnachinese@gmail.com?subject=%E5%95%8F%E9%A1%8C%E5%9B%9E%E5%A0%B1%EF%BD%9C%E7%BE%8E%E5%A8%9F%E8%8F%AF%E8%AA%9E%E5%B7%A5%E4%BD%9C%E5%AE%A4">回報問題</a> · Questions or bug reports? Email me anytime.</div></footer><!-- QFOOT_V1727 -->

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const GAMES=[{k:'pinyin',flag:'guest_pinyin',href:'pinyin.html?guest=1',ic:'ā',cls:'',t:'拼音練習',e:'Pinyin practice'},
             {k:'hanzi',flag:'guest_hanzi',href:'hanzi.html?guest=1',ic:'字',cls:'hz',t:'漢字闖關',e:'Hanzi game'}];
const nm=$('#nm');try{nm.value=localStorage.getItem('qna_guest_name')||''}catch(e){}
let db=null;
try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore();}catch(e){}
function go(g){const v=nm.value.trim().slice(0,40);
  if(!v){nm.classList.add('err');nm.focus();nm.placeholder='請先填名字 · Please enter your name';return}
  try{localStorage.setItem('qna_guest_name',v)}catch(e){}
  const done=()=>{location.href=g.href};
  if(db){const inc=firebase.firestore.FieldValue.increment(1);
    db.collection('stats').doc('play').set({[g.k==='pinyin'?'py':'hz']:inc},{merge:true}).catch(()=>{}).finally(done);setTimeout(done,800);}
  else done();}
nm.addEventListener('input',()=>nm.classList.remove('err'));
/* ROLEPICK_V1725 先選身份 */
const showStu=on=>{$('#role').hidden=on;$('#stu').hidden=!on;if(on){try{history.replaceState(null,'','#student')}catch(e){}nm.focus()}else{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}};
$('#r-stu').onclick=()=>showStu(true);$('#r-back').onclick=()=>showStu(false);
if(location.hash==='#student')showStu(true);
/* TCLASS_V1722 班級代碼 → 班級頁 */
const cc=$('#cc');const cgo=()=>{const c=cc.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!c){cc.focus();return}const v=nm.value.trim().slice(0,40);if(v){try{localStorage.setItem('qna_guest_name',v)}catch(e){}}location.href='room.html?c='+encodeURIComponent(c)};
$('#ccgo').onclick=cgo;cc.onkeydown=e=>{if(e.key==='Enter')cgo()};
function draw(on){const list=GAMES.filter(g=>on[g.flag]);
  const box=$('#pick');
  if(!list.length){box.className='none';box.textContent='目前還沒有開放 · Not open yet';return}
  box.className='pick';if(list.length===1)box.style.gridTemplateColumns='1fr';
  box.innerHTML=list.map((g,i)=>'<button class="opt" type="button" data-i="'+i+'"><i class="'+g.cls+'">'+g.ic+'</i><b>'+g.t+'</b><small>'+g.e+'</small></button>').join('');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>go(list[+b.dataset.i]));}
async function boot(){
  let on={guest_pinyin:true,guest_hanzi:true};
  if(db){try{const d=await db.collection('site').doc('games').get();on=d.exists?d.data():{}}catch(e){}}
  draw(on);
  if(!db)return;
  /* 統計：每次打開算一次瀏覽；這台裝置第一次來才算一位訪客 */
  let first=false;try{first=!localStorage.getItem('qna_play_seen');localStorage.setItem('qna_play_seen','1')}catch(e){}
  const inc=firebase.firestore.FieldValue.increment(1);const up={views:inc};if(first)up.visitors=inc;
  try{await db.collection('stats').doc('play').set(up,{merge:true})}catch(e){}
  try{const s=await db.collection('stats').doc('play').get();const x=s.exists?s.data():{};
    $('#sv').textContent=Number(x.visitors||0).toLocaleString();$('#sp').textContent=Number(x.views||0).toLocaleString();$('#stats').hidden=false}catch(e){}}
boot();
})();
</script>
</body>
</html>
