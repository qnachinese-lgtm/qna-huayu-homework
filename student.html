<!doctype html>
<!-- ⚠️ HANZI_NOTE 漢字遊戲（字族工坊）備註——改這個檔案之前請先看：
     1. 漢字遊戲的程式「不在」這個檔案裡，全部在 hanzi.html、hanzi-game.js、hanzi-data.js、hanzi-teacher.js、hanzi-student.js。
     2. 它是靠 db.js 最後面的「HANZI_LOADER」那一段，自動接到老師後台（teacher.html）和學生頁（student.html）。
     3. 所以：不要在 teacher.html／teacher-app.js／student.html 裡加漢字遊戲的程式；也不要刪 db.js 的 HANZI_LOADER、根目錄的 check-hanzi.js、vercel.json 的 buildCommand。
     4. 每次修改前先從 GitHub 下載「最新」的檔案再改，不要拿電腦裡或別的對話裡的舊檔案上傳（舊檔案會把別人改過的東西蓋掉）。
     5. 上傳後如果 GitHub 出現紅色 ✕，代表漢字遊戲需要的東西被弄掉了，網站會維持上一版，點進去看說明再補回來。 -->

/* V813 */
/* LOGINSAFE_V1346 登入的錯誤訊息本來是夾在密碼欄和登入鈕中間的一行小紅字，
   很容易被當成「按了沒反應」（Quinn 就是這樣）。改成有底色的方框，空的時候完全不佔位。 */
#gate #g-err{display:none}
#gate #g-err:not(:empty){
  display:block;margin:10px 0 2px;padding:10px 12px;border-radius:10px;
  background:#FDECEA;border:1px solid #F3C2BC;color:#A33227;
  font-size:14px;font-weight:700;line-height:1.5;text-align:left}

#app .gp-qn{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;color:#1E4C86;
  background:#E8EFF7;border:1px solid #C7D8EF;border-radius:99px;padding:2px 9px;white-space:nowrap}
#app .gp-fold>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#app .startprac-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#app .startprac-sub{margin:0}
@media(max-width:480px){#app .gp-qn{font-size:11.5px;padding:2px 7px}}

<style>
/* ===== 漢語拼音一律用 Times New Roman（只影響拉丁字母，中文維持原字體） ===== */
@font-face{font-family:'PinyinRoman';font-style:normal;font-weight:400;
  src:local('Times New Roman'),local('Georgia'),local('Noto Serif'),local('DejaVu Serif'),local('Liberation Serif');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
@font-face{font-family:'PinyinRoman';font-style:normal;font-weight:700;
  src:local('Times New Roman Bold'),local('Times New Roman'),local('Georgia Bold'),local('Georgia'),local('Noto Serif'),local('Liberation Serif Bold');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
@font-face{font-family:'PinyinRoman';font-style:italic;font-weight:400;
  src:local('Times New Roman Italic'),local('Times New Roman'),local('Georgia Italic'),local('Georgia'),local('Noto Serif');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
/* 錯題本／作業簿：拉丁字母一律 Times New Roman */
.wb-wrap,.wb-wrap *,.wb-sec,.wb-sec *,.wb-py,.wb-ref,.wb-filled,.wb-in,.wb-bl,.opt-blank,.wbrev,.wbrev *,.mist-tag,.hw-img+*{font-family:'PinyinRoman',var(--font)}
.wb-wrap h2,.wb-wrap h3,.wb-sec>summary{font-family:'PinyinRoman',var(--serif)}

.ex-item,.gp-ex-body,.vtab-ex,.vtab-ex .ex-item{font-family:'PinyinRoman',var(--serif)}
.vtab-c.vt-py,.vrow-py{font-family:'PinyinRoman',var(--font)}
ruby rt,.flash-rd,.zi-pop .zi-py{font-family:'PinyinRoman',"Helvetica Neue",Arial,system-ui,sans-serif}

body,input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="date"],input[type="tel"],input[type="search"],input[type="url"],input:not([type]),select,textarea,
.btn,.tab,.note-tab,.mode-tag,.brand-sub{font-family:'PinyinTone',var(--font)}
h1,h2,h3,.brand,.student-card .name,.avatar,.flash-word,.vocab-chip,.zi-pop .zi-big,.ex-item,.lesson-no,.score-pill,.score-pill small{font-family:'PinyinTone',var(--serif)}
ruby rt,.flash-rd,.zi-pop .zi-py{font-family:'PinyinTone',"Helvetica Neue",Arial,"Segoe UI",system-ui,"Noto Sans",sans-serif}
/* 讓頂列和內容欄同寬置中，避免展開課程時看起來歪一邊 */
.topbar-inner{max-width:760px!important}
/* 內容欄永遠 760 置中，任何情況都不被撐寬或推移 */
.container,.container.narrow{max-width:760px!important;margin-left:auto!important;margin-right:auto!important}
/* 內容欄永遠 760 置中；筆記改為在課程卡「內部」與課文左右並排（見 styles.css），
   因此不需要、也不會位移整個版面。 */
/* 防止課程內容（音檔/圖片/表格）撐破欄寬導致版面跑掉 */
/* LEAVEREQ_V1204 請假／改時間 */
.lv-bar{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line,#FDF3D8)}
.lv-bar .btn{width:100%;justify-content:center}
.lv-mine{margin-top:10px}
.lv-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;font-size:13.5px}
.lv-md{flex:1;min-width:120px}
.lv-rp{flex:1 1 100%;color:var(--muted,#8E9CAF);font-size:12.5px}
.badge.lv-no{background:#F8E7E4;color:#A33227;border-color:#F0C9C2}
#screen{max-width:100%}
#screen audio,#screen img,#screen video,#screen canvas,#screen table{max-width:100%}
#screen audio{width:100%}
/* 課文以「詞」為單位斷行：每個詞不從中間換行 */
.prose .ci-wrap,.ci-wrap{white-space:nowrap}
/* 關鍵修正：展開課程時，過寬的內容（生詞拼音列 .vrow-py、討論作答 textarea 等）
   一律不得撐大白色卡片；否則卡片會超出 760 欄寬、開筆記時就會被蓋住。 */
#screen .card{max-width:100%!important;box-sizing:border-box}
#screen .ls-text{min-width:0;max-width:100%;overflow-wrap:anywhere}
#screen .ls-text .vrow-py{white-space:normal!important}
#screen .ls-text textarea{max-width:100%!important;width:100%!important;box-sizing:border-box}
#screen .ls-sec,#screen .ls-sec-b,#screen .lesson-block,#screen .audio-wrap,#screen .dlg-fold,#screen .dlg-fold-body,#screen .prose{min-width:0!important;max-width:100%!important}

/* ---- 內容頁美化 ---- */
.card{border-radius:16px;box-shadow:0 3px 14px rgba(22,32,46,.07);border:1px solid rgba(30,76,134,.09)}
.snav button{border-radius:999px}
/* SNAV_V1059s 手機上這一排有六顆、量出來 548px，390px 的螢幕裝不下，
   「📈 我的成績」和「ℹ️ 資訊」被推到橫向捲動後面，學生根本看不到有這兩個。
   窄螢幕改成兩排三顆，每一顆等寬，全部看得見。 */
@media (max-width:560px){
  #snav{flex-wrap:wrap!important;overflow:visible!important;
    row-gap:4px!important;column-gap:4px!important;padding:2px 10px 4px!important}
  #snav button{flex:1 0 calc(33.333% - 3px)!important;width:auto!important;min-width:0!important;
    justify-content:center!important;padding:8px 2px 9px!important;font-size:12.5px!important;gap:5px!important}
  #snav button.on:after{left:6px!important;right:6px!important}
  #snav button .ic{font-size:15px!important;flex:0 0 auto}
}
@media (max-width:340px){
  #snav button{flex:1 0 calc(50% - 2px)!important}
}
.book-bar2{gap:8px;margin:2px 0 16px}
.book-chip{border-radius:999px;padding:8px 18px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);transition:.15s ease}
.book-chip:hover{border-color:var(--primary);color:var(--primary)}
.book-chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(22,32,46,.28)}
.ls-card>summary{padding:16px 18px}
.ls-card .lesson-no{border-radius:13px;box-shadow:0 3px 8px rgba(22,32,46,.28)}
.ls-card h3{letter-spacing:.5px}

/* ---- 已送出作業清單 ---- */
.sw-card>summary.sw-title{cursor:pointer;font-weight:700;font-size:15px;list-style:none;color:var(--primary)}
.sw-card>summary.sw-title::-webkit-details-marker{display:none}
.sw-row{border-top:1px solid var(--line);padding:10px 2px}
.sw-row:first-of-type{border-top:none}
.sw-head{display:flex;align-items:flex-start;gap:8px}
details.sw-row>summary{list-style:none;cursor:pointer}
details.sw-row>summary::-webkit-details-marker{display:none}
.vex-fold>summary::-webkit-details-marker{display:none}.vex-fold>summary::marker{content:''}.vex-fold[open]>summary{margin-bottom:2px}
.sw-more{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--primary);font-weight:600}
.sw-qalist{margin-top:8px;padding:10px 12px;background:#FDF3D8;border-radius:12px}
.sw-qa{padding:7px 0;border-top:1px dashed var(--line)}
.sw-qa:first-child{border-top:none}
.sw-q{font-weight:600;font-size:14px;display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.sw-qn{background:var(--primary);color:#fff;border-radius:50%;min-width:19px;height:19px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.sw-a{margin:4px 0 0 26px;color:#5B6B80;font-size:14px;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 9px}

/* ---- 課程卡片標籤 ---- */
.ls-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.ls-tag{font-size:11.5px;color:#5B6B80;background:rgba(30,76,134,.08);border-radius:999px;padding:2px 9px;white-space:nowrap}
.ls-tag.done{color:#1F6A54;background:rgba(22,163,74,.13);font-weight:700}

/* ---- 學習進度卡 ---- */
.prog-card{margin-bottom:12px}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-bar{height:9px;background:rgba(30,76,134,.12);border-radius:999px;overflow:hidden}
.prog-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#1E4C86);border-radius:999px;transition:width .45s ease}

/* ---- 老師回饋橫幅 ---- */
.fb-banner{cursor:pointer;background:linear-gradient(90deg,#EDE9FE,#EDE9FE);border:1px solid #E2CFFA;color:#6D28D9;border-radius:14px;padding:12px 16px;margin-bottom:12px;font-weight:600;box-shadow:0 2px 8px rgba(200,140,20,.12)}
.fb-banner:hover{filter:brightness(.98)}

/* ---- 生詞卡控制列 ---- */
.flash-controls{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:14px}
.flash-tools,.flash-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn-know-no{background:#fff;border:1.5px solid #F0C9C2;color:#A33227;font-weight:600}
.btn-know-yes{background:#E1F0EA;border:1.5px solid #BFE0CB;color:#1F6A54;font-weight:600}
.btn-know-no:hover{background:#F8E7E4}.btn-know-yes:hover{background:#E1F0EA}
.flash-count{color:var(--muted);font-size:13px;min-width:52px;text-align:center}

/* ---- 團班資訊卡 ---- */
.class-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffffff 0%,#F8E7E4 100%);border:1px solid rgba(163,113,78,.15);border-radius:18px;padding:16px 18px 15px;margin-bottom:14px;box-shadow:0 4px 16px rgba(163,113,78,.10)}
.class-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),#A33227)}
.cb-head{display:flex;align-items:center;gap:10px}
.cb-ic{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--primary);border-radius:11px;box-shadow:0 3px 8px rgba(163,113,78,.32)}
.cb-label{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:.5px}
.cb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cb-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#5B6B80;background:#fff;border:1px solid rgba(163,113,78,.20);border-radius:999px;padding:6px 13px;box-shadow:0 1px 3px rgba(163,113,78,.07)}
.cb-chip.cb-cls{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 2px 6px rgba(163,113,78,.3);font-weight:800;letter-spacing:.5px}
.cb-note{margin-top:12px;font-size:12.5px;color:var(--muted);border-top:1px dashed rgba(163,113,78,.16);padding-top:9px}
/* ===== 課文插圖：不要滿版，點一下才放大 ===== */
.ls-pic{text-align:center}
.ls-img{max-width:min(100%,460px);max-height:330px;width:auto;height:auto;object-fit:contain;
  border-radius:12px;border:1px solid var(--line,#DCE5F0);background:#fff;display:inline-block;cursor:zoom-in;
  box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s}
.ls-img:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ls-img-hint{font-size:12px;color:var(--muted,#8E9CAF);margin-top:5px}
@media(max-width:640px){.ls-img{max-width:100%;max-height:none}.ls-img-hint{display:none}}
#pic-big{position:fixed;inset:0;z-index:9999;background:rgba(20,16,12,.86);display:flex;
  align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#pic-big img{max-width:96vw;max-height:92vh;border-radius:10px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#pic-big .pb-x{position:absolute;top:14px;right:18px;font-size:30px;line-height:1;color:#fff;background:none;border:0;cursor:pointer}
/* 題目插圖也一起限制，避免小圖被拉大 */
#screen .q-pic img{max-width:min(100%,420px);height:auto;border-radius:10px}
/*EXAMVIEW_V67 考題版面：短選項橫排、閱讀材料的圖放大可點*/
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:700px){.opts.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.c2{grid-template-columns:1fr}}
#screen .note-card .q-pic img{max-width:100%;width:100%;max-height:none;height:auto;cursor:zoom-in}
/*QSEL_V70 選詞填空用下拉，學生不用一直往下滑*/
/*INLSEL_V72 選詞填空的下拉直接長在短文的空格上*/
/*MATCARD_V73 閱讀材料卡片重新排版*/
/*TRANSCRIPT_V75 聽力文本（老師開放後才顯示）*/
#screen .tsc{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
#screen .tsc-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--soft);cursor:pointer;user-select:none}
#screen .tsc-h .grow{flex:1}
#screen .tsc-b{padding:4px 14px 14px}
#screen .tsc-item{padding:12px 0;border-top:1px dashed var(--line)}
#screen .tsc-item:first-child{border-top:0}
#screen .tsc-no{font-weight:700;color:var(--muted);font-size:13px;margin-bottom:6px}
#screen .tsc-t{display:flex;gap:8px;margin:5px 0;line-height:1.75}
#screen .tsc-w{flex:none;min-width:30px;height:22px;padding:0 6px;border-radius:6px;background:#A33227;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:3px}
#screen .tsc-w.f{background:#8E9CAF}
#screen .tsc-q{margin-top:8px;color:#A33227;font-size:14px;line-height:1.7}
/*MATTAB_V74 文字／圖片切換*/
.mat-tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:2px 0 10px;background:var(--surface)}
.mat-tabs .mtb{padding:5px 14px;border:0;border-right:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.mat-tabs .mtb:last-child{border-right:0}
.mat-tabs .mtb.on{background:var(--accent);color:#fff}
.mat-body.hide{display:none}
#screen .note-card{border-style:solid;border-left:4px solid var(--accent);background:var(--surface-2);padding:15px 18px}
.mat-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.mat-kicker{font-size:13.5px;font-weight:800;color:var(--accent);letter-spacing:.01em}
.mat-type{font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.mat-title{font-size:18px;font-weight:700;line-height:1.6;margin:0 0 8px;color:var(--ink)}/*MATORD_V76*/
/*ACTDO_V746 課室活動：一個活動一張卡，下面是選填的作答框*/
.act-tip{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);
  border-radius:10px;padding:8px 12px;margin-bottom:10px;line-height:1.7}
.act-card{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:10px;background:var(--surface)}
.act-h{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.act-h b{font-size:15.5px;line-height:1.6}
.act-no{flex:none;min-width:26px;height:26px;padding:0 7px;border-radius:8px;background:var(--accent);color:#fff;
  font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.act-b .al{margin:0 0 5px;line-height:1.85;font-size:14.5px}
.act-b .al b{color:var(--accent)}
.act-b .al-p{padding-left:1.1em}
.act-do{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
.act-do>summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--primary);list-style-position:inside}
.act-ta{width:100%;box-sizing:border-box;margin-top:8px;font-family:inherit;font-size:15px;line-height:1.8;

.act-f{display:flex;align-items:center;gap:10px;margin-top:8px}
.act-st{font-size:12.5px;color:var(--muted);flex:1}

.note-text .mp-s{padding-left:1.9em;margin-top:-4px}
.note-text .mp-n b,.note-text .mp-s b{color:var(--accent)}
.mat-hint{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.inl-sel{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;margin:0 4px}

/* 文言文：一句一塊，原文大、注釋小，底下筆記和翻譯並排 */

/* CLNAV_V1058 文言文一課二三十段，捲到一半不知道自己在哪裡。右下角一個小方塊。 */
#clnav{position:fixed;right:16px;bottom:18px;z-index:70;display:none;
  align-items:center;gap:6px;padding:6px 8px;border-radius:999px;
  background:rgba(255,255,255,.96);border:1px solid var(--line,#DCE5F0);

/* CLNAME_V1011 人名＝深藍粗體，地名＝棕色點線底線，跟講義印出來一樣 */
/* LANGMENU_V1020 跟教師端 #ui-lang 那一套一樣的長相 */
/* styles.css 裡的 .langs 是舊的四格並排樣式，帶 overflow:hidden——
   下拉選單會被它整個切掉（測出來的：選單在 DOM 裡、位置也對，就是看不到）。
   這裡把那層外框解掉。 */
.langs{display:inline-block;border:0;overflow:visible;border-radius:0;background:none}
.lang-wrap{position:relative;display:inline-block}
.lang-btn .lg-ic{width:16px;height:16px;flex:0 0 16px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;color:var(--muted,#5B6B80)}
.langs .lang-btn,.lang-btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;cursor:pointer;
  background:var(--surface,#fff);border:1px solid var(--line,#DCE5F0);border-radius:9px;
  padding:6px 12px;font:inherit;font-size:13px;color:var(--ink,#16202E)}
.langs .lang-btn:hover,.lang-btn:hover{background:var(--accent-soft,#E4EDF9)}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:80;
  background:var(--surface,#fff);border:1px solid var(--line,#DCE5F0);border-radius:11px;
  box-shadow:0 10px 28px rgba(22,32,46,.16);overflow:hidden;min-width:100%}
.lang-menu[hidden]{display:none}
.langs .lang-menu button,.lang-menu button{display:block;width:100%;text-align:center;white-space:nowrap;
  background:none;border:0;border-bottom:1px solid var(--line,#DCE5F0);
  padding:10px 18px;font:inherit;font-size:14px;color:var(--ink,#16202E);cursor:pointer}
.langs .lang-menu button:last-child,.lang-menu button:last-child{border-bottom:0}
.langs .lang-menu button:hover,.lang-menu button:hover{background:var(--accent-soft,#E4EDF9)}
.langs .lang-menu button.on,.lang-menu button.on{background:var(--accent,#1E4C86);color:#fff;font-weight:700}
/* 登入頁那一個置中，選單就不要靠右貼邊 */
/* AUTHTAB_V1259 登入／免費註冊：一條兩半的切換，不要兩顆散開的小按鈕 */
.auth-tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin:0 0 20px}
.auth-tabs button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;
  padding:10px 6px;font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer}
.auth-tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
/* AUTH3_V1353 老師登入那一顆是 <a>（要跳到另一個檔案），樣式跟旁邊的按鈕對齊
   TAB3FS_V1358 這裡原本只寫 font:inherit，而 .auth-tabs 本身沒有字級，所以它一路
   繼承到 body 的 16px；旁邊兩顆 <button> 明寫了 14.5px。差 10%，看起來就是老師登入
   那四個字比較大（她截圖量出來 78×19px vs 70×17px）。字級、字重都補上。 */
.auth-tabs .at-teacher{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:9px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;
  font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.auth-tabs .at-teacher:hover{color:var(--primary)}
@media(max-width:380px){.auth-tabs-3 button,.auth-tabs-3 .at-teacher{font-size:13px;padding-left:4px;padding-right:4px}}

/* GATE_V1357 第二次嘗試。上一次（V1354）我只動間距和粗細，等於把原本就平淡的東西
   再壓平一點，所以更難看。這次改的是「有沒有層次」：
   ① 背景從一片死灰藍，改成跟她後台同一套柔霧藍漸層——前後台看起來像同一個品牌；
   ② 卡片給真正的厚度（更大的圓角、兩層陰影、白到微藍的漸層），不再是一張白紙；
   ③ 生 的徽章放大、壓在卡片上緣一半，是這一頁唯一的視覺重點；
   ④ 輸入框去掉細邊框、改成有底色的槽，聚焦時才用品牌藍描邊；
   ⑤ 登入鈕給漸層和陰影，按下去會沉一點。
   顏色全部沿用她既有的品牌藍，沒有引進新色系。 */
#gate.login-wrap{
  background:
    radial-gradient(900px 560px at 8% -12%, #C9DCF3 0%, rgba(201,220,243,0) 58%),
    radial-gradient(820px 520px at 95% -6%, #D6E4F6 0%, rgba(214,228,246,0) 56%),
    radial-gradient(1000px 640px at 60% 108%, #DCE9F7 0%, rgba(220,233,247,0) 60%),
    #EFF4FA;
  background-attachment:fixed;padding:40px 20px}

#gate .login-card{
  position:relative;max-width:404px;padding:44px 30px 26px;border-radius:24px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FBFDFF 100%);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 1px 2px rgba(22,32,46,.04),0 18px 48px rgba(30,76,134,.16)}

/* 生 的徽章：放大、壓在卡片上緣 */
#gate .brand-badge{
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:62px;height:62px;border-radius:18px;font-size:31px;margin:0;
  box-shadow:0 8px 20px rgba(30,76,134,.30);border:3px solid #fff}
/* 語言選擇移到卡片右上角：本來緊接在徽章下面，變成「生→地球→標題→副標」
   四層置中堆疊，又擠又跟 logo 搶視覺。移開之後中央只剩品牌。 */
#gate .langs{position:absolute;top:14px;right:14px;margin:0!important;z-index:2}
#gate .langs .lang-btn,#gate .langs button{padding:0 10px;height:30px;font-size:12.5px}
/* HOME_V1358 登入頁本來沒有任何一條路回官網——從官網按「登入」進來的人，
   想回去只能靠瀏覽器上一頁。把品牌本身做成連結：不多一顆鈕，但有路可走。 */
#gate .gate-home{display:block;text-decoration:none;color:inherit}
#gate h1{font-size:23px;letter-spacing:.3px;margin:0 0 3px;font-family:"Roboto","Helvetica Neue",system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans TC",sans-serif;font-weight:800}
#gate p.sub{margin:0 0 20px;font-size:13.5px;color:#6A7C95}

/* 分頁列 */
#gate .auth-tabs{padding:4px;border-radius:14px;margin:0 0 20px;
  background:#E8EFF7;border:1px solid rgba(30,76,134,.07)}
#gate .auth-tabs button,#gate .auth-tabs .at-teacher{
  padding:10px 6px;font-size:14px;border-radius:11px;color:#5B6B80;
  transition:background .16s,color .16s,box-shadow .16s}
#gate .auth-tabs button:not(.on):hover,#gate .auth-tabs .at-teacher:hover{
  background:rgba(255,255,255,.6);color:#1E4C86}
#gate .auth-tabs button.on{background:#fff;color:#1E4C86;
  box-shadow:0 1px 2px rgba(22,32,46,.05),0 4px 12px rgba(30,76,134,.14)}
/* TAB3EQ_V1358 她說「這三個比例不對」。量出來：三個都是四個字（文字寬都是 52px），
   框卻是 121/121/82——老師登入窄了 32%，而且字重 700 比旁邊的 600 粗，
   左右 padding 還是 15/11 不對稱（為了讓出分隔線），文字在自己框裡就偏了 2px。
   改成三等分：一樣的 flex、一樣的 padding、一樣的字重。分隔線拿掉——
   只在第二、三顆之間有一條線，本身就是不對稱的。 */
#gate .auth-tabs .at-teacher{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px}

/* 輸入框：有底色的槽，不要細邊框 */
#gate .field{margin-bottom:15px}
#gate .field label{font-size:13px;font-weight:700;color:#334A64;margin-bottom:6px;display:block}
#gate .field input{height:48px;border-radius:13px;font-size:15px;
  background:#F4F7FB;border:1.5px solid transparent;padding:0 14px;
  transition:background .15s,border-color .15s,box-shadow .15s}
#gate .field input:hover{background:#EFF4FA}
#gate .field input:focus{outline:none;background:#fff;border-color:#1E4C86;
  box-shadow:0 0 0 4px rgba(30,76,134,.12)}

/* 登入鈕 */
#gate .btn-primary{height:50px;border-radius:14px;font-size:16px;font-weight:700;
  margin-top:6px;border:0;letter-spacing:.5px;
  background:linear-gradient(180deg,#2A5B9B 0%,#1E4C86 100%);
  box-shadow:0 2px 6px rgba(30,76,134,.22),0 10px 22px rgba(30,76,134,.20);
  transition:transform .12s,box-shadow .12s}

#gate .btn-primary:active{transform:translateY(1px);
  box-shadow:0 1px 3px rgba(30,76,134,.24),0 6px 14px rgba(30,76,134,.18)}

/* 忘記密碼：輕的文字連結 */
#gate .login-card>button.btn-ghost{height:auto;min-height:0;padding:9px 6px;margin-top:6px;
  font-size:13px;font-weight:600;color:#6A7C95;background:none;border:0;box-shadow:none;
  /* GATEERR_V1387 看起來一樣（字本來就置中），但本來只有 64px 寬可以按，
     教師端那一顆是整條 342px。手指按的人差很多，統一成整條。 */
  width:100%}
#gate .login-card>button.btn-ghost:hover{color:#1E4C86;background:none}

/* 底部說明：細線＋淡字，不要色塊 */
#gate .login-card>.notice:last-child{
  background:none!important;border:0!important;
  border-top:1px solid rgba(30,76,134,.12)!important;

  color:#6A7C95;font-size:12.5px;line-height:1.65;text-align:center}

  #gate .auth-tabs button,#gate .auth-tabs .at-teacher{font-size:13px}

/* ══════════════ SHELL_V800 學生端新外框 ══════════════
   取代原本的「NTU COOL 風格外框」。放在最後面，所以蓋得過前面的規則。 */
:root{
  --s-line:#DCE5F0; --s-bg:#F4F7FB; --s-paper:#fff;
  --s-bd:#1E4C86; --s-deep:#143A6B; --s-ink:#16202E; --s-mut:#5B6B80; --s-soft:#E4EDF9;
}
/* GATE_V996 這一條是 V968 全站換成藍色系以前留下來的，
   把共用樣式的底色和點點用 !important 蓋成米黃色，
   所以學生頁和教師頁看起來像兩個不同的網站。拿掉，跟著共用樣式走。 */
#app{padding-left:0!important;padding-bottom:0!important}

/* 頂端：品牌列 */
.topbar{background:var(--s-paper);border-bottom:0}
.topbar-inner{max-width:1112px!important;margin:0 auto!important;
  padding-left:24px!important;padding-right:24px!important}

/* 分頁列（原本的左側直欄） */
.cool-shell{display:block}
.crail{position:static!important;left:auto;top:auto;bottom:auto;width:auto!important;height:auto!important;
  background:var(--s-paper)!important;border-bottom:1px solid var(--s-line);
  flex-direction:row!important;justify-content:flex-start!important;align-items:stretch!important;
  gap:2px!important;padding:0 24px!important;z-index:40;overflow-x:auto;overflow-y:hidden;
  max-width:1112px;margin:0 auto}
.crail::-webkit-scrollbar{display:none}
.crail button{width:auto!important;flex:none!important;flex-direction:row!important;gap:6px!important;
  border-radius:0!important;background:transparent!important;color:var(--s-mut)!important;
  padding:10px 13px 12px!important;font-size:14.5px!important;font-weight:600!important;
  position:relative;white-space:nowrap;line-height:1.4}
.crail button .ic{font-size:15px!important}
.crail button:hover{background:transparent!important;color:var(--s-ink)!important}
.crail button.on{background:transparent!important;color:var(--s-deep)!important}
.crail button.on:after{content:'';position:absolute;left:11px;right:11px;bottom:0;height:2.5px;
  background:var(--s-bd);border-radius:3px 3px 0 0}
.crail button .n{background:#A33227!important;color:#fff!important;margin-top:0!important;
  font-size:10.5px!important;padding:0 6px!important;line-height:16px}

/* 內容欄：收窄置中 */
.cool-main{max-width:1112px!important;margin:0 auto!important;padding:22px 24px 46px!important}
#screen{max-width:none!important}
.crumb{margin-bottom:10px}
.foot-note{color:var(--s-mut);opacity:.7}

/* 首頁兩欄：主欄 + 右欄 */
.home2{display:grid!important;grid-template-columns:minmax(0,1fr) 292px;gap:30px;align-items:start}
.h-main{flex:none!important;min-width:0}
.h-side{flex:none!important;position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.h-side .card{position:static!important;margin:0!important}

/* 卡片統一：淡邊、少陰影 */
#app .card{background:var(--s-paper);border:1px solid var(--s-line)!important;
  border-radius:14px!important;box-shadow:none!important}
#app .pg-h h2{font-family:var(--serif);font-size:23px}

/* 課程：方塊牆 → 一列一課 */
.cgrid{display:block!important;background:var(--s-paper);border:1px solid var(--s-line);
  border-radius:14px;overflow:hidden;margin-bottom:14px}
.ccard{border:0!important;border-radius:0!important;border-bottom:1px solid var(--s-line)!important;
  flex-direction:row!important;align-items:center;gap:12px;padding:12px 16px;background:transparent!important}
.ccard:last-child{border-bottom:0!important}
.ccard:hover{transform:none!important;box-shadow:none!important;background:#FDF3D8!important}
.ccard-top{height:34px!important;width:34px;flex:none;border-radius:9px;overflow:hidden}
.ccard-top .tg{position:static!important;display:none}
.ccard-b{padding:0!important;flex:1;min-width:0}

.ccard-b .m{font-size:12.5px}
.ccard-f{border-top:0!important;margin-top:0!important;padding:0!important;flex:none;gap:10px;font-size:15px}

/* 模組清單：去掉重框 */
.mod{border-color:var(--s-line)!important;border-radius:12px!important}
.mod-h{background:#FDF3D8!important;font-size:14.5px}
.mitem{padding-left:18px!important}
.mitem:hover{background:#FDF3D8}

/* 課程內頁的左側小選單：改成上方橫向分頁，跟整體一致 */
.cwrap{display:block!important}
.cnav{width:auto!important;display:flex;gap:4px;overflow-x:auto;padding:0 0 8px!important;
  border-bottom:1px solid var(--s-line);margin-bottom:14px}
.cnav button{width:auto!important;white-space:nowrap;border-left:0!important;border-radius:999px!important;
  padding:7px 13px!important;font-size:13.5px!important}
.cnav button.on{box-shadow:none!important}
.cbody{padding-left:0!important;border-left:0!important}
/* CNAVWRAP_V1196 手機寬度下，課程內頁的分頁列最後一個（檔案）被切在畫面外，
   又沒有任何提示可以左右滑。改成排不下就換行，五個一次看得到。
   麵包屑的連結也加高一點，手指按得到。 */
@media(max-width:560px){
  .cnav{flex-wrap:wrap!important;overflow-x:visible!important;row-gap:6px}
  .crumb{gap:5px 7px}
  .crumb a{display:inline-flex;align-items:center;min-height:32px;padding:0 2px}
  /* LSHEAD_V1196 課名那一列：右邊「我的筆記」那顆鈕不會縮，
     越南文一長，左邊的課名就被壓成一個字一行。手機上讓它換行。 */
  .ls-card>summary.row-between{flex-wrap:wrap;row-gap:8px}
  .ls-card>summary.row-between>div:first-child{flex:1 1 100%;min-width:0}
  .ls-card>summary.row-between>div:last-child{flex:0 0 auto;margin-left:auto}
}

  .topbar-inner{padding-left:14px!important;padding-right:14px!important}
}
