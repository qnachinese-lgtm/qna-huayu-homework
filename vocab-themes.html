<style>
:root{--bg:#FAF7F2;--card:#fff;--line:#E7E0D5;--ink:#2E2A24;--muted:#8A8073;--primary:#B4694A;--primary-soft:#F6EDE7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 20px;position:sticky;top:0;z-index:10}
h1{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
.tab{padding:7px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;color:var(--muted)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
input[type=search]{flex:1;min-width:200px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-family:inherit;background:#fff}
.btn{padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--ink)}
.btn:hover{background:var(--primary-soft)}
.stat{color:var(--muted);font-size:13px;margin:8px 0 18px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.theme>summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:15.5px;list-style:none;display:flex;align-items:center;gap:10px}
.theme>summary::-webkit-details-marker{display:none}
.theme>summary::before{content:'▸';color:var(--primary);font-size:13px;transition:transform .15s}
.theme[open]>summary::before{transform:rotate(90deg)}
.cnt{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0;border-top:1px solid var(--line)}
.w{padding:10px 16px;border-bottom:1px solid #F1EBE1;border-right:1px solid #F1EBE1;min-width:0}
.zh{font-size:16.5px;font-weight:600}
.py{color:var(--primary);font-size:12.5px;margin-left:7px;font-weight:400}
.vi{color:#3F6B4C;font-size:13.5px;margin-top:1px;word-break:break-word}
.src{color:var(--muted);font-size:11.5px;margin-top:3px}
.lvtag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--primary-soft);color:var(--primary);margin-left:6px;vertical-align:middle}
.note{background:#FFF8E8;border:1px solid #EBDCB8;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>主題詞彙庫</h1>
  <div class="sub">依生活情境重新編排平台既有生詞 · 僅供老師檢閱，未連到學生端</div>
</header>
<div class="wrap">
  <div class="note">
    這一頁的每一個詞都直接來自平台課本裡已經有的生詞，<b>沒有新增、沒有改字</b>，中文·拼音·越南文·出處都照原樣帶過來。
    我做的只是「貼主題標籤」。目前<b>初級已分類完成</b>；中級·高級還沒分類，會先集中在「未分類」裡，等妳確認初級的分法可以用，我再照同樣的方式往下做。
  </div>
  <div class="bar">
    <button class="tab on" data-lv="1">初級</button>
    <button class="tab" data-lv="2">中級</button>
    <button class="tab" data-lv="3">高級</button>

  </div>
  <div class="stat" id="stat"></div>
  <div id="out"><div class="loading">讀取中…</div></div>
</div>

function parseVocabLine(line){
  if(/[｜|]/.test(line)){
    var p=line.split(/[｜|]/).map(function(s){return s.trim();});
    var w=p[0],py='';
    var m=w.match(/^([^\[]*)\[([^\]]*)\]/); if(m){w=m[1].trim();py=m[2].trim();}
    return {w:w,py:py,en:(p[2]||'')};
  }
  var py2='',b=line.match(/\[([^\]]*)\]/); if(b)py2=b[1].trim();
  var s=line.replace(/\[[^\]]*\]/g,' ').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  var m2=s.match(/^[一-鿿]+(?:[／\/][一-鿿]+)*/);
  var w2=m2?m2[0]:s;
  var en=m2?s.slice(m2[0].length).replace(/^[\s=：:，,·-]+/,'').trim():'';
  return {w:w2,py:py2,en:en};
}
function levelOf(book){
  if(/當代中文課程一|時代華語一|發音/.test(book))return 1;
  if(/時代華語二|實用中文讀寫一/.test(book))return 2;
  return 3;
}
var W2T={};
Object.keys(THEME_L1).forEach(function(k){
  THEME_L1[k].split(' ').filter(Boolean).forEach(function(w){W2T[w]=k;});
});

var ROWS=[],curLv=1,curQ='';
function strip(s){return String(s||'').replace(/<[^>]*>/g,'');}

function load(){
  DB.list('lessons').then(function(rows){
    rows.forEach(function(l){
      var book=String(l.book||l.textbook||'')||'(未分類課本)';
      (l.dialogues||[]).forEach(function(d){
        var lines=String(d.vocabulary||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        if(!lines.length)return;
        var words=lines.filter(function(s){return !/^[-–—－]/.test(s);});
        var vi=String(d.vocab_vi||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        words.forEach(function(line,i){
          var p=parseVocabLine(line);
          ROWS.push({w:p.w,py:p.py,en:p.en,vi:vi[i]||'',book:book,
                     lesson:strip(l.title),seg:strip(d.title),lv:levelOf(book),
                     theme:W2T[p.w]||'（未分類）'});
        });
      });
    });
    render();
  }).catch(function(e){
    document.getElementById('out').innerHTML='<div class="loading">讀取失敗：'+e.message+'</div>';
  });
}

function render(){
  var seen={},list=[];
  ROWS.forEach(function(r){
    if(curLv&&r.lv!==curLv)return;
    var k=r.w+'|'+r.lv;
    if(seen[k])return; seen[k]=1;
    if(curQ){
      var hay=(r.w+' '+r.py+' '+r.vi+' '+r.en).toLowerCase();
      if(hay.indexOf(curQ)<0)return;
    }
    list.push(r);
  });
  var by={};
  list.forEach(function(r){(by[r.theme]=by[r.theme]||[]).push(r);});
  var keys=Object.keys(by).sort(function(a,b){
    if(a==='（未分類）')return 1; if(b==='（未分類）')return -1; return a.localeCompare(b,'zh-Hant');
  });
  var lvName={1:'初級',2:'中級',3:'高級',0:'全部'};
  document.getElementById('stat').textContent=
    lvName[curLv]+'：'+list.length+' 個詞 · '+keys.length+' 個主題'+(curQ?'（搜尋中）':'');
  var html=keys.map(function(k){
    var open=(keys.length<=3||curQ)?' open':'';
    return '<details class="theme"'+open+'><summary>'+k+'<span class="cnt">'+by[k].length+'</span></summary><div class="grid">'+
      by[k].map(function(r){
        return '<div class="w"><div class="zh">'+esc(r.w)+
          (r.py?'<span class="py">'+esc(r.py)+'</span>':'')+
          (curLv===0?'<span class="lvtag">'+({1:'初',2:'中',3:'高'}[r.lv])+'</span>':'')+'</div>'+
          (r.vi?'<div class="vi">'+esc(r.vi)+'</div>':'')+
          '<div class="src">'+esc(r.book)+' · '+esc(r.lesson)+'</div></div>';
      }).join('')+'</div></details>';
  }).join('');
  document.getElementById('out').innerHTML=html||'<div class="loading">沒有符合的詞</div>';
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); curLv=+b.dataset.lv; render();
  };
});
document.getElementById('q').oninput=function(){curQ=this.value.trim().toLowerCase();render();};
document.getElementById('exp').onclick=function(){
  var ds=document.querySelectorAll('details.theme'),all=true;
  ds.forEach(function(d){if(!d.open)all=false;});
  ds.forEach(function(d){d.open=!all;});
  this.textContent=all?'全部展開':'全部收合';
};
function boot(){
  var started=false;
  function go(){ if(started)return; started=true; load(); }
  try{
    firebase.auth().onAuthStateChanged(function(u){
      if(u){ go(); }
      else{
        document.getElementById('out').innerHTML=
          '<div class="loading">請先在同一個瀏覽器登入 <a href="teacher.html">教師管理頁</a>，再回到這一頁。</div>';
      }
    });
  }catch(e){ go(); }
  setTimeout(go,8000);
}
document.getElementById('dl').onclick=function(){
  var seen={},aoa=[['主題','難度','中文','拼音','越南文','英文','課本','課次','段落']];
  ROWS.forEach(function(r){
    var k=r.w+'|'+r.lv; if(seen[k])return; seen[k]=1;
    aoa.push([r.theme,{1:'初級',2:'中級',3:'高級'}[r.lv],r.w,r.py,r.vi,r.en,r.book,r.lesson,r.seg]);
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'主題詞彙庫');
  XLSX.writeFile(wb,'主題詞彙庫.xlsx');
};
boot();
</script>
</body>
