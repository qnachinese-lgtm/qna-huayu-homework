<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>主題課程 · QNA CHINESE</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--line:#E7E0D5;--ink:#2E2A24;--muted:#8A8073;--primary:#B4694A;--soft:#F6EDE7;
--ok:#2F6B4F;--okbg:#EFF7F1;--todo:#9A5B12;--todobg:#FFF6E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.8}
header{background:linear-gradient(135deg,#B4694A,#8E5138);color:#fff;padding:20px}
.hw{max-width:920px;margin:0 auto}
.kicker{font-size:12.5px;opacity:.85;letter-spacing:.08em}
h1{margin:4px 0 0;font-size:22px}
.hsub{font-size:13.5px;opacity:.9;margin-top:3px}
.back{color:#fff;opacity:.9;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:6px}
.wrap{max-width:920px;margin:0 auto;padding:20px}
.orig{background:var(--okbg);border:1px solid #CBE3D5;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
section>h2{margin:0;padding:13px 18px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.body{padding:15px 18px}
.task{background:var(--soft);border-left:4px solid var(--primary);padding:12px 16px;border-radius:0 10px 10px 0;font-size:15.5px}
ul.q{margin:0;padding-left:20px} ul.q li{padding:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#FBF7F1;font-weight:600;font-size:13px}
.py{color:var(--primary);font-size:12.5px}
.vi{color:#3F6B4C}
.dlg .turn{padding:7px 0;border-bottom:1px dashed #EFE8DC;font-size:15px}
.dlg .turn:last-child{border-bottom:0}
.who{font-weight:600;color:var(--primary)}
.rp{color:var(--primary);font-size:12.5px}
.rv{color:#3F6B4C;font-size:13px}
.keys li{padding:5px 0;font-size:15px}
.keys .vi{font-size:13px;display:block}
.gp{background:#FCFAF7;border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.gp code{background:var(--soft);padding:2px 8px;border-radius:6px;font-size:15px;color:var(--primary);font-family:inherit;font-weight:600}
.exs{margin-top:8px;padding-left:12px;border-left:2px solid var(--soft)}
.card{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:#FCFAF7}
.card h4{margin:0 0 6px;font-size:14.5px;color:var(--primary)}
.todo{background:var(--todobg);border:1px solid #EBD6AC;border-radius:11px;padding:11px 15px;font-size:13.5px;margin-top:12px}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:4px 0;font-size:14.5px}
.chk li::before{content:'☐ ';color:var(--primary);font-weight:700}
.mini{color:var(--muted);font-size:12.5px;margin-top:8px}
ol.qz{padding-left:20px;margin:0} ol.qz li{padding:4px 0;font-size:14.5px}
.lvtag{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
/* index */
.unit{margin-bottom:22px}
.unit h3{font-size:15px;margin:0 0 10px;color:var(--primary);display:flex;align-items:center;gap:8px}
.unit h3::after{content:'';flex:1;height:1px;background:var(--line)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-decoration:none;color:inherit;transition:.12s}
a.lcard:hover{border-color:var(--primary);box-shadow:0 3px 12px #B4694A1A}
a.lcard .no{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
a.lcard .tt{font-size:16px;font-weight:600;margin:2px 0 4px}
a.lcard .tv{font-size:12.5px;color:#3F6B4C}
a.lcard .tk{font-size:12.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:600;margin-top:8px}
@media(max-width:600px){table,th,td{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="tc-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function qs(){var m=location.search.match(/[?&]l=([^&]+)/);return m?decodeURIComponent(m[1]):'';}

function renderIndex(){
  var units={};
  TC.forEach(function(L){(units[L.unit]=units[L.unit]||[]).push(L);});
  var h='<header><div class="hw"><div class="kicker">QNA CHINESE</div>'+
    '<h1>主題課程</h1><div class="hsub">學了就能說，走進真實的華語生活 · A1–B2</div></div></header><div class="wrap">'+
    '<div class="orig"><b>這一套課程全部是新寫的</b>，跟當代中文、時代華語、實用中文讀寫沒有任何關係，版權是妳自己的。'+
    '越南文是初稿，請妳校對；音檔一律由妳錄製，不使用 AI 語音。</div>';
  Object.keys(units).forEach(function(u){
    h+='<div class="unit"><h3>'+esc(u)+'</h3><div class="lgrid">'+
      units[u].map(function(L){
        return '<a class="lcard" href="?l='+encodeURIComponent(L.id)+'"><div class="no">第 '+L.no+' 課</div>'+
          '<div class="tt">'+esc(L.title)+'</div><div class="tv">'+esc(L.viTitle)+'</div>'+
          '<div class="tk">'+esc(L.task.zh)+'</div><div class="badge">A1–B2</div></a>';
      }).join('')+'</div></div>';
  });
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function sec(n,title,inner){
  return '<section><h2>'+(n?'<span class="num">'+n+'</span>':'')+esc(title)+'</h2><div class="body">'+inner+'</div></section>';
}

function renderLesson(L){
  var h='<header><div class="hw"><a class="back" href="./tc-course.html">← 回課程列表</a>'+
    '<div class="kicker">主題課程 · '+esc(L.unit)+' · 第 '+L.no+' 課</div>'+
    '<h1>'+esc(L.title)+'</h1><div class="hsub">'+esc(L.viTitle)+' · A1–B2</div></div></header><div class="wrap">';

  h+='<div class="orig"><b>全新原創，與任何課本無關。</b>越南文為初稿請校對；音檔請妳自己錄，不使用 AI 語音。</div>';

  h+=sec(1,'今天的任務','<div class="task">'+esc(L.task.zh)+'</div><div class="mini">越南文：'+esc(L.task.vi)+'</div>');

  h+=sec(2,'情境導入','<ul class="q">'+L.warmup.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'+
    (L.media?'<div class="todo">需要的圖片／影片（請妳自己拍或用無版權素材）：'+esc(L.media)+'</div>':''));

  h+=sec(3,'真實對話','<div class="dlg">'+L.dialog.map(function(t){
      return '<div class="turn"><span class="who">'+esc(t.who)+'：</span>'+esc(t.zh)+
        '<div class="rp">'+esc(t.py)+'</div><div class="rv">'+esc(t.vi)+'</div></div>';
    }).join('')+'</div><div class="todo">音檔需要<b>正常語速</b>與<b>慢速</b>兩版，由妳錄製。腳本在本頁最後。</div>');

  h+=sec(4,'溝通必備句','<ol class="keys">'+L.keys.map(function(k){
      return '<li>'+esc(k.zh)+'<span class="vi">'+esc(k.vi)+'</span></li>';}).join('')+'</ol>');

  h+=sec(5,'核心生詞','<table><tr><th>生詞</th><th>漢語拼音</th><th>越南文</th><th>例句</th></tr>'+
    L.vocab.map(function(v){return '<tr><td>'+esc(v.w)+'</td><td class="py">'+esc(v.py)+'</td><td class="vi">'+esc(v.vi)+'</td><td>'+esc(v.ex)+'</td></tr>';}).join('')+
    '</table>'+(L.vocabNote?'<div class="mini">'+esc(L.vocabNote)+'</div>':''));

  h+=sec(6,'實用語法','<div class="gp"><div><code>'+esc(L.grammar.pattern)+'</code></div>'+
    '<div style="margin-top:6px">'+esc(L.grammar.note)+' <span class="vi">'+esc(L.grammar.vi)+'</span></div>'+
    '<div class="exs">'+L.grammar.ex.map(function(e){return '<div>'+esc(e)+'</div>';}).join('')+'</div>'+
    '<div style="margin-top:10px"><b>口說替換</b>：'+esc(L.grammar.swap)+'</div></div>');

  h+=sec(7,'聽力練習',L.listening.map(function(x,i){
      return '<div class="card"><h4>'+(i+1)+'、'+esc(x.t)+'</h4>'+esc(x.d)+'</div>';}).join(''));

  h+=sec(8,'口說練習（學生錄音）','<ol class="qz">'+L.speaking.q.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>'+
    '<div class="card" style="margin-top:12px"><h4>參考回答</h4>'+esc(L.speaking.model)+'</div>'+
    '<div class="todo">參考回答需要妳錄一段示範音檔。</div>');

  h+=sec(9,'溝通任務',L.tasks.map(function(t){
      return '<div class="card"><h4>'+esc(t.n)+'</h4>'+esc(t.d).replace(/\n/g,'<br>')+'</div>';}).join('')+
    '<div class="mini">上課方式：老師扮演對方角色，學生抽任務卡；或兩位學生互相扮演。</div>');

  h+=sec(10,'課後小測驗','<ol class="qz">'+L.quiz.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>'+
    '<h3 style="font-size:14.5px;margin:18px 0 6px">自我評量</h3><ul class="chk">'+
    L.selfcheck.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');

  h+=sec(0,'同一主題 · 四級任務梯子','<table><tr><th style="width:62px">程度</th><th>學習任務</th><th>學生最後要能做到</th></tr>'+
    L.ladder.map(function(r){return '<tr><td><span class="lvtag">'+esc(r.lv)+'</span></td><td>'+esc(r.task)+'</td><td>'+esc(r.can)+'</td></tr>';}).join('')+'</table>');

  var rec=[
    ['01','整段對話（'+L.dialog.length+' 句，各角色都由妳錄）','真實對話'],
    ['02','對話逐句（'+L.dialog.length+' 句分開存檔）','逐句跟讀'],
    ['03','溝通必備句 '+L.keys.length+' 句','必備句'],
    ['04','核心生詞 '+L.vocab.length+' 個（詞＋例句）','生詞'],
    ['05','語法例句 '+L.grammar.ex.length+' 句','語法'],
    ['06','聽力題目音檔 '+L.listening.length+' 段','聽力練習'],
    ['07','口說參考回答 1 段','口說練習'],
    ['08','測驗音檔 2 段','小測驗']
  ];
  var total=L.dialog.length*2+L.keys.length+L.vocab.length+L.grammar.ex.length+L.listening.length+3;
  h+=sec(0,'錄音腳本（給妳錄音用）','<div class="todo" style="margin-top:0"><b>不使用 AI 語音。</b>以下每一句都需要<b>正常語速</b>與<b>慢速</b>兩個版本。</div>'+
    '<table style="margin-top:12px"><tr><th style="width:44px">編號</th><th>要錄的內容</th><th style="width:96px">用在哪</th></tr>'+
    rec.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>';}).join('')+'</table>'+
    '<div class="mini">這一課合計約 '+total+' 個檔。錄好丟給我，我一批一批掛上去。</div>');

  h+='</div>';
  document.getElementById('app').innerHTML=h;
  document.title=L.title+' · 主題課程 · QNA CHINESE';
}

(function(){
  if(typeof TC==='undefined'){document.getElementById('app').innerHTML='<div class="wrap">資料檔載入失敗</div>';return;}
  var id=qs();
  var L=id?TC.filter(function(x){return x.id===id;})[0]:null;
  if(L)renderLesson(L); else renderIndex();
})();
</script>
</body>
</html>
