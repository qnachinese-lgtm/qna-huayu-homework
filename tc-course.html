<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>主題課程 · QNA CHINESE</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--line:#E7E0D5;--ink:#2E2A24;--muted:#8A8073;--primary:#B4694A;--soft:#F6EDE7;--ok:#2F6B4F;--okbg:#EFF7F1;--todo:#9A5B12;--todobg:#FFF6E6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.8}
header{background:linear-gradient(135deg,#B4694A,#8E5138);color:#fff;padding:18px 20px}
.hw{max-width:920px;margin:0 auto}
.kicker{font-size:12.5px;opacity:.85;letter-spacing:.08em}
h1{margin:4px 0 0;font-size:22px}
.hsub{font-size:13.5px;opacity:.9;margin-top:3px}
.back{color:#fff;opacity:.9;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:6px}
.wrap{max-width:920px;margin:0 auto;padding:20px}
.orig{background:var(--okbg);border:1px solid #CBE3D5;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.modes a{padding:8px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600}
.modes a.on{background:var(--primary);border-color:var(--primary);color:#fff}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
section>h2{margin:0;padding:13px 18px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.body{padding:15px 18px}
.task{background:var(--soft);border-left:4px solid var(--primary);padding:12px 16px;border-radius:0 10px 10px 0;font-size:15.5px}
ul.q{margin:0;padding-left:20px} ul.q li{padding:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#FBF7F1;font-weight:600;font-size:13px}
.py{color:var(--primary);font-size:12.5px}
.vi{color:#3F6B4C}
.dlg .turn{padding:7px 0;border-bottom:1px dashed #EFE8DC;font-size:15px}
.dlg .turn:last-child{border-bottom:0}
.who{font-weight:600;color:var(--primary)}
.rp{color:var(--primary);font-size:12.5px}
.rv{color:#3F6B4C;font-size:13px}
.keys li{padding:5px 0;font-size:15px}
.keys .vi{font-size:13px;display:block}
.gp{background:#FCFAF7;border:1px solid var(--line);border-radius:11px;padding:12px 15px}
.gp code{background:var(--soft);padding:2px 8px;border-radius:6px;font-size:15px;color:var(--primary);font-family:inherit;font-weight:600}
.exs{margin-top:8px;padding-left:12px;border-left:2px solid var(--soft)}
.card{border:1px solid var(--line);border-radius:11px;padding:12px 15px;margin-bottom:10px;background:#FCFAF7}
.card h4{margin:0 0 6px;font-size:14.5px;color:var(--primary)}
.todo{background:var(--todobg);border:1px solid #EBD6AC;border-radius:11px;padding:11px 15px;font-size:13.5px;margin-top:12px}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:4px 0;font-size:14.5px}
.chk li::before{content:'☐ ';color:var(--primary);font-weight:700}
.mini{color:var(--muted);font-size:12.5px;margin-top:8px}
ol.qz{padding-left:20px;margin:0} ol.qz li{padding:4px 0;font-size:14.5px}
.lvtag{display:inline-block;background:var(--primary);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.unit{margin-bottom:22px}
.unit h3{font-size:15px;margin:0 0 10px;color:var(--primary);display:flex;align-items:center;gap:8px}
.unit h3::after{content:'';flex:1;height:1px;background:var(--line)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.lcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-decoration:none;color:inherit;transition:.12s}
a.lcard:hover{border-color:var(--primary);box-shadow:0 3px 12px #B4694A1A}
a.lcard .no{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
a.lcard .tt{font-size:16px;font-weight:600;margin:2px 0 4px}
a.lcard .tv{font-size:12.5px;color:#3F6B4C}
a.lcard .tk{font-size:12.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:600;margin-top:8px}
.lcbtns{display:flex;gap:6px;margin-top:9px}
.lcbtns span{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

/* ===== 上課模式 ===== */
body.teach{background:#F4EFE8}
.tstage{max-width:1080px;margin:0 auto;padding:14px 18px 96px;min-height:100vh}
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 12px}
.tbar .tt{font-weight:700;font-size:15px}
.tbar .sp{flex:1}
.tg{padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13.5px;font-family:inherit;color:var(--muted);font-weight:600}
.tg.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 40px;min-height:56vh;box-shadow:0 2px 18px #00000008}
.tkind{font-size:13px;color:var(--primary);font-weight:700;letter-spacing:.06em;margin-bottom:14px}
.tzh{font-size:34px;line-height:1.5;font-weight:600}
.tpy{font-size:19px;color:var(--primary);margin-top:8px}
.tvi{font-size:19px;color:#3F6B4C;margin-top:5px}
.twho{font-size:19px;color:var(--muted);font-weight:700;margin-bottom:6px}
.tlist{font-size:24px;line-height:2}
.tlist .s{display:block;font-size:16px;color:#3F6B4C}
.tlist .p{display:block;font-size:15px;color:var(--primary)}
.tbig{font-size:26px;line-height:1.75}
.tnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:12px;justify-content:center}
.tnav button{padding:10px 22px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:15px;font-family:inherit;font-weight:700;color:var(--ink)}
.tnav button:disabled{opacity:.35;cursor:default}
.tnav .pos{font-size:14px;color:var(--muted);min-width:96px;text-align:center}
.hidden{visibility:hidden}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;font-size:22px}
@media(max-width:760px){.tcard{padding:22px 20px}.tzh{font-size:26px}.tgrid{grid-template-columns:1fr}}

/* ===== 列印學習單 ===== */
.sheet{background:#fff;max-width:820px;margin:0 auto 20px;padding:34px 40px;border:1px solid var(--line);border-radius:8px}
.sheet h1{color:var(--ink);font-size:22px;margin:0}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:4px}
.sheet h3{font-size:15.5px;border-bottom:2px solid var(--primary);padding-bottom:5px;margin:26px 0 12px;color:var(--primary)}
.nameline{display:flex;gap:26px;font-size:13px;color:var(--muted);margin:10px 0 0}
.nameline span{flex:1;border-bottom:1px solid #bbb;padding-bottom:2px}
.blank{display:inline-block;border-bottom:1px solid #999;min-width:110px}
.wline{border-bottom:1px solid #ccc;height:26px;margin:6px 0}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcut{border:1.5px dashed #999;border-radius:8px;padding:12px 14px;font-size:13.5px}
.tcut b{display:block;color:var(--primary);margin-bottom:4px}
.prbar{max-width:820px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
@media print{
  body{background:#fff}
  header,.prbar,.modes,.tnav,.tbar,.orig,.todo,.noprint{display:none!important}
  .sheet{border:0;border-radius:0;max-width:none;margin:0;padding:0;box-shadow:none}
  .wrap{padding:0;max-width:none}
  h3{page-break-after:avoid}
  .tcut{page-break-inside:avoid}
  @page{margin:16mm}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="tc-data.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function P(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}
function lurl(id,mode){return '?l='+encodeURIComponent(id)+(mode?'&mode='+mode:'');}

/* ---------- 課程列表 ---------- */
function renderIndex(){
  var units={};TC.forEach(function(L){(units[L.unit]=units[L.unit]||[]).push(L);});
  var h='<header><div class="hw"><div class="kicker">QNA CHINESE</div><h1>主題課程</h1>'+
    '<div class="hsub">學了就能說，走進真實的華語生活 · A1–B2</div></div></header><div class="wrap">'+
    '<div class="orig"><b>這一套課程全部是新寫的</b>，跟當代中文、時代華語、實用中文讀寫沒有任何關係，版權是妳自己的。'+
    '越南文是初稿，請妳校對；音檔一律由妳錄製，不使用 AI 語音。<br>'+
    '每一課都有三種用法：<b>課文</b>（完整內容，妳自己看）、<b>上課模式</b>（開螢幕帶學生一段一段走）、<b>學習單</b>（印出來給學生寫）。</div>';
  Object.keys(units).forEach(function(u){
    h+='<div class="unit"><h3>'+esc(u)+'</h3><div class="lgrid">'+units[u].map(function(L){
      return '<a class="lcard" href="'+lurl(L.id)+'"><div class="no">第 '+L.no+' 課</div>'+
        '<div class="tt">'+esc(L.title)+'</div><div class="tv">'+esc(L.viTitle)+'</div>'+
        '<div class="tk">'+esc(L.task.zh)+'</div>'+
        '<div class="lcbtns"><span>課文</span><span>上課模式</span><span>學習單</span></div></a>';
    }).join('')+'</div></div>';
  });
  document.getElementById('app').innerHTML=h+'</div>';
}

/* ---------- 課文（完整內容） ---------- */
function sec(n,title,inner){return '<section><h2>'+(n?'<span class="num">'+n+'</span>':'')+esc(title)+'</h2><div class="body">'+inner+'</div></section>';}

function renderLesson(L){
  var h='<header><div class="hw"><a class="back" href="./tc-course.html">← 回課程列表</a>'+
    '<div class="kicker">主題課程 · '+esc(L.unit)+' · 第 '+L.no+' 課</div><h1>'+esc(L.title)+'</h1>'+
    '<div class="hsub">'+esc(L.viTitle)+' · A1–B2</div></div></header><div class="wrap">'+modes(L,'');
  h+='<div class="orig"><b>全新原創，與任何課本無關。</b>越南文為初稿請校對；音檔請妳自己錄，不使用 AI 語音。</div>';
  h+=sec(1,'今天的任務','<div class="task">'+esc(L.task.zh)+'</div><div class="mini">越南文：'+esc(L.task.vi)+'</div>');
  h+=sec(2,'情境導入','<ul class="q">'+L.warmup.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'+
    (L.media?'<div class="todo">需要的圖片／影片（請妳自己拍或用無版權素材）：'+esc(L.media)+'</div>':''));
  h+=sec(3,'真實對話','<div class="dlg">'+L.dialog.map(function(t){
    return '<div class="turn"><span class="who">'+esc(t.who)+'：</span>'+esc(t.zh)+
      '<div class="rp">'+esc(t.py)+'</div><div class="rv">'+esc(t.vi)+'</div></div>';}).join('')+
    '</div><div class="todo">音檔需要<b>正常語速</b>與<b>慢速</b>兩版，由妳錄製。腳本在本頁最後。</div>');
  h+=sec(4,'溝通必備句','<ol class="keys">'+L.keys.map(function(k){
    return '<li>'+esc(k.zh)+'<span class="vi">'+esc(k.vi)+'</span></li>';}).join('')+'</ol>');
  h+=sec(5,'核心生詞','<table><tr><th>生詞</th><th>漢語拼音</th><th>越南文</th><th>例句</th></tr>'+
    L.vocab.map(function(v){return '<tr><td>'+esc(v.w)+'</td><td class="py">'+esc(v.py)+'</td><td class="vi">'+esc(v.vi)+'</td><td>'+esc(v.ex)+'</td></tr>';}).join('')+
    '</table>'+(L.vocabNote?'<div class="mini">'+esc(L.vocabNote)+'</div>':''));
  h+=sec(6,'實用語法','<div class="gp"><div><code>'+esc(L.grammar.pattern)+'</code></div>'+
    '<div style="margin-top:6px">'+esc(L.grammar.note)+' <span class="vi">'+esc(L.grammar.vi)+'</span></div>'+
    '<div class="exs">'+L.grammar.ex.map(function(e){return '<div>'+esc(e)+'</div>';}).join('')+'</div>'+
    '<div style="margin-top:10px"><b>口說替換</b>：'+esc(L.grammar.swap)+'</div></div>');
  h+=sec(7,'聽力練習',L.listening.map(function(x,i){return '<div class="card"><h4>'+(i+1)+'、'+esc(x.t)+'</h4>'+esc(x.d)+'</div>';}).join(''));
  h+=sec(8,'口說練習（學生錄音）','<ol class="qz">'+L.speaking.q.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>'+
    '<div class="card" style="margin-top:12px"><h4>參考回答</h4>'+esc(L.speaking.model)+'</div>');
  h+=sec(9,'溝通任務',L.tasks.map(function(t){return '<div class="card"><h4>'+esc(t.n)+'</h4>'+esc(t.d).replace(/\n/g,'<br>')+'</div>';}).join(''));
  h+=sec(10,'課後小測驗','<ol class="qz">'+L.quiz.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>'+
    '<h3 style="font-size:14.5px;margin:18px 0 6px">自我評量</h3><ul class="chk">'+
    L.selfcheck.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>');
  h+=sec(0,'同一主題 · 四級任務梯子','<table><tr><th style="width:62px">程度</th><th>學習任務</th><th>學生最後要能做到</th></tr>'+
    L.ladder.map(function(r){return '<tr><td><span class="lvtag">'+esc(r.lv)+'</span></td><td>'+esc(r.task)+'</td><td>'+esc(r.can)+'</td></tr>';}).join('')+'</table>');
  var total=L.dialog.length*2+L.keys.length+L.vocab.length+L.grammar.ex.length+L.listening.length+3;
  h+=sec(0,'錄音腳本（給妳錄音用）','<div class="todo" style="margin-top:0"><b>不使用 AI 語音。</b>每一句都需要<b>正常語速</b>與<b>慢速</b>兩個版本。</div>'+
    '<div class="mini">這一課合計約 '+total+' 個檔：對話整段與逐句、必備句 '+L.keys.length+' 句、生詞 '+L.vocab.length+' 個、語法例句 '+L.grammar.ex.length+' 句、聽力 '+L.listening.length+' 段、口說示範 1 段、測驗 2 段。</div>');
  document.getElementById('app').innerHTML=h+'</div>';
  document.title=L.title+' · 主題課程';
}
function modes(L,cur){
  return '<div class="modes">'+
    '<a class="'+(cur===''?'on':'')+'" href="'+lurl(L.id)+'">📄 課文</a>'+
    '<a class="'+(cur==='teach'?'on':'')+'" href="'+lurl(L.id,'teach')+'">🖥 上課模式</a>'+
    '<a class="'+(cur==='print'?'on':'')+'" href="'+lurl(L.id,'print')+'">🖨 學習單</a></div>';
}

/* ---------- 上課模式 ---------- */
function buildSlides(L){
  var s=[];
  s.push({k:'今天的任務',big:L.task.zh,vi:L.task.vi});
  s.push({k:'情境導入',list:L.warmup.map(function(x){return {zh:x};}),plain:true});
  L.dialog.forEach(function(t,i){
    s.push({k:'對話 '+(i+1)+' / '+L.dialog.length,who:t.who,zh:t.zh,py:t.py,vi:t.vi});
  });
  s.push({k:'溝通必備句',list:L.keys.map(function(k){return {zh:k.zh,vi:k.vi};})});
  for(var i=0;i<L.vocab.length;i+=4){
    s.push({k:'核心生詞 '+(Math.floor(i/4)+1),grid:L.vocab.slice(i,i+4)});
  }
  s.push({k:'實用語法',big:L.grammar.pattern,note:L.grammar.note,exs:L.grammar.ex,swap:L.grammar.swap});
  L.listening.forEach(function(x,i){s.push({k:'聽力 '+(i+1),big:x.t,note:x.d});});
  s.push({k:'口說練習',list:L.speaking.q.map(function(x){return {zh:x};}),plain:true,note:'參考回答：'+L.speaking.model});
  L.tasks.forEach(function(t){s.push({k:'溝通任務 · '+t.n,big:t.d});});
  s.push({k:'自我評量',list:L.selfcheck.map(function(x){return {zh:'☐ '+x};}),plain:true});
  return s;
}
function renderTeach(L){
  var slides=buildSlides(L),i=0;
  var showPy=true,showVi=true;
  var h='<div class="tstage"><div class="tbar">'+
    '<a class="tg" href="'+lurl(L.id)+'">← 回課文</a>'+
    '<div class="tt">'+esc(L.title)+'</div><div class="sp"></div>'+
    '<button class="tg on" id="t-py">拼音</button>'+
    '<button class="tg on" id="t-vi">越南文</button>'+
    '<button class="tg" id="t-fs">全螢幕</button></div>'+
    '<div class="tcard" id="tcard"></div></div>'+
    '<div class="tnav"><button id="t-prev">← 上一步</button><div class="pos" id="t-pos"></div><button id="t-next">下一步 →</button></div>';
  document.getElementById('app').innerHTML=h;
  document.title=L.title+' · 上課模式';

  function draw(){
    var s=slides[i],o='<div class="tkind">'+esc(s.k)+'</div>';
    if(s.who!=null)o+='<div class="twho">'+esc(s.who)+'</div>';
    if(s.zh)o+='<div class="tzh">'+esc(s.zh)+'</div>';
    if(s.big)o+='<div class="tzh" style="font-size:30px">'+esc(s.big).replace(/\n/g,'<br>')+'</div>';
    if(s.py)o+='<div class="tpy'+(showPy?'':' hidden')+'">'+esc(s.py)+'</div>';
    if(s.vi)o+='<div class="tvi'+(showVi?'':' hidden')+'">'+esc(s.vi)+'</div>';
    if(s.note)o+='<div class="tbig" style="margin-top:16px;color:#5a534a">'+esc(s.note)+'</div>';
    if(s.exs)o+='<div class="tlist" style="margin-top:16px">'+s.exs.map(function(e){return '<div>'+esc(e)+'</div>';}).join('')+'</div>';
    if(s.swap)o+='<div class="tbig" style="margin-top:14px"><b>替換：</b>'+esc(s.swap)+'</div>';
    if(s.list)o+='<div class="tlist" style="margin-top:10px">'+s.list.map(function(x){
      return '<div>'+esc(x.zh)+(x.vi&&showVi?'<span class="s">'+esc(x.vi)+'</span>':'')+'</div>';}).join('')+'</div>';
    if(s.grid)o+='<div class="tgrid" style="margin-top:14px">'+s.grid.map(function(v){
      return '<div><b>'+esc(v.w)+'</b>'+(showPy?'<span class="p">'+esc(v.py)+'</span>':'')+
             (showVi?'<span class="s">'+esc(v.vi)+'</span>':'')+'</div>';}).join('')+'</div>';
    document.getElementById('tcard').innerHTML=o;
    document.getElementById('t-pos').textContent=(i+1)+' / '+slides.length;
    document.getElementById('t-prev').disabled=(i===0);
    document.getElementById('t-next').disabled=(i===slides.length-1);
  }
  function go(d){i=Math.max(0,Math.min(slides.length-1,i+d));draw();}
  document.getElementById('t-prev').onclick=function(){go(-1);};
  document.getElementById('t-next').onclick=function(){go(1);};
  document.getElementById('t-py').onclick=function(){showPy=!showPy;this.classList.toggle('on',showPy);draw();};
  document.getElementById('t-vi').onclick=function(){showVi=!showVi;this.classList.toggle('on',showVi);draw();};
  document.getElementById('t-fs').onclick=function(){
    if(document.fullscreenElement)document.exitFullscreen();
    else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
  });
  draw();
}

  h+='<h3>溝通必備句（念三次，打勾）</h3>'+L.keys.map(function(k){
      return '<div>☐☐☐　'+esc(k.zh)+'<span class="vi ans-vi" style="margin-left:8px;font-size:12.5px">'+esc(k.vi)+'</span></div>';}).join('');

  h+='<h3>語法練習：'+esc(L.grammar.pattern)+'</h3><div>'+esc(L.grammar.note)+'</div>'+
     '<div style="margin:8px 0 4px"><b>例：</b>'+esc(L.grammar.ex[0])+'</div>'+
     '<div><b>替換：</b>'+esc(L.grammar.swap)+'</div>'+
     '<div class="wline"></div><div class="wline"></div><div class="wline"></div>';

  h+='<h3>口說練習（先寫下來，再說一次）</h3>'+L.speaking.q.map(function(x,i){
      return '<div>'+(i+1)+'. '+esc(x)+'</div><div class="wline"></div>';}).join('');

  h+='<h3>小測驗</h3>'+L.quiz.map(function(x,i){
      return '<div>'+(i+1)+'. '+esc(x)+'</div><div class="wline"></div>';}).join('');

  h+='<h3>自我評量</h3><ul class="chk">'+L.selfcheck.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';

  h+='</div>';

  h+='<div class="sheet" style="page-break-before:always"><h1>任務卡</h1>'+
     '<div class="sub">'+esc(L.title)+' · 沿虛線剪下</div><div class="tcards" style="margin-top:14px">'+
     L.tasks.map(function(t){return '<div class="tcut"><b>'+esc(t.n)+'</b>'+esc(t.d).replace(/\n/g,'<br>')+'</div>';}).join('')+
     '</div>'+
     '<h3>四級任務梯子（老師用）</h3><table><tr><th style="width:58px">程度</th><th>學習任務</th><th>要能做到</th></tr>'+
     L.ladder.map(function(r){return '<tr><td>'+esc(r.lv)+'</td><td>'+esc(r.task)+'</td><td>'+esc(r.can)+'</td></tr>';}).join('')+
     '</table></div></div>';

  document.getElementById('app').innerHTML=h;
  document.title=L.title+' · 學習單';
  var on=true;
  function sync(){
    document.querySelectorAll('.ans-vi,.ans-py').forEach(function(e){e.style.display=on?'':'none';});
    document.getElementById('p-ans').textContent=on?'隱藏拼音・越南文（學生版）':'顯示拼音・越南文（解答版）';
    document.getElementById('p-ans').classList.toggle('on',!on);
  }
  document.getElementById('p-ans').onclick=function(){on=!on;sync();};
  sync();
}

(function(){
  if(typeof TC==='undefined'){document.getElementById('app').innerHTML='<div class="wrap">資料檔載入失敗</div>';return;}
  var id=P('l'),mode=P('mode');
  var L=id?TC.filter(function(x){return x.id===id;})[0]:null;
  if(!L){renderIndex();return;}
  if(mode==='teach'){document.body.classList.add('teach');renderTeach(L);}
  else if(mode==='print'){renderPrint(L);}
  else renderLesson(L);
})();
</script>
