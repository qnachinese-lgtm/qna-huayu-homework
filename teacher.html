<!doctype html>
<!-- ⚠️ HANZI_NOTE 漢字遊戲（字族工坊）備註——改這個檔案之前請先看：
     1. 漢字遊戲的程式「不在」這個檔案裡，全部在 hanzi.html、hanzi-game.js、hanzi-data.js、hanzi-teacher.js、hanzi-student.js。
     2. 它是靠 db.js 最後面的「HANZI_LOADER」那一段，自動接到老師後台（teacher.html）和學生頁（student.html）。
     3. 所以：不要在 teacher.html／teacher-app.js／student.html 裡加漢字遊戲的程式；也不要刪 db.js 的 HANZI_LOADER、根目錄的 check-hanzi.js、vercel.json 的 buildCommand。
     4. 每次修改前先從 GitHub 下載「最新」的檔案再改，不要拿電腦裡或別的對話裡的舊檔案上傳（舊檔案會把別人改過的東西蓋掉）。
     5. 上傳後如果 GitHub 出現紅色 ✕，代表漢字遊戲需要的東西被弄掉了，網站會維持上一版，點進去看說明再補回來。 -->

<head>
<meta charset="utf-8">
<!-- NOTRANS_V966 不要讓瀏覽器自動翻譯。後台有自己的 中文／Tiếng Việt 選單，
     瀏覽器再翻一次會把課文、生詞這些教學資料一起翻掉。 -->

<style>
/* BLUE_V950 中性專業配色：同一個藍色家族由淺到深，靠深淺做出層次。
   底色是很淡的藍，卡片維持白色浮在上面，所以看得出前後關係，不再是平的一片。
   刻意只寫在 teacher.html 裡，不動 styles.css——那一份是跟學生端共用的，
   學生看到的畫面在你親自看過之前不會變。 */
:root{
  --paper:#F4F7FB; --surface:#ffffff; --surface-2:#E8EFF7;
  --ink:#16202E; --muted:#5B6B80; --faint:#607188/* TIDY_V1321 白底上的對比從 2.79 提到 4.26，還是比「次要」淡一階。
     CONTRAST_V1375 再提一階：4.26 差 0.24 就到無障礙標準的 4.5，而且這個顏色用在
     「🩺 資料健檢」「👈 左邊點一位學生開始批改」那種提示字，手機在戶外本來就最難讀。
     #607188：白底 4.98、淺藍底（#EFF4FA）4.51，兩種底都過。深色模式那一組不動。 */;
  --line:#DCE5F0; --line-strong:#C0CEE0;
  --primary:#1E4C86; --primary-dark:#143A6B; --primary-soft:#E4EDF9;
  --accent:#0F2740; --accent-soft:#E4EDF9;
  --gold:#9C7D2A;
  --ok:#1F6A54; --ok-soft:#E1F0EA;
  /* TIDY_V1319 本來有三種「要注意」的顏色：紅（過期）、紫（快到了）、琥珀（備份／報到）。
     三種警示色一起出現，哪個比較急反而看不出來。現在只留兩層：
     紅＝過期、該處理了；其他一律淡藍＝知道一下就好。綠色（已繳、已結案）保留，
     那是另一件事——做完了，不是警告，改成灰色反而看不懂。 */
  --warn:#1E4C86; --warn-soft:#E4EDF9;
  --danger:#A33227; --danger-soft:#F8E7E4;
  --shadow:0 1px 2px rgba(22,32,46,.06), 0 8px 24px rgba(22,32,46,.07);
  --shadow-sm:0 1px 2px rgba(22,32,46,.07);
}
/* 深色模式是用 body.dark 切的（不是看系統設定）。本來主色是粉紅、重點色是青綠，
   跟淺色模式對不起來，看起來像另一個網站。改成同一個藍色家族的深色版。 */
body.dark{
  --paper:#16202E; --surface:#16202E; --surface-2:#16202E;
  --ink:#E8EFF7; --muted:#C7D8EF; --faint:#5B6B80;
  --line:#16202E; --line-strong:#5B6B80;
  --primary:#1E4C86; --primary-dark:#1E4C86; --primary-soft:#16202E;
  --accent:#C7D8EF; --accent-soft:#16202E;
  --gold:#FDE68A;
  --ok:#BFE0CB; --ok-soft:#16202E; --warn:#E2CFFA; --warn-soft:#16202E;
  --danger:#A33227; --danger-soft:#16202E;
}
.fb-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;padding:7px 11px;background:#fff;border:1px solid #E4EDF9;border-radius:9px;font-size:12.5px;color:#5B6B80}
.fb-legend b{font-size:14px;color:#16202E}
/* TIDY_V954 灰色說明字統一避免最後一行只剩一兩個字（像「到。」那樣） */
.hint,.sub,.muted,.empty,.ai-sub{text-wrap:pretty}
.fb-legend .grow{flex:1 1 auto;min-width:0}

/* ===== 漢語拼音一律用 Times New Roman（只影響拉丁字母，中文維持原字體） ===== */
@font-face{font-family:'PinyinRoman';font-style:normal;font-weight:400;
  src:local('Times New Roman'),local('Georgia'),local('Noto Serif'),local('DejaVu Serif'),local('Liberation Serif');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
@font-face{font-family:'PinyinRoman';font-style:normal;font-weight:700;
  src:local('Times New Roman Bold'),local('Times New Roman'),local('Georgia Bold'),local('Georgia'),local('Noto Serif'),local('Liberation Serif Bold');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
@font-face{font-family:'PinyinRoman';font-style:italic;font-weight:400;
  src:local('Times New Roman Italic'),local('Times New Roman'),local('Georgia Italic'),local('Georgia'),local('Noto Serif');
  unicode-range:U+0020-024F,U+0300-036F,U+01CD-01DC,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
/* 錯題本／作業簿：拉丁字母一律 Times New Roman */
.wb-wrap,.wb-wrap *,.wb-sec,.wb-sec *,.wb-py,.wb-ref,.wb-filled,.wb-in,.wb-bl,.opt-blank,.wbrev,.wbrev *,.mist-tag,.hw-img+*{font-family:'PinyinRoman',var(--font)}
.wb-wrap h2,.wb-wrap h3,.wb-sec>summary{font-family:'PinyinRoman',var(--serif)}

.ex-item,.gp-ex-body,.vtab-ex,.vtab-ex .ex-item{font-family:'PinyinRoman',var(--serif)}
/* 語法區塊的課本圖表 */
.gp-imgrow{margin-top:6px}
.gp-imgbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gp-imgbox img{width:76px;height:76px;object-fit:contain;border:1px solid var(--line,#DCE5F0);border-radius:8px;background:#fff}
.vtab-c.vt-py,.vrow-py{font-family:'PinyinRoman',var(--font)}
/* SNAME_V868 本來姓名鎖成 Times New Roman，怕越南文聲調缺字。
   現在拉丁字母走 Be Vietnam Pro（本來就是為越南文做的），聲調沒問題，
   鎖著反而只有名字是襯線體，跟整個介面對不起來。跟著介面走就好。 */
.sname{font-family:inherit}
ruby rt,.flash-rd,.zi-pop .zi-py{font-family:'PinyinRoman',"Helvetica Neue",Arial,system-ui,sans-serif}

/* ===== 漢語拼音聲調字母：只有帶聲調的拉丁字母改用襯線字，其他中英文維持原字體 ===== */
@font-face{font-family:'PinyinTone';font-style:normal;font-weight:400;
  src:local('Times New Roman'),local('Georgia'),local('Noto Serif'),local('DejaVu Serif');
  unicode-range:U+0020-007F,U+00A0-024F,U+0300-036F,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
@font-face{font-family:'PinyinTone';font-style:normal;font-weight:700;
  src:local('Times New Roman Bold'),local('Times New Roman'),local('Georgia Bold'),local('Georgia'),local('Noto Serif');
  unicode-range:U+0020-007F,U+00A0-024F,U+0300-036F,U+1E00-1EFF,U+2018-201F,U+2032-2033;}
body,input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="date"],input[type="tel"],input[type="search"],input[type="url"],input:not([type]),select,textarea,
.btn,.tab,.note-tab,.mode-tag,.brand-sub{font-family:var(--font)}
h1,h2,h3,.brand,.student-card .name,.avatar,.flash-word,.vocab-chip,.zi-pop .zi-big,.ex-item,.lesson-no,.score-pill,.score-pill small{font-family:var(--serif)}
ruby rt,.flash-rd,.zi-pop .zi-py{font-family:'PinyinRoman',"Helvetica Neue",Arial,"Segoe UI",system-ui,"Noto Sans",sans-serif}
/* FONT_ONE2_V662 'PinyinTone' 原本把 U+0020-007F（所有英文字母和數字）也換成 Times New Roman，
   所以整個後台的英文、數字都是襯線字，中文卻是黑體，同一行看起來像兩種字。
   介面一律用 var(--font)；真正需要襯線的拼音（ruby rt、拼音欄、作業簿）改用 PinyinRoman，不受影響。 */

/* 表單兩欄對齊：標題長短不一時，輸入框仍在同一水平線 */
.form-grid>.field{display:flex;flex-direction:column;align-items:stretch}
.form-grid>.field>label{flex:1 0 auto}
.form-grid>.field>label .hint{display:inline-block}
.form-grid>.field>input,.form-grid>.field>select{min-height:43px}
.stu-tb{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
/* NAMEWIDE_V1233 姓名欄再寬一點，長的越南文名字才不會被切 */
.stu-tr{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.05fr 1.35fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.stu-tr:last-child{border-bottom:none}
.stu-tr:not(.stu-th):hover{background:#F4F7FB}
.stu-th{background:#EEF0F3;font-weight:700;font-size:12.5px;color:var(--muted)}
.stu-nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow:hidden}
/* STUNM_V1005 名字要自己包一層才縮得了，也才會出現「…」 */
.stu-nm .nmx{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stu-nm .avatar.sm{width:26px;height:26px;font-size:11px;flex:none}
.stu-tr>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:720px){.stu-tr{grid-template-columns:1.5fr 1fr 1.2fr}.stu-tr>span:nth-child(3),.stu-tr>span:nth-child(5),.stu-th>span:nth-child(3),.stu-th>span:nth-child(5){display:none}}
/* LEDCOL_V741 狀態欄本來只有 82px，可是「📌 預約・詢問」要 112px，
   餘額欄 120px 也裝不下「預繳 1,400,000 VND」＋「待補」——
   兩欄都是 nowrap 又沒裁切，超出去的字就直接印在隔壁欄的數字上面。
   欄寬改成夠用的尺寸，並且每一格都加上裁切，長內容只會變成「…」。 */
.led-sum{display:grid;
  grid-template-columns:16px minmax(96px,1.6fr) 118px 92px 92px minmax(158px,1.4fr) 104px;
  align-items:center;column-gap:10px;row-gap:4px}
.led-sum>.led-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.led-sum>span{font-size:13px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.led-sum>span>.badge{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.led-head{padding:2px 14px 6px;color:var(--muted);font-size:12px;font-weight:600}
/* LQPCOL_V688 多了一顆「📤 指派」之後，最後一欄 116px 裝不下三顆鈕，會壓到左邊的「題數」。 */
.lqt{display:grid;grid-template-columns:minmax(90px,1.3fr) 68px 118px 58px 208px;align-items:center;column-gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.lqt-head{color:var(--muted);font-size:12px;font-weight:600;border-bottom:2px solid var(--line);padding-bottom:6px}
.lqt>b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lqt>span{font-size:13px;white-space:nowrap;min-width:0}
@media(max-width:640px){.lqt{grid-template-columns:1fr auto;row-gap:2px}.lqt-head{display:none}.lqt>span:nth-child(4){display:none}}
@media(max-width:720px){.led-sum{display:flex;flex-wrap:wrap;column-gap:10px}.led-sum>.led-name{min-width:0}
  .led-sum>span{overflow:visible;text-overflow:clip}.led-head{display:none}}

/* ===== 批改台 ===== */
#grades-list{display:block!important}
.sg-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.sg-filters .grow{flex:1}
.sg-chip{border:1.5px solid rgba(30,76,134,.28);background:#fff;color:#0F2740;font-weight:700;

.sg-chip:hover{background:rgba(30,76,134,.09)}
.sg-chip.on{background:#0F2740;border-color:#0F2740;color:#fff}
.sg-wrap{display:flex;gap:16px;align-items:flex-start;min-height:0}
.sg-list{flex:0 0 306px;max-width:306px;max-height:calc(100vh - 210px);overflow:auto;
  background:#fff;border:1px solid rgba(30,76,134,.16);border-radius:14px;padding:6px}
.sg-item{display:block;width:100%;text-align:left;border:0;background:transparent;font-family:inherit;
  cursor:pointer;padding:10px 12px;border-radius:10px;border-bottom:1px solid rgba(30,76,134,.09)}
.sg-item:last-child{border-bottom:0}
.sg-item:hover{background:rgba(30,76,134,.06)}
.sg-item.on{background:#0F2740}
.sg-item.on *{color:#fff!important}
.sg-item.test{opacity:.72}
.sg-i1{display:flex;align-items:center;gap:7px;font-size:14.5px;color:#16202E}
.sg-i2{display:block;font-size:12.5px;color:#5B6B80;margin-top:3px}
.sg-i3{display:block;font-size:11.5px;color:#607188;margin-top:2px}
.sg-tt{background:#E4EDF9;color:#1E4C86;border-radius:999px;padding:0 7px;font-size:11px;font-weight:700}
.sg-st{margin-left:auto;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:800}
.sg-st.pend{background:#EDE9FE;color:#6D28D9}
.sg-st.done{background:#E1F0EA;color:#1F6A54}
.sg-pane{flex:1;min-width:0;min-height:210px;background:#fff;border:1px solid rgba(30,76,134,.16);border-radius:14px;
  max-height:calc(100vh - 210px);overflow:auto}
.sg-head{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid rgba(30,76,134,.14);
  padding:13px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sg-head h3{margin:0;font-size:17px;flex:1;min-width:0}
.sg-navbar{display:flex;align-items:center;gap:9px}
.sg-pos{font-weight:800;color:#5B6B80;font-size:13px;white-space:nowrap}
.sg-body{padding:16px 18px 26px}
/* DRAFTBAR_V835 草稿說明框固定在標題列下面，捲到哪裡都看得見 */
#sg-pane .draft-bar{position:sticky;top:50px;z-index:2;box-shadow:0 6px 14px rgba(22,32,46,.08)}
#sg-pane textarea,#sg-pane input[type="text"]{width:100%;box-sizing:border-box}
#sg-pane .srev-item textarea{min-height:52px}
.sg-item.on .sg-st{background:rgba(255,255,255,.22)}
/* SGNAME_V952 左邊那排本來名字和三個標籤擠在同一行，欄寬只有 306px，
   結果「潘氏蘭」被拆成兩行、「待批改」也被拆成兩行，看起來很亂。
   改成：名字自己佔一整行（放不下才用「…」），標籤排第二行，而且每一顆標籤內部不准換行。 */
.sg-item .sg-i1{flex-wrap:wrap;row-gap:5px}
.sg-item .sg-i1>b{flex:0 0 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-item .sg-i1 .sg-st{margin-left:0;white-space:nowrap}
.sg-item .sg-i2,.sg-item .sg-i3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-item.on .sg-tt{background:rgba(255,255,255,.22)}
.sg-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid rgba(30,76,134,.14);
  padding:11px 18px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.sg-empty{padding:70px 20px;text-align:center;color:#607188;font-size:15px;line-height:2}
.sg-empty span{font-size:13px}
@media(max-width:1000px){
  .sg-wrap{display:block}
  .sg-list{max-width:none;flex:none;max-height:300px;margin-bottom:14px}
  .sg-pane{max-height:none}
}

/* HANZI_V1 */
.hz-tb{border-collapse:collapse;font-size:14px}.hz-tb th{text-align:left;font-weight:500;color:var(--muted,#667);border-bottom:1px solid #dde3ea;padding:6px 8px;white-space:nowrap}.hz-tb td{border-bottom:1px solid #eef1f5;padding:8px;vertical-align:top}
/* ══════ GATEPAINT_V1388 登入卡先別畫，等樣式讀完再出現 ══════
   Quinn：「切換教師後臺，那個白色框子的大小會不一」。
   登入卡的 HTML 在第 201 行，但它的樣式整包在 <body> 裡面那支 2000 多行的
   <style>（1400～3575 行）。瀏覽器會先把卡片用「還沒上妝」的樣子畫出來
   （量到的：標題 99 高、三選一只有 34 高、登入鈕 37 高、卡片 652），
   等讀到那包樣式才變成最後的 629——所以看起來就是框子大小跳了一下。
   做法：這裡先藏起來，那包樣式的最後一行再放出來。CSS 是邊讀邊套的，
   所以卡片第一次出現就已經是最後的樣子，不會再跳。
   （學生端沒有這個問題——它的登入卡是 JS 畫的，本來就等到最後。） */
#gate{visibility:hidden}
</style>
<!-- ══════ CSSHEAD_V1389 兩包 CSS 從 <body> 搬到 <head> ══════
     本來第 270～1385 行和 1411～3586 行這兩包樣式寫在 <body> 裡面（在登入卡的 HTML 後面），
     所以瀏覽器會先把畫面用「還沒上妝」的樣子畫出來，讀到這兩包才變成最後的樣子。
     V1388 是先把登入卡遮起來蓋過這個現象；這裡是把原因直接拿掉。
     搬動是機械性的：兩包的先後順序沒有變，相對於 styles.css 的順序也沒有變，
     所以哪一條規則蓋過哪一條完全跟以前一樣。實測搬完第一次畫面 185ms。 -->
      <style>
        .segbar{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
        .segbar .segb{padding:6px 13px;border:none;border-right:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
        .segbar .segb:last-child{border-right:none}
        .segbar .segb:hover{background:#EEF0F3}
        .segbar .segb.on{background:var(--accent,#1E4C86);color:#fff}
        .segbar .segn{font-size:11px;background:#0000000f;border-radius:999px;padding:1px 6px;font-weight:700}
        .segbar .segb.on .segn{background:#ffffff33;color:#fff}
        /* VERBAR_V61 同一課的三個版本收在同一張課卡裡，用膠囊鈕切換 */
        .ver-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
        .ver-row .verb{display:inline-flex;align-items:center;gap:7px;padding:5px 15px;border:1px solid var(--line);border-radius:999px;
          background:var(--surface,#fff);font-family:var(--font);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:.13s;line-height:1.6}
        .ver-row .verb:hover{border-color:var(--accent);color:var(--ink)}
        .ver-row .verb.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 5px rgba(22,32,46,.22)}
        .ver-row .vdot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--faint);background:transparent}
        .ver-row .vdot.pub{background:var(--ok);border-color:var(--ok)}
        .ver-row .verb.on .vdot{border-color:#ffffff8c}
        .ver-row .verb.on .vdot.pub{background:#fff;border-color:#fff}
        .stu-bar{margin:0 0 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
        .stu-bar .grow{flex:1}
        .smore{margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:9px}
        .smore-t{font-size:11px;color:var(--muted);letter-spacing:.5px;font-weight:700;margin-bottom:4px}
        .smore-b{display:flex;flex-wrap:wrap;gap:6px}
        .dash-sec{margin-top:14px;padding:0;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
        .dash-sec>summary.dash-sec-t{font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.5px;margin:0;padding:12px 15px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:2px}
        .dash-sec>summary.dash-sec-t::-webkit-details-marker{display:none}
        .dash-sec>summary.dash-sec-t::before{content:'▸';font-size:10px;margin-right:6px;opacity:.55}
        .dash-sec[open]>summary.dash-sec-t::before{content:'▾'}
        .dash-sec>summary.dash-sec-t:hover{background:#FFFFFF}
        .dash-sec-b{padding:0 14px 14px}
        .dash-sec .dash-n{display:inline-block;background:#A33227;color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;vertical-align:2px}
        .dash-sec .card{box-shadow:none}
        /* 繳費頁 */
        .pay-sum{display:flex;gap:26px;flex-wrap:wrap;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px}
        .pay-sum .muted{font-size:12px}
        .pay-sum b{font-size:19px;display:block;margin-top:2px}
        /* ITVSUM_V838 面試客戶視窗裡的總額摘要：一列講完，跟上面的練習清單同一個調 */
        .pay-sum.itv-sum{align-items:center;gap:6px 14px;padding:10px 14px;margin-bottom:10px}
        .pay-sum.itv-sum .k{font-size:12px;color:var(--muted,#5B6B80)}
        .pay-sum.itv-sum b{font-size:15px;display:inline;margin:0}
        .pay-sum.itv-sum b.ok{color:#1F6A54}
        .pay-sum.itv-sum b.due{color:#A33227}
        .pay-bar.sm{display:inline-block;width:110px;height:6px;margin:0;flex:none}
        /* MINIPOP_V1342 .pay-grp 本來 overflow:hidden（為了讓表頭底色不要蓋過圓角），
           但它也把每一列「⋯」展開的選單裁掉——最後一列整個選單都看不到（Quinn 回報）。
           改成：表頭和最後一列自己做圓角，容器不再裁切。 */
        .pay-grp{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
        .pay-gh{border-radius:11px 11px 0 0}
        .pay-grp>.pay-row:last-child{border-radius:0 0 11px 11px}
        .pay-gh{padding:10px 15px;background:#F4F7FB;border-bottom:1px solid var(--line);font-weight:800;color:var(--primary);font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .pay-gs{margin-left:auto;font-size:12.5px;font-weight:600;color:#A33227}
        .pay-gs.ok{color:#1F6A54}
        /* PAY_FIT_V46 加了「已處理」之後動作欄塞不下，會壓到「目前」那一欄。
           把欄寬重新分配，動作欄給足空間、必要時自己換行，金額欄也不再被截掉。 */
        .pay-row{display:grid;grid-template-columns:minmax(120px,1.2fr) 84px 84px minmax(120px,auto) minmax(150px,auto) minmax(140px,auto) minmax(190px,auto);align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--line);font-size:13.5px}
        .pay-row:last-child{border-bottom:none}
        .pay-row.is-owe{background:#FFFFFF}
        .pay-hd{padding:7px 15px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;background:#FFFFFF}
        .pay-hd span{text-align:left}
        .pay-hd span{white-space:nowrap}
        .pay-nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .pay-c{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pay-c b{color:var(--ink)}
        .pay-dt{color:var(--muted);font-size:11.5px;margin-left:5px}
        .pay-act{display:flex;gap:6px;justify-content:flex-end;align-items:center;white-space:nowrap}
        .pay-act .btn{white-space:nowrap}
        /* PAYCOL_V994 本來沒有 min-width:0，格線元素的預設是 min-width:auto，
           所以標籤比欄位寬的時候不會截斷、會直接壓到隔壁欄（Quinn 的截圖：
           「✅ Đang học」貼著「65.75 giờ」）。 */
        .pay-st{font-weight:700;white-space:nowrap;padding:2px 9px;border-radius:999px;font-size:12.5px;text-align:center;justify-self:start;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
        /* PAYTAG_V1082 狀態那一格裝不下就截掉，不要壓到旁邊的「上課」欄 */
        #app .pay-row>.pay-tag{min-width:0;overflow:hidden}
        #app .pay-row>.pay-tag>.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
        /* 越南文的「Đang học」比「在學中」寬，欄位一起放寬，才不用截斷 */
        body.ui-vi .pay-row{grid-template-columns:minmax(120px,1.2fr) 104px 92px minmax(120px,auto) minmax(150px,auto) minmax(140px,auto) minmax(190px,auto)}
        .pay-st.blank{background:none}
        .pay-st.owe{background:#F8E7E4;color:#A33227}
        .pay-st.ok{background:#E1F0EA;color:#1F6A54}
        .pay-st.over{background:#f3e8ff;color:#6D28D9}
        .pay-st.muted{background:#EEF0F3;color:var(--muted);font-weight:600}
        /* PAY_GRID_V50 每一列的欄寬改成固定比例（原本用 auto，所以每一列會照自己的內容
           算寬度，欄位就對不齊、看起來扭來扭去）。改成 fr 之後，同一群組裡每一列
           算出來的欄寬完全一樣，「應收／已繳／目前」就會排成直的一條線。
           另外「已處理」標籤原本自己佔一格，會把後面整排推掉，現在收進「目前」那一格裡。 */
        /* PAYTAG_V1082 狀態欄 78→92：短寫法（📌 預約）剛好放得下 */
        .pay-row{grid-template-columns:minmax(150px,1.5fr) 92px 88px minmax(108px,1fr) minmax(152px,1.35fr) minmax(128px,1.05fr) 206px;
          align-items:center;min-height:48px}
        .pay-hd{min-height:0}
        /* VI_EDIT_V51 越南文的開關和對照表搬到「編輯課文」裡面，課文卡的按鈕列就只剩常用的幾個。 */
        .vi-box{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#F4F7FB}
        .vi-box-h{font-weight:700;margin-bottom:8px!important}
        .vi-box-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .vi-sw.as-label{margin:0}
        .vi-sw.as-label input{position:absolute;opacity:0;width:0;height:0;margin:0}
        .vi-sw.as-label:has(input:checked){color:#1F6A54;border-color:#BFE0CB;background:#E1F0EA}
        .vi-sw.as-label:has(input:checked) .knob{background:#1F6A54}
        .vi-sw.as-label:has(input:checked) .knob::after{left:15px}
        .pay-stw{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;max-width:100%}
        .pay-paid{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4}
        .pay-paid .pay-sub{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
        .badge.feepub{cursor:pointer;font:inherit;font-size:12px;line-height:1.6;border-style:dashed}
        .badge.feepub:hover{border-style:solid;box-shadow:0 0 0 2px #1E4C8622}
        /* 🏠 今日總覽封面 */
        /* LAYOUT_V673 標題和按鈕本來擠同一行，視窗一窄標題就斷在奇怪的地方、中間還空一大塊。
           改成標題佔一整行，按鈕另起一行。 */
        .hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 26px;margin-bottom:14px;
          display:block}
        .hero .kick{color:var(--muted);font-size:13px;letter-spacing:.4px;margin-bottom:6px}
        .hero h2{font-size:32px;line-height:1.3;margin:0 0 10px;font-weight:800}
        .hero p.hsub{margin:0;color:var(--muted);font-size:14.5px;line-height:1.8;max-width:54ch}
        /* UIVI_V970 越南文比中文佔位多，同樣的 54ch 只裝得下五十幾個字母，
           右邊還有空位就先折行了。切越南文時放寬到 80ch。 */
        body.ui-vi .hero p.hsub{max-width:80ch}
        /* UILANG_V971 右上角這一排的寬度固定，切語言時按鈕不要跑位。
           寬度照比較長的越南文留，中文就是左右多留一點白。 */
        /* LANGBTN_V982 寬度固定：中文「🌐 中文」比越南文「🌐 Tiếng Việt」短，
           不固定的話一切換語言，旁邊的設定和登出就會跳位子。 */
        /* LANGBTN_V983 三顆鈕都固定寬度，而且每一顆都寬得下越南文
           （Cài đặt 86px、Đăng xuất 77px），切換語言時整排不會移位。
           設定和登出原本留太寬（108／92），收緊之後剛好把語言鈕變長的位子補回來——
           實測頂欄換行的門檻跟改之前一樣，都是視窗寬 980px 以下才換行。 */
        /* LANGMENU_V988 Quinn 指定的樣子：一顆「🌐 目前語言」，按下去展開一張清單，
           正在用的那一種反白。原本按一下就直接切換，看不出來有哪些語言可以選。 */
        #ui-langwrap{position:relative;flex:0 0 auto}
        #ui-lang{min-width:118px;justify-content:center;white-space:nowrap}
        /* NOTEMAP_V1171 注釋底下的「掛到第幾句」對照 */
        .cl-nmap:empty{display:none}
        .cl-nmap{margin:6px 0 2px;background:var(--paper);border:1px solid var(--line);
          border-radius:10px;padding:8px 10px}
        .cl-nmap-t{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
        .cl-nmap-r{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:2px 0}
        .cl-nmap-n{flex:0 0 52px;color:var(--primary);font-weight:700}
        .cl-nmap-e{flex:1;color:var(--ink)}
        .cl-nmap-w{flex:0 0 auto;color:var(--muted,#5B6B80);font-weight:600;cursor:help;
          font-size:11.5px;background:var(--surface-2,#E8EFF7);border-radius:999px;padding:1px 8px}
        .cl-nmap-tip{display:block;font-weight:400;color:var(--muted,#5B6B80);margin-top:3px}
        /* CLSENT_V1166 匯出講義裡，每一段底下的句子清單 */
        /* 注意：視窗掛在 #modal-root，不在 #app 裡面，所以這幾條不能加 #app 前綴 */
        .gh-qd>summary{list-style:none;cursor:pointer}
        .gh-qd>summary::-webkit-details-marker{display:none}
        .gh-caret{flex:0 0 14px;text-align:center;color:var(--muted);font-size:11px}
        .gh-caret::before{content:'\25BE';display:inline-block;transition:transform .15s}
        .gh-caret-off::before{content:''}
        /* SEGCOL_V1174 「N 句」靠右、寬度固定，不然每一列都差一點點 */
        .gh-list.gh-seglist .gh-meta{min-width:52px;text-align:right}
        /* DQEDIT_V1175 討論題展開之後直接在這裡改 */
        .gh-dqb{margin:2px 0 8px 30px;border-left:2px solid var(--line-strong);padding:4px 0 2px 12px}
        .gh-dql{font-size:12px;color:var(--muted);margin:6px 0 3px}
        .gh-dqb textarea{width:100%;min-height:54px;font:inherit;font-size:13.5px;line-height:1.75;
          border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink)}
        .gh-dqb textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
        #gh-dqdirty{color:#8A6B1F;font-weight:600}
        .gh-qd[open] .gh-caret::before{transform:rotate(180deg)}
        .gh-qd>summary:hover .gh-caret{color:var(--primary)}
        .gh-qn.on{color:var(--primary);font-weight:700}
        .gh-qs{margin:2px 0 8px 30px;border-left:2px solid var(--line-strong);padding-left:12px}
        .gh-qrow{font-size:13.5px}
        .gh-qrow .gh-ln{line-height:1.85}
        /* SETOUT_V1159 右上角的「⚙️ 設定」拿掉——側邊選單已經有一個了，重複。
           元素本身留著不刪：語言鈕是掛在它前面的（mount() 找 #settings-btn
           當定位點），真的刪掉語言鈕就不會出現。這裡只讓它不顯示。 */
        #settings-btn{display:none!important}
        /* TBTIDY_V1236 右上角本來是三顆沒有字的圖示鈕，跟有字的鈕排一樣的間距，
           看起來像散在那裡。收成一組（彼此靠緊、正方形），後面加一條細線隔開有字的那一組。 */
        .topbar-inner{gap:9px}
        /* TBUNI_V1268 跟學生端統一：三顆圖示鈕併成同一條（中間細線分格），
           圖示換成同一套線條圖，所有鈕都是 34 高、10 圓角。 */
        .tb-ic{display:inline-flex;align-items:center;height:34px;
          background:var(--surface,#fff);border:1px solid var(--line,#DCE5F0);border-radius:10px}
        .topbar-inner .tb-ic .btn{min-width:0;width:38px;height:100%;padding:0;border:0;border-radius:0;
          background:none;color:var(--muted,#5B6B80);display:inline-flex;align-items:center;justify-content:center}
        .topbar-inner .tb-ic .btn+.btn{border-left:1px solid var(--line,#DCE5F0)}
        .topbar-inner .tb-ic .btn:first-child{border-radius:9px 0 0 9px}
        .topbar-inner .tb-ic .btn:last-child{border-radius:0 9px 9px 0}
        .topbar-inner .tb-ic .btn:hover{background:var(--primary-soft,#E4EDF9);color:var(--primary,#1E4C86)}
        .tb-svg{width:17px;height:17px;flex:0 0 17px;fill:none;stroke:currentColor;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round}
        #site-btn .tb-svg,#ui-lang .tb-svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted,#5B6B80)}
        .topbar-inner #site-btn,.topbar-inner #ui-lang,
        .topbar-inner [data-act="logout"]{height:34px;border-radius:10px;gap:7px}
        .topbar-inner #site-btn,.topbar-inner #ui-lang{border:1px solid var(--line,#DCE5F0);
          background:var(--surface,#fff)}
        .topbar-inner [data-act="logout"]{color:var(--muted,#5B6B80)}
        .topbar-inner [data-act="logout"]:hover{color:var(--primary,#1E4C86)}
        .topbar-inner #site-btn:hover,.topbar-inner #ui-lang:hover,
        .topbar-inner [data-act="logout"]:hover{background:var(--primary-soft,#E4EDF9)}
        .topbar-inner #site-btn:hover .tb-svg,.topbar-inner #ui-lang:hover .tb-svg{color:var(--primary,#1E4C86)}
        /* SITEBTN_V1155 從後台回官網。開新分頁，後台這邊不會被關掉。 */
        #site-btn{min-width:82px;justify-content:center;text-decoration:none}
        #settings-btn{min-width:92px;justify-content:center}
        .topbar-inner [data-act="logout"]{min-width:82px;justify-content:center}
        #ui-lang-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:80;
          background:var(--surface,#fff);border:1px solid var(--line,#DCE5F0);border-radius:11px;
          box-shadow:0 10px 28px rgba(22,32,46,.16);overflow:hidden;min-width:100%}
        #ui-lang-menu[hidden]{display:none}
        #ui-lang-menu button{display:block;width:100%;text-align:center;white-space:nowrap;
          background:none;border:0;border-bottom:1px solid var(--line,#DCE5F0);
          padding:10px 18px;font:inherit;font-size:14px;color:var(--ink,#16202E);cursor:pointer}
        #ui-lang-menu button:last-child{border-bottom:0}
        #ui-lang-menu button:hover{background:var(--primary-soft,#E4EDF9)}
        #ui-lang-menu button.on{background:var(--primary,#1E4C86);color:#fff;font-weight:700}
        /* MOBILE_V984 頂欄是 flex-wrap:nowrap，放不下不會換行，會直接掉出螢幕外——
           手機上「登出」就被切掉一半（Quinn 的截圖）。手機把三顆鈕的固定寬度拿掉，
           語言鈕只留一個地球，整排才塞得進 360px 的螢幕。 */
        @media(max-width:560px){
          #ui-lang,#settings-btn,#site-btn,.topbar-inner [data-act="logout"]{min-width:0}
          #ui-lang .lgn,#site-btn .obn{display:none}
        }
        /* HERO_V988 越南文的問候語在 34ch 這個寬度，最後一個字會自己掉到下一行。
           放寬，並且讓瀏覽器把兩行切得一樣長。 */
        .hero h2{text-wrap:balance}
        body.ui-vi .hero h2{max-width:58ch}
        .hero .upd{margin-top:12px;color:#607188;font-size:12.5px}
        .hero .acts{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 0;padding-top:15px;border-top:1px solid var(--line)}
        .hero .acts .btn{padding:11px 17px;font-size:14.5px;font-weight:700;border-radius:11px}
        /* HEROTIDY2_V1225 四顆常用的裝在一個淡灰底的群組裡，「更多」放在群組外面當灰字；
           新報名改成標題旁邊的紅色小標籤。 */
        .hero .acts{align-items:center;gap:10px}
        .hero .seg{display:flex;gap:4px;background:#F4F7FB;border-radius:13px;padding:4px;flex-wrap:wrap}
        /* SEGEQ_V1226 四顆一樣寬（字數不一樣也切齊），顏色也一樣，不再有一顆是藍的 */
        .hero .seg .btn{border:none;background:transparent;box-shadow:none;color:var(--ink);
          font-weight:600;padding:9px 10px;border-radius:10px;
          min-width:128px;justify-content:center;text-align:center}
        .hero .seg .btn:hover{background:#fff}
        .hero .lead-pill{display:inline-flex;align-items:center;gap:5px;margin-left:12px;vertical-align:middle;
          background:#F8E7E4;color:#A33227;border-radius:999px;padding:4px 13px;
          font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
        .hero .lead-pill:hover{background:#F0C9C2}
        @media (max-width:560px){
          .hero .seg{width:100%}
          /* SEGEQ_V1232 手機上本來 flex-basis 40% 會把按鈕壓得比字還窄，
             「記一堂課」最後一個字被切掉。改成不准縮，寬度不夠就整顆換行。 */
          .hero .seg .btn{flex:1 0 auto;min-width:0;justify-content:center;padding:9px 10px}
          .hero .lead-pill{margin-left:0;margin-top:8px;font-size:13px}}
        /* HEROTIDY_V1224 「⋯ 更多」：按了在原地往下展開，不另外開視窗 */
        .hero .acts .hmore{position:relative}
        .hero .acts .hmore>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;border:none;background:transparent;color:#607188;font-weight:600;padding:10px 12px;box-shadow:none}
        .hero .acts .hmore>summary:hover{color:var(--ink);background:#F4F7FB}
        .hero .acts .hmore>summary::-webkit-details-marker{display:none}

        .rpf{background:var(--surface,#fff);border:1px solid var(--line);border-radius:12px;
          padding:8px 12px;margin-bottom:10px}
        .rpf-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 0}
        .rpf-l{flex:none;width:36px;font-size:11.5px;font-weight:800;color:var(--muted)}
        .rpf-c{font:inherit;font-size:12px;font-weight:700;line-height:1;cursor:pointer;
          display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
          background:#fff;color:var(--ink);border:1px solid var(--line-strong);
          border-radius:999px;padding:5px 11px}
        .rpf-c:hover{border-color:var(--primary)}
        .rpf-c.on{background:var(--primary);border-color:var(--primary);color:#fff}
        .rpf-c i{font-style:normal;font-size:10.5px;font-weight:800;opacity:.7}
        .rpf-x{font:inherit;font-size:12px;font-weight:700;cursor:pointer;background:none;
          border:0;color:var(--primary);padding:4px 0}
        /* RPTITLE_V991 本來一行就切掉。中文標題短，看不太出來；
           越南文標題幾乎一定被切（「📌 Giải thích chi phí xin học trường ngôn ngữ」
           在 1280px 也只看得到一半）。改成最多兩行。 */
        .rp-h>b{font-size:15.5px;line-height:1.4;min-width:0;overflow:hidden;
          white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
          -webkit-box-orient:vertical;line-clamp:2;min-height:2.8em}
        .rp-g{display:flex;gap:5px;flex-wrap:wrap;min-height:22px;align-items:center}
        .rp-g .tag{font-size:11.5px;padding:1px 9px}
        .rp-g .hint{font-size:11.5px}
        /* RPPV_V715 預覽方塊本來只給 min-height，第四行會露出半截被切掉，很難看。
           改成固定高度 ＝ 上下內距 ＋ 剛好三行，切在行與行之間。 */
        .rp-p{font-size:13.5px;line-height:24px;color:var(--ink);white-space:pre-line;
          display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
          height:90px;box-sizing:border-box;background:var(--surface-2);border-radius:10px;padding:9px 12px}
        .rp-p.rp-empty{color:var(--muted);font-style:normal;background:transparent;
          border:1px dashed var(--line);display:flex;align-items:center;height:90px}
        /* RPCARD_V912 本來「複製」在最左、其他兩顆在最右，一列被分成兩半。全部靠右排一組。 */
        .rp-f{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:10px;
          border-top:1px solid var(--line)}
        .rp-f>.btn{flex:none}
        .rp-f .btn.is-off{opacity:.45}
        .rp-f .rp-del{color:#A33227;border-color:#F0C9C2;background:#fff;padding:0 9px}
        .rp-f .rp-del:hover{background:#F8E7E4;border-color:#A33227}
        .rp-edit{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
        .rp-ta{width:100%;box-sizing:border-box;font-size:14px;line-height:1.8;resize:vertical}
        @media(max-width:900px){.rp-edit{grid-template-columns:1fr}}
        /* DOC_V719 申請文件清單 */
        .doc-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;
          padding:9px 12px;background:var(--surface-2);border-radius:12px}
        .doc-b{font-size:12.5px;font-weight:700;background:#fff;border:1px solid var(--line);
          border-radius:999px;padding:2px 11px;white-space:nowrap}
        .doc-b.ok{background:#E1F0EA;border-color:#BFE0CB;color:#1F6A54}
        .doc-b.warn{background:#F4F7FB;border-color:#C7D8EF;color:#6D28D9}
        /* DOCMISS_V1238 缺的項目名字可能很長，要能換行 */
        .doc-b.miss{white-space:normal;text-align:left;line-height:1.6;max-width:100%}
        /* DOCPICK_V1238 檔案視窗裡的收件清單 */
        .dc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        /* DRIVE_V1242 */
        .dv-bar{margin:0 0 10px;padding:8px 12px;border-radius:10px;background:#E8EFF7;
          border:1px solid #C0CEE0;font-size:13px;word-break:break-all}
        .dv-bar a{color:var(--accent,#1E4C86)}
        .dc-g{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:13px;font-weight:700}
        .dc-g .muted{font-weight:400;font-size:12.5px}
        .dc-list{margin:2px 0 2px;border:1px solid var(--line,#DCE5F0);border-radius:12px;overflow:hidden}
        .dc-r{display:grid;grid-template-columns:24px minmax(0,1fr) 104px auto;gap:8px;align-items:baseline;
          padding:8px 12px;border-bottom:1px solid var(--line,#DCE5F0);font-size:13.5px}
        .dc-r:last-child{border-bottom:0}
        .dc-r.on{background:#F4F7FB}
        .dc-k{font-size:13px;line-height:1.5}
        .dc-n{min-width:0;font-weight:600}
        .dc-n .dc-f{display:flex;flex-wrap:wrap;gap:5px;font-style:normal;font-weight:400;
          font-size:12px;margin-top:3px}
        .dc-chip{display:inline-flex;align-items:center;gap:4px;background:#E8EFF7;
          border:1px solid #DCE5F0;border-radius:999px;padding:1px 4px 1px 9px;max-width:100%}
        .dc-chip a{color:var(--accent,#1E4C86);text-decoration:none;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap;max-width:300px}
        .dc-chip a:hover{text-decoration:underline}
        .dc-chip .dc-x{border:0;background:transparent;cursor:pointer;color:#607188;
          font-size:13px;line-height:1;padding:1px 4px;border-radius:999px}
        .dc-chip .dc-x:hover{background:#E8EFF7;color:#A33227}
        .dc-d{text-align:right;font-size:12.5px;color:var(--muted,#5B6B80);white-space:nowrap}
        /* CFTWO_V1243 一列塞檔名＋下拉＋日期＋大小＋兩顆鈕，檔名只剩「TRẦN …」，
           根本看不出是哪一個檔。改成兩行：檔名自己一整行（長的就換行，不再切掉），
           下面那一行才是「這是哪一項」、日期、大小和按鈕。 */
        .cf-row.cf-hasdoc{grid-template-columns:minmax(0,1fr) 108px 56px auto;row-gap:6px}
        .cf-row.cf-hasdoc .cf-nm{grid-column:1/-1;white-space:normal;overflow:visible;
          text-overflow:clip;word-break:break-word;line-height:1.45}
        .cf-row.cf-hasdoc .cf-doc{grid-column:1}
        .cf-doc{min-width:0}
        .cf-doc .cf-sel{width:100%;box-sizing:border-box;font-family:inherit;font-size:12.5px;
          padding:4px 7px;border:1px dashed #C7D8EF;border-radius:8px;background:#fff;
          color:var(--muted,#5B6B80);cursor:pointer}
        .cf-doc .cf-sel.on{border-style:solid;border-color:#BFE0CB;background:#E1F0EA;
          color:#1F6A54;font-weight:600}
        .cf-nodoc{font-size:12px;color:var(--muted,#5B6B80)}
        @media(max-width:700px){
          .cf-row.cf-hasdoc{grid-template-columns:auto auto 1fr auto;row-gap:6px}
          .cf-row.cf-hasdoc .cf-doc{grid-column:1/-1;order:1}
          .dc-r{grid-template-columns:24px minmax(0,1fr) auto;}
          .dc-d{grid-column:2;text-align:left}
          .doc-head{display:none}}
        .doc-head,.doc-row{display:grid;grid-template-columns:126px minmax(160px,1.4fr) 150px 96px minmax(120px,1fr) 42px;
          gap:8px;align-items:center}
        /* DOCUP_V1240 「今天」和「📎 上傳」擠在同一格；掛上去的檔案列在那一列底下 */
        .doc-ops{display:flex;gap:4px;align-items:center}
        .doc-ops .btn{padding:4px 7px;font-size:12.5px}
        .doc-ops .doc-up.on{background:#E1F0EA;border-color:#BFE0CB;color:#1F6A54}
        .doc-f2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
        .doc-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;
          background:#E8EFF7;border:1px solid #DCE5F0;border-radius:999px;padding:2px 4px 2px 10px;max-width:100%}
        .doc-chip a{color:var(--accent,#1E4C86);text-decoration:none;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap;max-width:340px}
        .doc-chip a:hover{text-decoration:underline}
        .doc-chip .doc-x{border:0;background:transparent;cursor:pointer;color:#607188;
          font-size:14px;line-height:1;padding:2px 5px;border-radius:999px}
        .doc-chip .doc-x:hover{background:#E8EFF7;color:#A33227}
        .dc-r .dc-up{padding:3px 9px;font-size:12px}
        .doc-head{font-size:11.5px;letter-spacing:.05em;color:var(--muted);
          padding:0 2px 6px;border-bottom:1.5px solid var(--line);margin-bottom:6px}
        .doc-row{padding:5px 2px;border-bottom:1px solid var(--line)}
        .doc-row:last-child{border-bottom:0}
        .doc-row select,.doc-row input{width:100%;box-sizing:border-box;font-size:13.5px;padding:6px 9px}
        .doc-row .doc-today{padding:0 8px;height:32px;min-height:0;font-size:12px}
        .doc-row .rp-del{padding:0 8px;height:32px;min-height:0}
        .doc-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
          padding-top:10px;border-top:1px solid var(--line)}
        @media(max-width:820px){
          .doc-head{display:none}
          .doc-row{grid-template-columns:1fr 1fr;gap:6px;padding:10px 2px}
          .doc-row .doc-n{grid-column:1/-1}
          .doc-row .doc-nt{grid-column:1/-1}}
        /* QUOTE_V713 價目表 */
        .pr-row{display:grid;grid-template-columns:minmax(180px,1fr) 260px 132px;gap:12px;
          align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
        .pr-row:last-child{border-bottom:0}
        .pr-head{font-size:11.5px;letter-spacing:.06em;color:var(--muted);
          border-bottom:1.5px solid var(--line);padding:8px 2px}
        .pr-n{min-width:0}.pr-n>b{display:block;font-size:14.5px;line-height:1.4}
        .pr-vi{display:block;font-style:normal;font-size:12.5px;color:var(--primary)}
        .pr-a{text-align:right;font-weight:700;font-size:14px}
        /* PRWRAP_V939 一個價格不斷行；要斷就斷在兩個幣別中間 */
        .pr-a .pr-p{white-space:nowrap;display:inline-block}
        .pr-a .pr-sl{color:#C0CEE0;font-weight:400;margin:0 8px}
        .pr-o{display:flex;gap:6px;justify-content:flex-end}
        @media(max-width:720px){.pr-row{grid-template-columns:1fr 1fr}.pr-head{display:none}
          .pr-n{grid-column:1/-1}.pr-a{text-align:left}}
        /* QUOTE_V713 報價單的勾選清單 */
        .qt-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
        .qt-pick{display:grid;grid-template-columns:22px minmax(140px,1fr) 170px 84px;gap:10px;
          align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
        .qt-pick:last-child{border-bottom:0}
        .qt-pick:hover{background:var(--surface-2)}
        .qt-pick.qt-off{opacity:.5;cursor:default}
        .qt-pick.qt-off:hover{background:transparent}
        .qt-pick input[type="checkbox"]{width:auto;margin:0}
        .qt-nm{min-width:0}.qt-nm>b{display:block;font-size:14px;line-height:1.4}
        .qt-nm>i{display:block;font-style:normal;font-size:12px;color:var(--primary)}
        .qt-pz{text-align:right;font-size:13px;white-space:nowrap}
        .qt-qn{width:100%;text-align:center}
        @media(max-width:720px){.qt-pick{grid-template-columns:22px 1fr 84px}
          .qt-pz{grid-column:2/-1;text-align:left}}
        /* BOOKS_V701 教材進度 */
        .bk-row{display:grid;grid-template-columns:minmax(150px,1.6fr) 62px minmax(150px,1.3fr) 108px 128px 74px;
          gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
        .bk-row:last-child{border-bottom:0}
        .bk-row>b{min-width:0;font-size:14px}
        .bk-head{font-size:11.5px;letter-spacing:.06em;color:var(--muted);border-bottom:1.5px solid var(--line)}
        .bk-head>b{font-size:11.5px;font-weight:700}
        .bk-p{display:flex;align-items:center;gap:8px;min-width:0}
        .bk-bar{flex:1;min-width:44px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
        .bk-bar>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
        .bk-n{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
        @media(max-width:820px){.bk-row{grid-template-columns:1fr 1fr;gap:5px}
          .bk-row>b{grid-column:1/-1}.bk-head{display:none}}
        /* NARROW_V1373 320px 的小手機（越南文最明顯）：教材進度那一塊會把整頁撐寬 16px，
           整個畫面可以左右晃。原因是 grid 的格子預設 min-width:auto，裡面一長串
           不能斷的字（越南文的教材名、網址）就把欄位撐大，連帶把 details 撐到 324px。
           這不是翻譯造成的——我用上線那版字典測過，一模一樣。
           兩格都允許縮到 0、長字可以斷行就解決了。 */
        @media(max-width:360px){
          .bk-row{min-width:0}
          .bk-row>*{min-width:0;overflow-wrap:anywhere;word-break:break-word}
          #app .panel details.disc{max-width:100%}
          /* 空狀態那顆主要按鈕（「＋ 新增代書客戶」這種）越南文一行放不下，
             窄螢幕讓它換行，不要頂出畫面 */
          #app .panel .btn.btn-primary{white-space:normal;max-width:100%}
          /* .cards 是 grid，格子的 min-width 預設是 auto，所以裡面最長的那一串
             （教材名＋「Đã đăng 0 bài」那幾個標籤）會把整欄撐到 324px，
             比 296px 的面板寬 28px，整頁就跟著能左右晃。允許格子縮到 0 就好。 */
          #app .panel .cards{min-width:0}
          #app .panel .cards>*{min-width:0}
        }
        /* PLAN_V700 一鍵排課程表的預覽清單 */
        .plan-row{display:grid;grid-template-columns:minmax(160px,2.2fr) 124px 82px 92px;gap:10px;align-items:center;
          padding:7px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
        .plan-row:last-child{border-bottom:0}
        .plan-row>b{min-width:0;font-size:14px;line-height:1.35}
        .plan-head{font-size:11.5px;letter-spacing:.06em;color:var(--muted);border-bottom:1.5px solid var(--line)}
        .plan-head>b{font-size:11.5px;font-weight:700}
        .plan-due{font-weight:700;color:var(--primary-dark)}
        @media(max-width:680px){.plan-row{grid-template-columns:1fr 1fr;gap:4px}
          .plan-row>b{grid-column:1/-1}.plan-head{display:none}}
        /* WAIT_V696 「等了 N 天」 */
        .sg-wait{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:800;
          white-space:nowrap;border:1px solid transparent}
        /* ALIGN_V702 「今天要處理」的兩份清單本來是純 flex，
           每一列的標籤、姓名長度都不一樣，後面的東西就跟著往右跑，整份清單看起來歪的。
           現在標籤／姓名／等待天數／時間／按鈕都給固定寬度，中間的說明文字吃掉剩下的空間，
           每一欄的左邊緣就對齊了。手機寬度以下自動還原成會換行的排法。 */
        .dash-sec[data-ds="todo"] .dash-row{flex-wrap:nowrap;gap:9px;padding:9px 4px}
        /* VITODO_V989 這幾列是「標籤 126px ＋ 姓名 104px ＋ 說明 ＋ 按鈕 96px」的固定欄寬，
           而且不許換行。中文剛好，越南文每一欄都爆出去（按鈕文字直接跑到鈕外面）。
           越南文改成照內容排、放不下就換行——欄位不會再對齊，但不會有東西被切掉或跑出去。 */
        body.ui-vi .dash-sec[data-ds="todo"] .dash-row{flex-wrap:wrap;row-gap:4px}
        body.ui-vi .dash-sec[data-ds="todo"] .dash-row>b,
        body.ui-vi .dash-sec[data-ds="todo"] .dash-row>.badge:first-child{
          flex:0 1 auto;width:auto;max-width:100%}
        body.ui-vi .dash-sec[data-ds="todo"] .dash-row>.btn{
          flex:0 0 auto;width:auto;padding-left:13px;padding-right:13px}
        body.ui-vi .dash-sec[data-ds="todo"] .todo-hero .dash-row .sg-wait,
        body.ui-vi .dash-sec[data-ds="todo"] .todo-hero .dash-row>.grow+.muted{
          flex:0 0 auto;width:auto;text-align:inherit}
        .dash-sec[data-ds="todo"] .dash-row>.badge:first-child{flex:0 0 126px;width:126px;
          box-sizing:border-box;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        /* TODONAME_V1002 本來 104px——只夠中文姓名，
           「中文＋越南文」兩段的名字十個有六個被切掉。
           右邊的 .grow 空白有四百多 px，放寬完全不佔到別欄。 */
        .dash-sec[data-ds="todo"] .dash-row>b{flex:0 1 232px;width:232px;min-width:104px;max-width:232px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dash-sec[data-ds="todo"] .dash-row>.muted{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dash-sec[data-ds="todo"] .dash-row>.btn{flex:0 0 96px;width:96px;justify-content:center;
          padding-left:0;padding-right:0}
        .dash-sec[data-ds="todo"] .todo-hero .dash-row .sg-wait{flex:0 0 80px;width:80px;
          box-sizing:border-box;text-align:center}
        .dash-sec[data-ds="todo"] .todo-hero .dash-row>.grow+.muted{flex:0 0 132px;width:132px;text-align:right}
        /* 資料健檢那一塊本來就是會換行的兩層排法，不要被上面的規則拉進去 */
        .dash-sec[data-ds="todo"] .dash-row[style*="flex-wrap:wrap"]{flex-wrap:wrap}
        @media(max-width:760px){
          .dash-sec[data-ds="todo"] .dash-row{flex-wrap:wrap}
          .dash-sec[data-ds="todo"] .dash-row>.badge:first-child,
          .dash-sec[data-ds="todo"] .dash-row>b,
          .dash-sec[data-ds="todo"] .dash-row>.btn,
          .dash-sec[data-ds="todo"] .todo-hero .dash-row .sg-wait,
          .dash-sec[data-ds="todo"] .todo-hero .dash-row>.grow+.muted{flex:0 0 auto;width:auto;text-align:inherit}
          /* REMBTN_V1371 Quinn：「按鈕太醜了」。
             上面那條把電腦版寫死的 96px 寬放開成 width:auto，可是上面
             「padding-left:0;padding-right:0」沒有一起放開——那個 0 內距本來是
             靠 96px 的固定寬撐出空間的。結果手機上變成「寬度剛好等於字寬、左右沒有留白」：
             量出來「去看」34px、「看客戶」50px、「💰 記繳費」74px，三種寬度各自靠右，
             右邊排出一道參差的階梯。把內距補回來，再給一個 104px 的下限讓它們對齊；
             越南文字長的還是可以自己撐大，不會被切掉。 */
          .dash-sec[data-ds="todo"] .dash-row>.btn{
            padding-left:14px;padding-right:14px;justify-content:center}
          /* 104px 的對齊下限只給「⏰ 提醒」——那幾列每列只有一顆鈕，
             對齊了右邊才會是一條直線。「今天的課」那種一列兩三顆的不套，
             免得兩顆各 104px 把一列撐爆。 */
          .dash-sec[data-ds="todo"] .dash-row.rem-row>.btn{min-width:104px}
        }
        /* REMBTN_V1371 同一張提醒清單裡，「💰 記繳費」是深色實心、「去看」「看客戶」是
           淺色外框，四列排下來深深淺淺。可是這三件事其實一樣重要——繳件也有死線。
           深淺差別反而在暗示「記繳費比繳件急」，那不是真的。
           統一成淺色外框：紅色的「欠 NT$1,500」標籤本來就在喊了，按鈕不用跟著喊。
           只改「⏰ 提醒」這 8 種列（統一掛 .rem-row），

        /* GUIDE_V691 使用說明 */

           兩層的左邊界對齊（剩下的 10px 是頂列自己的內距）。
           不選更寬（1560、1700）是因為表格再拉寬，一行的眼睛移動距離太長反而難讀；
           1440 剛好也是一般筆電的螢幕寬，那種螢幕上等於滿版。 */
        #app .container>.panel:not(.hide),#app .container>#classview-body{max-width:1440px;margin-left:auto;margin-right:auto}
        #app .container .panel,#app .container #classview-body{max-width:none;width:100%}
        .cool-sec .stu-tb{border:0;margin-top:0;border-radius:0}
        .tpg-h{margin:2px 0 16px}
        .tpg-h h2{margin:0;font-size:22px;letter-spacing:-.01em}
        .tpg-h .sub{color:var(--muted);font-size:13.5px;margin-top:3px}
        .tstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:13px;margin-bottom:18px;max-width:900px}
        .tstat .s{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
        .tstat .s .k{color:var(--muted);font-size:12.5px;font-weight:600}
        .tstat .s .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.15}
        .tstat .s .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
        /* 班級頁：第二層導覽（Canvas 式） */
        .tcwrap{display:flex;align-items:flex-start;max-width:none}
        .tcnav{width:148px;flex:none;padding-top:2px}
        .tcnav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;
          padding:9px 13px;color:var(--muted);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
        .tcnav button:hover{color:var(--ink);background:#fff}
        .tcnav button.on{color:var(--primary);border-left-color:var(--primary);background:#fff}
        .tcbody{flex:1;min-width:0;max-width:1100px;padding-left:20px;border-left:1px solid var(--line)}
        /* 模組 */
        .tmod{border:1px solid var(--line);border-radius:11px;margin-bottom:13px;overflow:hidden;background:#fff}
        .tmod-h{background:#EEF0F3;padding:11px 15px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
        .tmod-h .chev{color:var(--muted);font-size:12px;transition:.15s}
        .tmod.closed .tmod-h .chev{transform:rotate(-90deg)}
        .tmod.closed .tmod-items{display:none}
        .tmitem{display:flex;align-items:center;gap:10px;padding:10px 15px 10px 28px;border-top:1px solid var(--line)}
        .tmitem:hover{background:#F4F7FB}
        .tmitem .mi{font-size:16px;flex:none;width:21px;text-align:center}
        .tmitem .mt{flex:1;min-width:0;font-weight:600;font-size:14.5px}
        .tmitem .ms{color:var(--muted);font-weight:400;font-size:12.5px;display:block}
        .tpub{width:19px;height:19px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
        .tpub-y{background:#1F6A54;color:#fff}.tpub-n{background:#DCE5F0;color:#57677C}/* CONTRAST_V1375 這一顆的底是 #DCE5F0，
          比白底深，所以字要再深一階才過 4.5（量到 4.54）。其他地方的 --faint 不受影響 */
        /* 分組卡片（學生名冊等） */
        .cool-sec{background:#fff;border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
        .cool-sec>summary{cursor:pointer;list-style:none;padding:12px 16px;background:#EEF0F3;font-weight:700;display:flex;align-items:center;gap:8px}
        .cool-sec>summary::-webkit-details-marker{display:none}
        .cool-sec>summary::after{content:'\25be';margin-left:auto;color:var(--muted);transition:transform .15s}
        .cool-sec[open]>summary::after{transform:rotate(180deg)}
        .cool-sec>summary>*{margin:0!important}
        .cool-sec>*:not(summary){padding:10px 14px 12px}
        .cool-sec>summary>span:first-child{font-size:15px!important}
        .cool-sec .tag{background:#EEF0F3;color:#5B6B80;border:0}
        .cool-sec[open]>summary{border-bottom:1px solid var(--line)}
        .cool-sec .stu-tb{margin-top:10px}
        /* 篩選列與工具列 */
        #app .container .section-head{margin-bottom:14px}
        /* 版面固定：切換教材／捲軸出現時，右上按鈕不再跑位 */
        html{scrollbar-gutter:stable}
        .book-tab{font-weight:600}
        #app .container .section-head{flex-wrap:wrap}
        #app .container .section-head .sub{flex:0 1 auto;min-width:0}
        /* HEADWRAP_V828 本來是 nowrap，視窗不夠寬時最右邊的按鈕會被擠到容器外面看不到。
           改成可以換行，擠不下就自己掉到下一列。 */
        #app .container .section-head .head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
        @media(max-width:820px){#app .container .section-head .head-actions{flex-wrap:wrap;margin-left:0;width:100%;justify-content:flex-start}}
        #app .container .section-head h2{font-size:22px;letter-spacing:-.01em}
        #panel-dashboard>.section-head{display:none}
        /* 數字磚統一成 COOL 卡片樣式 */
        #panel-dashboard .stat-card{background:#fff;border:1px solid var(--line)!important;border-radius:12px!important;box-shadow:none!important}
        #nav-toggle{border:none !important;background:transparent !important;display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:7px 11px !important;border-radius:10px;cursor:pointer;color:#5B6B80;box-shadow:none !important;margin-right:2px}
        #nav-toggle svg{width:18px;height:18px;transition:transform .18s}
        body.nav-off #nav-toggle svg{transform:rotate(180deg)}/* 收起來的時候箭頭要反過來 */
        #nav-toggle:hover{background:#EEF0F3 !important;color:var(--ink,#16202E)}
        .topbar-inner{max-width:none !important;margin:0 !important;width:100%;padding-left:10px}
        /* LAYOUT_V673 兩種版面，設定裡可以切：
           side＝左邊側欄（收起來變成一條圖示列，不會整條不見）
           top ＝沒有側欄，選單橫排在最上面，內容用整個寬度 */
        /* NAVIC_V1274 側邊選單本來是彩色 emoji，跟全站的線條圖示不同套。
           換成同一套線條圖，顏色跟著文字走（選中那一條會一起變深）。 */
        .sidenav .tab .e{width:20px;flex:none;display:inline-flex;align-items:center;justify-content:center}
        .sidenav .tab .e .nv-i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
          stroke-linecap:round;stroke-linejoin:round;opacity:.92}
        .sidenav .tab.active .e .nv-i{opacity:1;stroke-width:1.85}
        .sidenav .tab .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        body.nav-off .sidenav{width:64px;padding:14px 8px}
        body.nav-off .sidenav .lab,body.nav-off .sidenav .count{display:none}
        body.nav-off .sidenav .tab{justify-content:center;padding:11px 0;gap:0}
        body.nav-off .sidenav .sec{text-align:center;letter-spacing:0;font-size:9px;padding:12px 0 5px}
        body.nav-off .sidenav .sbrand{justify-content:center;padding:2px 0 13px}
        body.nav-off .sidenav .sbrand>div:last-child{display:none}
        body.nav-off .topbar{margin-left:64px}
        body.nav-off #app .container{margin-left:64px;max-width:calc(100% - 64px)}

        /* ═══ TNAV_V1355 後台的頂部選單（Quinn 給的參考：橫向選單＋滑過去展開） ═══
           後台本來就有「頂部選單」這個版面（設定 → 版面），但它只是把側欄的項目橫排成
           一條深色捲動列，沒有分組也沒有下拉，十幾項擠在一起還要左右捲。
           這裡重做成跟官網同一種：白底、文字＋底線、滑過去展開分組。
           側欄的程式一行都沒動——它還在（只是藏起來），分頁的點擊、計數、目前在哪一頁
           全部還是走原本那一套，這個選單只是把同樣的東西換一個長相顯示出來。 */
        /* TNAVFIX_V1356 ① 彈出視窗被選單蓋住（Quinn 截圖：設定視窗的標題被切掉一半）。
           .overlay 是 z-index:50，我把選單寫成 55、下拉寫成 70，所以它們浮在視窗上面。
           選單改成 40：比內容高（捲動時釘得住），比彈出視窗低（視窗一開就蓋過去）。 */
        #tnav{display:none}
        body.layout-top #tnav{display:flex;align-items:center;gap:2px;flex-wrap:wrap;
          background:transparent;border:0;padding:0;margin-left:6px;position:static}
        body.layout-top .topbar-inner{flex-wrap:wrap;row-gap:6px}
        /* TBWRAP_V1364 右邊那一組當成一塊：要掉下去就整組一起掉，而且靠右對齊 */
        .tb-right{display:inline-flex;align-items:center;gap:9px;flex-wrap:nowrap;margin-left:auto}
        @media(max-width:860px){.tb-right{flex-wrap:wrap;justify-content:flex-end}}
        /* ② 手機版（860px 以下）一律用原本那套側欄選單（☰ 換頁），不管版面選的是哪一個。
           我本來在手機上也把側欄藏起來、改用頂部那條橫捲的列，結果變成手機只剩頂部
           可以用、左側完全叫不出來（Quinn 回報）。手機本來那一套是好用的，不該被我換掉。
           版面的選擇從現在起只影響桌機。 */
        @media(min-width:861px){body.layout-top .sidenav{display:none!important}}
        @media(max-width:860px){body.layout-top #tnav{display:none!important}}
        #tnav .tn-i{position:relative;display:flex}
        /* 字級、高度、內距、hover 全部照官網那一套（15px／600／40px 高／13px 內距） */
        #tnav .tn-b{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 13px;
          border:0;background:none;border-radius:10px;
          font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);
          cursor:pointer;white-space:nowrap;transition:color .15s,background .15s}
        #tnav .tn-b:hover{color:var(--accent,#1E4C86);background:#E9F0F9}
        #tnav .tn-i.on>.tn-b{color:#14345E;font-weight:800;background:#E9F0F9}
        #tnav .tn-i.open>.tn-b{color:var(--accent,#1E4C86)}
        #tnav .tn-c{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:2.2;
          stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:transform .18s}
        #tnav .tn-i.open>.tn-b .tn-c{transform:rotate(180deg)}
        #tnav .tn-p{position:absolute;left:0;top:calc(100% + 7px);z-index:5;display:none;min-width:228px;
          background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px;
          box-shadow:0 14px 38px rgba(22,32,46,.16)}
        #tnav .tn-i.open>.tn-p{display:block}
        /* TNAVBRIDGE_V1363 Quinn：「我往下滑要選擇選項，離開那個按鈕，那整塊就直接不見」。
           選單面板離按鈕有 7px 的縫，滑鼠往下移的那一瞬間就離開了 .tn-i 的感應範圍，
           mouseleave 一觸發面板就收起來，根本來不及點。
           補一塊透明的「橋」把那段縫蓋住——官網的選單本來就有這個，後台漏了。 */
        #tnav .tn-i.has-sub::after{content:"";position:absolute;left:0;right:0;top:100%;
          height:9px;display:none}
        #tnav .tn-i.has-sub.open::after{display:block}
        #tnav .tn-p button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
          padding:9px 12px;border:0;border-radius:10px;background:none;cursor:pointer;
          font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap}
        #tnav .tn-p button:hover{background:#E4EDF9;color:var(--accent,#1E4C86)}
        #tnav .tn-p button.on{background:#E4EDF9;color:#14365F;font-weight:700}
        #tnav .tn-n{margin-left:auto;font-size:11px;font-weight:700;background:#E4EDF9;color:#30507B;
          border-radius:999px;padding:1px 7px}
        #tnav .tn-b .tn-n{margin-left:2px}
        #tnav .tn-n.alert{background:#F8E7E4;color:#A33227}
        #tnav .tn-n:empty,#tnav .tn-n.zero{display:none}

        /* 頂部選單版 */
        /* NAVLINE_V899 底線改 3px，跟分頁的指示線同一個厚度、同一個位置，
           不然選到的那一格會是「2.7px 咖啡色 ＋ 0.9px 深色」兩條錯開，看起來歪。 */
        body.layout-top .sidenav{position:static;width:auto;flex-direction:row;align-items:center;
          overflow-x:auto;padding:0 6px;gap:3px;border-bottom:3px solid #16202E;
          margin:-24px -20px 18px;border-radius:0}
        body.layout-top .sidenav .sec,body.layout-top .sidenav .sbrand{display:none}
        body.layout-top .sidenav .tab{width:auto;flex:none;white-space:nowrap;border-radius:0;font-size:13px;
          padding:12px 11px;border-bottom:3px solid transparent;background:none!important;color:#C0CEE0!important;
          margin-bottom:-3px}/* NAVLINE_V899 往下推，正好蓋在選單那條底線上 */
        body.layout-top .sidenav .tab .lab.subhint,body.nav-off .sidenav .tab .lab.subhint{display:none}
        body.layout-top .sidenav{scrollbar-width:none}
        body.layout-top .sidenav::-webkit-scrollbar{height:0;display:none}
        body.layout-top .sidenav .tab .lab{display:inline}
        body.layout-top .sidenav .tab.active{color:#fff!important;border-bottom-color:var(--primary,#1E4C86)}
        body.layout-top .sidenav .tab .count{margin-left:5px}
        body.layout-top .topbar{margin-left:0}
        /* LAYOUT_V675 頂部選單版本來把整個 container 限寬 1240 又靠左，所以選單列和內容
           都只佔畫面左邊一塊、右邊空一大片。改成：container 用滿整個寬度（選單列才會拉滿），
           內容則由下面的 .panel 限寬 1180 並置中。 */
        body.layout-top #app .container{margin-left:0;margin-right:0;max-width:none}
        /* WIDE_V1375 頂部那一列跟著內容一起置中，左邊界才會對齊。
           max-width 要用 !important：上面 1545 行那條 .topbar-inner{max-width:none!important}
           權重一樣但排在前面，不加會被它蓋掉。 */
        body.layout-top .topbar-inner{max-width:1440px!important;margin-left:auto!important;margin-right:auto!important}
        body.layout-top #nav-toggle{display:none}
        @media(max-width:860px){
          #nav-toggle{display:none}
          /* MNAV_V1103 本來是橫向捲動：11 個分頁加起來 1318px，
             820px 只看得到 6 個、390px 只看得到 3 個，而且看不出來右邊還有東西。
             改成折行，全部看得見。這一排在窄螢幕是 position:static，
             捲頁就會往上跑掉，多佔兩排不影響使用。 */
          .sidenav{position:static;width:auto;flex-direction:row;flex-wrap:wrap;
            overflow-x:visible;padding:6px 8px;border-right:none;border-bottom:1px solid #16202E;
            gap:4px;row-gap:4px}
          .sidenav .sec{display:none}.sidenav .sbrand{display:none}
          .sidenav .tab{white-space:nowrap;width:auto;flex:0 1 auto;justify-content:flex-start;
            padding:7px 10px;font-size:13.5px}
          body .topbar{margin-left:0}
          #app .container{margin-left:0;max-width:100%}
        }

        /* ══════ DRAWER_V1372 手機上的「左側選單」 ══════
           Quinn：「左側跟頂部沒有任何改變，全部都是以頂部爲主欸」。她說得沒錯，我量過：
           861px 以上兩種設定差很多（左側＝212px 的直欄、頂部＝橫排在最上面），
           可是 860px 以下兩種長得一模一樣，都是上方那片格子。
           原因是我自己寫的：上一次她說「手機只能用頂部、叫不出左側」，
           我就讓手機一律走側欄那一套；但側欄在手機上本來就是攤平成上方的格子，
           所以「左側」這個選項在手機上等於沒有作用——按了沒反應。
           現在補上真正的抽屜：選「左側」時，手機按 ☰ 從左邊滑出一整條直的選單。
           z-index 用 46／45：比頂部那條（30）高，壓得住內容；
           但比彈出視窗（.overlay 是 50）低，所以視窗一開照樣蓋在抽屜上面，
           不會重演 V1356 那次「選單蓋住設定視窗」。 */
        #nav-scrim{display:none}
        body.nav-drawer #nav-scrim{display:block;position:fixed;inset:0;z-index:45;
          background:rgba(10,16,26,.45);opacity:0;pointer-events:none;transition:opacity .2s}
        body.nav-drawer.drawer-open #nav-scrim{opacity:1;pointer-events:auto}
        body.nav-drawer #app .sidenav{
          display:flex!important;flex-direction:column!important;flex-wrap:nowrap!important;
          grid-template-columns:none!important;
          position:fixed!important;left:0;top:0;bottom:0;width:272px;max-width:84vw;
          z-index:46;overflow-y:auto!important;overflow-x:hidden!important;
          background:#16202E;padding:14px 12px!important;margin:0!important;
          border-radius:0!important;gap:3px;
          transform:translateX(-101%);transition:transform .22s ease;
          box-shadow:none}
        body.nav-drawer.drawer-open #app .sidenav{transform:none;box-shadow:6px 0 28px rgba(0,0,0,.35)}
        /* 抽屜裡要全部攤開：mnav-fold 那條「只留現在這一頁」的規則在這裡不適用 */
        body.nav-drawer #app .sidenav .tab{display:flex!important;width:100%!important;
          justify-content:flex-start;min-height:44px}
        body.nav-drawer #app .sidenav .sec{display:block!important;
          color:#7F93AD;font-size:11px;letter-spacing:.14em;margin:12px 0 4px;padding:0 6px}
        body.nav-drawer #app .sidenav .sbrand{display:none!important}
        body.nav-drawer #mnav-btn{display:none!important}
        /* 開著抽屜的時候背景不要跟著捲 */
        body.nav-drawer.drawer-open{overflow:hidden}
        #drawer-btn{display:none}
        body.nav-drawer #drawer-btn{display:inline-flex!important;align-items:center;
          justify-content:center;width:40px;height:40px;flex:none;margin-left:6px;
          border:1px solid var(--line,#DCE5F0);background:#fff;border-radius:11px;
          font-size:17px;line-height:1;cursor:pointer;color:#14365F}

        /* MOBILE_V1145 手機版的選單本來是「能塞幾個就塞幾個」的折行，
           每一行長短不一、選到的那一格又是一塊白色凸出來，看起來像壞掉。
           改成整齊的兩欄格子：每一格一樣大、選到的那一格填滿深藍。 */
        #mnav-btn{display:none}
        @media(max-width:600px){
          #app .sidenav,body.layout-top .sidenav{
            display:grid!important;grid-template-columns:1fr 1fr;gap:6px;
            padding:10px!important;margin:-12px 0 16px!important;
            border-radius:14px;border-bottom:0;overflow:visible!important}
          #app .sidenav .tab,body.layout-top .sidenav .tab{
            width:100%!important;flex:none!important;justify-content:flex-start;
            padding:11px 12px!important;border-radius:10px!important;
            border-bottom:0!important;margin:0!important;min-height:44px;
            font-size:13.5px;background:#16202E!important;color:#DCE5F0!important;
            overflow:hidden}
          #app .sidenav .tab .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #app .sidenav .tab .e{font-size:15px;flex:none}
          #app .sidenav .tab .count{margin-left:auto;flex:none}
          #app .sidenav .tab.active,body.layout-top .sidenav .tab.active{
            background:var(--primary,#1E4C86)!important;color:#fff!important;
            font-weight:700;border-bottom:0!important}
          #app .sidenav .tab.active .count{background:#ffffff33;color:#fff}
          /* MNAVFOLD_V1146 十一格全部攤開要佔掉半個螢幕，手機預設收起來：

        /* ═══ FLATBAR_V1352 篩選列全部改成「文字＋底線」 ═══
           Quinn：「每一頁都是不同的風格是怎麼樣？」量出來同一排裡並排的小按鈕有四種長相：
           .segb 高32圓角0無框字重700／.btn btn-sm 高30圓角8有框字重500／
           .btn 高37圓角10有框／.sg-chip 圓角999實心藥丸。學生頁最明顯——
           「在學中｜全部」一個盒子、「其他狀態▾」自己一個盒子、「沒有Email」又一個，
           三個盒子擠在同一排，怎麼排都不整齊。

        /* QINLINE_V774 練習題清單上直接打字 */

        @media (max-width:700px){.qi-a{flex-basis:100%}}
        /* LCFIX_V1356 Quinn：「按鈕都跑了」。量出來「課本」那排的發佈鈕在 x=1081–1190，
           「作業簿」那排在 1199–1308——整整差一欄。原因是這個格線寫死五欄，
           但 V1329 把課本那排從六顆砍成三顆之後，格子沒跟著改：
           課本排只用掉 3 格（右邊空兩格），作業簿排是「編輯＋更多＋一個沒用到的佔位＋發佈」
           ＝ 4 格，兩排的最後一顆自然對不齊。這是那次砍按鈕留下來的，不是這次改版造成的。
           改成「有幾顆就排幾欄、整組靠右」：每一排的最後一顆都會落在同一條垂直線上。 */
        .lc-btns{display:grid;grid-auto-flow:column;grid-auto-columns:88px;gap:6px;flex:none;
          justify-content:end}
        .lc-btns>.btn{width:100%;justify-content:center;padding-left:4px;padding-right:4px;white-space:nowrap}
        @media (max-width:820px){

        @media (max-width:640px){.lc-bar .grow{flex-basis:100%;height:0}}
        .crm-thead{display:flex;align-items:center;gap:8px;padding:2px 14px 7px}
        .crm-thead .crm-head{font-size:12px;color:var(--muted,#5B6B80);font-weight:600}
        /* CRMCOL_V757 🗑 從姓名欄搬到最右邊那一欄之後，姓名旁邊只剩 ✏️，
           省下來的寬度給中間那兩欄——「申請學校」和「期限・結果」本來都被擠成「…」。 */
        .crm-head{display:grid;
          /* STBADGE_V897 狀態欄本來 78px，「✕ 中途放棄」塞不下被切成「✕ 中途…」。放寬到 100px。 */
          /* CRMFIT_V989 七欄加起來最少要 1018px，可是格線一直開到視窗 1181px 都還在用，
             那時候容器只有 870px。也就是說 1181～1370px 這一段本來就裝不下，
             中文被切成「…」所以看不出來，越南文直接凸出白框外面。
             這裡把最小寬度收到 948px，換行的門檻也從 1180 提到 1280。 */
          /* MONEY_V1023 「報價 6,000,000 VND」一行要 113px、越南文「Báo giá 120.000.000 VND」要 141px，
             欄位只有 122px，所以「報價」兩個字被擠到上面一行（Quinn：「掉下來讓我覺得很煩」）。
             寫成 minmax：有空間就給到 148px 排成一行，真的不夠寬才縮回原本的 122px，
             所以窄視窗的排法完全沒變。 */
          /* NAMEWIDE_V1233 名字欄本來最少 170px，扣掉旁邊的 ✏️ 只剩 128px 給名字，
             「阮文明 Nguyễn Văn Minh」要 167px，所以被切成「…」。
             名字欄放寬到 206px，差的寬度從申請學校、期限、金額那幾欄各收一點。 */
          grid-template-columns:minmax(214px,1.5fr) minmax(104px,auto) minmax(132px,1.6fr) minmax(172px,200px) 66px minmax(116px,168px) 60px;
          gap:10px;align-items:center;flex:1;min-width:0}
        /* CRMHEAD_V757 最上面那一列標題置中，跟底下的內容對齊。
           姓名靠左、已收靠右——那兩欄的內容本來就是那樣排的，硬置中反而更歪。 */
        .crm-thead .crm-head .cc{justify-content:center;text-align:center}
        .crm-thead .crm-head .cc.nm,
        .crm-thead .crm-head .cc.sch{justify-content:flex-start;text-align:left}
        .crm-thead .crm-head .cc.money{justify-content:flex-end;text-align:right}
        .crm-head .cc.st,.crm-head .cc.dt,.crm-head .cc.num,.crm-head .cc.kd{justify-content:center}
        /* STBADGE_V897 三種狀態標籤釘成同寬同高，文字置中，看起來才是同一顆。
           寬度跟右邊的結果標籤一樣是 92px。 */
        /* STBADGE_V998 本來是固定 106px。106 是我在測試環境量「Đang tiến hành」量出來的，
           可是越南文字型是她自己在設定裡選的——換一個字型就又被切掉（她的截圖）。
           改成照內容長、只留下限，任何字型都不會再被切。 */
        #app .crm-head .cc.st .badge{width:auto;min-width:106px;max-width:100%;flex:0 1 auto;
          display:inline-flex!important;align-items:center;justify-content:center;
          text-align:center!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .crm-head .cc.money{justify-content:flex-end;text-align:right}
        /* CRMGAP_V1356 Quinn：「按鈕也靠得太近了吧」。量了她的截圖：綠色的「進行中」
           標籤右緣到旁邊「✏️ 申請簽證」那顆之間只有 6px，兩顆幾乎黏在一起。
           同一格裡一個是「狀態」一個是「可以按的鈕」，6px 看起來像同一個東西。
           拉到 10px；欄寬沒動，只是格子裡的兩個東西分開一點。 */
        .crm-head .cc{min-width:0;display:flex;align-items:center;gap:10px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .crm-head .cc>*{min-width:0;overflow:hidden;text-overflow:ellipsis}
        /* EDIT_COL_V16 ✏️ 固定貼在「姓名」欄的右緣，每一列都在同一個位置 */
        /* ONELINE_V676 姓名一律排一行（拿掉「聯絡」欄之後寬度夠了）；
           ✏️🗑 縮小並靠右，不跟名字搶空間。 */
        /* BTNALIGN_V682 ✏️🗑 本來跟在名字後面跑（space-between 把三個東西攤開），
           名字長短不一就每一列一個位置。讓名字吃掉剩下的空間，兩顆鈕就一律貼在欄位右緣。 */
        .crm-head .cc.nm{white-space:nowrap;overflow:hidden;align-items:center;gap:2px;justify-content:flex-start}
        /* NAMECUT_V1103 切掉的時候要有「…」，不然看不出來後面還有字 */
        .cc.nm>b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        /* LIFE_V1106 四個日期 */
        .lf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}
        .lf-f{display:flex;flex-direction:column;gap:3px;font-weight:400;margin:0}
        .lf-f>span{font-size:12px;color:var(--muted,#5B6B80)}
        .lf-f>input{margin:0}
        /* DATEBTN_V1255 日期格子後面跟著「今天」和「✕」 */
        /* FGSEC_V1256 表單裡的分區小標 */
        .fg-sec,.form-grid .field.fg-sec{display:flex;flex-direction:row;align-items:baseline;
          gap:8px;flex-wrap:wrap;margin:8px 0 -2px;padding-top:12px;
          border-top:1px solid var(--line,#DCE5F0)}
        .fg-sec:first-child{margin-top:0;padding-top:0;border-top:0}
        .fg-sec>b{font-size:13.5px;color:var(--primary,#1E4C86);letter-spacing:.02em}
        .fg-sec>i{font-style:normal;font-size:12px;color:var(--muted,#5B6B80);font-weight:400}
        .lf-in{display:flex;align-items:center;gap:4px;min-width:0}
        .lf-in>input{flex:1;min-width:0;margin:0}
        .lf-in>.btn{flex:none;padding:5px 8px;font-size:12px}
        .lf-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
        .lf-i{font-size:12px;background:#EEF0F3;color:#5B6B80;border-radius:999px;padding:2px 10px;white-space:nowrap}
        .lf-i>b{font-weight:700;color:#16202E}
        .lf-i.lf-n{background:#EDE9FE;color:#6B21A8}
        /* REALNAME_V1108 名字旁邊的真實姓名 */
        .rl-t{font-size:12px;color:#5B6B80;font-weight:400;margin-left:6px;white-space:nowrap}
        /* PASSPAY_V1107 「代收」那個勾放在那一列裡 */
        .pay-pass{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
          color:var(--muted,#5B6B80);white-space:nowrap;font-weight:400;margin:0}
        .cc .tag{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .crm-head .cc.nm b{font-size:15px;flex:1 1 auto;min-width:0;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis;line-height:1.35}
        .crm-head .cc.nm .btn-icon{flex:none;padding:2px 6px;font-size:12.5px}
        .crm-head .cc.nm .btn-icon{flex:none;margin-left:6px}
        /* MEETICON_V922 客戶列最後一欄只有 62px，「🎥 進入教室」整顆塞進去會把
           前面的「已收」擠掉，有按鈕的列就跟沒按鈕的列對不齊。這裡只留 icon。 */
        #app .crm-head .cc.act .mb-t{display:none}
        #app .crm-head .cc.act .mb-a{padding-left:9px;padding-right:9px;font-size:15px;line-height:1.2}
