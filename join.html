<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QNA CHINESE · 報名表 / Phiếu đăng ký</title>
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex">
<meta property="og:title" content="QNA CHINESE · 報名表 / Phiếu đăng ký">
<meta property="og:description" content="Điền thông tin để cô sắp lớp cho em. 填好資料，老師會盡快跟你聯絡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202E;--muted:#5B6B80;--line:#E4E7EB;--primary:#1E4C86;--soft:#F4F6F8;--ok:#16a34a;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#EEF1F4;color:var(--ink);
  font-family:"Be Vietnam Pro","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:0 2px 14px rgba(20,35,60,.05)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--primary);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none}
h1{font-size:21px;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.langbar{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.langbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;color:var(--muted)}
.langbar button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.sec{margin-top:20px}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);
  border-bottom:1.5px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.f{margin-bottom:13px}
.f>label{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
.f .hint{font-weight:400;color:var(--muted);font-size:12.5px}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #C7D6EA;outline-offset:1px;border-color:var(--primary)}
textarea{min-height:88px;resize:vertical}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;cursor:pointer;background:#fff;font-size:14.5px}
.pick input{width:auto;margin:0}
.pick.on{background:#EEF2F7;border-color:#9FB2C8;font-weight:600}
.sub-box{border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;
  padding:12px 14px;margin-top:10px;background:#FAFBFC;display:none}
.sub-box.on{display:block}
.go{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:var(--primary);
  color:#fff;font:inherit;font-size:16.5px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:14.5px;display:none}
.msg.err{display:block;background:#FDECEA;color:var(--bad)}
.done{text-align:center;padding:34px 18px}
.done .big{font-size:44px}
.done h2{margin:10px 0 6px;font-size:21px}
.done p{color:var(--muted);margin:0}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:480px){.wrap{padding:12px 10px 50px}.card{padding:16px 14px;border-radius:14px}h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <div class="hd"><div class="logo">華</div>
      <div><h1 id="t-title">Phiếu đăng ký học</h1>
        <div class="sub" id="t-sub">QNA CHINESE · Tiếng Trung Quyên Huỳnh</div></div></div>

    <div class="langbar">
      <button type="button" data-l="vi" class="on">Tiếng Việt</button>
      <button type="button" data-l="zh">中文</button>
      <button type="button" data-l="en">English</button>
    </div>

    <div id="t-lead" class="sub" style="margin-bottom:4px"></div>

    <form id="form" autocomplete="off">
      <div class="hp"><label>Company<input type="text" id="company" tabindex="-1"></label></div>

      <div class="sec">
        <div class="sec-h" id="t-s1">THÔNG TIN CỦA EM</div>
        <div class="f"><label id="t-name">Tên thường gọi *</label><input type="text" id="f-name"></div>
        <div class="f"><label id="t-real">Họ tên đầy đủ</label><input type="text" id="f-real"></div>
        <div class="f"><label id="t-email">Email</label><input type="email" id="f-email" inputmode="email"></div>
        <div class="f"><label id="t-phone">Zalo / LINE / Số điện thoại</label><input type="text" id="f-phone" inputmode="tel"></div>
        <div class="f"><label id="t-birth">Ngày sinh</label><input type="date" id="f-birth"></div>
      </div>

      <div class="sec">
        <div class="sec-h" id="t-s2">EM MUỐN GÌ</div>
        <div class="picks" id="picks">
          <label class="pick on" data-k="student"><input type="checkbox" value="student" checked> <span data-t="k-student">Học tiếng Trung</span></label>
          <label class="pick" data-k="agency"><input type="checkbox" value="agency"> <span data-t="k-agency">Du học</span></label>
          <label class="pick" data-k="interview"><input type="checkbox" value="interview"> <span data-t="k-interview">Luyện phỏng vấn</span></label>
          <label class="pick" data-k="writing"><input type="checkbox" value="writing"> <span data-t="k-writing">Viết hồ sơ</span></label>
        </div>

        <div class="sub-box on" id="box-student">
          <div class="f"><label id="t-level">Trình độ hiện tại</label>
            <select id="f-level"></select></div>
          <div class="f"><label id="t-goal">Mục tiêu học</label>
            <select id="f-goal"></select></div>
          <div class="f" style="margin-bottom:0"><label id="t-time">Giờ nào em học được <span class="hint" id="t-time-h">(giờ Việt Nam)</span></label>
            <input type="text" id="f-time" placeholder="VD: tối thứ 2, thứ 5 sau 20:00"></div>
        </div>

        <div class="sub-box" id="box-agency">
          <div class="f" style="margin-bottom:0"><label id="t-school">Trường / ngành em muốn nộp</label>
            <input type="text" id="f-school" placeholder="VD: NTNU, ngành Sư phạm tiếng Hoa"></div>
        </div>

        <div class="sub-box" id="box-interview">
          <div class="f" style="margin-bottom:0"><label id="t-itv">Phỏng vấn gì</label>
            <input type="text" id="f-itv" placeholder="VD: phỏng vấn xin visa"></div>
        </div>

        <div class="sub-box" id="box-writing">
          <div class="f" style="margin-bottom:0"><label id="t-docs">Cần viết giấy tờ gì</label>
            <input type="text" id="f-docs" placeholder="VD: kế hoạch học tập, tự truyện"></div>
        </div>
      </div>

      <div class="sec">
        <div class="sec-h" id="t-s3">KHÁC</div>
        <div class="f"><label id="t-from">Em biết cô qua đâu</label><input type="text" id="f-from" placeholder="Facebook / bạn giới thiệu…"></div>
        <div class="f" style="margin-bottom:0"><label id="t-msg">Em muốn nói thêm gì</label><textarea id="f-msg"></textarea></div>
      </div>

      <button class="go" type="submit" id="go">Gửi</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="foot">QNA CHINESE</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
/* JOIN_V1110 學生自己填的報名表。寫進 leads（跟官網的報名同一個集合、同一條安全規則），
   老師在後台「財務・營運 → 報名名單」看到，按一下就能建成正式的學生／客戶。 */
var T={
 vi:{title:'Phiếu đăng ký học',lead:'Em điền giúp cô mấy thông tin này nhé, cô sẽ liên hệ lại sớm.',
   s1:'THÔNG TIN CỦA EM',s2:'EM MUỐN GÌ',s3:'KHÁC',
   name:'Tên thường gọi *',real:'Họ tên đầy đủ',email:'Email',phone:'Zalo / LINE / Số điện thoại',
   birth:'Ngày sinh',level:'Trình độ hiện tại',goal:'Mục tiêu học',
   time:'Giờ nào em học được',timeh:'(giờ Việt Nam)',school:'Trường / ngành em muốn nộp',
   itv:'Phỏng vấn gì',docs:'Cần viết giấy tờ gì',from:'Em biết cô qua đâu',msg:'Em muốn nói thêm gì',
   go:'Gửi',sending:'Đang gửi…',need:'Em điền tên và ít nhất một cách liên hệ nhé.',
   err:'Gửi không được, em thử lại hoặc nhắn trực tiếp cho cô nhé.',
   okT:'Cô nhận được rồi!',okB:'Cô sẽ liên hệ lại với em sớm nhất có thể.',
   ks:'Học tiếng Trung',ka:'Du học',ki:'Luyện phỏng vấn',kw:'Viết hồ sơ',
   L:['Chưa học bao giờ','Mới bắt đầu','Sơ cấp','Trung cấp','Cao cấp'],
   G:['Giao tiếp hằng ngày','Thi TOCFL','Du học','Công việc','Khác']},
 zh:{title:'報名表',lead:'填好這幾項，老師會盡快跟你聯絡。',
   s1:'你的資料',s2:'你想要什麼',s3:'其他',
   name:'平常用的名字 *',real:'真實姓名',email:'Email',phone:'Zalo／LINE／電話',
   birth:'生日',level:'目前程度',goal:'學習目標',
   time:'哪些時間可以上課',timeh:'（越南時間）',school:'想申請的學校／科系',
   itv:'要練哪一種面試',docs:'需要代寫哪些文件',from:'怎麼知道老師的',msg:'還想說什麼',
   go:'送出',sending:'送出中…',need:'請填名字，還有至少一種聯絡方式。',
   err:'送不出去，請再試一次，或直接私訊老師。',
   okT:'收到了！',okB:'老師會盡快跟你聯絡。',
   ks:'華語課',ka:'留學代辦',ki:'面試練習',kw:'代寫文件',
   L:['完全沒學過','剛開始','初級','中級','高級'],
   G:['日常會話','考 TOCFL','留學','工作','其他']},
 en:{title:'Registration form',lead:'Fill this in and the teacher will get back to you soon.',
   s1:'ABOUT YOU',s2:'WHAT YOU NEED',s3:'OTHER',
   name:'Name you usually go by *',real:'Full legal name',email:'Email',phone:'Zalo / LINE / Phone',
   birth:'Date of birth',level:'Current level',goal:'Goal',
   time:'When can you take lessons',timeh:'(Vietnam time)',school:'School / major you want to apply to',
   itv:'What kind of interview',docs:'Which documents',from:'How did you find us',msg:'Anything else',
   go:'Send',sending:'Sending…',need:'Please fill in your name and at least one way to reach you.',
   err:'Could not send. Please try again or message the teacher directly.',
   okT:'Got it!',okB:'The teacher will contact you soon.',
   ks:'Chinese lessons',ka:'Study abroad',ki:'Interview practice',kw:'Document writing',
   L:['Never studied','Just starting','Beginner','Intermediate','Advanced'],
   G:['Everyday conversation','TOCFL exam','Study abroad','Work','Other']}};
var L='vi';
function $(id){return document.getElementById(id);}
function setSel(el,arr){el.innerHTML='<option value=""></option>'+arr.map(function(x,i){
  return '<option value="'+i+'">'+x+'</option>';}).join('');}
function apply(){
  var t=T[L];document.documentElement.lang=(L==='zh'?'zh-Hant':L);
  $('t-title').textContent=t.title;$('t-lead').textContent=t.lead;
  $('t-s1').textContent=t.s1;$('t-s2').textContent=t.s2;$('t-s3').textContent=t.s3;
  $('t-name').textContent=t.name;$('t-real').textContent=t.real;$('t-email').textContent=t.email;
  $('t-phone').textContent=t.phone;$('t-birth').textContent=t.birth;
  $('t-level').textContent=t.level;$('t-goal').textContent=t.goal;
  $('t-time').innerHTML=t.time+' <span class="hint">'+t.timeh+'</span>';
  $('t-school').textContent=t.school;$('t-itv').textContent=t.itv;$('t-docs').textContent=t.docs;
  $('t-from').textContent=t.from;$('t-msg').textContent=t.msg;$('go').textContent=t.go;
  var m={'k-student':t.ks,'k-agency':t.ka,'k-interview':t.ki,'k-writing':t.kw};
  Object.keys(m).forEach(function(k){var e=document.querySelector('[data-t="'+k+'"]');if(e)e.textContent=m[k];});
  var lv=$('f-level').value,gl=$('f-goal').value;
  setSel($('f-level'),t.L);setSel($('f-goal'),t.G);
  $('f-level').value=lv;$('f-goal').value=gl;
  document.querySelectorAll('.langbar button').forEach(function(b){b.classList.toggle('on',b.dataset.l===L);});
}
document.querySelectorAll('.langbar button').forEach(function(b){
  b.addEventListener('click',function(){L=b.dataset.l;apply();});});
document.querySelectorAll('.pick input').forEach(function(c){
  c.addEventListener('change',function(){
    c.closest('.pick').classList.toggle('on',c.checked);
    var b=$('box-'+c.value);if(b)b.classList.toggle('on',c.checked);});});
(function(){try{var n=(navigator.language||'').toLowerCase();
  L=(n.indexOf('vi')===0)?'vi':(n.indexOf('zh')===0?'zh':(n.indexOf('en')===0?'en':'vi'));}catch(e){}
  apply();})();
$('form').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var t=T[L],msg=$('msg'),go=$('go');
  if($('company').value)return;               /* 擋機器人 */
  var v=function(id){return ($(id).value||'').trim();};
  var name=v('f-name'),email=v('f-email'),phone=v('f-phone');
  if(!name||!(email||phone)){msg.className='msg err';msg.textContent=t.need;return;}
  var want=[];document.querySelectorAll('.pick input').forEach(function(c){if(c.checked)want.push(c.value);});
  var lvI=$('f-level').value,glI=$('f-goal').value;
  var lead={kind:'lead',status:'new',source:'join',lang:L,
    name:name,real_name:v('f-real'),email:email,phone:phone,
    birth:v('f-birth'),want:want.join(','),
    level:(lvI===''?'':T.zh.L[Number(lvI)]||''),goal:(glI===''?'':T.zh.G[Number(glI)]||''),
    pref_time:v('f-time'),school:v('f-school'),itv_kind:v('f-itv'),docs:v('f-docs'),
    referrer:v('f-from'),message:v('f-msg')};
  /* leads 的安全規則限制一筆最多 25 個欄位，這裡把空的拿掉，也順便少存一點 */
  Object.keys(lead).forEach(function(k){if(lead[k]==='')delete lead[k];});
  go.disabled=true;go.textContent=t.sending;msg.className='msg';
  try{
    await DB.insert('leads',lead);
    $('card').innerHTML='<div class="done"><div class="big">🎉</div><h2>'+t.okT+'</h2><p>'+t.okB+'</p></div>';
    window.scrollTo(0,0);
  }catch(e){go.disabled=false;go.textContent=t.go;msg.className='msg err';msg.textContent=t.err;}
});
</script>
</body>
</html>
