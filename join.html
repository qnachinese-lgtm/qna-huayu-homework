<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QNA CHINESE · 報名表 / Phiếu đăng ký</title>
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex">
<meta property="og:title" content="QNA CHINESE · 報名表 / Phiếu đăng ký">
<meta property="og:description" content="Điền thông tin để mình sắp lớp cho bạn nhé. 填好資料，老師會盡快跟你聯絡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* JOINUI_V1120 配色改成跟老師後台同一套藍（styles.css 的 --primary #1E4C86 那一組），
   字體也用後台的 Calibri／Carlito ＋ Noto Sans TC。 */
/* FONT_V1130 中文改成思源黑體（Noto Sans TC），就是 Quinn 給的宜蘊醫療那個網站在用的黑體。
   越南文／英文和數字維持 Be Vietnam Pro。 */
:root{
  --primary:#1E4C86;--primary-d:#143A6B;--primary-soft:#E4EDF9;--accent:#0F2740;
  --bg:#F4F7FB;--ink:#16202E;--muted:#5B6B80;--line:#DCE5F0;--line-2:#C0CEE0;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 8px 24px rgba(22,32,46,.06);
  --shadow-lg:0 2px 4px rgba(22,32,46,.05),0 16px 40px rgba(22,32,46,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.65;
  font-family:"Be Vietnam Pro","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:420px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(228,237,249,.85),rgba(244,247,251,0) 78%)}
.page{position:relative;z-index:1;max-width:740px;margin:0 auto;padding:30px 18px 52px}

/* ── 頂欄：跟官網同一條 ── */
header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;max-width:740px;margin:0 auto;padding:11px 18px}
.logo{width:46px;height:46px;flex:none;border-radius:13px;color:#fff;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  font-size:22px;font-weight:700;letter-spacing:.5px;
  box-shadow:0 6px 16px rgba(30,76,134,.28)}
.mark{font-weight:800;font-size:16.5px;letter-spacing:2.6px;line-height:1.3}
.mark span{display:block;font-size:12px;font-weight:500;letter-spacing:.2px;color:var(--muted)}
/* LANGMENU_V1124 跟後台、官網同一顆：「🌐 目前語言」按下去展開清單 */
.langwrap{position:relative;margin-left:auto}
.lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:126px;
  border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:8px 15px;
  font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.lang-btn:hover{border-color:var(--primary)}
.langbar{position:absolute;top:calc(100% + 6px);right:0;z-index:80;background:#fff;
  border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 28px rgba(22,32,46,.16);
  overflow:hidden;min-width:100%}
.langbar[hidden]{display:none}
.langbar button{display:block;width:100%;text-align:center;white-space:nowrap;background:none;border:0;
  border-bottom:1px solid var(--line);padding:10px 18px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.langbar button:last-child{border-bottom:0}
.langbar button:hover{background:var(--primary-soft)}
.langbar button.on{background:var(--primary);color:#fff;font-weight:700}

/* ── 標題 ── */
.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--primary);margin-bottom:14px}
h1{font-weight:700;font-size:34px;line-height:1.35;margin:0 0 10px;letter-spacing:0;color:var(--ink)}
/* FONT_V1127 楷書的字面比黑體小、字距看起來偏鬆，中文版把字距收一點、行距放開一點；
   越南文／英文的標題原本太粗，跟中文擺在一起輕重差太多，降到 600。 */
html[lang^="zh"] body{letter-spacing:.02em;line-height:1.75}
html[lang^="zh"] h1{font-size:34px;font-weight:900;letter-spacing:.06em;line-height:1.4}
html[lang^="zh"] .done h2{font-weight:900;letter-spacing:.06em}
html[lang^="zh"] .sec-h .tx{letter-spacing:.14em}
html[lang="vi"] h1,html[lang="en"] h1{font-weight:600;letter-spacing:-.2px}
.lead{color:var(--muted);font-size:16px;margin:0 0 26px;max-width:32em}

/* ── 白卡 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:32px 32px 36px}
.sec+.sec{margin-top:30px;padding-top:28px;border-top:1px dashed var(--line)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.sec-h .no{width:27px;height:27px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:700}
.sec-h .tx{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--primary)}

/* ── 欄位 ── */
.f{margin-bottom:17px}
.f:last-child{margin-bottom:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.req{color:var(--primary)}
.hint{font-weight:500;font-size:12px;color:#8E9CAF}
input,select,textarea{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;
  font:inherit;font-size:15px;background:#fff;color:var(--ink);transition:.15s}
input::placeholder,textarea::placeholder{color:#9DAAB9;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(30,76,134,.14)}
textarea{min-height:98px;resize:vertical}
/* REQALL_V1126 沒填的欄位 */
input.bad,select.bad{border-color:#A33227;box-shadow:0 0 0 3px rgba(163,50,39,.12)}
/* LEADFILE_V1123 選檔案 */
.addf{border:1.5px dashed var(--line-2);background:#fff;color:var(--primary);border-radius:12px;
  padding:11px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.15s}
.addf:hover{border-color:var(--primary);background:var(--primary-soft)}
.addf:disabled{opacity:.45;cursor:default;border-style:solid}
.files{margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.files:empty{margin-bottom:0}
.fx{border:0;background:none;color:var(--muted);font:inherit;font-size:16px;line-height:1;
  cursor:pointer;padding:2px 4px;border-radius:6px}
.fx:hover{background:#F0D2CE;color:#A33227}
.files .fr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  background:#F7FAFD;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.files .fr b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fr.bad{background:#FCEFEE;border-color:#F0D2CE;color:#A33227}
select{appearance:none;-webkit-appearance:none;padding-right:40px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%235B6B80' stroke-width='2' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 15px center}

/* ── 服務選項 ── */
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{position:relative;display:flex;align-items:center;gap:12px;background:#fff;cursor:pointer;
  border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;transition:.16s}
.pick:hover{border-color:var(--line-2)}
.pick input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.pick .ic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:18px;
  background:var(--primary-soft);transition:.16s}
.pick .nm{font-weight:700;font-size:14.5px;line-height:1.35}
.pick .tick{margin-left:auto;width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;
  border:1.5px solid var(--line-2);color:transparent;font-size:12px;font-weight:700;transition:.16s}
.pick.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 6px 18px rgba(30,76,134,.12)}
.pick.on .ic{background:#CFE0F5}
.pick.on .tick{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── 選了才出現的小區塊 ── */
.sub-box{display:none;margin-top:14px;background:#F7FAFD;border:1px solid var(--line);border-radius:16px;padding:18px}
.sub-box.on{display:block}
.bt{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--primary);margin-bottom:15px}

/* ── 送出 ── */
/* STEP_V1135 一步一步填 */
.steps{margin:0 0 16px}
.bar{height:6px;background:#E1E8F2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:99px;transition:width .25s}
.stx{margin-top:8px;font-size:13px;font-weight:700;color:var(--primary)}
.sec.hide{display:none}
/* 有了進度條就不用再重複一次段落標題 */
.sec-h{display:none}
.nav{display:flex;gap:10px;margin-top:30px}
.nav .go{margin-top:0;flex:2}
.back{flex:1;border:1.5px solid var(--line-2);background:#fff;color:var(--muted);
  border-radius:999px;padding:16px 12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.nav .go{flex:2}
.back:hover{border-color:var(--primary);color:var(--primary)}
.back.hide,.go.hide{display:none}
/* DRAFT_V1135 上次填到一半 */
.draft{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#FFF8E6;border:1px solid #F0DFB0;
  border-radius:12px;padding:9px 13px;font-size:13px;color:#7A5A12;margin-bottom:16px}
.draft button{border:0;background:none;color:var(--primary);font:inherit;font-size:13px;
  font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
.draft.hide{display:none}
/* SOCIAL_V1135 送出後加好友 */
.done .soc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.done .soc a{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:11px 20px;
  font-size:14.5px;font-weight:700;text-decoration:none;color:#fff}
.done .soc a.fb{background:#1877F2}
.done .soc a.za{background:#0068FF}
.go{width:100%;margin-top:30px;border:0;border-radius:999px;padding:16px;cursor:pointer;
  font:inherit;font-size:16px;font-weight:800;color:#fff;letter-spacing:.3px;
  background:linear-gradient(135deg,var(--primary),var(--primary-d));box-shadow:0 8px 22px rgba(30,76,134,.26);transition:.16s}
.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px rgba(30,76,134,.32)}
.go:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;text-align:center;font-size:14px}
.msg.err{color:var(--primary);font-weight:600}

/* ── 送出後 ── */
.done{text-align:center;padding:28px 6px 22px}
.done .big{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  font-size:34px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 10px 26px rgba(30,76,134,.28)}
.done h2{font-weight:700;font-size:24px;margin:0 0 8px;letter-spacing:0}
.done p{color:var(--muted);margin:0;font-size:15.5px}

.foot{text-align:center;margin-top:28px}
.foot a{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;display:inline-block;transition:.15s}
.foot a:hover{color:var(--primary);border-color:var(--line-2)}
.foot .cp{display:block;margin-top:12px;color:#8E9CAF;font-size:12px;letter-spacing:1.6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

@media(max-width:600px){
  .page{padding:18px 14px 40px}
  .top{flex-wrap:wrap;gap:9px;padding:9px 14px}
  .lang-btn{min-width:0;padding:8px 12px}
  .lang-btn .lgn{display:none}
  .logo{width:40px;height:40px;border-radius:12px;font-size:19px}
  .mark{font-size:14.5px;letter-spacing:2px}.mark span{font-size:11px}
  h1{font-size:26px}
  .lead{font-size:15px;margin-bottom:20px}
  .card{padding:22px 18px 28px;border-radius:18px}
  .picks{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr;gap:0}
  .sec+.sec{margin-top:24px;padding-top:22px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">華</div>
    <div class="mark">QNA CHINESE<span id="t-sub">Tiếng Trung Quyên Huỳnh</span></div>
    <div class="langwrap"><!-- LANGMENU_V1124 -->
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false">🌐 <span class="lgn" id="lang-cur">Tiếng Việt</span></button>
      <div class="langbar" id="lang-menu" role="listbox" hidden>
        <button type="button" data-l="vi" class="on">Tiếng Việt</button>
        <button type="button" data-l="zh">中文</button>
        <button type="button" data-l="en">English</button>
      </div>
    </div>
  </div>
</header>

<div class="page">
  <div class="eyebrow" id="t-eye">📝 Đăng ký</div>
  <h1 id="t-title">Phiếu đăng ký học</h1>
  <p class="lead" id="t-lead"></p>

  <div class="card" id="card">
    <div class="steps"><!-- STEP_V1135 -->
      <div class="bar"><i id="st-bar" style="width:33%"></i></div>
      <div class="stx" id="st-tx"></div>
    </div>
    <div class="draft hide" id="draft-bar"><!-- DRAFT_V1135 -->
      <span id="t-draft">Đã giữ lại nội dung bạn điền dở lần trước.</span>
      <button type="button" id="draft-clear">Xoá, điền lại</button>
    </div>
    <form id="form" autocomplete="off">
      <div class="hp"><label>Company<input type="text" id="company" tabindex="-1"></label></div>

      <div class="sec">
        <div class="sec-h"><span class="no">1</span><span class="tx" id="t-s1">THÔNG TIN CỦA BẠN</span></div>
        <div class="row2">
          <div class="f"><label id="t-name">Tên Facebook / Zalo <span class="req">*</span></label><input type="text" id="f-name"></div>
          <div class="f"><label id="t-real">Họ tên đầy đủ</label><input type="text" id="f-real"></div>
        </div>
        <div class="f"><label id="t-fb">Link Facebook</label><input type="text" id="f-fb" placeholder="facebook.com/..."></div>
        <div class="row2">
          <div class="f"><label id="t-phone">Zalo / LINE / Số điện thoại</label><input type="text" id="f-phone" inputmode="tel"></div>
          <div class="f"><label id="t-email">Email</label><input type="email" id="f-email" inputmode="email"></div>
        </div>
        <div class="f"><label id="t-birth">Ngày sinh</label><input type="date" id="f-birth"></div>
      </div>

      <div class="sec">
        <div class="sec-h"><span class="no">2</span><span class="tx" id="t-s2">BẠN MUỐN GÌ</span></div>
        <div class="picks" id="picks">
          <label class="pick on" data-k="student"><input type="checkbox" value="student" checked><span class="ic">📖</span><span class="nm" data-t="k-student">Học tiếng Trung</span><span class="tick">✓</span></label>
          <label class="pick" data-k="agency"><input type="checkbox" value="agency"><span class="ic">🎓</span><span class="nm" data-t="k-agency">Du học</span><span class="tick">✓</span></label>
          <label class="pick" data-k="interview"><input type="checkbox" value="interview"><span class="ic">🎤</span><span class="nm" data-t="k-interview">Luyện phỏng vấn</span><span class="tick">✓</span></label>
          <label class="pick" data-k="writing"><input type="checkbox" value="writing"><span class="ic">✍️</span><span class="nm" data-t="k-writing">Viết hồ sơ</span><span class="tick">✓</span></label>
        </div>

        <div class="sub-box on" id="box-student"><div class="bt">📖 <span data-t="k-student">Học tiếng Trung</span></div>
          <div class="row2">
            <div class="f"><label id="t-level">Trình độ hiện tại</label><select id="f-level"></select></div>
            <div class="f"><label id="t-goal">Mục tiêu học</label><select id="f-goal"></select></div>
          </div>
          <div class="f"><label id="t-time">Giờ nào bạn học được <span class="hint" id="t-time-h">(giờ Việt Nam)</span></label>
            <input type="text" id="f-time" placeholder="VD: tối thứ 2, thứ 5 sau 20:00"></div>
          <div class="row2"><!-- MOREQ_V1131 -->
            <div class="f"><label id="t-mode">Học 1 kèm 1 hay lớp nhóm</label><select id="f-mode"></select></div>
            <div class="f"><label id="t-freq">Một tuần mấy buổi</label><select id="f-freq"></select></div>
          </div>
          <div class="f"><label id="t-when">Muốn bắt đầu khi nào</label><select id="f-when"></select></div>
        </div>

        <div class="sub-box" id="box-agency"><div class="bt">🎓 <span data-t="k-agency">Du học</span></div>
          <div class="f"><label id="t-school">Trường / ngành bạn muốn nộp</label>
            <input type="text" id="f-school" placeholder="VD: NTNU, ngành Sư phạm tiếng Hoa"></div>
          <div class="row2"><!-- MOREQ_V1131 -->
            <div class="f"><label id="t-edu">Học vấn cao nhất</label><select id="f-edu"></select></div>
            <div class="f"><label id="t-term">Muốn nhập học kỳ nào</label><select id="f-term"></select></div>
          </div>
          <div class="f"><label id="t-major">Trường / ngành đã học</label>
            <input type="text" id="f-major" placeholder="VD: ĐH Hà Nội, ngành Ngôn ngữ Trung"></div>
        </div>

        <div class="sub-box" id="box-interview"><div class="bt">🎤 <span data-t="k-interview">Luyện phỏng vấn</span></div>
          <div class="f"><label id="t-itv">Phỏng vấn gì</label>
            <input type="text" id="f-itv" placeholder="VD: phỏng vấn xin visa"></div>
          <div class="f"><label id="t-idate">Ngày phỏng vấn</label>
            <input type="text" id="f-idate" placeholder="VD: 20/10/2026 hoặc chưa biết"></div><!-- MOREQ_V1131 -->
        </div>

        <div class="sub-box" id="box-writing"><div class="bt">✍️ <span data-t="k-writing">Viết hồ sơ</span></div>
          <div class="f"><label id="t-docs">Cần viết giấy tờ gì</label>
            <input type="text" id="f-docs" placeholder="VD: kế hoạch học tập, tự truyện"></div>
          <div class="f"><label id="t-ddue">Khi nào cần nộp</label>
            <input type="text" id="f-ddue" placeholder="VD: 30/10/2026 hoặc chưa biết"></div><!-- MOREQ_V1131 -->
        </div>
        <div class="row2" style="margin-top:14px"><!-- MOREQ_V1131 -->
          <div class="f"><label id="t-meet">Ngày muốn hẹn</label><input type="date" id="f-meetd"></div>
          <div class="f"><label id="t-slot">Mấy giờ</label>
            <input type="text" id="f-slot" class="hhmm" inputmode="numeric" maxlength="5"></div><!-- HHMM_V1133 -->
        </div>
      </div>

      <div class="sec">
        <div class="sec-h"><span class="no">3</span><span class="tx" id="t-s3">KHÁC</span></div>
        <div class="f"><label id="t-from">Bạn biết mình qua đâu</label><input type="text" id="f-from" placeholder="Facebook / bạn giới thiệu…"></div>

/* HHMM_V1133 時間欄位跟老師後台一樣：打 0900 自動變成 09:00 */
function hhmmFmt(v){var d=String(v||'').replace(/\D/g,'');if(!d)return '';
  if(d.length>4)d=d.slice(0,4);
  if(d.length<=2)return d;
  return d.slice(0,d.length-2)+':'+d.slice(-2);}
function hhmmNorm(v){var s=String(v||'').trim();if(!s)return '';var h,m;
  if(s.indexOf(':')>=0){var q=s.split(':');h=parseInt(q[0]||'0',10)||0;m=parseInt(q[1]||'0',10)||0;}
  else{var d=s.replace(/\D/g,'');if(!d)return '';
    if(d.length<=2){h=parseInt(d,10)||0;m=0;}
    else{h=parseInt(d.slice(0,d.length-2),10)||0;m=parseInt(d.slice(-2),10)||0;}}
  if(h>23||m>59)return '';
  return String(h).length<2?('0'+h+':'+(String(m).length<2?('0'+m):m)):(h+':'+(String(m).length<2?('0'+m):m));}
document.addEventListener('input',function(e){var t=e.target;
  if(t&&t.classList&&t.classList.contains('hhmm')){t.value=hhmmFmt(t.value);}});
document.addEventListener('blur',function(e){var t=e.target;
  if(t&&t.classList&&t.classList.contains('hhmm')&&t.value.trim()){
    var n=hhmmNorm(t.value);
    if(n){t.value=n;t.classList.remove('bad');}else{t.classList.add('bad');}}},true);

async function notifyLead(lead){
  var g=function(k){return (SITE&&SITE[k])||'';};
  var pub=g('emailjs_public'),svc=g('emailjs_service'),tpl=g('emailjs_template');
  var to=[g('notify_email')||(window.TEACHER_EMAIL||''),g('notify_cc')]
    .filter(function(x){return x&&String(x).trim();}).join(', ');
  if(!pub||!svc||!tpl||!to)return;
  var want=String(lead.want||'').split(',').filter(Boolean)
    .map(function(k){return WANT_ZH[k]||k;}).join('、');
  var lines=[
    '名字（臉書／Zalo）：'+(lead.name||''),
    '真實姓名：'+(lead.real_name||'—'),
    '臉書連結：'+(lead.fb||'—'),
    'Email：'+(lead.email||'—'),
    'Zalo／電話：'+(lead.phone||'—'),
    '生日：'+(lead.birth||'—'),
    '想要：'+(want||'—'),
    '目前程度：'+(lead.level||'—'),
    '學習目標：'+(lead.goal||'—'),
    (lead.pref_time?'可以上課的時間：'+lead.pref_time:''),
    (lead.school?'想申請的學校／科系：'+lead.school:''),
    (lead.itv_kind?'面試種類：'+lead.itv_kind:''),
    (lead.docs?'要代寫的文件：'+lead.docs:''),
    (lead.referrer?'怎麼知道老師的：'+lead.referrer:''),
    (lead.message?'想說的話：'+lead.message:''),
    '',
    '（這一筆是從「報名表連結」填的，後台：財務・營運 → 報名名單）'
  ].filter(Boolean);
  try{await loadEmailJS();window.emailjs.init({publicKey:pub});
    await window.emailjs.send(svc,tpl,{
      to_email:to,name:lead.name||'',from_name:lead.name||'',
      email:lead.email||'',line:lead.fb||'',phone:lead.phone||'',
      level:lead.level||'',goal:lead.goal||'',lang:lead.lang||'',
      booking:lead.pref_time||'',material:'',
      message:lines.join('\n'),
      summary:'📝 報名表｜'+(lead.name||'')+'｜'
        +[lead.fb,lead.phone,lead.email].filter(Boolean).join(' / ')
        +(want?'｜'+want:'')});
  }catch(e){/* 寄不出去就算了，報名資料已經存好了 */}
  /* JOINREPLY_V1119 學生有留 Email，而且後台有設「自動回覆範本」，就回一封確認信給他 */
  try{var rtpl=g('emailjs_reply_template');
    if(rtpl&&lead.email){
      var RB={
        vi:{s:'QNA CHINESE · Mình đã nhận được phiếu đăng ký',
            b:'Chào '+(lead.name||'')+',\n\nMình đã nhận được phiếu đăng ký của bạn rồi, mình sẽ liên hệ lại sớm nhất có thể. Cảm ơn bạn nhé!\n\nQNA CHINESE'},
        zh:{s:'已收到你的報名 · QNA CHINESE',
            b:'你好 '+(lead.name||'')+'，\n\n我已經收到你填的報名表，會盡快跟你聯絡。謝謝你！\n\nQNA CHINESE'},
        en:{s:'We received your registration · QNA CHINESE',
            b:'Hi '+(lead.name||'')+',\n\nI have received your registration form and will contact you as soon as possible. Thank you!\n\nQNA CHINESE'}};
      var r=RB[lead.lang]||RB.vi;
      await window.emailjs.send(svc,rtpl,{to_email:lead.email,to_name:lead.name||'',
        from_name:'QNA CHINESE',subject:r.s,message:r.b});
    }
  }catch(e){/* 自動回覆失敗也不影響報名 */}
}
/* LEADFILE_V1123 學生可以順便上傳成績單、護照照片。
   照片在瀏覽器裡先縮到長邊 1400px、轉成 JPEG，這樣一張大約 200～400KB，
   再存成文字放進 lead_files（跟學生交作業用的是同一套做法）。
   PDF 沒辦法壓，超過 700KB 就請對方改拍照片。最多 3 個。 */
var FILES=[];
var FILE_MAX=3,PDF_MAX=700*1024,RAW_MAX=12*1024*1024;
function fileFmt(n){return n<1024*1024?(Math.round(n/1024)+' KB'):((n/1048576).toFixed(1)+' MB');}
function fileDraw(){
  var box=$('file-list');if(!box||!FILES)return;   /* 第一次 apply() 時 FILES 還沒指定值 */
  var t=T[L];
  box.innerHTML=FILES.map(function(f,i){
    return '<div class="fr'+(f.bad?' bad':'')+'"><span>'+(f.bad?'⚠️':(f.type==='application/pdf'?'📄':'🖼'))+'</span>'+
      '<b>'+f.name.replace(/[<>&]/g,'')+'</b><span style="margin-left:auto">'+
      (f.bad?f.bad:fileFmt(f.size))+'</span>'+
      '<button type="button" class="fx" data-i="'+i+'" title="'+t.fileDel+'">✕</button></div>';}).join('');
  box.querySelectorAll('.fx').forEach(function(b){
    b.addEventListener('click',function(){FILES.splice(Number(b.dataset.i),1);fileDraw();});});
  var add=$('f-add');
  if(add){var full=FILES.length>=FILE_MAX;add.disabled=full;
    add.textContent=full?t.fileFull:t.fileAdd;}
}
function shrink(file){
  return new Promise(function(res){
    if(file.type==='application/pdf'){
      if(file.size>PDF_MAX)return res({bad:'big'});
      return toB64(file,res);
    }
    if(String(file.type||'').indexOf('image/')!==0)return res({bad:'type'});
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      try{
        var mx=1400,w=img.width,h=img.height;
        if(w>mx||h>mx){var r=Math.min(mx/w,mx/h);w=Math.round(w*r);h=Math.round(h*r);}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        var d=c.toDataURL('image/jpeg',0.72);
        if(d.length>940000)d=c.toDataURL('image/jpeg',0.55);
        if(d.length>940000)return res({bad:'big'});
        res({data:d,type:'image/jpeg',size:Math.round(d.length*0.75)});
      }catch(e){res({bad:'type'});}
    };
    img.onerror=function(){URL.revokeObjectURL(url);res({bad:'type'});};
    img.src=url;
  });
}
function toB64(file,res){
  var r=new FileReader();
  r.onload=function(){var d=String(r.result||'');
    if(d.length>940000)return res({bad:'big'});
    res({data:d,type:file.type,size:file.size});};
  r.onerror=function(){res({bad:'type'});};
  r.readAsDataURL(file);
}
$('f-add').addEventListener('click',function(){$('f-file').click();});
$('f-file').addEventListener('change',async function(){
  var t=T[L],list=[].slice.call(this.files||[]);
  this.value='';                                   /* 清掉才能再選同一個檔案 */
  for(var i=0;i<list.length;i++){
    if(FILES.length>=FILE_MAX)break;               /* 一個一個加上去，不會蓋掉前面選的 */
    var f=list[i];
    if(f.size>RAW_MAX){FILES.push({name:f.name,size:f.size,bad:t.fileBig});fileDraw();continue;}
    var r=await shrink(f);
    if(r.bad){FILES.push({name:f.name,size:f.size,bad:(r.bad==='big'?t.fileBig:t.fileBad)});}
    else{FILES.push({name:f.name,size:r.size,type:r.type,data:r.data});}
    fileDraw();
  }
  fileDraw();
});
/* STEP_V1135 三個步驟：你的資料 → 你想要什麼 → 其他。手機上一次只看一段，比較不會被嚇跑。 */
var STEP=1;
function secs(){return [].slice.call(document.querySelectorAll('#form .sec'));}
function stepDraw(){
  var t=T[L],S=secs();
  S.forEach(function(e,i){e.classList.toggle('hide',(i+1)!==STEP);});
  $('st-bar').style.width=Math.round(STEP*100/3)+'%';
  $('st-tx').textContent=String(t.step).replace('{n}',STEP).replace('{t}',[t.s1,t.s2,t.s3][STEP-1]||'');
  $('f-back').classList.toggle('hide',STEP===1);
  $('f-next').classList.toggle('hide',STEP===3);
  $('go').classList.toggle('hide',STEP!==3);
}
/* 這一步該填的欄位 */
function stepNeed(){
  var want=[];document.querySelectorAll('.pick input').forEach(function(c){if(c.checked)want.push(c.value);});
  if(STEP===1)return ['f-name','f-real','f-fb','f-phone','f-email','f-birth'];
  if(STEP===2){
    var n=['f-meetd','f-slot'];
    if(want.indexOf('student')>=0)n=n.concat(['f-level','f-goal','f-time','f-mode','f-freq','f-when']);
    if(want.indexOf('agency')>=0)n=n.concat(['f-school','f-edu','f-major','f-term']);
    if(want.indexOf('interview')>=0)n=n.concat(['f-itv','f-idate']);
    if(want.indexOf('writing')>=0)n=n.concat(['f-docs','f-ddue']);
    return n;}
  return ['f-from'];
}
function markNeed(ids){
  var first=null;
  ids.forEach(function(id){var e=$(id);if(!e)return;
    var empty=!String(e.value||'').trim();
    e.classList.toggle('bad',empty);
    if(empty&&!first)first=e;});
  var sl=$('f-slot');
  if(!first&&ids.indexOf('f-slot')>=0&&sl.value.trim()&&!hhmmNorm(sl.value)){sl.classList.add('bad');first=sl;}
  return first;
}
function stepGo(n){
  var t=T[L],msg=$('msg');
  if(n>STEP){
    if(STEP===2){
      var want=[];document.querySelectorAll('.pick input').forEach(function(c){if(c.checked)want.push(c.value);});
      if(!want.length){msg.className='msg err';msg.textContent=t.needKind;return;}
    }
    var bad=markNeed(stepNeed());
    if(bad){msg.className='msg err';msg.textContent=t.needAll;
      bad.scrollIntoView({behavior:'smooth',block:'center'});
      setTimeout(function(){try{bad.focus({preventScroll:true});}catch(e){}},320);return;}
  }
  msg.className='msg';msg.textContent='';
  STEP=Math.min(3,Math.max(1,n));stepDraw();
  $('card').scrollIntoView({behavior:'smooth',block:'start'});
}
$('f-next').addEventListener('click',function(){stepGo(STEP+1);});
$('f-back').addEventListener('click',function(){stepGo(STEP-1);});

/* DRAFT_V1135 填一半自動留著，送出成功才清掉 */
var DKEY='qna_join_draft';
function dFields(){return [].slice.call(document.querySelectorAll('#form input,#form select,#form textarea'))
  .filter(function(e){return e.id&&e.id.indexOf('f-')===0&&e.type!=='file';});}
function draftSave(){
  try{var o={};dFields().forEach(function(e){
    if(e.type==='checkbox')o[e.id||e.value]=e.checked;else if(e.value)o[e.id]=e.value;});
    var picks={};document.querySelectorAll('.pick input').forEach(function(c){picks[c.value]=c.checked;});
    localStorage.setItem(DKEY,JSON.stringify({v:o,k:picks,at:Date.now()}));}catch(e){}
}
function draftLoad(){
  try{var d=JSON.parse(localStorage.getItem(DKEY)||'null');
    if(!d||!d.v||Date.now()-(d.at||0)>1000*60*60*24*30)return false;
    var any=false;
    Object.keys(d.v).forEach(function(k){var e=$(k);if(e&&typeof d.v[k]==='string'&&d.v[k]){e.value=d.v[k];any=true;}});
    if(d.k)document.querySelectorAll('.pick input').forEach(function(c){
      if(typeof d.k[c.value]==='boolean'){c.checked=d.k[c.value];
        c.closest('.pick').classList.toggle('on',c.checked);
        var b=$('box-'+c.value);if(b)b.classList.toggle('on',c.checked);}});
    return any;}catch(e){return false;}
}
function draftClear(){try{localStorage.removeItem(DKEY);}catch(e){}}
document.addEventListener('input',function(e){
  if(e.target&&e.target.closest&&e.target.closest('#form'))draftSave();});
document.addEventListener('change',function(e){
  if(e.target&&e.target.closest&&e.target.closest('#form'))draftSave();});
$('draft-clear').addEventListener('click',function(){
  draftClear();dFields().forEach(function(e){e.value='';e.classList.remove('bad');});
  $('draft-bar').classList.add('hide');STEP=1;stepDraw();});

/* DUP_V1135 同一支手機／臉書已經送過，再送前先提醒一次 */
var SKEY='qna_join_sent';
function sentList(){try{return JSON.parse(localStorage.getItem(SKEY)||'[]')||[];}catch(e){return [];}}
function sentKey(l){return String(l.phone||l.fb||l.email||'').replace(/\s|[-()]/g,'').toLowerCase();}
var DUPOK=false;

/* SOCIAL_V1135 送出後直接加好友 */
function socHtml(){
  var t=T[L],fb=(SITE&&SITE.fab_facebook)||'',za=(SITE&&SITE.fab_zalo)||'';
  var url=function(u,z){u=String(u||'').trim();if(!u)return '';
    if(/^https?:/i.test(u))return u;
    return z?('https://zalo.me/'+u.replace(/\D/g,'')):('https://facebook.com/'+u.replace(/^\/+/,''));};
  var a=url(fb),b=url(za,true);
  if(!a&&!b)return '';
  return '<div style="margin-top:22px;font-size:14px;color:var(--muted)">'+t.socT+'</div><div class="soc">'
    +(a?'<a class="fb" href="'+a+'" target="_blank" rel="noopener">f '+t.socFb+'</a>':'')
    +(b?'<a class="za" href="'+b+'" target="_blank" rel="noopener">💬 '+t.socZa+'</a>':'')+'</div>';
}

$('form').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var t=T[L],msg=$('msg'),go=$('go');
  if($('company').value)return;               /* 擋機器人 */
  var v=function(id){return ($(id).value||'').trim();};
  var name=v('f-name'),email=v('f-email'),phone=v('f-phone'),fb=v('f-fb');
  var want=[];document.querySelectorAll('.pick input').forEach(function(c){if(c.checked)want.push(c.value);});
  /* REQALL_V1126 每一欄都要填完才送得出去（留言和檔案除外） */
  if(!want.length){msg.className='msg err';msg.textContent=t.needKind;
    $('picks').scrollIntoView({behavior:'smooth',block:'center'});return;}
  var need=['f-name','f-real','f-fb','f-phone','f-email','f-birth','f-level','f-goal','f-from','f-meetd','f-slot'];
  if(want.indexOf('student')>=0)need.push('f-time','f-mode','f-freq','f-when');
  if(want.indexOf('agency')>=0)need.push('f-school','f-edu','f-major','f-term');
  if(want.indexOf('interview')>=0)need.push('f-itv','f-idate');
  if(want.indexOf('writing')>=0)need.push('f-docs','f-ddue');
  var first=null;
  ['f-name','f-real','f-fb','f-phone','f-email','f-birth','f-level','f-goal','f-time','f-school','f-itv','f-docs','f-from',
   'f-meetd','f-slot','f-mode','f-freq','f-when','f-edu','f-major','f-term','f-idate','f-ddue']
    .forEach(function(id){var e=$(id);if(!e)return;
      var must=need.indexOf(id)>=0,empty=!String(e.value||'').trim();
      e.classList.toggle('bad',must&&empty);
      if(must&&empty&&!first)first=e;});
  var sl=$('f-slot');
  if(!first&&sl&&sl.value.trim()&&!hhmmNorm(sl.value)){sl.classList.add('bad');first=sl;}/* HHMM_V1133 */
  if(first){msg.className='msg err';msg.textContent=t.needAll;
    first.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(function(){try{first.focus({preventScroll:true});}catch(e){}},320);return;}
  var lvI=$('f-level').value,glI=$('f-goal').value;
  var lead={kind:'lead',status:'new',source:'join',lang:L,
    name:name,real_name:v('f-real'),fb:fb,email:email,phone:phone,
    birth:v('f-birth'),want:want.join(','),
    level:(lvI===''?'':T.zh.L[Number(lvI)]||''),goal:(glI===''?'':T.zh.G[Number(glI)]||''),
    pref_time:v('f-time'),school:v('f-school'),itv_kind:v('f-itv'),docs:v('f-docs'),
    referrer:v('f-from'),message:v('f-msg')};
  /* MOREQ_V1131 多問的那幾項合併成四欄再存，後台一行就看得完 */
  var zh=T.zh,pickZh=function(arr,id){var i=$(id).value;return i===''?'':(arr[Number(i)]||'');};
  var slot=hhmmNorm(v('f-slot')),md=v('f-meetd');
  lead.pref_meet=[md,slot].filter(Boolean).join(' ');
  if(want.indexOf('student')>=0){
    lead.need=[pickZh(zh.M,'f-mode'),pickZh(zh.F,'f-freq'),pickZh(zh.W,'f-when')].filter(Boolean).join('・');}
  if(want.indexOf('agency')>=0){
    lead.edu=[pickZh(zh.E,'f-edu'),v('f-major'),pickZh(termList(zh),'f-term')].filter(Boolean).join('・');}
  var dl=[];
  if(want.indexOf('interview')>=0&&v('f-idate'))dl.push('面試 '+v('f-idate'));
  if(want.indexOf('writing')>=0&&v('f-ddue'))dl.push('文件 '+v('f-ddue'));
  if(dl.length)lead.deadline=dl.join('／');
  /* leads 的安全規則限制一筆最多 25 個欄位，這裡把空的拿掉，也順便少存一點 */
  Object.keys(lead).forEach(function(k){if(lead[k]==='')delete lead[k];});
  /* DUP_V1135 這台裝置已經送過同一個聯絡方式 */
  var sk=sentKey(lead);
  if(sk&&!DUPOK){
    var hit=sentList().filter(function(x){return x&&x.k===sk;})[0];
    if(hit){DUPOK=true;msg.className='msg err';
      msg.textContent=String(t.dup).replace('{d}',String(hit.at||'').slice(0,10));return;}
  }
  go.disabled=true;go.textContent=t.sending;msg.className='msg';
  var ok=FILES.filter(function(f){return f.data;});
  if(ok.length){lead.file_key='k'+Date.now()+Math.random().toString(36).slice(2,8);lead.files=ok.length;}
  try{
    if(ok.length){/* LEADFILE_V1123 檔案先存，存不進去也不擋報名 */
      go.textContent=t.fileUp;
      for(var i=0;i<ok.length;i++){
        try{await DB.insert('lead_files',{lead_key:lead.file_key,name:String(ok[i].name).slice(0,180),
          mime:ok[i].type,data:ok[i].data});}catch(e){}
      }
      go.textContent=t.sending;
    }
    await DB.insert('leads',lead);
    notifyLead(lead);                          /* JOINMAIL_V1115 寄信通知老師，寄不出去也不影響報名 */
    draftClear();/* DRAFT_V1135 */
    try{var sl2=sentList();sl2.push({k:sk,at:new Date().toISOString().slice(0,10)});
      localStorage.setItem(SKEY,JSON.stringify(sl2.slice(-20)));}catch(e){}/* DUP_V1135 */
    $('card').innerHTML='<div class="done"><div class="big">🎉</div><h2>'+t.okT+'</h2><p>'+t.okB+'</p>'
      +socHtml()+'</div>';
    window.scrollTo(0,0);
  }catch(e){go.disabled=false;go.textContent=t.go;msg.className='msg err';msg.textContent=t.err;}
});

/* DRAFT_V1135 放在最後面才叫：上面的 var（DKEY 之類）都指定好了，
   而且 apply() 已經把下拉選項建好，暫存的選項才貼得回去。 */
(function(){try{if(draftLoad())$('draft-bar').classList.remove('hide');}catch(e){}})();
</script>
