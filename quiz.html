<!doctype html>
<html lang="zh-Hant">
<head><script src="stu-shell.js?v=1805"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老師出的題｜美娟華語工作室 QNA CHINESE</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<!-- QTYPE_V1784 Quinn：「老師那邊可以新增題目類型」——填空題、句子排序、聽音選詞，學生在這一頁作答；紀錄跟其他題目一樣存進 tstudents，老師後台看得到 -->
<style>
:root{--p:#1E4C86;--ps:#E4EDF9;--ink:#16202E;--mut:#7A8BA3;--line:#DCE4EF;--bg:#F4F7FB;--ok:#2E8B57;--bad:#B23B2E}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:"Noto Serif","Noto Serif TC","Songti TC",PMingLiU,serif;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}[hidden]{display:none!important}
.bar{height:60px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1100px)/2));position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}.bl{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center}
.brand b{font-size:17px;letter-spacing:1px}.back{color:var(--p);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff;white-space:nowrap}
.stage{flex:1;width:100%;max-width:640px;margin:0 auto;padding:26px 16px 40px}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(30,60,110,.09);padding:26px;text-align:center}
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px;gap:10px;text-align:left}
.prog{height:6px;background:#EEF3FA;border-radius:99px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--p);transition:width .2s}
.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.sent{font-size:24px;line-height:2.1;text-align:left;font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC",serif}
.sent input{width:6.5em;height:42px;border:0;border-bottom:2px solid var(--p);background:#F5F8FD;border-radius:8px 8px 0 0;font:inherit;font-size:22px;text-align:center;margin:0 4px;outline:none;color:var(--p)}
.sent input.ok{border-color:var(--ok);background:#EAF6EF;color:var(--ok)}.sent input.no{border-color:var(--bad);background:#FDECEC;color:var(--bad)}
.build{min-height:64px;border:2px dashed #C9D6E8;border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.build.ok{border-color:var(--ok);background:#F2FAF5}.build.no{border-color:var(--bad);background:#FFF6F5}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pc{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:21px;font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC",serif;color:var(--ink)}
.build .pc{background:var(--ps);border-color:var(--ps);color:var(--p)}.pc.used{visibility:hidden}
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:40px;margin:4px auto 6px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(30,76,134,.25)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts button{min-height:60px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:24px;font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC","Noto Serif TC",serif;color:var(--ink)}
.opts button.ok{border:2px solid var(--ok);background:#EAF6EF;color:var(--ok)}.opts button.no{border:2px solid var(--bad);background:#FDECEC;color:var(--bad)}
.fb{min-height:24px;margin-top:14px;font-size:15px}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.btn{width:100%;height:50px;margin-top:14px;border:0;border-radius:12px;background:var(--p);color:#fff;font-size:16px;font-weight:700;letter-spacing:1px}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.big{font-size:44px;font-weight:700;color:var(--p);margin:8px 0}
.res{text-align:left;margin-top:14px;border-top:1px solid #EEF2F8;padding-top:10px}.res div{padding:7px 0;border-bottom:1px dashed #EEF2F8;font-size:14.5px;line-height:1.7}.res small{color:var(--mut)}.res .c{color:var(--ok)}.res .y{color:var(--bad)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
.sayb{border:1px solid #DCE4EF;background:#fff;border-radius:999px;padding:2px 9px;cursor:pointer;margin-left:4px}
.pc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.25}.pcpy{font-size:12px;color:#2F64A8;font-family:"Noto Serif",serif;letter-spacing:0;margin-top:2px}
.fbk{display:inline-block;min-width:2.4em;border-bottom:2px solid #1E4C86;color:#1E4C86;text-align:center;margin:0 4px;padding:0 4px}.fbk.ok{color:#1F6B43;border-color:#1F6B43}.fbk.no{color:#A33227;border-color:#A33227}
.fopt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0 0;align-items:center}.fopt small{color:#7A8BA3;width:100%;text-align:center}.fopt button{border:1px solid #DCE4EF;background:#fff;border-radius:12px;padding:10px 18px;font:inherit;font-size:20px;cursor:pointer;min-width:84px}.fopt button.on{border-color:#1E4C86;background:#EEF3FA;color:#1E4C86;font-weight:700}.fopt button.right{background:#E3F4EA;border-color:#7CCBA4;color:#1F6B43}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="index.html"><span class="bl">美</span><b>美娟華語工作室</b></a><a class="back" id="back" href="play.html">← 回班級</a></header>
<main class="stage" id="stage"><div class="card"><p class="sub">讀取中…</p></div></main>
<script src="config.js"></script>
<script src="zhuyin.js?v=1741"></script><script src="pyutil.js?v=1794"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var Q=new URLSearchParams(location.search),code=String(Q.get('class')||'').toUpperCase().replace(/[^A-Z0-9]/g,''),tid=String(Q.get('task')||'');
$('back').href='room.html?c='+encodeURIComponent(code);
var ls={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var name=ls.get('qna_cls_name_'+code),dev=ls.get('qna_guest_dev');
if(!code||!tid){bad('找不到這份題目');return}
if(!name||!dev){location.replace('room.html?c='+encodeURIComponent(code));return}
var db=null;try{if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.firestore()}catch(e){}
function bad(t){$('stage').innerHTML='<div class="card"><h2>'+esc(t)+'</h2><a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="room.html?c='+encodeURIComponent(code)+'">回班級</a></div>'}
function norm(s){return String(s||'').replace(/[\s　]/g,'').replace(/[，。！？、；：「」『』（）(),.!?;:'"]/g,'').toLowerCase()}
var T=null,C=null,QS=[],R={i:0,ok:0,res:[],t0:Date.now()};
/* 題目 → 一題一題 */
function build(t){var lines=String(t.items||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
  if(t.game==='fill')return lines.map(function(l){var parts=[],ans=[],re=/[（(]([^）)]+)[）)]/g,last=0,m;
      while((m=re.exec(l))){parts.push(l.slice(last,m.index));ans.push(m[1].split(/[／\/]/).map(function(x){return x.trim()}).filter(Boolean));last=re.lastIndex}
      parts.push(l.slice(last));return ans.length?{type:'fill',parts:parts,ans:ans,src:l}:null}).filter(Boolean).map(function(q,qi,all){
      /* FILLCH_V1794 「從選項選」：每一格給四個選項（其他句子的答案當誘答） */
      if(t.mode==='choice'){var pool=[];all.forEach(function(o){o.ans.forEach(function(a){if(pool.indexOf(a[0])<0)pool.push(a[0])})});
        q.opts=q.ans.map(function(a){var d=shuffle(pool.filter(function(x){return a.indexOf(x)<0})).slice(0,3);return d.length>=1?shuffle([a[0]].concat(d)):null});if(q.opts.some(function(o){return !o}))q.opts=null;}
      return q;});
  if(t.game==='order')return lines.map(function(l,li){var w=l.split(/\s+/).filter(Boolean);if(w.length<2)return null;var py=String((t.pys||[])[li]||'').split('|');var pm={};w.forEach(function(x,i){if(py[i])pm[x]=py[i]});var s;var n=0;do{s=shuffle(w);n++}while(s.join('')===w.join('')&&n<10);return {type:'order',words:w,mix:s,src:w.join(''),pm:pm}}).filter(Boolean);
  if(t.game==='listen'){var ws=lines.map(function(l){var h=(/^[㐀-鿿]+/.exec(l)||[''])[0];return h}).filter(Boolean);ws=ws.filter(function(w,i){return ws.indexOf(w)===i});
    /* VOICE_V1788 只出老師錄過聲音的詞（不用電腦的聲音），一次最多 10 題 */
    var rec=ws.filter(function(w){return window.QSH&&QSH.has(w)});if(rec.length<4)return [];
    var all=ws;ws=shuffle(rec).slice(0,10);
    return ws.map(function(w){var others=shuffle(all.filter(function(x){return x!==w})).slice(0,3);return {type:'listen',w:w,opts:shuffle(others.concat([w])),src:w}})}
  return []}
async function boot(){
  try{var a=await db.collection('ttasks').doc(tid).get();T=a.exists?a.data():null;var b=await db.collection('tclasses').doc(code).get();C=b.exists?b.data():null}catch(e){}
  if(!T||T.deleted_at||T.class_code!==code)return bad('找不到這份題目');if(!C||C.deleted_at)return bad('找不到這個班級');
  if(T.game==='listen'){try{await (window.QSH&&QSH.ready)}catch(e){}}
  QS=build(T);if(!QS.length)return bad(T.game==='listen'?'老師還沒錄好這份題目的聲音（至少要錄 4 個詞）':'這份題目還沒有內容');
  if(T.game==='listen'){try{speechSynthesis.getVoices()}catch(e){}}
  show()}
var TN={fill:'填空題',order:'句子排序',listen:'聽音選詞'};
/* ORDERPY_V1794 詞卡下面的小字拼音（學生選注音的就顯示注音） */
function SCRZ(){try{var TS=((C.scripts||{})[code+'_'+(localStorage.getItem('qna_guest_dev')||'')])||C.script_default||'';var my=localStorage.getItem('qna_cls_scr_'+code)||'';return ((C.scr_free&&my)?my:TS)==='zy'}catch(e){return false}}
function PYS(q,w){var p=q.pm&&q.pm[w];if(!p)return '';return '<small class="pcpy">'+esc(SCRZ()&&window.PYU?PYU.toZy(p):p)+'</small>'}
function head(){return '<div class="qhead"><span>'+esc(T.title||TN[T.game])+'・'+TN[T.game]+'</span><span>'+(R.i+1)+' / '+QS.length+'</span></div><div class="prog"><i style="width:'+(R.i/QS.length*100)+'%"></i></div>'}
function say(w){if(window.QSH&&QSH.code){QSH.play(w);return}try{var u=new SpeechSynthesisUtterance(w);u.lang='zh-TW';u.rate=.85;var vs=speechSynthesis.getVoices().filter(function(v){return /zh[-_](TW|HK|CN)|cmn|Chinese/i.test(v.lang+' '+v.name)});
  var tw=vs.find(function(v){return /TW/i.test(v.lang)})||vs[0];if(tw)u.voice=tw;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function show(){var q=QS[R.i],h='<div class="card">'+head();
  if(q.type==='fill'&&q.opts){h+='<p class="sub">選出空格裡正確的字詞</p><div class="sent">'+q.parts.map(function(p,j){return esc(p)+(j<q.ans.length?'<span class="fbk" data-b="'+j+'">'+'＿'.repeat(Math.max(2,Array.from(q.ans[j][0]).length))+'</span>':'')}).join('')+'</div>'
     +q.opts.map(function(o,j){return '<div class="fopt">'+(q.opts.length>1?'<small>第 '+(j+1)+' 格</small>':'')+o.map(function(x){return '<button type="button" data-j="'+j+'" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div>'}).join('')}
  else if(q.type==='fill'){h+='<p class="sub">在空格裡填上正確的字詞</p><div class="sent">'+q.parts.map(function(p,j){return esc(p)+(j<q.ans.length?'<input data-b="'+j+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+'□'.repeat(Array.from(q.ans[j][0]).length)+'" style="width:'+(Array.from(q.ans[j][0]).length*1.3+1.6)+'em">':'')}).join('')+'</div><p class="note">□ 是要填幾個字</p>'}
  if(q.type==='order'){h+='<p class="sub">依照順序點下面的詞，排成正確的句子（點上面的詞可以拿回來）</p><div class="build" id="bd"></div><div class="pool" id="pl">'+q.mix.map(function(w,j){return '<button type="button" class="pc" data-j="'+j+'">'+esc(w)+PYS(q,w)+'</button>'}).join('')+'</div>'}
  if(q.type==='listen'){h+='<p class="sub">聽聽看，選出你聽到的詞</p><button type="button" class="play" id="pv" aria-label="再聽一次">🔊</button><div class="note">聽不清楚可以再按一次</div><div class="opts">'+q.opts.map(function(o){return '<button type="button" data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>'}
  h+='<div class="fb" id="fb"></div>'+(q.type==='listen'?'<button class="btn" id="nx" type="button" hidden>下一題 →</button>':'<button class="btn" id="ck" type="button">確定</button>')+'</div>';
  $('stage').innerHTML=h;var done=false;
  function next(){R.i++;if(R.i>=QS.length)return finish();show()}
  function mark(ok,ans,shown){R.res.push({w:q.src,p:shown,a:ans,ok:ok?1:0,k:ok?'':'x'});if(ok)R.ok++;
    $('fb').className='fb '+(ok?'ok':'no');$('fb').innerHTML=ok?'✓ 答對了':'✗ 正確答案：'+esc(shown);done=true}
  if(q.type==='fill'&&q.opts){var sel=q.ans.map(function(){return ''});
    document.querySelectorAll('.fopt button').forEach(function(b){b.onclick=function(){if(done)return;var j=+b.dataset.j;sel[j]=b.dataset.v;document.querySelectorAll('.fopt button[data-j="'+j+'"]').forEach(function(x){x.classList.toggle('on',x===b)});var bk=document.querySelector('.fbk[data-b="'+j+'"]');if(bk){bk.textContent=b.dataset.v;bk.classList.add('on')}}});
    $('ck').onclick=function(){if(done)return next();if(sel.some(function(v){return !v}))return void($('fb').textContent='每一格都要選');
      var good=sel.map(function(v,j){return q.ans[j].some(function(a){return norm(a)===norm(v)})});document.querySelectorAll('.fbk').forEach(function(x,j){x.classList.add(good[j]?'ok':'no')});document.querySelectorAll('.fopt button').forEach(function(x){x.disabled=true;if(q.ans[+x.dataset.j][0]===x.dataset.v)x.classList.add('right')});
      mark(good.every(Boolean),sel.join('／'),q.ans.map(function(a){return a[0]}).join('／'));$('ck').textContent=R.i===QS.length-1?'看成績':'下一題 →'}}
  else if(q.type==='fill'){var ins=document.querySelectorAll('.sent input');if(ins[0])ins[0].focus();
    ins.forEach(function(x){x.onkeydown=function(e){if(e.key==='Enter')$('ck').click()}});
    $('ck').onclick=function(){if(done)return next();var vals=[].map.call(ins,function(x){return x.value.trim()});if(vals.some(function(v){return !v}))return void($('fb').textContent='每一格都要填');
      var good=vals.map(function(v,j){return q.ans[j].some(function(a){return norm(a)===norm(v)})});ins.forEach(function(x,j){x.classList.add(good[j]?'ok':'no');x.disabled=true});
      mark(good.every(Boolean),vals.join('／'),q.ans.map(function(a){return a[0]}).join('／'));$('ck').textContent=R.i===QS.length-1?'看成績':'下一題 →'}}
  if(q.type==='order'){var pick=[];
    function paint(){$('bd').innerHTML=pick.map(function(j,k){return '<button type="button" class="pc" data-k="'+k+'">'+esc(q.mix[j])+PYS(q,q.mix[j])+'</button>'}).join('');
      document.querySelectorAll('#pl .pc').forEach(function(b){b.classList.toggle('used',pick.indexOf(+b.dataset.j)>=0)});
      document.querySelectorAll('#bd .pc').forEach(function(b){b.onclick=function(){if(done)return;pick.splice(+b.dataset.k,1);paint()}})}
    document.querySelectorAll('#pl .pc').forEach(function(b){b.onclick=function(){if(done)return;var j=+b.dataset.j;if(pick.indexOf(j)<0){pick.push(j);paint()}}});paint();
    $('ck').onclick=function(){if(done)return next();if(pick.length<q.mix.length)return void($('fb').textContent='每個詞都要用到');
      var a=pick.map(function(j){return q.mix[j]}).join('');var ok=a===q.src;$('bd').classList.add(ok?'ok':'no');mark(ok,a,q.words.join(' '));$('ck').textContent=R.i===QS.length-1?'看成績':'下一題 →'}}
  if(q.type==='listen'){$('pv').onclick=function(){say(q.w)};setTimeout(function(){say(q.w)},250);
    document.querySelectorAll('.opts button').forEach(function(b){b.onclick=function(){if(done)return;var ok=b.dataset.o===q.w;b.classList.add(ok?'ok':'no');
      if(!ok)document.querySelectorAll('.opts button').forEach(function(x){if(x.dataset.o===q.w)x.classList.add('ok')});mark(ok,b.dataset.o,q.w);$('nx').hidden=false;$('nx').textContent=R.i===QS.length-1?'看成績':'下一題 →'}});
    $('nx').onclick=next}}
async function finish(){var n=QS.length,ok=R.ok,t=new Date().toISOString();
  var prog={};try{prog=JSON.parse(ls.get('qna_cls_prog_'+code)||'{}')||{}}catch(e){}
  var old=prog[tid]||{},better=ok>(old.ok||0)||!old.n;
  prog[tid]={ok:better?ok:old.ok,n:better?n:old.n,times:(old.times||0)+1,at:t,first:old.first||old.at||t,last:R.res.slice(0,60),hist:(Array.isArray(old.hist)?old.hist:[]).concat([{at:t,ok:ok,n:n,wr:R.res.filter(function(x){return !x.ok}).map(function(x){return x.w}).slice(0,40)}]).slice(-20)};
  ls.set('qna_cls_prog_'+code,JSON.stringify(prog));
  var saved='';try{await db.collection('tstudents').doc(code+'_'+dev).set({class_code:code,owner_uid:C.owner_uid,name:name,dev:dev,last_at:t,tasks:{[tid]:prog[tid]}},{merge:true});saved='已儲存，老師看得到'}catch(e){saved='紀錄沒存進去（網路不穩？）'}
  var wr=R.res.filter(function(x){return !x.ok});
  $('stage').innerHTML='<div class="card"><p class="sub" style="margin:0">做完了！</p><div class="big">'+ok+' / '+n+'</div><p class="sub">'+saved+'</p>'
   +(wr.length?'<div class="res">'+wr.map(function(x){return '<div><span class="y">✗ '+esc(x.a)+'</span><br><small>正確：</small><span class="c">'+esc(x.p)+'</span>'+(window.QSH&&QSH.has(x.w||x.p)?' <button type="button" class="sayb" data-say="'+esc(x.w||x.p)+'">🔈</button>':'')+'</div>'}).join('')+'</div>':'<div class="res" style="text-align:center;color:#1F6B43;font-weight:700">全部都對了，很棒！</div>')
   +'<button class="btn" id="ag" type="button">再做一次</button><a class="btn ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="room.html?c='+encodeURIComponent(code)+'">回班級</a></div>';
  $('stage').querySelectorAll('[data-say]').forEach(function(b){b.onclick=function(){QSH.play(b.dataset.say)}});
  $('ag').onclick=function(){QS=build(T);R={i:0,ok:0,res:[],t0:Date.now()};show()}}
boot();
})();
</script>
</body>
</html>
