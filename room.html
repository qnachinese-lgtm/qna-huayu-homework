<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的班級｜美娟華語工作室 QNA CHINESE</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
/* TCLASS_V1722 學生的班級頁：用班級代碼＋名字加入，列出老師出的題目 */
:root{--p:#1E4C86;--ps:#E4EDF9;--ink:#16202E;--mut:#7A8BA3;--line:#DCE4EF;--bg:#F4F7FB;--ok:#2E8B57}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC",PMingLiU,serif;min-height:100vh;padding:100px 16px 40px}
.bar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1100px)/2));z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.bl{width:34px;height:34px;border-radius:9px;background:var(--p);color:#fff;font-weight:700;font-size:18px;line-height:34px;text-align:center}
.brand b{font-size:17px;letter-spacing:1px}
.be{font-size:12px;letter-spacing:1.5px;color:var(--mut);padding-left:12px;border-left:1px solid var(--line)}
.home{color:var(--p);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(30,60,110,.10),0 2px 6px rgba(30,60,110,.05);padding:32px 28px;text-align:center}
.logo{width:58px;height:58px;border-radius:14px;background:var(--p);color:#fff;font-size:30px;font-weight:700;line-height:58px;margin:0 auto 14px;box-shadow:0 4px 12px rgba(30,76,134,.28)}
h1{margin:0;font-size:23px;letter-spacing:2px}
.sub{margin:6px 0 0;font-size:14px;color:#4A5B75}
.sub2{margin:4px 0 22px;font-size:12.5px;color:var(--mut)}
.code{display:inline-block;font-family:"Courier New",monospace;letter-spacing:3px;font-weight:700;color:var(--p);background:var(--ps);border-radius:8px;padding:2px 10px;font-size:14px;margin-top:8px}
label{display:block;text-align:left;font-size:14px;font-weight:700;margin:0 0 6px}
label span{font-weight:400;color:var(--mut);margin-left:4px}
input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:16px;color:var(--ink);outline:none}
input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(30,76,134,.12)}
.go{width:100%;margin-top:14px;height:50px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-size:16px;font-weight:700;letter-spacing:2px;cursor:pointer}
.go:hover{filter:brightness(1.1)}
.msg{color:#B23B2E;font-size:13.5px;min-height:18px;margin-top:8px}
.me{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:#4A5B75;margin-bottom:18px}
.me button{border:0;background:none;color:var(--p);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.list{display:flex;flex-direction:column;gap:10px;text-align:left}
.t{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
.t:hover{border-color:var(--p);box-shadow:0 6px 18px rgba(30,76,134,.10)}
.t i{font-style:normal;width:42px;height:42px;border-radius:12px;background:var(--ps);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;font-family:"Times New Roman",serif}
.t i.hz{font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC",serif}
.t .x{flex:1;min-width:0}.t b{display:block;font-size:16px}.t small{color:var(--mut);font-size:12.5px}
.t .st{font-size:12.5px;color:var(--mut);white-space:nowrap}.t .st.ok{color:var(--ok);font-weight:700}
.none{color:var(--mut);font-size:14px;padding:20px 0}
@media(max-width:480px){.be{display:none}.card{padding:26px 18px}}
.qf{max-width:640px;margin:40px auto 0;padding:18px 16px 8px;border-top:1px solid #DCE4EF;text-align:center;font-size:13px;line-height:1.8;color:#7A8BA3;font-family:"Noto Serif TC","Songti TC",serif}
.qf b{color:#3D4B5F}.qf a{color:#1E4C86;text-decoration:none;font-weight:700}.qf a:hover{text-decoration:underline}
#qf-mail{color:#1E4C86;font-weight:700;user-select:all}
.qf-cp{border:1px solid #DCE4EF;background:#fff;border-radius:999px;padding:1px 10px;font:inherit;font-size:12px;color:#1E4C86;cursor:pointer;margin-left:4px}
.qf-rp{margin-top:10px;border:1px solid #DCE4EF;background:#fff;border-radius:999px;padding:7px 18px;font:inherit;font-size:13px;color:#1E4C86;font-weight:700;cursor:pointer}
.qf-rp:hover,.qf-cp:hover{background:#F5F8FD}
.qf-m{position:fixed;inset:0;background:rgba(16,28,48,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.qf-m[hidden]{display:none}
.qf-box{position:relative;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:20px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(16,28,48,.25);font-family:"Noto Serif TC","Songti TC",serif;color:#16202E;text-align:left}
.qf-x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:24px;color:#7A8BA3;cursor:pointer;line-height:1}
.qf-box h3{margin:0;font-size:20px;letter-spacing:1px}.qf-box h3 small{font-size:13px;font-weight:400;color:#7A8BA3;margin-left:6px;letter-spacing:0}
.qf-s{margin:6px 0 16px;font-size:13px;color:#7A8BA3}
.qf-box label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}.qf-box label span{font-weight:400;color:#7A8BA3}
.qf-k{display:flex;gap:6px;flex-wrap:wrap}
.qf-k button{flex:1;min-width:0;height:38px;border:1px solid #DCE4EF;border-radius:10px;background:#fff;font:inherit;font-size:13px;color:#4A5B75;cursor:pointer;white-space:nowrap}
.qf-k button.on{border-color:#1E4C86;background:#E4EDF9;color:#1E4C86;font-weight:700}
.qf-box textarea,.qf-box input{width:100%;box-sizing:border-box;border:1px solid #DCE4EF;border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;color:#16202E;outline:none;background:#fff}
.qf-box textarea{min-height:110px;resize:vertical;line-height:1.6}.qf-box input{height:44px;padding:0 12px}
.qf-box textarea:focus,.qf-box input:focus{border-color:#1E4C86;box-shadow:0 0 0 3px rgba(30,76,134,.12)}
.qf-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qf-msg{min-height:18px;margin-top:10px;font-size:13px;color:#B23B2E}.qf-msg.ok{color:#2E8B57}
.qf-go{width:100%;margin-top:8px;height:48px;border:0;border-radius:12px;background:#1E4C86;color:#fff;font:inherit;font-size:15px;font-weight:700;letter-spacing:1px;cursor:pointer}
.qf-go:disabled{opacity:.6}
@media(max-width:480px){.qf-2{grid-template-columns:1fr}.qf-k button{font-size:12px}}
.bar-r{display:flex;align-items:center;gap:8px}
.cpill{border:1px solid #DCE4EF;border-radius:999px;padding:6px 14px;background:#fff;color:#1E4C86;font:inherit;font-size:13.5px;cursor:pointer;font-family:"Noto Serif TC","Songti TC",serif}
.cpill:hover{background:#F5F8FD}
.qf-c{text-align:center}.qf-c .qf-av{width:56px;height:56px;border-radius:14px;background:#1E4C86;color:#fff;font-size:28px;font-weight:700;line-height:56px;margin:0 auto 12px}
.qf-c .qf-line{margin:6px 0 2px;font-size:15px}.qf-c .qf-sub{font-size:13px;color:#7A8BA3;margin:0 0 16px}
.qf-c .qf-rp{width:100%;margin-top:6px;height:46px;border-radius:12px}
@media(max-width:480px){.cpill{padding:6px 10px;font-size:12.5px}}

/* MHDR_V1739 Quinn：「手機版的排版好醜」——手機上招牌不斷行、按鈕縮成一行 */
.cpill,.home{white-space:nowrap}
@media(max-width:560px){
  .bar{gap:8px!important;padding:0 12px!important;height:56px!important}
  .brand{gap:8px!important;min-width:0;flex:0 1 auto}
  .brand b{font-size:15.5px!important;letter-spacing:.5px!important;white-space:nowrap!important}
  .brand .be,.brand .rchip{display:none!important}
  .brand .bl{width:32px!important;height:32px!important;font-size:17px!important;border-radius:9px!important;flex:none;line-height:32px!important;display:inline-block;text-align:center}
  .bar-r{gap:6px!important;flex:none;display:flex;align-items:center}
  .cpill .ce{display:none}
  .cpill,.home{font-size:13px!important;padding:6px 11px!important;line-height:1.2}
}
@media(max-width:360px){.brand b{font-size:14px!important}.home{padding:6px 9px!important}}
</style>
</head>
<body>
<header class="bar"><a class="brand" href="play.html"><span class="bl">美</span><b>美娟華語工作室</b><span class="be">QNA CHINESE</span></a><span class="bar-r"><button type="button" class="cpill" id="qf-open">聯絡我<span class="ce"> · Contact</span></button><a class="home" href="index.html">官網 →</a></span></header>
<main class="card" id="app"><p class="sub">讀取中…</p></main>
<div class="qf-m" id="qf-cm" hidden><div class="qf-box qf-c" role="dialog" aria-modal="true"><button type="button" class="qf-x" id="qf-cx" aria-label="關閉">×</button><div class="qf-av">美</div><h3>聯絡我 <small>Contact</small></h3><div class="qf-line"><b>黃美娟 Quinn Huang</b>・<span id="qf-mail">qnachinese@gmail.com</span> <button type="button" class="qf-cp" id="qf-cp">複製</button></div><p class="qf-sub">有任何問題都可以聯絡我 · Questions? Contact me anytime.</p><button type="button" class="qf-rp qf-go" id="qf-rp">回報問題 · Report a problem</button></div></div><!-- CTOP_V1736 Quinn：聯絡資料放最上面，不要放最下面 -->
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=$('#app');
const code=String(new URLSearchParams(location.search).get('c')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.firestore();
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function dev(){let d=ls.get('qna_guest_dev');if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set('qna_guest_dev',d)}return d}
function bad(t){app.innerHTML='<div class="logo">美</div><h1>'+t+'</h1><p class="sub2" style="margin-top:10px">請跟老師確認班級代碼 · Please check the class code with your teacher</p><a class="go" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="play.html">回練習入口 · Back</a>';}
async function boot(){
  if(!code)return bad('沒有班級代碼');
  let c=null;try{const d=await db.collection('tclasses').doc(code).get();c=d.exists?d.data():null}catch(e){}
  if(!c||c.deleted_at)return bad('找不到這個班級');
  const nk='qna_cls_name_'+code;const nm=ls.get(nk);
  if(!nm)return ask(c);
  show(c,nm);}
function ask(c){
  app.innerHTML='<div class="logo">美</div><h1>'+esc(c.name)+'</h1><p class="sub">'+(c.owner_name?esc(c.owner_name)+' 的班級':'')+'</p><div class="code">'+esc(code)+'</div><p class="sub2">填上名字加入班級 · Enter your name to join</p>'
   +'<label for="nm">你的名字 <span>Your name</span></label><input id="nm" maxlength="40" autocomplete="off" placeholder="請填老師認得的名字">'
   +'<button class="go" id="go">加入班級 · Join</button><div class="msg" id="msg"></div>';
  const inp=$('#nm');inp.value=ls.get('qna_guest_name')||'';inp.focus();
  const go=async()=>{const v=inp.value.trim().slice(0,40);if(!v){$('#msg').textContent='請先填名字';return}
    ls.set('qna_cls_name_'+code,v);ls.set('qna_guest_name',v);
    try{const t=new Date().toISOString();await db.collection('tstudents').doc(code+'_'+dev()).set({class_code:code,owner_uid:c.owner_uid,name:v,dev:dev(),joined_at:t,last_at:t},{merge:true});}catch(e){}
    show(c,v);};
  $('#go').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};}
async function show(c,nm){const SCR=((c.scripts||{})[code+'_'+dev()])||c.script_default||'';/* SCRSTU_V1742 */
  app.innerHTML='<div class="logo">美</div><h1>'+esc(c.name)+'</h1><p class="sub">'+(c.owner_name?esc(c.owner_name)+' 的班級':'')+'</p><div class="code">'+esc(code)+'</div>'
   +'<div class="me" style="margin-top:16px">'+esc(nm)+' <button id="chg">換名字</button></div><div class="list" id="list"><p class="none">讀取題目中…</p></div>';
  $('#chg').onclick=()=>{try{localStorage.removeItem('qna_cls_name_'+code)}catch(e){}ask(c)};
  let ts=[];try{const sn=await db.collection('ttasks').where('class_code','==',code).get();ts=sn.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>!t.deleted_at).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))}catch(e){}
  let prog={};try{prog=JSON.parse(ls.get('qna_cls_prog_'+code)||'{}')||{}}catch(e){}
  const GN={flip:'翻牌配對 · Memory',quiz:'快問快答 · Quiz',bingo:'生詞賓果 · Bingo',fw:'大富翁 · Board game',mole:'聲調打地鼠 · Whack-a-mole',wmole:'詞語打地鼠 · Word whack-a-mole',pinyin:'拼音遊戲 · Pinyin games'};/* CGAME_V1736 */
  $('#list').innerHTML=ts.length?ts.map(t=>{const p=prog[t.id];const hz=t.kind==='hanzi';const gm=t.kind==='game';
    if(gm)return '<a class="t" href="'+((t.game==='mole'||t.game==='wmole'||t.game==='pinyin')?'pinyin.html':'games.html')+'?class='+encodeURIComponent(code)+'&task='+encodeURIComponent(t.id)+'"><i>🎮</i><span class="x"><b>'+esc(t.title)+'</b><small>'+(GN[t.game]||'生詞遊戲')+((['mole','wmole','pinyin'].includes(t.game)&&(SCR?SCR==='zy':t.zy))?'（注音）':'')+'</small></span>'+(p?'<span class="st ok">玩過 '+(p.times||1)+' 次</span>':'<span class="st">還沒玩</span>')+'</a>';
    const st=p?(hz?(p.stars>=(t.min_stars||1)?'<span class="st ok">✓ 完成</span>':'<span class="st">★ '+(p.stars||0)+'</span>'):'<span class="st'+(p.n&&p.ok===p.n?' ok':'')+'">'+(p.ok||0)+'/'+(p.n||0)+'</span>'):'<span class="st">還沒做</span>';
    return '<a class="t" href="'+(hz?'hanzi.html':'pinyin.html')+'?class='+encodeURIComponent(code)+'&task='+encodeURIComponent(t.id)+'"><i class="'+(hz?'hz':'')+'">'+(hz?'字':(SCR?SCR==='zy':t.zy)?'ㄅ':'ā')+'</i><span class="x"><b>'+esc(t.title)+'</b><small>'+(hz?'漢字闖關 · Hanzi game':(SCR?SCR==='zy':t.zy)?'注音練習 · Zhuyin practice':'拼音練習 · Pinyin practice')+'</small></span>'+st+'</a>';}).join('')
    :'<p class="none">老師還沒出題 · No practice yet</p>';}
boot();
})();
</script>
<div class="qf-m" id="qf-m" hidden><div class="qf-box" role="dialog" aria-modal="true" aria-labelledby="qf-h">
  <button type="button" class="qf-x" id="qf-x" aria-label="關閉">×</button>
  <h3 id="qf-h">回報問題 <small>Report a problem</small></h3>
  <p class="qf-s">寫下遇到的狀況，美娟老師會看到。Tell us what happened.</p>
  <label>哪一類 <span>Type</span></label>
  <div class="qf-k" id="qf-k"><button type="button" data-k="bug" class="on">網站壞掉 · Bug</button><button type="button" data-k="q">問題 · Question</button><button type="button" data-k="idea">建議 · Idea</button></div>
  <label for="qf-msg">內容 <span>Message</span></label><textarea id="qf-msg" maxlength="2000" placeholder="例如：按「開始練習」沒有反應"></textarea>
  <div class="qf-2"><div><label for="qf-nm">你的名字 <span>Name</span></label><input id="qf-nm" maxlength="60"></div><div><label for="qf-em">Email <span>（想收到回覆再填）</span></label><input id="qf-em" type="email" maxlength="100"></div></div>
  <div class="qf-msg" id="qf-note"></div>
  <button type="button" class="qf-go" id="qf-go">送出 · Send</button>
</div></div>
<script>
/* QFOOT_V1728 Quinn：mailto 會跳出「選應用程式」視窗，不好用——Email 改成「複製」，問題回報在網頁裡直接填、直接送（存在 feedback，後台看得到） */
(function(){const $=s=>document.getElementById(s);
  const mail=()=>String((document.getElementById('qf-mail')||{}).textContent||window.TEACHER_EMAIL||'').trim();
  $('qf-cp').onclick=()=>{const t=mail();const ok=()=>{$('qf-cp').textContent='已複製 ✓';setTimeout(()=>{$('qf-cp').textContent='複製'},1600)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{prompt('Email',t)})}catch(e){prompt('Email',t)}};
  let kind='bug';const m=$('qf-m');
  const open=()=>{m.hidden=false;try{$('qf-nm').value=$('qf-nm').value||localStorage.getItem('qna_guest_name')||''}catch(e){}setTimeout(()=>$('qf-msg').focus(),30)};
  const close=()=>{m.hidden=true};
  $('qf-rp').onclick=open;$('qf-x').onclick=close;m.onclick=e=>{if(e.target===m)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden)close()});
  $('qf-k').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;$('qf-k').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('qf-go').onclick=async()=>{const msg=$('qf-msg').value.trim(),note=$('qf-note');note.className='qf-msg';
    if(!msg){note.textContent='請先寫內容 · Please write a message';return}
    $('qf-go').disabled=true;note.textContent='送出中…';
    try{if(!window.firebase||!firebase.firestore)throw new Error('offline');if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      await firebase.firestore().collection('feedback').add({kind,msg:msg.slice(0,2000),name:$('qf-nm').value.trim().slice(0,60),email:$('qf-em').value.trim().slice(0,100),page:(location.pathname+location.search).slice(0,200),at:new Date().toISOString(),ua:String(navigator.userAgent||'').slice(0,200)});
      note.className='qf-msg ok';note.textContent='已送出，謝謝！ · Sent, thank you!';$('qf-msg').value='';setTimeout(close,1400);}
    catch(e){note.textContent='送不出去，請直接寫信給我（上面的 Email） · Failed, please email me.'}
    $('qf-go').disabled=false;};
})();
</script>
<script>/* CTOP_V1736 */(function(){const m=document.getElementById('qf-cm');const o=()=>{m.hidden=false},c=()=>{m.hidden=true};
document.getElementById('qf-open').onclick=o;document.getElementById('qf-cx').onclick=c;m.onclick=e=>{if(e.target===m)c()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')c()});document.getElementById('qf-rp').addEventListener('click',c,true);})();</script>
</body>
