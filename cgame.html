     學生選注音的，拼音的地方都換成注音。紀錄存進 tstudents（跟其他題目一樣），老師點學生看得到。 -->

/* ---------- 拼音 ---------- */
const MK={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function markSyl(s,t){s=s.replace(/v/g,'ü').replace(/u:/g,'ü');if(!(t>=1&&t<=4))return s;let i=-1;const l=s.toLowerCase();
  if(l.indexOf('a')>=0)i=l.indexOf('a');else if(l.indexOf('e')>=0)i=l.indexOf('e');else if(l.indexOf('ou')>=0)i=l.indexOf('o');else{for(let k=l.length-1;k>=0;k--){if('aeiouü'.includes(l[k])){i=k;break}}}
  if(i<0)return s;const ch=l[i];return s.slice(0,i)+MK[ch][t-1]+s.slice(i+1);}
function normPy(p){return String(p||'').trim().replace(/([a-zA-Züv:]+)([1-5])/g,(m,b,t)=>markSyl(b,+t)).replace(/\s+/g,'');}
const INI=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w',''];
const FIN=['iang','iong','uang','ueng','ang','eng','ing','ong','ian','iao','uai','uan','üan','ai','ei','ao','ou','an','en','er','ia','ie','io','iu','in','ua','uo','ui','un','üe','ue','ün','a','o','e','i','u','ü','ê'];
function sylls(p){const n=String(p||'').toLowerCase().normalize('NFD').replace(/[’'·\-]/g,'');let base='',tones=[];
  for(const ch of n){if(/[\u0304]/.test(ch)){tones[base.length-1]=1;continue}if(/[\u0301]/.test(ch)){tones[base.length-1]=2;continue}if(/[\u030c]/.test(ch)){tones[base.length-1]=3;continue}if(/[\u0300]/.test(ch)){tones[base.length-1]=4;continue}if(/[\u0308]/.test(ch)){base=base.slice(0,-1)+'ü';continue}if(/[a-zü]/.test(ch))base+=ch;}
  const memo={};const go=i=>{if(i===base.length)return [];if(i in memo)return memo[i];let best=null;
    for(const a of INI){if(!base.startsWith(a,i))continue;for(const f of FIN){const j=i+a.length;if(!base.startsWith(f,j))continue;const e=j+f.length;const r=go(e);if(r){best=[[i,e]].concat(r);break}}if(best)break;}
    memo[i]=best;return best;};
  const segs=go(0);if(!segs)return null;return segs.map(([a,b])=>{let t=5;for(let k=a;k<b;k++)if(tones[k])t=tones[k];return {b:base.slice(a,b),t};});}
function toZy(p){const s=sylls(p);if(!s||!window.ZY)return p;return s.map(x=>ZY.syl(x.b,x.t)).join(' ');}
const D=p=>SCR==='zy'?toZy(p):p;/* 學生看到的：拼音或注音 */
const pyKey=p=>String(p||'').toLowerCase().normalize('NFC').replace(/[\s'’·\-]/g,'');
const TNUM=p=>{const s=sylls(p);return s?s.map(x=>x.t):[]};
const tw=w=>w.replace(/臺/g,'台');

/* ---------- 紀錄 ---------- */
async function save(ok,n,miss,extra){const t=new Date().toISOString();let prog={};try{prog=JSON.parse(lsg('qna_cls_prog_'+code)||'{}')||{}}catch(e){}
  const old=prog[tid]||{};const better=!old.n||ok/n>(old.ok||0)/(old.n||1);
  const cur=Object.assign({},old,{times:(old.times||0)+1,at:t,first:old.first||old.at||t,ok:better?ok:old.ok,n:better?n:old.n,game:T.game,
    hist:(Array.isArray(old.hist)?old.hist:[]).concat([Object.assign({at:t,ok,n,wr:[...new Set(miss||[])].slice(0,30)},extra&&extra.net?{net:extra.net}:{})]).slice(-20)});/* NETREC_V1798 連線大富翁：記第幾名、和誰一起玩 */
  if(extra&&extra.recs&&extra.recs.length)cur.recs=(Array.isArray(old.recs)?old.recs:[]).concat(extra.recs).slice(-30);
  prog[tid]=cur;lss('qna_cls_prog_'+code,JSON.stringify(prog));
  try{await db.collection('tstudents').doc(code+'_'+DEV).set({class_code:code,owner_uid:C.owner_uid,name:NAME,dev:DEV,last_at:t,tasks:{[tid]:cur}},{merge:true});}catch(e){}}
function done(title,ok,n,miss,again,extra){if(ENDED)return;ENDED=true;/* 連按兩下不要存兩次 */save(ok,n,miss,extra);later(()=>QSH.result({title,ok,n,miss,again}),700);}

function flipHome(){if(!need(3,'翻牌'))return;intro('🃏 翻牌配對','把「漢字」和它的「'+(SCR==='zy'?'注音':'拼音')+'」配成一對。',['牌一開始都是蓋著的。','每次翻兩張：一張漢字、一張'+(SCR==='zy'?'注音':'拼音')+'，配對了就留著，旁邊會顯示詞和'+(SCR==='zy'?'注音':'拼音')+'。','不急，沒有時間限制。翻錯 2 次以上的詞，最後會列出來再練習。'],flipPlay);}
function flipPlay(){clearT();const ws=shuffle(W).slice(0,Math.min(+T.count||6,W.length));let cards=shuffle(ws.flatMap(x=>[{k:x.w,t:x.w,py:0},{k:x.w,t:D(x.p),py:1}]));
  let open=[],dn=new Set(),wrong={},moves=0,lock=false,last=null;
  const draw=()=>{G.innerHTML='<div class="panel"><div class="prog"><span>翻了 '+moves+' 次</span><span>配好 '+dn.size+' / '+ws.length+' 對</span></div><div class="fgrid">'
    +cards.map((c,i)=>{const up=open.includes(i)||dn.has(c.k);return '<div class="fc zhk'+(up?' up':'')+(c.py?' pyc py':'')+(dn.has(c.k)?' done':'')+'" data-i="'+i+'">'+(up?esc(c.t):'<span class="q">？</span>')+'</div>'}).join('')+'</div>'
    +(last?'<div class="fb '+(last.ok?'ok':'no')+'">'+(last.ok?'配對了！':'不是一對，再找找看。')+(last.ok?'<span class="w zhk">'+esc(last.w)+'</span><span class="p zhk py">'+esc(D(last.p))+'</span>'+sayBtn(last.w):'')+'</div>':'')+'</div>';
    document.querySelectorAll('.fc').forEach(el=>el.onclick=()=>tap(+el.dataset.i));};
  const tap=i=>{if(lock||open.includes(i)||dn.has(cards[i].k))return;open.push(i);if(open.length<2)return draw();
    moves++;const[a,b]=open.map(x=>cards[x]);
    if(a.k===b.k&&a.py!==b.py){dn.add(a.k);last={ok:1,w:a.k,p:ws.find(x=>x.w===a.k).p};open=[];draw();if(dn.size===ws.length){const miss=Object.keys(wrong).filter(k=>wrong[k]>=2);done('翻牌配對',ws.length-miss.length,ws.length,miss,flipPlay);}}
    else{[a,b].forEach(c=>{wrong[c.k]=(wrong[c.k]||0)+1});last={ok:0};lock=true;draw();later(()=>{open=[];lock=false;draw()},1300);}};
  draw();}

/* ================= 打地鼠 ================= */
function moleWordHome(){if(!need(3,'詞語打地鼠'))return;intro('🐹 詞語打地鼠','看'+(SCR==='zy'?'注音':'拼音')+'，打拿著那個詞的地鼠。一次三隻，不計時。',['上面出現'+(SCR==='zy'?'注音':'拼音')+'（老師錄過音的詞也可以聽），打拿著那個詞的地鼠。','打錯沒關係，會告訴你正確答案，按「下一題」再繼續。'],moleWord);}
function moleWord(){clearT();const qs=shuffle(W).slice(0,Math.min(+T.count||10,W.length));let i=0,ok=0,miss=[];
  const q=()=>{const x=qs[i];const others=shuffle(W.filter(y=>y!==x&&pyKey(y.p)!==pyKey(x.p))).slice(0,2);const opts=shuffle([x,...others]);const holes=shuffle([0,1,2,3,4,5]).slice(0,opts.length);let fin=false;
    const draw=fb=>{G.innerHTML='<div class="panel"><div class="prog"><span>第 '+(i+1)+' / '+qs.length+' 題</span><span>答對 '+ok+'</span></div>'
      +'<div class="mprompt"><div class="big zhk py">'+esc(D(x.p))+'</div><small>打拿著這個詞的地鼠</small><div style="margin-top:6px">'+sayBtn(x.w)+'</div></div>'
      +'<div class="field">'+[0,1,2,3,4,5].map(h=>{const k=holes.indexOf(h);return '<div class="hole">'+(k>=0?'<button class="mole zhk'+(fin&&opts[k]===x?' right':'')+(fin&&fb&&fb.pick===k&&opts[k]!==x?' wrong':'')+'" data-k="'+k+'">'+esc(opts[k].w)+'</button>':'')+'</div>'}).join('')+'</div>'
      +(fb?'<div class="fb '+(fb.ok?'ok':'no')+'">'+(fb.ok?'打對了！':'不是這一隻。')+'<span class="w zhk">'+esc(x.w)+'</span><span class="p zhk py">'+esc(D(x.p))+'</span>'+meanOf(x.w)+sayBtn(x.w)+'<span class="sp"></span><button class="btn pri" id="nx">'+(i+1<qs.length?'下一題 →':'看結果')+'</button></div>':'')+'</div>';
      document.querySelectorAll('.mole').forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const k=+b.dataset.k,good=opts[k]===x;if(good)ok++;else miss.push(x.w);draw({ok:good,pick:k})});
      const nx=$('#nx');if(nx)nx.onclick=()=>{i++;if(i<qs.length)q();else done('詞語打地鼠',ok,qs.length,miss,moleWord)};};
    draw();if(window.QSH&&QSH.has(x.w))later(()=>QSH.play(x.w),300);};q();}
function moleToneHome(){if(!need(1,'聲調打地鼠'))return;intro('🐹 聲調打地鼠','看詞，按出每一個字的聲調。不計時。',['地鼠拿著一個詞，按下面的聲調按鈕；兩個字的詞要按兩次（第一個字、第二個字）。','按錯了可以按「↶ 退一格」。','答完會告訴你正確的'+(SCR==='zy'?'注音':'拼音')+'，按「下一題」再繼續。'],moleTone);}
function moleTone(){clearT();const qs=shuffle(W.filter(x=>TNUM(x.p).length===[...x.w].length)).slice(0,+T.count||10);if(!qs.length){bad('這份題目的拼音讀不出聲調，請老師檢查拼音');return}let i=0,ok=0,miss=[];
  const q=()=>{const x=qs[i];const ans=TNUM(x.p);let pk=[],fb=null;const hole=Math.floor(Math.random()*6);
    const draw=()=>{G.innerHTML='<div class="panel"><div class="prog"><span>第 '+(i+1)+' / '+qs.length+' 題</span><span>答對 '+ok+'</span></div>'
      +'<div class="mprompt"><small>按出每一個字的聲調（'+ans.length+' 個字）</small><div class="big zhk">'+[...x.w].map((c,k)=>'<span style="'+(k===pk.length&&!fb?'border-bottom:3px solid #1E4C86':'')+'">'+esc(c)+'</span>').join(' ')+'</div><small>你按的：'+(pk.length?pk.map(t=>['','ˉ 1','ˊ 2','ˇ 3','ˋ 4','˙ 輕'][t]).join('　'):'—')+'</small></div>'
      +'<div class="field">'+[0,1,2,3,4,5].map(h=>'<div class="hole">'+(h===hole?'<div class="mole zhk'+(fb?(fb.ok?' right':' wrong'):'')+'" style="cursor:default">'+esc(x.w)+'</div>':'')+'</div>').join('')+'</div>'
      +(fb?'<div class="fb '+(fb.ok?'ok':'no')+'">'+(fb.ok?'聲調都對了！':'有聲調不對。')+'<span class="w zhk">'+esc(x.w)+'</span><span class="p zhk py">'+esc(D(x.p))+'</span>'+meanOf(x.w)+sayBtn(x.w)+'<span class="sp"></span><button class="btn pri" id="nx">'+(i+1<qs.length?'下一題 →':'看結果')+'</button></div>'
        :'<div class="tones">'+[1,2,3,4,5].map(t=>'<button data-t="'+t+'">'+['','ˉ','ˊ','ˇ','ˋ','˙'][t]+'<small>'+(t<5?t+' 聲':'輕聲')+'</small></button>').join('')+(pk.length?'<button data-t="0" style="width:auto;padding:0 14px;font-size:15px">↶ 退一格</button>':'')+'</div>')+'</div>';
      document.querySelectorAll('.tones button').forEach(b=>b.onclick=()=>{const t=+b.dataset.t;if(!t){pk.pop();return draw()}pk.push(t);if(pk.length===ans.length){const good=pk.every((v,k)=>v===ans[k]);if(good)ok++;else miss.push(x.w);fb={ok:good};}draw();});
      const nx=$('#nx');if(nx)nx.onclick=()=>{i++;if(i<qs.length)q();else done('聲調打地鼠',ok,qs.length,miss,moleTone)};};
    draw();};q();}

/* ================= 賓果 ================= */
function uniqW(){const seen=new Set();return shuffle(W).filter(x=>{const k=pyKey(x.p);if(seen.has(k)||seen.has('w:'+tw(x.w)))return false;seen.add(k);seen.add('w:'+tw(x.w));return true;});}
function bingoHome(){const u=uniqW();if(u.length<9){bad('這份題目的詞不夠（賓果至少要 9 個拼音不一樣的詞）');return}
  intro('🎯 生詞賓果','跟電腦比賽，先連成一條線的人贏。',['上面出現'+(SCR==='zy'?'注音':'拼音')+'（老師錄過音的詞也可以聽），在你的卡上找到那個詞，點下去。','你的卡上沒有，就按「我沒有這個詞」。如果其實有，會提醒你在哪裡。','點過的格子會顯示'+(SCR==='zy'?'注音':'拼音')+'。電腦的卡不給你看，只告訴你它連了幾條線。','同一張卡不會有拼音一樣的詞。'],bingoPlay);}
function bingoPlay(){clearT();const u=uniqW();const n=u.length>=16?4:3,N2=n*n;const pool=u.slice(0,Math.min(u.length,N2+Math.ceil(N2/2)));
  const mine=shuffle(pool).slice(0,N2),bot=shuffle(pool).slice(0,N2),calls=shuffle(pool);let ci=0,mm=Array(N2).fill(0),bm=Array(N2).fill(0),miss=[],fb=null,over=false,found=0,had=0;
  const L=[];for(let i=0;i<n;i++){L.push([...Array(n)].map((_,j)=>i*n+j));L.push([...Array(n)].map((_,j)=>j*n+i));}L.push([...Array(n)].map((_,j)=>j*n+j));L.push([...Array(n)].map((_,j)=>j*n+n-1-j));
  const lines=m=>L.filter(l=>l.every(i=>m[i]));
  const draw=()=>{const x=calls[ci],ml=lines(mm),lc=new Set(ml.flat());
    G.innerHTML='<div class="panel"><div class="bwrap"><div><div class="call"><small>第 '+(ci+1)+' 個</small><div class="big zhk py">'+esc(D(x.p))+'</div>'+sayBtn(x.w)+'</div>'
      +(fb?'<div class="fb '+(fb.ok?'ok':'no')+'">'+esc(fb.t)+'<span class="w zhk">'+esc(x.w)+'</span></div>':'')
      +'<div class="row" style="margin-top:12px">'+(fb||over?'':'<button class="btn" id="none" style="flex:1">我沒有這個詞</button>')+(fb&&!over?'<button class="btn pri" id="nx" style="flex:1">下一個 →</button>':'')+'</div>'
      +'<div class="vs"><div>你<b>'+ml.length+'</b>條線</div><div>電腦<b>'+lines(bm).length+'</b>條線</div></div></div>'
      +'<div class="bgrid" style="grid-template-columns:repeat('+n+',1fr)">'+mine.map((w,i)=>'<button class="bc zhk'+(mm[i]?' on':'')+(lc.has(i)?' line':'')+'" data-i="'+i+'">'+esc(w.w)+(mm[i]?'<small class="py">'+esc(D(w.p))+'</small>':'')+'</button>').join('')+'</div></div></div>';
    document.querySelectorAll('.bc').forEach(b=>b.onclick=()=>tap(+b.dataset.i,b));const no=$('#none');if(no)no.onclick=none;const nx=$('#nx');if(nx)nx.onclick=next;};
  const botMove=()=>{const k=bot.indexOf(calls[ci]);if(k>=0)bm[k]=1;};
  const fin=title=>{over=true;draw();done(title,found,had,miss,bingoPlay);};
  const check=()=>{const a=lines(mm).length,b=lines(bm).length;if(a||b){fin(a&&!b?'賓果！你贏了':a&&b?'平手':'電腦先連成一條線');return true}return false};
  const tap=(i,el)=>{if(fb||over||mm[i])return;const x=calls[ci];
    if(mine[i]===x){mm[i]=1;found++;had++;botMove();fb={ok:1,t:'找到了！'};draw();check();}
    else{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);if(miss[miss.length-1]!==x.w)miss.push(x.w);}};
  const none=()=>{const x=calls[ci],k=mine.indexOf(x);botMove();if(k>=0&&!mm[k]){miss.push(x.w);had++;fb={ok:0,t:'其實你的卡上有喔：'};mm[k]=1;}else fb={ok:1,t:'對，你的卡上沒有。'};draw();check();};
  const next=()=>{ci++;fb=null;if(ci>=calls.length){fin('賓果');return}draw();if(window.QSH&&QSH.has(calls[ci].w))later(()=>QSH.play(calls[ci].w),300);};
  draw();if(window.QSH&&QSH.has(calls[0].w))later(()=>QSH.play(calls[0].w),300);}

/* ================= 快問快答 ================= */
function mkQ(x,kinds){const others=shuffle(W.filter(y=>y!==x&&pyKey(y.p)!==pyKey(x.p)&&tw(y.w)!==tw(x.w)));
  const ks=kinds.filter(k=>(k!=='listen'||(window.QSH&&QSH.has(x.w)))&&(k!=='mean'||(x.m&&W.filter(y=>y.m).length>=4)));const k=ks.length?pick(ks):'wpy';
