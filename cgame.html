<!-- CGAME_V1792 Quinn：「大富翁、賓果、打地鼠、翻牌的試用版」→「12345」
     班級作業的六個遊戲（翻牌、快問快答、賓果、大富翁、聲調打地鼠、詞語打地鼠）照試用版重做，放在這一頁。
     共同原則：學生自己按「下一步」、答完一定看到正確的詞和拼音（或注音）、結束一定有結果頁、聲音只播老師的錄音。
     學生選注音的，拼音的地方都換成注音。紀錄存進 tstudents（跟其他題目一樣），老師點學生看得到。 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Serif+TC:wght@400;700&display=swap">
<style>
:root{--navy:#1E4C86;--ink:#1B2533;--mut:#7A8BA3;--line:#DCE4EF;--bg:#F3F6FB;--soft:#EEF3FA;--ok:#1F6B43;--okbg:#E3F4EA;--no:#A33227;--nobg:#FDECEA;--gold:#E8C66A;--goldbg:#FFF7E3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif","Noto Serif TC","Songti TC",serif;min-height:100vh}
button{font-family:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.panel{background:#fff;border-radius:22px;box-shadow:0 8px 0 #D3DFEE,0 18px 40px rgba(30,76,134,.08);padding:22px 24px}
h2{margin:0 0 4px;font-size:24px}.sub{color:var(--mut);font-size:14.5px;margin:0 0 14px;line-height:1.7}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 20px;font-size:16px;color:var(--navy);cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.cen{justify-content:center}.sp{flex:1}
.rules{background:var(--soft);border-radius:14px;padding:12px 16px;margin:0 0 16px;font-size:15px;line-height:1.9}.rules ol{margin:0;padding-left:22px}
.fb{border-radius:14px;padding:12px 16px;font-size:17px;margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.fb .w{font-size:24px;letter-spacing:2px;color:var(--ink)}.fb .p{color:#4A5B75;font-size:18px}
.say{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--navy);cursor:pointer}
.prog{display:flex;justify-content:space-between;color:#5B6B82;font-size:14.5px;margin-bottom:10px}
.py{font-family:"Noto Serif",serif}.mean{color:#5B6B82;font-size:15px;border-left:1px solid #CFD8E5;padding-left:10px}
/* 翻牌 */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:0 auto}
.fc{aspect-ratio:4/3;border-radius:14px;border:2px solid var(--line);background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;user-select:none;text-align:center;padding:4px}
.fc.up{background:#fff;color:var(--ink)}.fc.pyc{font-size:20px;color:#2F64A8}
.fc.done{background:var(--okbg);border-color:#9AD3B4;color:var(--ok);cursor:default}
.fc .q{font-size:30px;color:rgba(255,255,255,.55)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(max-width:600px){.fgrid{gap:7px}.fc{font-size:22px}.fc.pyc{font-size:14px}}
/* 打地鼠 */
.mprompt{text-align:center;margin:4px 0 12px}.mprompt .big{font-size:40px;color:var(--navy);letter-spacing:2px}.mprompt small{display:block;color:var(--mut);font-size:13.5px}
.field{position:relative;background:linear-gradient(#BFE3A8,#9DCF85);border-radius:20px;padding:22px 14px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:600px;margin:0 auto}
.hole{height:118px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.hole:after{content:"";position:absolute;bottom:0;width:82%;height:22px;border-radius:50%;background:#6B4B2A;box-shadow:inset 0 5px 8px rgba(0,0,0,.35)}
.mole{position:relative;z-index:2;margin-bottom:8px;border:0;background:#fff;border-radius:16px;padding:10px 12px;min-width:92px;font-size:26px;letter-spacing:2px;color:var(--ink);box-shadow:0 4px 0 #C9B08E;cursor:pointer;animation:up .3s}
.mole:before{content:"🐹";display:block;font-size:26px;line-height:1;margin-bottom:4px}
.mole.right{background:var(--okbg);color:var(--ok)}.mole.wrong{background:var(--nobg);color:var(--no)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.tones{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}.tones button{width:70px;height:56px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:24px;cursor:pointer;color:var(--navy)}
.tones button small{display:block;font-size:11px;color:var(--mut)}
@media(max-width:600px){.hole{height:96px}.mole{min-width:74px;font-size:20px;padding:8px}}
/* 賓果 */
.bwrap{display:grid;grid-template-columns:260px 1fr;gap:20px}@media(max-width:760px){.bwrap{grid-template-columns:1fr}}
.call{background:var(--navy);color:#fff;border-radius:18px;padding:18px;text-align:center}.call small{opacity:.75}.call .big{font-size:36px;margin:6px 0}
.call .say{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.bgrid{display:grid;gap:8px}
.bc{aspect-ratio:1;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:28px;letter-spacing:2px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.bc small{font-size:12.5px;letter-spacing:0;color:#2F64A8;margin-top:2px}
.bc.on{background:var(--navy);border-color:var(--navy);color:#fff}.bc.on small{color:#CFE0F7}.bc.line{background:#2E8B6A;border-color:#2E8B6A}
@media(max-width:600px){.bc{font-size:20px}}
.vs{display:flex;gap:10px;margin-top:12px}.vs div{flex:1;background:var(--soft);border-radius:12px;padding:10px;text-align:center;font-size:14px;color:#4A5B75}.vs b{display:block;font-size:22px;color:var(--navy)}
/* 大富翁 */
.fwgrid{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:6px;aspect-ratio:1;max-width:560px;margin:0 auto;background:var(--navy);padding:10px;border-radius:22px}
.sq{background:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;position:relative;text-align:center;line-height:1.15;padding:2px;overflow:hidden}
.sq small{font-size:10.5px;color:#2F64A8}.sq.sp{background:#EEF3FA;color:var(--navy);font-size:14px;font-weight:700}
.sq.own0{box-shadow:inset 0 -6px 0 #2F64A8}.sq.own1{box-shadow:inset 0 -6px 0 #C2410C}
.tok{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid #fff}.tok.t0{left:3px;background:#2F64A8}.tok.t1{right:3px;background:#C2410C}
.center{grid-column:2/6;grid-row:2/6;background:#2B5C9A;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;text-align:center}
.center .dice{font-size:44px}.center .btn{min-width:150px}
@media(max-width:600px){.sq{font-size:15px}.sq small{font-size:8.5px}.sq.sp{font-size:11px}}
.huds{display:flex;gap:10px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}.hud{border:2px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:15px;background:#fff}.hud.on{border-color:var(--navy)}
.hud i{width:14px;height:14px;border-radius:50%;display:inline-block}
.m{position:fixed;inset:0;z-index:50;background:rgba(16,28,48,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mb{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:22px;padding:24px}
.mbtn{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.mbtn .btn{flex:1;min-width:120px}
.qm .card{border:2px solid var(--gold);background:var(--goldbg);border-radius:16px;padding:16px;text-align:center}
.ask{font-weight:700;font-size:18px;margin-bottom:6px;text-align:center}.qm .big,.qbig{font-size:40px;letter-spacing:3px}.qpy{font-size:22px;color:#2F64A8}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.opts button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:22px;cursor:pointer;color:var(--ink)}
.opts.pyo button{font-size:19px}
.opts button.right{background:var(--okbg);border-color:#7CCBA4;color:var(--ok)}.opts button.wrong{background:var(--nobg);border-color:#F0A3A3;color:var(--no)}
.tag{display:inline-block;border-radius:999px;background:var(--navy);color:#fff;padding:3px 12px;font-size:13.5px;margin-bottom:8px}.tag.f{background:#B04A74}
.recst{color:var(--mut);font-size:13.5px;text-align:center;margin-top:6px}
.btn.rec{background:#C23B3B;color:#fff;border-color:#C23B3B}
/* 快問快答 */
.qcard{border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.timer{height:6px;background:#EEF2F8;border-radius:6px;overflow:hidden;margin-bottom:12px}.timer i{display:block;height:100%;background:#2F64A8}
.kqo button{display:flex;align-items:center;gap:12px;text-align:left;font-size:20px}.kqo button i{width:34px;height:34px;border-radius:9px;color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px;flex:none}
</style></head><body>
<main class="wrap" id="g"><div class="panel"><p class="sub">讀取中…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script src="config.js"></script>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lsg=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};const lss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const qs=new URLSearchParams(location.search);
const code=String(qs.get('class')||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');const tid=String(qs.get('task')||'').trim();
const NAME=lsg('qna_cls_name_'+code),DEV=lsg('qna_guest_dev');
const G=$('#g');
function bad(t){G.innerHTML='<div class="panel" style="text-align:center"><h2 style="margin-bottom:12px">'+esc(t)+'</h2><a class="btn pri" style="display:inline-block;text-decoration:none" href="room.html?c='+encodeURIComponent(code)+'">回班級</a></div>';}
if(!code||!tid){bad('找不到這份題目');return}
if(!NAME||!DEV){location.replace('room.html?c='+encodeURIComponent(code));return}
if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
const db=firebase.firestore();
let C=null,T=null,W=[],SCR='py';
let TIMERS=[],ENDED=false;const later=(f,ms)=>TIMERS.push(setTimeout(f,ms));const clearT=()=>{TIMERS.forEach(clearTimeout);TIMERS=[];ENDED=false};

/* ---------- 拼音 ---------- */
const MK={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
function markSyl(s,t){s=s.replace(/v/g,'ü').replace(/u:/g,'ü');if(!(t>=1&&t<=4))return s;let i=-1;const l=s.toLowerCase();
  if(l.indexOf('a')>=0)i=l.indexOf('a');else if(l.indexOf('e')>=0)i=l.indexOf('e');else if(l.indexOf('ou')>=0)i=l.indexOf('o');else{for(let k=l.length-1;k>=0;k--){if('aeiouü'.includes(l[k])){i=k;break}}}
  if(i<0)return s;const ch=l[i];return s.slice(0,i)+MK[ch][t-1]+s.slice(i+1);}
function normPy(p){return String(p||'').trim().replace(/([a-zA-Züv:]+)([1-5])/g,(m,b,t)=>markSyl(b,+t)).replace(/\s+/g,'');}
const INI=['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w',''];
const FIN=['iang','iong','uang','ueng','ang','eng','ing','ong','ian','iao','uai','uan','üan','ai','ei','ao','ou','an','en','er','ia','ie','io','iu','in','ua','uo','ui','un','üe','ue','ün','a','o','e','i','u','ü','ê'];
function sylls(p){const n=String(p||'').toLowerCase().normalize('NFD').replace(/[’'·\-]/g,'');let base='',tones=[];
  for(const ch of n){if(/[\u0304]/.test(ch)){tones[base.length-1]=1;continue}if(/[\u0301]/.test(ch)){tones[base.length-1]=2;continue}if(/[\u030c]/.test(ch)){tones[base.length-1]=3;continue}if(/[\u0300]/.test(ch)){tones[base.length-1]=4;continue}if(/[\u0308]/.test(ch)){base=base.slice(0,-1)+'ü';continue}if(/[a-zü]/.test(ch))base+=ch;}
  const memo={};const go=i=>{if(i===base.length)return [];if(i in memo)return memo[i];let best=null;
    for(const a of INI){if(!base.startsWith(a,i))continue;for(const f of FIN){const j=i+a.length;if(!base.startsWith(f,j))continue;const e=j+f.length;const r=go(e);if(r){best=[[i,e]].concat(r);break}}if(best)break;}
    memo[i]=best;return best;};
  const segs=go(0);if(!segs)return null;return segs.map(([a,b])=>{let t=5;for(let k=a;k<b;k++)if(tones[k])t=tones[k];return {b:base.slice(a,b),t};});}
function toZy(p){const s=sylls(p);if(!s||!window.ZY)return p;return s.map(x=>ZY.syl(x.b,x.t)).join(' ');}
const D=p=>SCR==='zy'?toZy(p):p;/* 學生看到的：拼音或注音 */
const pyKey=p=>String(p||'').toLowerCase().normalize('NFC').replace(/[\s'’·\-]/g,'');
const TNUM=p=>{const s=sylls(p);return s?s.map(x=>x.t):[]};
const tw=w=>w.replace(/臺/g,'台');

/* ---------- 紀錄 ---------- */
async function save(ok,n,miss,extra){const t=new Date().toISOString();let prog={};try{prog=JSON.parse(lsg('qna_cls_prog_'+code)||'{}')||{}}catch(e){}
  const old=prog[tid]||{};const better=!old.n||ok/n>(old.ok||0)/(old.n||1);
  const cur=Object.assign({},old,{times:(old.times||0)+1,at:t,first:old.first||old.at||t,ok:better?ok:old.ok,n:better?n:old.n,game:T.game,
    hist:(Array.isArray(old.hist)?old.hist:[]).concat([{at:t,ok,n,wr:[...new Set(miss||[])].slice(0,30)}]).slice(-20)});
  if(extra&&extra.recs&&extra.recs.length)cur.recs=(Array.isArray(old.recs)?old.recs:[]).concat(extra.recs).slice(-30);
  prog[tid]=cur;lss('qna_cls_prog_'+code,JSON.stringify(prog));
  try{await db.collection('tstudents').doc(code+'_'+DEV).set({class_code:code,owner_uid:C.owner_uid,name:NAME,dev:DEV,last_at:t,tasks:{[tid]:cur}},{merge:true});}catch(e){}}
function done(title,ok,n,miss,again,extra){if(ENDED)return;ENDED=true;/* 連按兩下不要存兩次 */save(ok,n,miss,extra);later(()=>QSH.result({title,ok,n,miss,again}),700);}
const meanOf=w=>{const x=W.find(y=>y.w===w);return x&&x.m?'<span class="mean">'+esc(x.m)+'</span>':''};
const sayBtn=w=>(window.QSH&&QSH.has(w))?'<button class="say" data-say="'+esc(w)+'">🔈 聽老師念</button>':'';
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-say]');if(b&&window.QSH)QSH.play(b.dataset.say);});
const intro=(title,sub,rules,go,btn)=>{G.innerHTML='<div class="panel"><h2>'+title+'</h2><p class="sub">'+sub+'</p><div class="rules"><ol>'+rules.map(r=>'<li>'+r+'</li>').join('')+'</ol></div><div class="row cen"><button class="btn pri" id="go">'+(btn||'開始')+'</button></div></div>';$('#go').onclick=go;};
const need=(n,what)=>{if(W.length>=n)return true;bad('這份題目的詞不夠（'+what+'至少要 '+n+' 個詞）');return false;};

/* ================= 翻牌 ================= */
function flipHome(){if(!need(3,'翻牌'))return;intro('🃏 翻牌配對','把「漢字」和它的「'+(SCR==='zy'?'注音':'拼音')+'」配成一對。',['牌一開始都是蓋著的。','每次翻兩張：一張漢字、一張'+(SCR==='zy'?'注音':'拼音')+'，配對了就留著，旁邊會顯示詞和'+(SCR==='zy'?'注音':'拼音')+'。','不急，沒有時間限制。翻錯 2 次以上的詞，最後會列出來再練習。'],flipPlay);}
function flipPlay(){clearT();const ws=shuffle(W).slice(0,Math.min(+T.count||6,W.length));let cards=shuffle(ws.flatMap(x=>[{k:x.w,t:x.w,py:0},{k:x.w,t:D(x.p),py:1}]));
  let open=[],dn=new Set(),wrong={},moves=0,lock=false,last=null;
  const draw=()=>{G.innerHTML='<div class="panel"><div class="prog"><span>翻了 '+moves+' 次</span><span>配好 '+dn.size+' / '+ws.length+' 對</span></div><div class="fgrid">'
    +cards.map((c,i)=>{const up=open.includes(i)||dn.has(c.k);return '<div class="fc zhk'+(up?' up':'')+(c.py?' pyc py':'')+(dn.has(c.k)?' done':'')+'" data-i="'+i+'">'+(up?esc(c.t):'<span class="q">？</span>')+'</div>'}).join('')+'</div>'
    +(last?'<div class="fb '+(last.ok?'ok':'no')+'">'+(last.ok?'配對了！':'不是一對，再找找看。')+(last.ok?'<span class="w zhk">'+esc(last.w)+'</span><span class="p zhk py">'+esc(D(last.p))+'</span>'+sayBtn(last.w):'')+'</div>':'')+'</div>';
    document.querySelectorAll('.fc').forEach(el=>el.onclick=()=>tap(+el.dataset.i));};
  const tap=i=>{if(lock||open.includes(i)||dn.has(cards[i].k))return;open.push(i);if(open.length<2)return draw();
    moves++;const[a,b]=open.map(x=>cards[x]);
    if(a.k===b.k&&a.py!==b.py){dn.add(a.k);last={ok:1,w:a.k,p:ws.find(x=>x.w===a.k).p};open=[];draw();if(dn.size===ws.length){const miss=Object.keys(wrong).filter(k=>wrong[k]>=2);done('翻牌配對',ws.length-miss.length,ws.length,miss,flipPlay);}}
    else{[a,b].forEach(c=>{wrong[c.k]=(wrong[c.k]||0)+1});last={ok:0};lock=true;draw();later(()=>{open=[];lock=false;draw()},1300);}};
  draw();}

/* ================= 打地鼠 ================= */
function moleWordHome(){if(!need(3,'詞語打地鼠'))return;intro('🐹 詞語打地鼠','看'+(SCR==='zy'?'注音':'拼音')+'，打拿著那個詞的地鼠。一次三隻，不計時。',['上面出現'+(SCR==='zy'?'注音':'拼音')+'（老師錄過音的詞也可以聽），打拿著那個詞的地鼠。','打錯沒關係，會告訴你正確答案，按「下一題」再繼續。'],moleWord);}
function moleWord(){clearT();const qs=shuffle(W).slice(0,Math.min(+T.count||10,W.length));let i=0,ok=0,miss=[];
  const q=()=>{const x=qs[i];const others=shuffle(W.filter(y=>y!==x&&pyKey(y.p)!==pyKey(x.p))).slice(0,2);const opts=shuffle([x,...others]);const holes=shuffle([0,1,2,3,4,5]).slice(0,opts.length);let fin=false;
    const draw=fb=>{G.innerHTML='<div class="panel"><div class="prog"><span>第 '+(i+1)+' / '+qs.length+' 題</span><span>答對 '+ok+'</span></div>'
      +'<div class="mprompt"><div class="big zhk py">'+esc(D(x.p))+'</div><small>打拿著這個詞的地鼠</small><div style="margin-top:6px">'+sayBtn(x.w)+'</div></div>'

const KQC=[['#E5484D','▲'],['#1E6FD9','◆'],['#D9A100','●'],['#2E8B3A','■']];
function kqHome(){const qs0=(T.qs||[]).filter(q=>q&&Array.isArray(q.opts)&&q.opts.filter(Boolean).length>=2);if(!qs0.length){bad('這份題目還沒有內容');return}
  const lim=+T.timer||0;intro('📝 選擇題','一共 '+qs0.length+' 題。'+(lim?'每題 '+lim+' 秒。':'不計時，慢慢想。'),['看圖和問題，從下面選出對的答案。','答完會告訴你正確答案，按「下一題」再繼續。'],kqPlay);}
function kqPlay(){clearT();const lim=+T.timer||0;const Q=(T.qs||[]).filter(q=>q&&Array.isArray(q.opts)&&q.opts.filter(Boolean).length>=2);let i=0,ok=0,miss=[],res=null,t0=0;
  const tick=()=>{if(res)return;const left=lim-(Date.now()-t0)/1000;const b=$('.timer i');if(b)b.style.width=Math.max(0,left/lim*100)+'%';if(left<=0){answer(-1);return}later(tick,200);};
  const answer=k=>{if(res)return;const q=Q[i],good=k===q.ans;if(good)ok++;else miss.push(q.opts[q.ans]||'');res={good,k};draw();};
  const draw=()=>{const q=Q[i];G.innerHTML='<div class="panel"><div class="prog"><span>第 '+(i+1)+' / '+Q.length+' 題</span><span>答對 '+ok+'</span></div>'+(lim&&!res?'<div class="timer"><i style="width:100%"></i></div>':'')
    +'<div class="qcard zhk">'+(q.img?'<img src="'+esc(q.img)+'" alt="" style="max-width:100%;max-height:260px;border-radius:12px;display:block;margin:0 auto 10px">':'')+(q.q?'<div class="ask" style="font-size:22px">'+esc(q.q)+'</div>':'')+'</div>'
    +'<div class="opts kqo">'+q.opts.map((o,k)=>o?'<button class="zhk'+(res?(k===q.ans?' right':k===res.k?' wrong':''):'')+'" data-k="'+k+'"'+(res?' disabled':'')+'><i style="background:'+KQC[k][0]+'">'+KQC[k][1]+'</i>'+esc(o)+'</button>':'').join('')+'</div>'
    +(res?'<div class="fb '+(res.good?'ok':'no')+'">'+(res.good?'答對了！':res.k<0?'時間到了。':'答錯了。')+(res.good?'':'<span>正確答案：</span><span class="w zhk">'+esc(q.opts[q.ans])+'</span>')+'<span class="sp"></span><button class="btn pri" id="nx">'+(i+1<Q.length?'下一題 →':'看結果')+'</button></div>':'')+'</div>';
    document.querySelectorAll('.kqo button').forEach(b=>b.onclick=()=>answer(+b.dataset.k));const nx=$('#nx');if(nx)nx.onclick=()=>{i++;if(i<Q.length){res=null;t0=Date.now();draw();if(lim)tick();}else done('選擇題',ok,Q.length,miss.filter(Boolean),kqPlay)};};
  t0=Date.now();draw();if(lim)tick();}
