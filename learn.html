<!-- PRACT_V1781 Quinn：學生練習帳號——班級代碼／登入練習帳號／註冊（Email 驗證）。
     自己練習用華語八千詞；免費開放前幾級，再往上要填回饋申請，老師開通。
     練習帳號存在 pstudents，跟學習平台（students）、線上課會員（members）分開。 -->
<style>
:root{--p:#1E4C86;--ps:#E4EDF9;--ink:#16202E;--mut:#7A8BA3;--line:#DCE4EF;--bg:#F4F7FB;--ok:#2E8B57;--bad:#B23B2E;--warm:#E0A33A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif","Noto Serif TC","Songti TC",PMingLiU,serif;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}[hidden]{display:none!important}
.bar{height:68px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1440px)/2 + 20px));position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.bl{width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;flex:none}
.bn{display:flex;align-items:center;gap:12px}.bn b{font-size:19px;letter-spacing:1px;white-space:nowrap}
.bn .be{font-size:11.5px;letter-spacing:2px;color:var(--mut);padding-left:12px;border-left:1px solid var(--line);font-family:"Noto Serif","Noto Serif TC",serif;white-space:nowrap}
@media(max-width:1500px){.bn{flex-direction:column;align-items:flex-start;gap:0;line-height:1.15}.bn .be{padding-left:0;border-left:0;font-size:10px;letter-spacing:2.2px;margin-top:3px}}
@media(max-width:600px){.bar{height:56px;padding:0 14px}.bn b{font-size:16px}.bl{width:34px;height:34px;font-size:18px}}
.home2{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;color:#4A5B75;text-decoration:none;font-size:14px}
.home2:hover{background:#EEF3FA;color:var(--p)}.home2 svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.stage{flex:1;width:100%;max-width:880px;margin:0 auto;padding:30px 16px 24px}
.card{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(30,60,110,.09);padding:28px}
.narrow{max-width:460px;margin:0 auto;text-align:center}
.chip{display:inline-block;background:var(--ps);color:var(--p);border-radius:999px;padding:5px 14px;font-size:13.5px;font-weight:700}
h2{margin:12px 0 4px;font-size:21px;letter-spacing:1px}.sub{margin:0 0 18px;color:var(--mut);font-size:13.5px;line-height:1.7}
.seg{display:flex;background:#EEF3FA;border-radius:12px;padding:4px;gap:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 4px;font-size:14px;font-weight:700;color:#5B6B80}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(20,40,80,.12)}
.f{text-align:left}.f label.l{display:block;font-size:13.5px;font-weight:700;margin:12px 0 6px}.f label.l span{font-weight:400;color:var(--mut)}

input.t:focus,.ddb:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(30,76,134,.12)}
input.cc{text-align:center;letter-spacing:4px;font-family:"Courier New",monospace;font-weight:700;font-size:20px;text-transform:uppercase}
input.cc::placeholder{letter-spacing:1px;font-size:15px;font-weight:400;font-family:"Noto Serif","Noto Serif TC",serif}
.rowx{display:flex;align-items:center;min-height:40px;margin:10px 0 0;font-size:13.5px;color:var(--mut)}
.qrem-l{margin:10px 0 0!important}

.btn:disabled{opacity:.6}.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--line)}
.foot{margin:12px 0 0;text-align:center;font-size:13px;color:var(--mut)}.foot a,.lnk{color:var(--p);text-decoration:none;border:0;background:none;font-size:13.5px;padding:0}

.ddb.has{color:var(--ink)}.ddb::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid #7A8BA3;border-bottom:2px solid #7A8BA3;transform:translateY(-70%) rotate(45deg)}
.dd.open .ddb{border-color:var(--p);box-shadow:0 0 0 3px rgba(30,76,134,.12)}.dd.open .ddb::after{transform:translateY(-30%) rotate(-135deg)}
.ddp{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(20,40,80,.16);padding:6px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.ddp button{border:0;background:none;border-radius:10px;padding:10px 6px;font-size:14.5px;color:var(--ink)}.ddp button:hover{background:#EEF3FA;color:var(--p)}.ddp button.on{background:var(--ps);color:var(--p);font-weight:700}
.pz2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pz2 button{height:48px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;color:#4A5B75}
.pz2 button.on{border:2px solid var(--p);background:#F0F5FC;color:var(--p);font-weight:700}
.big{font-size:44px;font-weight:700;color:var(--p);margin:8px 0}
.okc{width:64px;height:64px;margin:6px auto 4px;border-radius:50%;background:#EAF6EF;color:var(--ok);font-size:34px;display:grid;place-items:center;font-weight:700}
/* 首頁 */
.hi{display:flex;align-items:center;gap:12px;margin-bottom:16px}.av{width:46px;height:46px;border-radius:50%;background:var(--ps);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.hi b{font-size:19px}.hi small{display:block;color:var(--mut);font-size:12.5px}.hi .out{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.today{background:linear-gradient(135deg,#1E4C86,#2C64A8);color:#fff;border-radius:20px;padding:22px 24px;display:flex;align-items:center;gap:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(30,76,134,.25)}
.today .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:26px;flex:none}
.today small{display:block;color:#C9D9F0;font-size:12.5px;letter-spacing:1px}.today b{display:block;font-size:19px;margin:2px 0}.today span{font-size:13px;color:#DCE6F4}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.st{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 6px 18px rgba(30,60,110,.06)}
.st small{color:var(--mut);font-size:12.5px}.st b{display:block;font-size:24px;margin-top:2px}.st b em{font-style:normal;font-size:13px;color:var(--mut);font-weight:400;margin-left:3px}
.sec{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(30,60,110,.07);padding:20px 22px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sec h3 small{font-weight:400;color:var(--mut);font-size:12.5px}
.sec h3 .r{margin-left:auto}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:9px}
.row .ic{width:38px;height:38px;border-radius:11px;background:var(--ps);color:var(--p);display:grid;place-items:center;font-weight:700;flex:none}
.row b{display:block;font-size:15px}.row small{color:var(--mut);font-size:12.5px}
.go{margin-left:auto;background:var(--p);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:13.5px;white-space:nowrap}
.join{display:flex;gap:8px}.join input{flex:1;height:44px}.join button{border:0;background:var(--p);color:#fff;border-radius:11px;padding:0 16px;font-weight:700;white-space:nowrap}
.joinlink{text-align:center;margin:6px 0 0}.joinlink>button{border:0;background:none;color:var(--p);font-size:14px;text-decoration:underline;text-underline-offset:3px}

.lvrow{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}.lvrow>span{font-size:13.5px;color:var(--mut);flex:none}
.lvs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.lvs::-webkit-scrollbar{display:none}
.lv{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:#4A5B75}.lv.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.lv.lock{color:#9AA9BD;background:#F7F9FC;border-style:dashed}
.reqst{margin:-4px 0 12px;padding:10px 14px;border-radius:12px;background:#FFF7E8;color:#8A5A00;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gm{border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;background:#fff;color:var(--ink);text-decoration:none;display:block}
.gm:hover{border-color:var(--p);box-shadow:0 6px 16px rgba(30,76,134,.10)}
.gm i{font-style:normal;display:block;width:42px;height:42px;margin:0 auto 6px;border-radius:12px;background:var(--ps);color:var(--p);font-size:21px;line-height:42px}
.gm b{font-size:14px}.gm small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.wrong{display:flex;flex-wrap:wrap;gap:8px}
.wd{border:1px solid #F1D3CF;background:#FFF8F7;border-radius:12px;padding:8px 12px;text-align:center;min-width:84px}

.pill{display:inline-block;margin-left:6px;border-radius:999px;padding:1px 8px;font-size:11.5px;vertical-align:2px}
.pill.new{background:#FDECEC;color:var(--bad)}.pill.done{background:#EAF6EF;color:var(--ok)}
@media(max-width:640px){.stats{gap:8px}.st{padding:10px}.st b{font-size:19px}.grid{grid-template-columns:1fr 1fr}.today{flex-wrap:wrap}.today button{margin-left:0;width:100%}}
/* 做題 */
.qhead{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px}
.prog{height:6px;background:#EEF3FA;border-radius:99px;overflow:hidden;margin-bottom:14px}.prog i{display:block;height:100%;background:var(--p);transition:width .2s}
.dots{display:flex;justify-content:center;gap:6px;margin:0 0 16px;flex-wrap:wrap}.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--mut)}
.dots button.done{background:var(--ps);color:var(--p);border-color:var(--ps)}.dots button.cur{border:2px solid var(--p);color:var(--p);font-weight:700}
.hz{font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC",serif;font-size:52px;margin:6px 0 4px;line-height:1.25}

.py{font-family:"Times New Roman",serif;font-size:22px;color:#4A5B75;letter-spacing:1px}.py .k{color:var(--p);font-weight:700;border-bottom:2px dashed var(--p)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opts button{min-height:56px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:19px;font-family:"Times New Roman","Noto Serif TC",serif;color:var(--ink);padding:6px}
.opts.t5{grid-template-columns:repeat(5,1fr)}
.opts button.sel{border:2px solid var(--p);background:#F0F5FC;color:var(--p);font-weight:700}
.opts button.ok{border:2px solid var(--ok);background:#EAF6EF;color:var(--ok)}.opts button.no{border:2px solid var(--bad);background:#FDECEC;color:var(--bad)}
.tin{text-align:center;font-family:"Times New Roman",serif;font-size:22px!important;height:56px!important}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.nav button{flex:1;height:48px;border-radius:12px;font-size:15px;font-weight:700}
.nav .pv{border:1px solid var(--line);background:#fff;color:var(--p)}.nav .pv:disabled{opacity:.4}.nav .nx{border:0;background:var(--p);color:#fff}
.res{text-align:left;margin-top:16px;border-top:1px solid #EEF2F8;padding-top:12px}.res div{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #EEF2F8;font-size:14px}
.res b{font-family:"BiauKai","DFKai-SB","標楷體","Kaiti TC",serif;font-size:20px;min-width:70px}.res .y{color:var(--bad)}.res .c{color:var(--ok)}
/* 開通申請 */
.mdl{position:fixed;inset:0;background:rgba(15,30,50,.45);display:grid;place-items:center;padding:16px;z-index:30}
.mbox{position:relative;width:100%;max-width:440px;background:#fff;border-radius:20px;padding:26px 26px 22px;text-align:center;max-height:92vh;overflow:auto}

.ver button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--p)}
.upd{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#16202E;color:#fff;border-radius:999px;padding:8px 8px 8px 18px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:8}

.load{text-align:center;color:var(--mut);padding:60px 0}
