<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>主題單元：去便利商店 · QNA CHINESE</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--line:#E7E0D5;--ink:#2E2A24;--muted:#8A8073;--primary:#B4694A;--soft:#F6EDE7;
--book:#2F6B4F;--bookbg:#EFF7F1;--draft:#9A5B12;--draftbg:#FFF6E6;--gap:#8A4B57;--gapbg:#FBEFF1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:19px}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.wrap{max-width:920px;margin:0 auto;padding:20px}
.tabs{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.tab{padding:7px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:14px;font-family:inherit;color:var(--muted)}
.tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-bottom:16px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:1.5px 9px;border-radius:999px;font-weight:600}
.p-book{background:var(--bookbg);color:var(--book);border:1px solid #CBE3D5}
.p-draft{background:var(--draftbg);color:var(--draft);border:1px solid #EBD6AC}
.p-gap{background:var(--gapbg);color:var(--gap);border:1px solid #EDCBD3}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
section>h2{margin:0;padding:13px 18px;font-size:15.5px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.body{padding:14px 18px}
.step{display:flex;gap:12px;padding:7px 0;border-bottom:1px dashed #EFE8DC}
.step:last-child{border-bottom:0}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);color:var(--primary);font-size:12.5px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:3px}
.words{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:9px;padding:5px 10px;background:#fff;font-size:14px;line-height:1.35}
.chip b{font-weight:600}
.chip i{font-style:normal;color:var(--primary);font-size:11.5px;margin-left:5px}
.chip u{display:block;text-decoration:none;color:#3F6B4C;font-size:12px}
.gp{border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:10px;background:#FCFAF7}
.gp h3{margin:0 0 5px;font-size:14.5px;color:var(--primary)}
.gp .exp{font-size:13.5px;color:#4A443B}
.gp .ex{margin-top:6px;font-size:13.5px;padding-left:12px;border-left:2px solid var(--soft)}
.gp .ex div{padding:2px 0}
.dlg{white-space:pre-wrap;font-size:14.5px;background:#FCFAF7;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.src{color:var(--muted);font-size:12px;margin-top:7px}
.warn{background:var(--draftbg);border:1px solid #EBD6AC;border-radius:11px;padding:11px 14px;font-size:13.5px;margin-bottom:12px}
.gapbox{background:var(--gapbg);border:1px solid #EDCBD3;border-radius:11px;padding:11px 14px;font-size:13.5px}
audio{width:100%;margin-top:8px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>主題單元：去便利商店</h1>
  <div class="sub">同一個情境，三個難度 · 僅供老師檢閱，未連到學生端</div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-lv="1">初級</button>
    <button class="tab" data-lv="2">中級</button>
    <button class="tab" data-lv="3">高級</button>
  </div>
  <div class="legend">
    <span><span class="pill p-book">課本</span> 直接來自妳平台裡的課本內容，有出處</span>
    <span><span class="pill p-draft">草稿</span> 我寫的，還不算數，要妳改過、妳自己錄音</span>
    <span><span class="pill p-gap">缺</span> 課本沒有、需要補的</span>
  </div>
  <div id="out"><div class="loading">讀取中…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
var LESSON={t1l4:"tXE7N1weChp2w4kOBAZQ",t2l8:"iccGpyMtJFW86KPThnwN",t3l2:"CYiYiLAPwrg8EDEeGNd5"};

/* 每一級要挑出來的主題詞：全部都是平台既有生詞，程式會去比對，
   對不到的會標成「查無此詞」，不會默默消失。 */
var UNIT={
1:{
 name:"初級 · 買一樣東西、問價錢、付錢",
 flow:["走進店裡，跟店員打招呼","找到要買的東西","問多少錢","說要買幾個／幾瓶","付錢、拿找的錢","說謝謝、再見"],
 words:"你好 請 謝謝 不客氣 再見 買 賣 給 要 錢 多少 一共 塊 元 便宜 貴 找 店／商店 超市 便利商店 東西 水 飲料 咖啡 茶 紅茶 綠茶 果汁 牛奶 麵包 蛋 冰 熱 甜 好吃 好喝 瓶 杯 個 碗 位 包子 微波 點心 錢包 付 票",
 lessons:[{id:"t1l4",segs:[0,1,2],why:"時代華語一 第四課 整課就是買飲料、問價錢、找錢，有音檔也有插圖"}],
 gp:[{id:"t1l4",idx:[0,1,2,3,4]}],
 draft:{title:"草稿：便利商店結帳對話（我寫的，用的每一個字都是初級課本裡已經有的詞）",
  text:"客人：你好，我要買一瓶水。\n店員：好，還要別的嗎？\n客人：我還要一個麵包。這個多少錢？\n店員：麵包三十五塊，水二十塊，一共五十五塊。\n客人：給你一百塊。\n店員：找你四十五塊。謝謝，再見。\n客人：謝謝，再見。"},
 gaps:"初級課本裡沒有的：結帳、袋子、發票、加熱、集點、繳費、影印、飯糰、關東煮。這幾個是台灣便利商店天天會用到的，但初級課本沒教。要不要補進來、補幾個，妳決定。"
},
2:{
 name:"中級 · 集點換東西、跟店員多講幾句",
 flow:["進店、看到集點活動的海報","問怎麼集點、滿幾點可以換","說想換哪一個","說為了換這個買了什麼","沒換到的時候怎麼講","結帳、拿贈品"],
 words:"貼紙 貼 店員 顧客 商品 商人 盒子 盒 豆漿 娃娃 海報 滿 連 只好 為了 得到 花 開始 變成 所有 增加 紀念 吸引 喜愛 差 類 影響 便利商店 便利 買 賣 錢 付 發票 袋子 加 送 收 差不多",
 lessons:[{id:"t2l8",segs:[0,1],why:"時代華語二 第八課 就是在超商集點換史努比，對話跟短文都有音檔跟插圖"}],
 gp:[{id:"t2l8",idx:[0,1,2,3,4,5,6]}],
 draft:null,
 gaps:"中級這一級課本材料算夠，缺的主要是「繳費、寄取包裹、影印、代收」這種超商服務類的說法——時代華語三第二課有，但那是高級的詞。要不要把其中幾個提前放到中級，妳看要不要。"
},
3:{
 name:"高級 · 說明超商提供哪些服務、講出優缺點",
 flow:["說明超商為什麼方便","列出提供的服務：熱食、熱水、提款機、代收","講自己的使用習慣","講缺點：東西比較貴、店員辛苦","比較超商和傳統商店"],
 words:"超商 服務 提供 需求 主要 用品 手續 自動提款機 順便 泡麵 使用 熱水 饅頭 熱狗 汽水 營養 中餐 西餐 白菜 蔬菜 零食 零錢 加熱 品質 速度 優點 缺點 態度 要求 樂趣 上門 提到 經過 空間 早晚 領 提 挺 整 算了 嚇一跳 坪 滿 碰到",
 lessons:[{id:"t3l2",segs:[0,1],why:"時代華語三 第二課「便利商店真方便」整課就是這個主題，對話＋短文〈台灣的超商〉都有音檔"}],
 gp:[{id:"t3l2",idx:[0,1,2,3,4,5,6]}],
 draft:null,
 gaps:"高級這一級課本材料最完整，這一課本身就有 30 道題可以直接用。真要補的話是「越南和台灣的便利商店有什麼不一樣」這種讓學生自己講的討論題。"
}};

function strip(s){return String(s||'').replace(/<[^>]*>/g,'');}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function parseVocabLine(line){
  if(/[｜|]/.test(line)){
    var p=line.split(/[｜|]/).map(function(s){return s.trim();});
    var w=p[0],py='';var m=w.match(/^([^\[]*)\[([^\]]*)\]/);if(m){w=m[1].trim();py=m[2].trim();}
    return {w:w,py:py,en:(p[2]||'')};
  }
  var py2='',b=line.match(/\[([^\]]*)\]/);if(b)py2=b[1].trim();
  var s=line.replace(/\[[^\]]*\]/g,' ').replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();
  var m2=s.match(/^[一-鿿]+(?:[／\/][一-鿿]+)*/);
  var w2=m2?m2[0]:s;
  var en=m2?s.slice(m2[0].length).replace(/^[\s=：:，,·-]+/,'').trim():'';
  return {w:w2,py:py2,en:en};
}

var BYID={},VOCAB={};
function boot(){
  var started=false;
  function go(){if(started)return;started=true;load();}
  try{firebase.auth().onAuthStateChanged(function(u){
    if(u)go();
    else document.getElementById('out').innerHTML='<div class="loading">請先在同一個瀏覽器登入 <a href="teacher.html">教師管理頁</a>，再回到這一頁。</div>';
  });}catch(e){go();}
  setTimeout(go,8000);
}
function load(){
  DB.list('lessons').then(function(rows){
    rows.forEach(function(l){BYID[l.id]=l;});
    rows.forEach(function(l){
      var book=String(l.book||l.textbook||'');
      (l.dialogues||[]).forEach(function(d){
        var lines=String(d.vocabulary||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        var words=lines.filter(function(s){return !/^[-–—－]/.test(s);});
        var vi=String(d.vocab_vi||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        words.forEach(function(line,i){
          var p=parseVocabLine(line);
          if(!VOCAB[p.w])VOCAB[p.w]={w:p.w,py:p.py,vi:vi[i]||'',en:p.en,src:book+' · '+strip(l.title)};
        });
      });
    });
    render(1);
  }).catch(function(e){document.getElementById('out').innerHTML='<div class="loading">讀取失敗：'+e.message+'</div>';});
}

function render(lv){
  var U=UNIT[lv],h='';
  h+='<section><h2>這個情境會發生什麼 <span class="pill p-draft">草稿</span></h2><div class="body">'+
     '<div class="muted" style="margin-bottom:8px">'+esc(U.name)+'</div>'+
     U.flow.map(function(s,i){return '<div class="step"><div class="n">'+(i+1)+'</div><div>'+esc(s)+'</div></div>';}).join('')+
     '<div class="src">流程是我排的，妳可以改順序或增減。</div></div></section>';

  var ws=U.words.split(' ').filter(Boolean),found=[],miss=[];
  ws.forEach(function(w){ if(VOCAB[w])found.push(VOCAB[w]); else miss.push(w); });
  h+='<section><h2>主題詞彙 <span class="pill p-book">課本</span><span class="muted" style="margin-left:auto;font-weight:400">'+found.length+' 個</span></h2><div class="body">'+
     '<div class="words">'+found.map(function(v){
        return '<span class="chip"><b>'+esc(v.w)+'</b>'+(v.py?'<i>'+esc(v.py)+'</i>':'')+(v.vi?'<u>'+esc(v.vi)+'</u>':'')+'</span>';
     }).join('')+'</div>'+
     (miss.length?'<div class="gapbox" style="margin-top:12px"><span class="pill p-gap">缺</span> 這幾個詞平台課本裡目前查不到，所以沒有拼音和越南文：'+esc(miss.join('、'))+'</div>':'')+
     '<div class="src">每個詞都是從平台既有生詞抓的，拼音和越南文照原樣帶過來，我沒有改字。</div></div></section>';

  U.lessons.forEach(function(ref){
    var l=BYID[LESSON[ref.id]];
    if(!l){h+='<section><div class="body">找不到課次 '+esc(ref.id)+'</div></section>';return;}
    h+='<section><h2>課本材料：'+esc(strip(l.title))+' <span class="pill p-book">課本</span></h2><div class="body">'+
       '<div class="muted" style="margin-bottom:10px">'+esc(ref.why)+'</div>';
    ref.segs.forEach(function(si){
      var d=(l.dialogues||[])[si]; if(!d)return;
      h+='<div style="margin-bottom:14px"><div style="font-weight:600;margin-bottom:5px">'+esc(strip(d.title))+'</div>'+
         '<div class="dlg">'+esc(strip(d.content||''))+'</div>'+
         (d.audio_url?'<audio controls preload="none" src="'+d.audio_url+'"></audio>':'<div class="src">（這一段沒有音檔）</div>')+
         '</div>';
    });
    h+='</div></section>';
  });

  U.gp.forEach(function(ref){
    var l=BYID[LESSON[ref.id]]; if(!l)return;
    var gps=l.grammar_points||[];
    h+='<section><h2>句型 <span class="pill p-book">課本</span><span class="muted" style="margin-left:auto;font-weight:400">'+esc(strip(l.title))+'</span></h2><div class="body">';
    ref.idx.forEach(function(i){
      var g=gps[i]; if(!g)return;
      h+='<div class="gp"><h3>'+esc(strip(g.title||''))+'</h3>';
      (g.blocks||[]).forEach(function(b){
        if(b.text)h+='<div class="exp">'+esc(strip(b.text))+'</div>';
        if(b.ex)h+='<div class="ex">'+String(b.ex).split('\n').filter(Boolean).map(function(x){return '<div>'+esc(strip(x))+'</div>';}).join('')+'</div>';
      });
      h+='</div>';
    });
    h+='<div class="src">說明和例句都是課本原文，我沒有另外寫。</div></div></section>';
  });

  if(U.draft){
    h+='<section><h2>'+esc(U.draft.title)+' <span class="pill p-draft">草稿</span></h2><div class="body">'+
       '<div class="warn">這一段<b>不是課本內容，是我寫的草稿</b>。要用的話請妳先改成妳自己的講法，音檔也要妳自己錄——我不會做 AI 語音。</div>'+
       '<div class="dlg">'+esc(U.draft.text)+'</div></div></section>';
  }
  if(U.gaps){
    h+='<section><h2>還缺什麼 <span class="pill p-gap">缺</span></h2><div class="body"><div class="gapbox">'+esc(U.gaps)+'</div></div></section>';
  }
  document.getElementById('out').innerHTML=h;
}

document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); render(+b.dataset.lv); window.scrollTo(0,0);
  };
});
boot();
</script>
</body>
</html>
