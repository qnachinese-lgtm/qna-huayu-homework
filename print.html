<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>QNA CHINESE 列印</title>
<style>body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#7a5236;background:#fdfaf5;margin:0;padding:40px;font-size:15px;line-height:1.8}</style>
</head>
<body>
<!-- PRINTURL_V834
     列印文件本來是開一個空白視窗再把內容寫進去，那種視窗沒有網址，
     所以 Chrome 在頁尾印出來的是「about:blank」。
     改成開這一頁（有正式網址），內容從 localStorage 拿，拿完就刪掉。 -->
<div id="m">正在準備列印內容…</div>
<script>
(function(){
  var m=document.getElementById('m');
  try{
    var k=(location.hash||'').slice(1);
    var h=k?localStorage.getItem(k):null;
    if(k){try{localStorage.removeItem(k);}catch(e){}
          /* PRINTURL_V847 把後面那一長串暫存代號從網址拿掉，
             Chrome 頁尾印出來的網址才乾淨 */
          try{history.replaceState(null,'',location.pathname);}catch(e){}}
    if(h){document.open();document.write(h);document.close();return;}
    m.textContent='這個列印視窗已經過期了，請回到平台再按一次列印。';
  }catch(e){
    m.textContent='打不開列印內容，請回到平台再按一次列印。';
  }
})();
</script>
</body>
</html>
