<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>QNA CHINESE 列印</title>
<style>body{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:#7a5236;background:#fdfaf5;margin:0;padding:40px;font-size:15px;line-height:1.8}
/* PRINTMSG_V995 保險：萬一這行字還在，也絕對不要印出來 */
@media print{#m{display:none!important}}</style>
</head>
<body>
<!-- PRINTURL_V834
     列印文件本來是開一個空白視窗再把內容寫進去，那種視窗沒有網址，
     所以 Chrome 在頁尾印出來的是「about:blank」。
     改成開這一頁（有正式網址），內容從 localStorage 拿，拿完就刪掉。 -->
<div id="m">正在準備列印內容…</div>
<script>
/* PRINTMSG_V995 本來這一段是在解析網頁的過程中就跑 document.open()，
   而規格上「解析中呼叫 document.open()」會被忽略——所以它沒有把舊內容清掉，
   document.write 只是接在「正在準備列印內容…」後面。
   結果是每一份列印出來的文件，第一頁最上面都有那一行字
   （講義、回饋單、檔案卡、對帳單都有，只是一直沒有人把它印出來看）。
   改成等解析結束（DOMContentLoaded）再寫，document.open() 才會真的清空。 */
function qnaPrintBoot(){
  var m=document.getElementById('m');
  try{
    var k=(location.hash||'').slice(1);
    var h=k?localStorage.getItem(k):null;
    if(k){try{localStorage.removeItem(k);}catch(e){}
          /* PRINTURL_V847 把後面那一長串暫存代號從網址拿掉，
             Chrome 頁尾印出來的網址才乾淨 */
          try{history.replaceState(null,'',location.pathname);}catch(e){}}
    if(h){document.open();document.write(h);document.close();return;}
    if(m)m.textContent='這個列印視窗已經過期了，請回到平台再按一次列印。';
  }catch(e){
    if(m)m.textContent='打不開列印內容，請回到平台再按一次列印。';
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',qnaPrintBoot);
else qnaPrintBoot();
</script>
</body>
</html>
