function dlg(o){return new Promise(res=>{const w=document.createElement('div');w.className='dlg';
  w.innerHTML='<div class="dlg-b" role="dialog" aria-modal="true"><h3>'+esc(o.title||'')+(o.sub?' <small>'+esc(o.sub)+'</small>':'')+'</h3>'
    +(o.text?'<p>'+esc(o.text)+'</p>':'')
    +(o.label?'<label class="l">'+esc(o.label)+'</label><input class="dlg-in" maxlength="'+(o.max||60)+'" placeholder="'+esc(o.ph||'')+'" value="'+esc(o.value||'')+'">':'')
    +'<div class="dlg-a">'+(o.noCancel?'':'<button class="btn" data-v="0">取消</button>')+'<button class="btn pri'+(o.danger?' dng':'')+'" data-v="1">'+esc(o.ok||'確定')+'</button></div></div>';
  document.body.appendChild(w);const inp=w.querySelector('.dlg-in');
  const done=v=>{w.remove();document.removeEventListener('keydown',kd);res(v)};
  const okv=()=>inp?(inp.value.trim()||null):true;
  const kd=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&(inp?document.activeElement===inp:true)){e.preventDefault();done(okv())}};
  document.addEventListener('keydown',kd);
  w.addEventListener('click',e=>{if(e.target===w)done(null);const b=e.target.closest('[data-v]');if(b)done(b.dataset.v==='1'?okv():null)});
  setTimeout(()=>{if(inp){inp.focus();inp.select()}else w.querySelector('.pri').focus()},20);});}

const PYSUB=[['fall','↓ 漢字往下掉'],['mole','ˇ 聲調打地鼠'],['wmole','詞 詞語打地鼠'],['flip','? 拼音配對翻牌'],['quiz','⚡ 拼音選擇搶答'],['puzzle','ü 拼音拼字拼圖']];
/* ================= VOICE_V1788 老師自己錄聲音 =================
   Quinn：「我是希望可以使用老師的真實聲音錄音，而不是使用 AI 聲音」
   錄好的檔案放在 Storage tvoice/老師編號/…；Firestore tvoice 記「哪一句 → 檔案網址」。
   學生那邊（stu-shell.js）要念的時候就播這裡的錄音；沒錄的不念。同一句話錄一次，每份題目都用得到。 */
let VOICE=null;
const vnorm=t=>String(t||'').replace(/[\s，。！？、；：,.!?;:「」『』（）()／\/…—\-·]/g,'').replace(/臺/g,'台');
function vid(t){let h=5381;const s=vnorm(t);for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36);}
async function vLoad(force){if(VOICE&&!force)return VOICE;VOICE={};try{const sn=await db.collection('tvoice').where('owner_uid','==',S.user.uid).get();sn.docs.forEach(d=>{const v=d.data();if(v&&v.text)VOICE[vnorm(v.text)]=Object.assign({id:d.id},v);});}catch(e){VOICE.__err=String(e&&(e.code||e.message)||e);}return VOICE;}
/* 一份題目要錄的句子：詞（每行第一段漢字）、填空和排序是整句、短句短文是每一句 */
function vTexts(t){if(!t)return[];let out=[];
  if(t.pm&&Array.isArray(t.segs))out=t.segs.map(x=>x.h);
  else if(t.game==='kq')out=[];
  else if(t.game==='fill')out=String(t.items||'').split('\n').map(l=>l.trim().replace(/[（(]([^）)]+)[）)]/g,(m,a)=>a.split(/[／\/]/)[0])).filter(Boolean);
  else if(t.game==='order')out=String(t.items||'').split('\n').map(l=>l.trim().replace(/\s+/g,'')).filter(Boolean);
  else if(t.kind==='hanzi')out=[];
  else out=String(t.items||'').split('\n').map(l=>(/^[㐀-鿿]+/.exec(l.trim())||[''])[0]).filter(Boolean);
  return [...new Set(out)].slice(0,80);}
function vBtn(t){const ts=vTexts(t);if(!ts.length)return '';const n=VOICE?ts.filter(x=>VOICE[vnorm(x)]).length:0;return '<button type="button" class="btn sm vb'+(n===ts.length?' done':'')+'" data-vt="'+esc(t.id)+'">🎤 錄聲音 '+n+'/'+ts.length+'</button>';}
let VREC=null;
/* RECFIX_V1801 Quinn：「錄完但是沒辦法播出來」
   1. 先用 iPhone／iPad 也播得出來的格式（mp4），瀏覽器不支援才用 webm（webm 在部分 iPhone／iPad 播不出來）。
   2. 錄音時量音量：整段都沒有聲音（麥克風沒收到），就不存，請老師檢查麥克風。
   3. 播不出來的時候會說原因，不會按了沒反應。 */
function recMime(){if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';return ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}})||'';}
async function vRecStart(){const st=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];const mt=recMime();const r=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  let peak=0,ac=null,iv=null,live=false;try{ac=new (window.AudioContext||window.webkitAudioContext)();try{ac.resume()}catch(e){}const an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);const buf=new Float32Array(an.fftSize);iv=setInterval(()=>{if(ac.state==='running')live=true;else return;an.getFloatTimeDomainData(buf);for(let i=0;i<buf.length;i++){const v=Math.abs(buf[i]);if(v>peak)peak=v;}},60);}catch(e){peak=1;}
  const done=new Promise(res=>{r.onstop=()=>{clearInterval(iv);try{ac&&ac.close()}catch(e){}try{st.getTracks().forEach(x=>x.stop())}catch(e){}const bl=new Blob(ch,{type:(r.mimeType||mt||'audio/webm').split(';')[0]});bl.peak=live?peak:null;res(bl);/* 量不到音量（瀏覽器不讓量）就不要擋 */};});r.start();return {stop:()=>{try{r.stop()}catch(e){}return done;}};}
function vPlay(url,btn){const a=new Audio(url);const st=btn&&btn.parentNode&&btn.parentNode.querySelector('.vst');const old=st?st.innerHTML:'';
  const say=t=>{if(st)st.innerHTML=t;};

/* PICQ_V1748 Quinn：「老師也可以上傳圖，方式就類似 Kahoot」——看圖選詞：每個詞配一張圖，學生看圖從四個詞裡選。

const PIC={};let PICBUSY=0;
function picWords(){return [...new Set(($('#g-items')||{value:''}).value.split('\n').map(x=>x.trim().split(/\s+/)[0]).filter(w=>/^[㐀-鿿]+$/.test(w)))];}
function picPaint(){const box=$('#picbox');if(!box)return;const PG=S.gk==='pic'||S.gk==='kflip';box.classList.toggle('hide',!PG);if(!PG)return;const ws=picWords();
  box.innerHTML='<label class="l">每個詞配一張圖</label>'+(ws.length?'<div class="picgrid">'+ws.map(w=>'<label class="picit'+(PIC[w]?' has':'')+'">'+(PIC[w]?'<img src="'+esc(PIC[w])+'" alt="">':'<span class="pic-plus">＋<small>上傳圖片</small></span>')+'<b>'+esc(w)+'</b><input type="file" accept="image/*" data-pw="'+esc(w)+'" hidden></label>').join('')+'</div><p class="gneed">點格子上傳圖片；手機可以直接拍照。'+(PICBUSY?'上傳中…':'')+'</p>':'<p class="gneed">先在上面打詞（或從題庫選詞），這裡就會出現格子讓你放圖。</p>');

function picShrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('圖片轉不過來')),'image/jpeg',.82);};im.onerror=()=>rej(new Error('讀不到這張圖'));im.src=u;});}

const KQBUSY={};
async function kqUp(i,file){KQBUSY[i]=1;kqPaint();const x=KQ[i];

function kqCheck(){if(Object.keys(KQBUSY).length)return {err:'圖片還在上傳，請等一下'};const qs=[];

      if(WZ_CNT[k]){const df=o.cnt||WZ_DF[k]||10;r+='<select data-wo="'+k+'" data-f="cnt">'+WZ_CNT[k].map(n=>'<option value="'+n+'"'+(n==df?' selected':'')+'>'+(/flip/.test(k)?n+' 對':n+' 題')+'</option>').join('')+'</select>';}
      if(k==='quiz')r+='<select data-wo="quiz" data-f="time"><option value="0">不計時</option><option value="20"'+(o.time=='20'?' selected':'')+'>每題 20 秒</option><option value="12"'+(o.time=='12'?' selected':'')+'>每題 12 秒</option></select>';
      if(k==='pinyin'){r+='<select data-wo="pinyin" data-f="sub">'+PYSUB.map(x=>'<option value="'+x[0]+'"'+(x[0]===(o.sub||PYSUB[0][0])?' selected':'')+'>'+x[1]+'</option>').join('')+'</select>';
        if((o.sub||PYSUB[0][0])==='fall')r+='<select data-wo="pinyin" data-f="spd"><option value="slow">慢</option><option value="mid"'+(o.spd==='mid'?' selected':'')+'>中</option><option value="fast"'+(o.spd==='fast'?' selected':'')+'>快</option></select>';}
      return r+'</div>';}).join('')+'</div>';}
  const box=$('#wz-games');box.innerHTML=h;
  box.querySelectorAll('[data-wg]').forEach(c=>c.onchange=()=>{c.checked?WZ.sel.add(c.dataset.wg):WZ.sel.delete(c.dataset.wg);wzGames();wzPaint();});
  box.querySelectorAll('[data-wo]').forEach(x=>x.onchange=()=>{const o=WZ.opt[x.dataset.wo]=WZ.opt[x.dataset.wo]||{};o[x.dataset.f]=x.value;if(x.dataset.f==='sub')wzGames();});}
function wzTypes(){const b=$('#wz-types');b.innerHTML=WZ_TY.map(k=>'<button type="button" class="wz-t'+(k===WZ.ty?' on':'')+'" data-wt="'+k+'">'+wzG(k)[1]+'</button>').join('');
  b.querySelectorAll('[data-wt]').forEach(x=>x.onclick=()=>{WZ.ty=x.dataset.wt;wzSetG(WZ.ty);wzTypes();wzPaint();});}
function wzSum(){const nm=$('#wz-name');nm.placeholder=wzDefName();const n0=nm.value.trim()||wzDefName();let h;
  if(WZ.cat==='w'){const ks=[...WZ.sel];h='會發出 <b>'+ks.length+' 份</b>：'+ks.map(wzNm).join('、')+'<br>生詞 '+wzWords().length+' 個<br><small style="color:var(--mut)">題目名稱：'+esc(n0)+'・'+esc(wzNm(ks[0]||'flip'))+(ks.length>1?' …':'')+'</small>';}
  else if(WZ.cat==='s')h='會發出 <b>1 份</b>：'+wzNm(WZ.ty)+'<br><small style="color:var(--mut)">題目名稱：'+esc(n0)+'</small>';
  else h='會發出 <b>1 份</b>：'+(S.pm==='sent'?'短句練習':S.pm==='text'?'短文練習':'拼音練習')+'<br><small style="color:var(--mut)">題目名稱：'+esc(n0)+'</small>';
  $('#wz-sum').innerHTML=h;const sv=$('#wz-savew');const can=!(WZ.cat==='s'&&WZ.ty==='kq');sv.hidden=!can;$('#wz-savet').textContent='也存進「我的題庫」（分類：'+n0+'）';}
function wzEnter(){const p=wzSteps()[WZ.st];$('#wz-body').scrollTop=0;
  if(p==='gitems'){if(WZ.cat==='w'){wzKind('game');if(['kq','fill','order','kblk','ktrain'].includes(S.gk))wzSetG('flip');}else{wzKind('game');wzSetG(WZ.ty);}
    $('#wz-gh').innerHTML=WZ.cat==='w'?'這一課的生詞 <small>一行一個詞，有拼音最好</small>':'題目內容 <small>'+esc(wzG(WZ.ty)[1])+'</small>';
    $('#wz-rad').hidden=!(WZ.cat==='s'&&WZ.ty==='kblk');const fm=$('#g-fmodew');if(fm)fm.classList.toggle('hide',!(WZ.cat==='s'&&WZ.ty==='fill'));}

  if(p==='pics'){wzSetG(WZ.sel.has('pic')?'pic':'kflip');picPaint();}
  if(p==='py')wzKind('pinyin');

async function wzGo(code){const msg=$('#t-msg'),nx=$('#wz-next');const nm=($('#wz-name').value.trim()||wzDefName()).slice(0,50);const out=[];
  nx.dataset.busy='1';nx.disabled=true;nx.textContent='發送中…';
  const fail=m=>{S.dry=null;delete nx.dataset.busy;if(m)msg.textContent=m;wzPaint();};
  try{if(WZ.cat==='p'){wzKind('pinyin');$('#t-title').value=nm;S.dry=[];await $('#t-go').onclick();if(!S.dry.length)return fail();out.push(...S.dry);}
    else{const ks=WZ.cat==='w'?[...WZ.sel]:[WZ.ty];
      for(const k of ks){wzKind('game');wzSetG(k);$('#g-title').value=(WZ.cat==='w'?nm+'・'+wzNm(k):nm).slice(0,60);const o=WZ.opt[k]||{};
        const gc=$('#g-cnt');if(gc&&WZ_CNT[k])gc.value=String(o.cnt||WZ_DF[k]||10);if(k==='quiz')$('#g-time').value=o.time||'0';
        if(k==='pinyin'){$('#g-sub').value=o.sub||PYSUB[0][0];$('#g-sub').dispatchEvent(new Event('change'));$('#g-spd').value=o.spd||'slow';}
        S.dry=[];await $('#t-go').onclick();if(!S.dry.length)return fail(ks.length>1?'【'+wzNm(k)+'】'+msg.textContent:'');out.push(...S.dry);}}}
  catch(e){return fail('發不出去：'+(e&&e.message||e));}
  S.dry=null;
  try{for(const t of out)await db.collection('ttasks').add(t);}catch(e){return fail('發不出去：'+(e&&e.message||e));}
  /* 自動存進我的題庫（分類＝題目名稱，重複的不會再存） */
  if($('#wz-save').checked&&!(WZ.cat==='s'&&WZ.ty==='kq')){const L=WZ.cat==='p'?(S.pm?String(($('#seg-text')||{}).value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean):wzLines('t-items')):wzLines();
    try{await mbLoad(false).catch(()=>{});if(L.length)await mbAdd(L,nm);}catch(e){}}
  if(S.pm)SEG=[];KQ=[];Object.keys(PIC).forEach(k=>delete PIC[k]);
  WZ.st=0;WZ.cat='';WZ.sel.clear();WZ.opt={};S.ctab='tasks';classView(code);}
function wizInit(code){const card=app.querySelector('.wzcard');if(!card)return;
  const w=document.createElement('div');w.className='wz';w.id='wz';
  w.innerHTML='<div class="wz-prog" id="wz-prog"></div><div class="wz-body" id="wz-body">'
   +'<section data-wp="cat"><div class="wz-h">要出什麼？</div><div class="wz-cats">'
   +'<button type="button" class="wz-cat" data-wc="w"><i>📚</i><span><b>生詞遊戲</b><small>打一次生詞，勾好幾個遊戲</small></span></button>'
   +'<button type="button" class="wz-cat" data-wc="s"><i>✍️</i><span><b>句子・題目</b><small>填空、排序、選擇題、拼字積木、接龍</small></span></button>'
   +'<button type="button" class="wz-cat" data-wc="p"><i>ā</i><span><b>拼音練習</b><small>看漢字打拼音；生詞、短句、短文</small></span></button></div></section>'
   +'<section data-wp="type"><div class="wz-h">哪一種？</div><div class="wz-types" id="wz-types"></div></section>'
   +'<section data-wp="gitems"><div class="wz-h" id="wz-gh"></div><div id="wz-gi"></div><div id="wz-rad" hidden><div class="wz-gg" style="margin-top:14px">打不出來的部首，點一下就放進去</div><div class="wz-rads">'+WZ_RAD.map(r=>'<button type="button">'+r+'</button>').join('')+'</div></div></section>'
   +'<section data-wp="games"><div class="wz-h">要給學生玩哪些？<small>可以勾好幾個</small></div><div id="wz-games"></div></section>'
   +'<section data-wp="pics"><div class="wz-h">每個詞放一張圖 <small>看圖選詞、圖片翻牌要用</small></div><div id="wz-pics"></div></section>'
   +'<section data-wp="py"><div class="wz-h">拼音練習</div><div id="wz-py"></div></section>'
   +'<section data-wp="send"><div class="wz-h">發給學生</div><label class="l">題目名稱 <span>（不寫就用下面灰字）</span></label><input id="wz-name" maxlength="50"><div id="wz-due"></div>'
   +'<div class="wz-sum" id="wz-sum"></div><label class="wz-save" id="wz-savew"><input type="checkbox" id="wz-save" checked><span id="wz-savet"></span></label><div id="wz-msg"></div></section>'
   +'</div><div class="wz-foot"><button type="button" class="wz-back" id="wz-back">← 上一步</button><span class="grow"></span><button type="button" class="wz-next" id="wz-next">下一步 →</button></div>';
  card.appendChild(w);
  /* 把原本的欄位搬進來 */
  const mv=(sel,to)=>{const n=app.querySelector(sel);if(n)$(to).appendChild(n);return n;};
  mv('#gwords','#wz-gi');mv('#kqbox','#wz-gi');mv('#g-fmodew','#wz-gi');
  mv('#picbox','#wz-pics');
  const pmseg=app.querySelector('.pmseg');if(pmseg)$('#wz-py').appendChild(pmseg);mv('#pm-words','#wz-py');mv('#pm-seg','#wz-py');
  mv('.duerow','#wz-due');mv('#t-msg','#wz-msg');
  w.querySelectorAll('[data-wc]').forEach(b=>b.onclick=()=>{WZ.cat=b.dataset.wc;w.querySelectorAll('[data-wc]').forEach(x=>x.classList.toggle('on',x===b));WZ.st=1;$('#t-msg').textContent='';wzEnter();});
  w.querySelectorAll('.wz-rads button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const ta=$('#g-items');const a=ta.selectionStart==null?ta.value.length:ta.selectionStart,z=ta.selectionEnd==null?a:ta.selectionEnd;ta.value=ta.value.slice(0,a)+b.textContent+ta.value.slice(z);const q=a+b.textContent.length;ta.focus();try{ta.setSelectionRange(q,q);}catch(e){}wzPaint();};});
  $('#wz-back').onclick=()=>{if(WZ.st>0){WZ.st--;$('#t-msg').textContent='';wzEnter();}};
  $('#wz-next').onclick=()=>{const p=wzSteps()[WZ.st];if(p==='send')return wzGo(code);if(wzBlock(p))return;WZ.st++;wzEnter();};
  w.addEventListener('input',()=>{wzPaint();if(wzSteps()[WZ.st]==='send')wzSum();});
  document.addEventListener('click',()=>setTimeout(wzPaint,60));
  if(WZ.cat)w.querySelectorAll('[data-wc]').forEach(x=>x.classList.toggle('on',x.dataset.wc===WZ.cat));

async function load(){const u=S.user;
  const own=String(u.email||'').toLowerCase()===OWNER;
  let p=null,rerr=null;try{const d=await db.collection('tteachers').doc(u.uid).get();p=d.exists?d.data():null;}catch(e){rerr=e;}
  /* PROFSAFE_V1776 Quinn：「已經註冊的人怎麼辦？」——讀不到（網路或權限問題）時不要當成沒註冊，請他重新整理，避免已經註冊的老師看到「建立老師資料」 */
  if(rerr&&!own){bar();app.innerHTML='<div class="card auth"><div class="logo">美</div><h2>暫時讀不到你的老師資料</h2><p class="sub">可能是網路不穩。請重新整理再試一次；還是不行的話，請聯絡美娟老師。</p><button class="btn pri" onclick="location.reload()">重新整理</button></div>';return;}
  if(!p&&S.pending){try{await mkProfile(S.pending);p={name:S.pending.name,status:'active'};}catch(e){}S.pending=null;}
  S.prof=p||(own?{name:'美娟老師',status:'approved'}:null);
  if(!S.prof)return profileView();
  if(!own&&(S.prof.status==='blocked'||S.prof.status==='rejected'))return waitView(S.prof.status);
  /* TVERIFY_V1806 Quinn：「這邊的話，是需要驗證」——老師帳號要先驗證 Email 才能用 */
  if(!own&&!u.emailVerified)return tVerifyView();
  if(p&&!own){db.collection('tteachers').doc(u.uid).update({last_at:now()}).catch(()=>{});}/* TDASH_V1734 後台看得到最後登入 */
  if(u.emailVerified&&p&&!p.email_verified){try{await u.getIdToken(true);await db.collection('tteachers').doc(u.uid).update({email_verified:true});}catch(e){}}
  route();}
function route(){if(!S.user||!S.prof)return;if(location.hash==='#bank')return myBankView();const m=/c=([A-Z0-9]+)/.exec(location.hash||'');if(m)classView(m[1]);else listView();}
window.addEventListener('hashchange',route);
/* REMEMBER_V1777 只有「在老師專區登入、而且勾了記住我」（或這個分頁剛登入）才自動進去；
   在學生頁或別的地方登入的帳號，不會自動變成老師專區的登入 */
function tkOK(u){try{if(S.loginHere){if(S.loginHere==='local')localStorage.setItem('qna_tclass_rem',u.uid);else{localStorage.removeItem('qna_tclass_rem');sessionStorage.setItem('qna_tclass_ses',u.uid);}S.loginHere=null;return true;}
  return localStorage.getItem('qna_tclass_rem')===u.uid||sessionStorage.getItem('qna_tclass_ses')===u.uid;}catch(e){return false}}
auth.onAuthStateChanged(u=>{S.user=u;S.prof=null;if(!u||!tkOK(u)){S.user=null;return authView(/reg/.test(location.search+location.hash)?'reg':'login');}load();});
})();

<div class="qf-m" id="qf-m" hidden><div class="qf-box" role="dialog" aria-modal="true" aria-labelledby="qf-h">

  <div class="qf-2"><div><label for="qf-nm">你的名字 <span>Name</span></label><input id="qf-nm" maxlength="60"></div><div><label for="qf-em">Email <span>（想收到回覆再填）</span></label><input id="qf-em" type="email" maxlength="100"></div></div>

</div></div>
<script>
/* QFOOT_V1728 Quinn：mailto 會跳出「選應用程式」視窗，不好用——Email 改成「複製」，問題回報在網頁裡直接填、直接送（存在 feedback，後台看得到） */
(function(){const $=s=>document.getElementById(s);
  const mail=()=>String((document.getElementById('qf-mail')||{}).textContent||window.TEACHER_EMAIL||'').trim();
  $('qf-cp').onclick=()=>{const t=mail();const ok=()=>{$('qf-cp').textContent='已複製 ✓';setTimeout(()=>{$('qf-cp').textContent='複製'},1600)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{prompt('Email',t)})}catch(e){prompt('Email',t)}};
  let kind='bug';const m=$('qf-m');
  const open=()=>{m.hidden=false;try{$('qf-nm').value=$('qf-nm').value||localStorage.getItem('qna_guest_name')||''}catch(e){}setTimeout(()=>$('qf-msg').focus(),30)};
  const close=()=>{m.hidden=true};
  $('qf-rp').onclick=open;$('qf-x').onclick=close;m.onclick=e=>{if(e.target===m)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden)close()});
  $('qf-k').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;$('qf-k').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('qf-go').onclick=async()=>{const msg=$('qf-msg').value.trim(),note=$('qf-note');note.className='qf-msg';
    if(!msg){note.textContent='請先寫內容 · Please write a message';return}
    $('qf-go').disabled=true;note.textContent='送出中…';
    try{if(!window.firebase||!firebase.firestore)throw new Error('offline');if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      await firebase.firestore().collection('feedback').add({kind,msg:msg.slice(0,2000),name:$('qf-nm').value.trim().slice(0,60),email:$('qf-em').value.trim().slice(0,100),page:(location.pathname+location.search).slice(0,200),at:new Date().toISOString(),ua:String(navigator.userAgent||'').slice(0,200)});
      note.className='qf-msg ok';note.textContent='已送出，謝謝！ · Sent, thank you!';$('qf-msg').value='';setTimeout(close,1400);}
    catch(e){note.textContent='送不出去，請直接寫信給我（上面的 Email） · Failed, please email me.'}
    $('qf-go').disabled=false;};
})();
</script>
