/* TCLASS_V1722 老師教室：其他老師註冊帳號（要主管理員批准）→ 開班 → 出拼音／漢字題 → 學生用班級代碼＋名字加入。

/* ---------- DLG_V1728 Quinn：瀏覽器內建的跳出視窗很醜——改成網頁自己的視窗 ---------- */
function dlg(o){return new Promise(res=>{const w=document.createElement('div');w.className='dlg';
  w.innerHTML='<div class="dlg-b" role="dialog" aria-modal="true"><h3>'+esc(o.title||'')+(o.sub?' <small>'+esc(o.sub)+'</small>':'')+'</h3>'
    +(o.text?'<p>'+esc(o.text)+'</p>':'')
    +(o.label?'<label class="l">'+esc(o.label)+'</label><input class="dlg-in" maxlength="60" placeholder="'+esc(o.ph||'')+'" value="'+esc(o.value||'')+'">':'')
    +'<div class="dlg-a">'+(o.noCancel?'':'<button class="btn" data-v="0">取消</button>')+'<button class="btn pri'+(o.danger?' dng':'')+'" data-v="1">'+esc(o.ok||'確定')+'</button></div></div>';
  document.body.appendChild(w);const inp=w.querySelector('.dlg-in');
  const done=v=>{w.remove();document.removeEventListener('keydown',kd);res(v)};
  const okv=()=>inp?(inp.value.trim()||null):true;
  const kd=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&(inp?document.activeElement===inp:true)){e.preventDefault();done(okv())}};
  document.addEventListener('keydown',kd);
  w.addEventListener('click',e=>{if(e.target===w)done(null);const b=e.target.closest('[data-v]');if(b)done(b.dataset.v==='1'?okv():null)});
  setTimeout(()=>{if(inp){inp.focus();inp.select()}else w.querySelector('.pri').focus()},20);});}

    else{const ws=all.slice(B.sec*20,B.sec*20+20);
      h+='<div class="bank-bar"><button type="button" class="btn sm" id="bk-back">← 所有分區</button><b>'+LV8[B.lv]+'・第 '+(B.sec+1)+' 區</b><span class="grow"></span><button type="button" class="btn sm" id="bk-all">全選</button><button type="button" class="btn sm" id="bk-none">全不選</button></div>'

const PIC={};let PICBUSY=0;
function picWords(){return [...new Set(($('#g-items')||{value:''}).value.split('\n').map(x=>x.trim().split(/\s+/)[0]).filter(w=>/^[㐀-鿿]+$/.test(w)))];}
function picPaint(){const box=$('#picbox');if(!box)return;box.classList.toggle('hide',S.gk!=='pic');if(S.gk!=='pic')return;const ws=picWords();

function picShrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('圖片轉不過來')),'image/jpeg',.82);};im.onerror=()=>rej(new Error('讀不到這張圖'));im.src=u;});}
async function picUp(w,file){PICBUSY++;picPaint();
  try{const b=await picShrink(file);const ref=firebase.storage().ref('tclass_img/'+S.user.uid+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg');

/* KQ_V1749 Quinn：「我要加自己出題的」——像 Kahoot：每一題一張圖（可不放）、一句問題（可不寫）、2～4 個選項，勾一個對的 */
let KQ=[];const KQC=[['#E21B3C','▲'],['#1368CE','◆'],['#D89E00','●'],['#26890C','■']];

  $('#kqadd').onclick=()=>{KQ.push(kqNew());kqPaint();const c=box.querySelectorAll('.kqc');c[c.length-1].scrollIntoView({behavior:'smooth',block:'center'});};}
const KQBUSY={};
async function kqUp(i,file){KQBUSY[i]=1;kqPaint();const x=KQ[i];
  try{const b=await picShrink(file);const ref=firebase.storage().ref('tclass_img/'+S.user.uid+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.jpg');await ref.put(b,{contentType:'image/jpeg'});x.img=await ref.getDownloadURL();}
  catch(e){dlg({title:'圖片傳不上去',text:/unauthorized|permission/i.test(String(e&&(e.code||e.message)))?'Storage 規則還沒發布，請主管理員到 Firebase 按「發布」。':String(e&&e.message||e),ok:'知道了',noCancel:1});}

function kqCheck(){if(Object.keys(KQBUSY).length)return {err:'圖片還在上傳，請等一下'};const qs=[];
  for(let i=0;i<KQ.length;i++){const x=KQ[i];const opts=x.opts.map(o=>o.trim());
    if(!x.img&&!x.q.trim())return {err:'第 '+(i+1)+' 題要放圖或寫問題'};
    if(!opts[x.ans])return {err:'第 '+(i+1)+' 題勾的「對的」那一格還沒寫'};
    const keep=opts.map((o,k)=>({o,k})).filter(z=>z.o);if(keep.length<2)return {err:'第 '+(i+1)+' 題至少要寫兩個選項'};
    qs.push({img:x.img||'',q:x.q.trim(),opts:keep.map(z=>z.o),ans:keep.findIndex(z=>z.k===x.ans)});}
  if(!qs.length)return {err:'至少要出一題'};return {qs};}

/* SEGP_V1755 Quinn：「除了練習單子以外，還想要增加難度：生詞、短句、短文」

S.pm='';let SEG=[];
const HANRE=/[\u3400-\u9fff\uf900-\ufaff]/;

function segPaint(){const g=$('#seg-grid');if(!g)return;if(!S.pm||!SEG.length){g.innerHTML='';return}

async function segEdit(b){const [si,ci]=b.dataset.s.split(':').map(Number);const c=Array.from(SEG[si].h)[ci];let opts=[];try{opts=pinyinPro.pinyin(c,{multiple:true,type:'array'})||[];}catch(e){}
  {const base=String(SEG[si].p[ci]||opts[0]||'').normalize('NFD').replace(/[\u0300\u0301\u030c\u0300-\u0302\u0304\u030b]/g,'').normalize('NFC');if(base&&opts.indexOf(base)<0)opts=opts.concat([base]);}/* 多一個「輕聲」選項 */
  const cur=SEG[si].p[ci];const w=document.createElement('div');w.className='dlg';
  w.innerHTML='<div class="dlg-b" style="max-width:340px"><h3 style="margin:0">「'+esc(c)+'」的拼音</h3>'+(opts.length>1?'<p class="gneed" style="margin:0">點一個讀音（最後一個沒有聲調的是輕聲）</p><div class="segopts">'+opts.map(o=>'<button type="button" class="btn sm'+(o===cur?' pri':'')+'" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>':'')
    +'<label class="l">或自己打（數字或聲調符號都可以，輕聲不用打數字）</label><input id="seg-in" value="'+esc(cur)+'"><div class="dlg-a"><button class="btn" data-x>取消</button><button class="btn pri" data-ok>確定</button></div></div>';
  document.body.appendChild(w);const inp=w.querySelector('#seg-in');inp.focus();inp.select();
  const set=v=>{v=String(v||'').trim();if(v){SEG[si].p[ci]=numToMark(v);}w.remove();segPaint();};
  w.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>set(x.dataset.o));w.querySelector('[data-ok]').onclick=()=>set(inp.value);w.querySelector('[data-x]').onclick=()=>w.remove();
  inp.onkeydown=e=>{if(e.key==='Enter')set(inp.value);};w.onclick=e=>{if(e.target===w)w.remove();};}
function numToMark(s){const T={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};return String(s).toLowerCase().replace(/v/g,'ü').replace(/([a-zü]+)([1-5])/g,(m,y,n)=>{n=+n;if(n===5)return y;let i=y.indexOf('a');if(i<0)i=y.indexOf('e');if(i<0&&y.indexOf('ou')>=0)i=y.indexOf('o');if(i<0){for(let k=y.length-1;k>=0;k--)if('iouü'.indexOf(y[k])>=0){i=k;break;}}return i<0?y:y.slice(0,i)+T[y[i]][n-1]+y.slice(i+1);});}

function stat(s,t){const r=(s.tasks||{})[t.id];if(!r)return '<td class="no">—</td>';

  if(t.kind==='game')return '<td class="ok">玩過 '+(r.times||1)+' 次'+(r.best!=null?'<br><small style="color:var(--mut)">最高 '+r.best+(r.unit||'')+'</small>':'')+'</td>';
  const st=Number(r.stars)||0;return '<td class="'+(st>=(t.min_stars||1)?'ok':'')+'">'+'★'.repeat(Math.min(st,3))+(st?'':'0')+'</td>';}
/* SCRSTU_V1742 Quinn：「班級裡有的人學拼音，有的人學注音，老師可以選擇哪些學生用拼音、哪些用注音」
   設定存在班級（tclasses.scripts：學生編號 → 'py'／'zy'；script_default：新加入的學生預設）。
   學生那邊的拼音練習、拼音遊戲、打地鼠都照這個設定顯示拼音或注音。 */
function scrOf(s){const m=(S.cur&&S.cur.scripts)||{};return m[s.id]||(S.cur&&S.cur.script_default)||'py';}
function studHtml(){if(S.studErr)return '<p class="msg">讀不到學生：'+esc(S.studErr)+'</p>';
  const def=(S.cur&&S.cur.script_default)||'py';
  const top='<h3 style="margin:0 0 12px">學生（'+S.studs.length+' 位）和成績</h3><div class="scrbar"><span>新加入的學生預設用</span><div class="scrseg" data-def="1"><button type="button" data-v="py" class="'+(def==='py'?'on':'')+'">ā 拼音</button><button type="button" data-v="zy" class="'+(def==='zy'?'on':'')+'">ㄅ 注音</button></div>'
    +(S.studs.length?'<span class="grow"></span><button type="button" class="btn sm" data-all="py">全部改成拼音</button><button type="button" class="btn sm" data-all="zy">全部改成注音</button>':'')+'</div>';
  if(!S.studs.length)return top+'<p class="empty">還沒有學生加入。把上面的代碼或連結給學生。</p>';
  const nz=S.studs.filter(s=>scrOf(s)==='zy').length;
  return top+'<p class="scrsum">拼音 '+(S.studs.length-nz)+' 位・注音 '+nz+' 位</p>'
   +'<div class="tbl"><table><thead><tr><th>名字</th><th>用什麼學</th><th>最後上線</th>'+S.tasks.map(t=>'<th title="'+esc(t.title)+'">'+(t.kind==='pinyin'?'ā ':t.kind==='game'?'🎮 ':'字 ')+esc(t.title.length>10?t.title.slice(0,10)+'…':t.title)+'</th>').join('')+'<th></th></tr></thead><tbody>'
   +S.studs.map(s=>{const v=scrOf(s);return '<tr><td><b>'+esc(s.name)+'</b></td><td><div class="scrseg" data-sid="'+esc(s.id)+'"><button type="button" data-v="py" class="'+(v==='py'?'on':'')+'">拼音</button><button type="button" data-v="zy" class="'+(v==='zy'?'on':'')+'">注音</button></div></td><td>'+esc(ago(s.last_at||s.joined_at))+'</td>'+S.tasks.map(t=>stat(s,t)).join('')+'<td><button class="btn sm del" data-rs="'+esc(s.id)+'">移除</button></td></tr>';}).join('')+'</tbody></table></div>';}
async function scrSave(patch,msg){const c=S.cur;if(!c)return;
  try{await db.collection('tclasses').doc(c.id).update(patch);}catch(x){dlg({title:'存不進去',text:String(x&&x.message||x),ok:'知道了',noCancel:1});return}
  if(patch.scripts)c.scripts=patch.scripts;if(patch.script_default)c.script_default=patch.script_default;
  const box=document.getElementById('studbox');if(box)box.innerHTML=studHtml();}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.scrseg button');if(t){const g=t.parentNode,v=t.dataset.v;
    if(g.dataset.def){scrSave({script_default:v});return}
    const m=Object.assign({},(S.cur&&S.cur.scripts)||{});m[g.dataset.sid]=v;scrSave({scripts:m});return}
  const a=e.target.closest&&e.target.closest('[data-all]');if(a){const m={};S.studs.forEach(s=>m[s.id]=a.dataset.all);scrSave({scripts:m,script_default:a.dataset.all});}});
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-rs]');if(!b)return;if(!await dlg({title:'移除這位學生？',text:'他在這個班的紀錄會一起刪掉。',ok:'移除',danger:1}))return;
  try{await db.collection('tstudents').doc(b.dataset.rs).delete();classView(S.cur.id);}catch(x){dlg({title:'移除失敗',text:String(x&&x.message||x),ok:'知道了',noCancel:1})}});

/* ---------- 開機 ---------- */
async function load(){const u=S.user;
  const own=String(u.email||'').toLowerCase()===OWNER;
  let p=null,rerr=null;try{const d=await db.collection('tteachers').doc(u.uid).get();p=d.exists?d.data():null;}catch(e){rerr=e;}
  /* PROFSAFE_V1776 Quinn：「已經註冊的人怎麼辦？」——讀不到（網路或權限問題）時不要當成沒註冊，請他重新整理，避免已經註冊的老師看到「建立老師資料」 */
  if(rerr&&!own){bar();app.innerHTML='<div class="card auth"><div class="logo">美</div><h2>暫時讀不到你的老師資料</h2><p class="sub">可能是網路不穩。請重新整理再試一次；還是不行的話，請聯絡美娟老師。</p><button class="btn pri" onclick="location.reload()">重新整理</button></div>';return;}
  if(!p&&S.pending){try{await mkProfile(S.pending);p={name:S.pending.name,status:'active'};}catch(e){}S.pending=null;}
  S.prof=p||(own?{name:'美娟老師',status:'approved'}:null);
  if(!S.prof)return profileView();
  if(!own&&(S.prof.status==='blocked'||S.prof.status==='rejected'))return waitView(S.prof.status);
  if(p&&!own){db.collection('tteachers').doc(u.uid).update({last_at:now()}).catch(()=>{});}/* TDASH_V1734 後台看得到最後登入 */
  if(u.emailVerified&&p&&!p.email_verified){try{await u.getIdToken(true);await db.collection('tteachers').doc(u.uid).update({email_verified:true});}catch(e){}}
  route();}
function route(){if(!S.user||!S.prof)return;const m=/c=([A-Z0-9]+)/.exec(location.hash||'');if(m)classView(m[1]);else listView();}
window.addEventListener('hashchange',route);
/* REMEMBER_V1777 只有「在老師專區登入、而且勾了記住我」（或這個分頁剛登入）才自動進去；
   在學生頁或別的地方登入的帳號，不會自動變成老師專區的登入 */
function tkOK(u){try{if(S.loginHere){if(S.loginHere==='local')localStorage.setItem('qna_tclass_rem',u.uid);else{localStorage.removeItem('qna_tclass_rem');sessionStorage.setItem('qna_tclass_ses',u.uid);}S.loginHere=null;return true;}
  return localStorage.getItem('qna_tclass_rem')===u.uid||sessionStorage.getItem('qna_tclass_ses')===u.uid;}catch(e){return false}}
auth.onAuthStateChanged(u=>{S.user=u;S.prof=null;if(!u||!tkOK(u)){S.user=null;return authView(/reg/.test(location.search+location.hash)?'reg':'login');}load();});
})();
</script>
<div class="qf-m" id="qf-m" hidden><div class="qf-box" role="dialog" aria-modal="true" aria-labelledby="qf-h">
  <button type="button" class="qf-x" id="qf-x" aria-label="關閉">×</button>
  <h3 id="qf-h">回報問題 <small>Report a problem</small></h3>
  <p class="qf-s">寫下遇到的狀況，美娟老師會看到。Tell us what happened.</p>
  <label>哪一類 <span>Type</span></label>
  <div class="qf-k" id="qf-k"><button type="button" data-k="bug" class="on">網站壞掉 · Bug</button><button type="button" data-k="q">問題 · Question</button><button type="button" data-k="idea">建議 · Idea</button></div>
  <label for="qf-msg">內容 <span>Message</span></label><textarea id="qf-msg" maxlength="2000" placeholder="請寫下遇到的問題，或想跟我們說的話"></textarea>
  <div class="qf-2"><div><label for="qf-nm">你的名字 <span>Name</span></label><input id="qf-nm" maxlength="60"></div><div><label for="qf-em">Email <span>（想收到回覆再填）</span></label><input id="qf-em" type="email" maxlength="100"></div></div>
  <div class="qf-msg" id="qf-note"></div>
  <button type="button" class="qf-go" id="qf-go">送出 · Send</button>
</div></div>
<script>
/* QFOOT_V1728 Quinn：mailto 會跳出「選應用程式」視窗，不好用——Email 改成「複製」，問題回報在網頁裡直接填、直接送（存在 feedback，後台看得到） */
(function(){const $=s=>document.getElementById(s);
  const mail=()=>String((document.getElementById('qf-mail')||{}).textContent||window.TEACHER_EMAIL||'').trim();
  $('qf-cp').onclick=()=>{const t=mail();const ok=()=>{$('qf-cp').textContent='已複製 ✓';setTimeout(()=>{$('qf-cp').textContent='複製'},1600)};
    try{navigator.clipboard.writeText(t).then(ok,()=>{prompt('Email',t)})}catch(e){prompt('Email',t)}};
  let kind='bug';const m=$('qf-m');
  const open=()=>{m.hidden=false;try{$('qf-nm').value=$('qf-nm').value||localStorage.getItem('qna_guest_name')||''}catch(e){}setTimeout(()=>$('qf-msg').focus(),30)};
  const close=()=>{m.hidden=true};
  $('qf-rp').onclick=open;$('qf-x').onclick=close;m.onclick=e=>{if(e.target===m)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!m.hidden)close()});
  $('qf-k').querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;$('qf-k').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
  $('qf-go').onclick=async()=>{const msg=$('qf-msg').value.trim(),note=$('qf-note');note.className='qf-msg';
    if(!msg){note.textContent='請先寫內容 · Please write a message';return}
    $('qf-go').disabled=true;note.textContent='送出中…';
    try{if(!window.firebase||!firebase.firestore)throw new Error('offline');if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      await firebase.firestore().collection('feedback').add({kind,msg:msg.slice(0,2000),name:$('qf-nm').value.trim().slice(0,60),email:$('qf-em').value.trim().slice(0,100),page:(location.pathname+location.search).slice(0,200),at:new Date().toISOString(),ua:String(navigator.userAgent||'').slice(0,200)});
      note.className='qf-msg ok';note.textContent='已送出，謝謝！ · Sent, thank you!';$('qf-msg').value='';setTimeout(close,1400);}
    catch(e){note.textContent='送不出去，請直接寫信給我（上面的 Email） · Failed, please email me.'}
    $('qf-go').disabled=false;};
})();
</script>

document.getElementById('qf-open').onclick=o;document.getElementById('qf-cx').onclick=c;m.onclick=e=>{if(e.target===m)c()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')c()});document.getElementById('qf-rp').addEventListener('click',c,true);})();</script>
