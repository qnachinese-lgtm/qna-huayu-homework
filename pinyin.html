<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拼音練習｜QNA CHINESE</title>
<link rel="icon" href="icon-192.png">
<script>try{if(localStorage.getItem('hyc_theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
/* PINYIN_V1 拼音練習（看字寫拼音）。這一頁的程式全部在這個檔案裡，
   由 db.js 最後面的 PINYIN_LOADER 把入口接到學生端和老師後台。 */
:root{
  --bg:#F4F7FB; --surface:#ffffff; --surface-2:#E8EFF7; --ink:#16202E; --muted:#5B6B80;
  --primary:#1E4C86; --primary-soft:#E4EDF9; --on-primary:#ffffff; --line:#C0CEE0;
  --good:#1E4C86; --bad:#A33227; --star:#9C7D2A;
  --kai:"BiauKai","DFKai-SB","標楷體","Kaiti TC","TW-Kai","STKaiti","LXGW WenKai TC",serif;
  --latin:"Times New Roman",Times,"Liberation Serif",serif;
  /* 介面字體跟學習平台一樣（越南文、英文名字才不會跑掉）；楷體只用在題目的漢字 */
  --ui:Calibri,Carlito,"Be Vietnam Pro","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
/* 顏色跟學習平台（styles.css）一樣；平台的深色模式開著時（hyc_theme=dark）這裡也跟著深色 */
html.dark{
  --bg:#16202E; --surface:#16202E; --surface-2:#1C2838; --ink:#E8EFF7; --muted:#C7D8EF;
  --primary:#1E4C86; --primary-soft:#1C2838; --on-primary:#ffffff; --line:#5B6B80;
  --good:#C7D8EF; --bad:#F0C9C2; --star:#FDE68A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* 在老師後台「派作業」的視窗裡打開（?embed=tasks）：只留出作業那一頁 */
body.embed .top,body.embed #tabs,body.embed #levels,body.embed #cheat{display:none!important}
body.embed .wrap{padding-top:10px}
.allowlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px}
.allowlist label{display:flex;gap:8px;align-items:center;font-size:16px;cursor:pointer}
.allowlist input{width:18px;height:18px;flex:none;margin:0}
.allowlist label{line-height:1.35}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{color:var(--primary);text-decoration:none;font-size:15px}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--latin);letter-spacing:.14em;font-size:12px;color:var(--muted)}
.brand h1{margin:0;font-size:clamp(24px,4.5vw,30px);line-height:1.2}
.who{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px;font-size:15px}
.tab[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.levels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.levels .lab{font-size:14px;color:var(--muted)}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);font-weight:700}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px clamp(16px,4vw,30px) 24px;display:flex;flex-direction:column;gap:14px;min-height:360px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line)}
.dots i.now{border-color:var(--primary)}
.dots i.ok{background:var(--good);border-color:var(--good)}
.dots i.no{background:var(--bad);border-color:var(--bad)}
/* 漢字區固定高度：一個字、三個字、一整句都一樣高，下面的輸入框才不會跳來跳去 */
.hanzi{font-family:var(--kai);height:clamp(84px,16vw,116px);display:flex;align-items:center;justify-content:center;font-size:clamp(52px,11vw,80px);line-height:1;text-align:center;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
.hanzi.long{font-size:clamp(24px,6vw,44px);letter-spacing:.03em}
.lbl{font-size:14px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;font-family:var(--latin);font-size:30px;padding:8px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink)}
.ukey{flex:none;width:56px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-family:var(--latin);font-size:26px}
.fb{min-height:88px;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:16px}
.fb:empty{padding:0}
.fb.ok{background:var(--primary-soft)}
.fb.no{background:var(--surface-2);border:2px dashed var(--bad)}
.fb .head{font-weight:700}
.fb.ok .head{color:var(--good)}
.fb.no .head{color:var(--bad)}
.ans{font-family:var(--latin);font-size:28px;line-height:1.3}
.ans .bad{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:5px}
.acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:auto}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 22px;font-size:16px;text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:700}
.tip{font-size:14px;color:var(--muted);margin:0}
.center{text-align:center}
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.result .big{font-family:var(--latin);font-size:64px;line-height:1;color:var(--primary)}
.result .big small{font-size:28px;color:var(--muted)}
.wronglist{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;text-align:left}
.wronglist div{border:2px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--surface-2);min-width:0}
.wronglist b{font-family:var(--kai);font-size:22px;font-weight:400;display:block}
.wronglist span{font-family:var(--latin);font-size:20px;overflow-wrap:anywhere}
.save{font-size:14px;color:var(--muted)}
.cheat{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:12px 18px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.cheat b{margin-right:4px}
.cheat span{font-family:var(--latin);font-size:19px}
.cheat code{font-family:var(--latin);background:var(--surface-2);border-radius:6px;padding:0 6px;font-size:16px;color:var(--muted)}
.gate{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin:auto}
/* 老師：詞表、成績 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>*{min-width:0}
textarea{width:100%;min-height:300px;font-family:var(--ui);font-size:17px;line-height:1.7;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);color:var(--ink);resize:vertical}
.preview{border:2px solid var(--line);border-radius:14px;padding:8px 12px;max-height:330px;overflow:auto;font-size:15px}
.preview div{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding:3px 0}
.preview div:last-child{border-bottom:none}
.preview .py{font-family:var(--latin);font-size:19px}
.preview .err{color:var(--bad);font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:400;font-size:13px;white-space:nowrap}
td.num{font-family:var(--latin);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{font-size:14px;color:var(--muted)}
/* 遊戲：漢字往下掉 */
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.gtop b{font-family:var(--latin);font-size:24px;color:var(--ink)}
.heart{color:var(--bad);font-size:22px;margin-right:2px}.heart.off{color:var(--line)}
.gcombo{color:var(--primary);font-weight:700;flex:1;text-align:center}
.field{position:relative;height:clamp(300px,52vh,420px);border:2px solid var(--line);border-radius:18px;background:var(--surface-2);overflow:hidden}
.drop{position:absolute;top:0;left:0;font-family:var(--kai);font-size:40px;line-height:1.1;padding:6px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);white-space:nowrap;will-change:transform;display:flex;flex-direction:column;align-items:center}
.drop.long{font-size:26px}
.drop small{font-family:var(--latin);font-size:18px;color:var(--good)}
.drop.hit{border-color:var(--good);background:var(--primary-soft);opacity:0;transition:opacity .5s .2s}
.drop.gone{opacity:0;transition:opacity .4s}
.gstart{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;overflow:auto;background:var(--surface-2);z-index:2}
.gstart>b{font-size:24px}
.gstart .big{font-family:var(--latin);font-size:56px;line-height:1;color:var(--primary)}
.gstart .big small{font-size:22px;color:var(--muted)}
.gmsg{min-height:1.7em;font-size:15px;color:var(--bad)}
.gmsg .py{font-family:var(--latin);font-size:19px}
input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 作業、我的課本、複習 */
.lsel{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:15px;max-width:100%}
.chip.task{border-color:var(--primary);color:var(--primary);font-weight:700}
.taskbar{background:var(--primary-soft);border-radius:12px;padding:6px 12px;font-size:15px;color:var(--ink);margin-bottom:6px}
.tform{display:flex;flex-direction:column;gap:12px}
.tform .lbl{display:block;margin-bottom:4px}
.tform select,.tform input[type=text],.tform input[type=date]{font:inherit;font-size:16px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);max-width:100%}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.tcard .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.twho{font-size:14px;color:var(--muted)}
.done{color:var(--good);font-weight:700}
@media (max-width:640px){.cols{grid-template-columns:1fr}.inrow input{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="back" href="student.html" id="backLink">← 回學習平台</a>
    <div class="brand"><small>QNA CHINESE</small><h1>拼音練習</h1></div>
    <span class="who" id="who">正在登入…</span>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="practice" type="button">練習</button>
    <button class="tab" data-tab="game" type="button">遊戲</button>
    <button class="tab" data-tab="list" data-teacher type="button">老師詞表</button>
    <button class="tab" data-tab="scores" data-teacher type="button">學生成績</button>
    <button class="tab" data-tab="tasks" data-teacher type="button">作業</button>
  </nav>
  <div class="levels" id="levels" hidden></div>
  <section class="stage" id="stage" aria-live="polite"><p class="tip center" style="margin:auto">正在讀取…</p></section>
  <aside class="cheat" id="cheat" hidden>
    <b>聲調怎麼打</b><small>拼音後面打數字，例如</small><span><code>ma3</code> → mǎ</span>
  </aside>
</div>

<script src="pinyin-words.js?v=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script>
(function(){
'use strict';
/* ====== 拼音核心 ====== */
const TONES={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'};
const REV={}; for(const b in TONES){[...TONES[b]].forEach((c,i)=>REV[c]=[b,i+1]);}
const VOW='aeiouü';
const norm=s=>s.normalize('NFC').toLowerCase().replace(/u:/g,'ü').replace(/v/g,'ü');
const SYL=/(zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])?([aeiouü]+)(ng|n|r)?(?![aeiouü])/y;
function segment(p){const out=[];let i=0;while(i<p.length){SYL.lastIndex=i;const m=SYL.exec(p);
  if(m&&m[0].length){out.push([i,i+m[0].length,false]);i+=m[0].length}else{out.push([i,i+1,true]);i++}}return out}
function parsePinyin(str,raw){
  const s=norm(str),syls=[];let chunk=[];
  const flush=d=>{if(!chunk.length)return;const plain=chunk.map(c=>c.ch).join('');const segs=segment(plain);
    segs.forEach(([a,b,junk],k)=>{let t=0;for(let j=a;j<b;j++)if(chunk[j].t)t=chunk[j].t;
      if(!t&&k===segs.length-1&&d!=null)t=d;
      let base=plain.slice(a,b);if(!raw)base=base.replace(/^([jqxy])ü/,'$1u');
      syls.push({base,tone:t||5,junk})});chunk=[]};
  for(const c of s){
    if(REV[c])chunk.push({ch:REV[c][0],t:REV[c][1]});
    else if(/[a-zü]/.test(c))chunk.push({ch:c,t:0});
    else if(/[0-5]/.test(c))flush(c==='0'?5:+c);
    else flush(null);
  }
  flush(null);return syls}
function markIndex(b){if(b.includes('a'))return b.indexOf('a');if(b.includes('e'))return b.indexOf('e');
  if(b.includes('ou'))return b.indexOf('o');for(let i=b.length-1;i>=0;i--)if(VOW.includes(b[i]))return i;return -1}
function markSyl(b,t){if(t===5)return b;const i=markIndex(b);if(i<0)return b;return b.slice(0,i)+TONES[b[i]][t-1]+b.slice(i+1)}
const PUNC={'。':'.','？':'?','！':'!','，':','};
function makeItem(h,p){
  const pp=String(p).split('|');/* 「|」後面是也算對的讀法（八千詞裡標「可讀輕聲」的詞） */
  const words=pp[0].trim().split(/\s+/).map(w=>parsePinyin(w)).filter(w=>w.length);
  const syls=words.flat();
  if(pp[1]){const A=parsePinyin(pp[1]);if(A.length===syls.length)A.forEach((a,i)=>{if(a.base===syls[i].base&&a.tone!==syls[i].tone)syls[i].alt=a.tone})}const sent=/[。？！]$/.test(h);
  return {h,words,syls,sent,bad:syls.some(s=>s.junk)||!syls.length}}
function answerHTML(it,wrong){let k=0;
  const html=it.words.map(w=>w.map((s,j)=>{let t=markSyl(s.base,s.tone);if(j>0&&/^[aoe]/.test(s.base))t="'"+t;
    if(k===0&&it.sent)t=t[0].toUpperCase()+t.slice(1);const c=wrong&&wrong[k]?' class="bad"':'';k++;return `<span${c}>${t}</span>`}).join('')).join(' ');
  return html+(it.sent?(PUNC[it.h.slice(-1)]||''):'')}
const plainAnswer=it=>answerHTML(it).replace(/<[^>]+>/g,'');
function checkTyped(input,it){const st=parsePinyin(input),T=it.syls;
  if(!st.length)return null;
  if(st.length===T.length&&st.every((x,i)=>x.base===T[i].base)){const wrong=T.map((t,i)=>st[i].tone!==t.tone&&st[i].tone!==t.alt);return{ok:!wrong.some(Boolean),kind:'tone',wrong}}
  const wrong=st.length===T.length?T.map((t,i)=>st[i].base!==t.base||(st[i].tone!==t.tone&&st[i].tone!==t.alt)):null;return{ok:false,kind:'spell',wrong}}
function autoConvert(el){let v=el.value,c=el.selectionStart;
  v=v.replace(/v/g,'ü').replace(/V/g,'Ü');
  const left=v.slice(0,c);const m=left.match(/([a-zA-ZüÜāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+)([0-5])$/);
  if(m){const syls=parsePinyin(m[1],true);const last=syls[syls.length-1];
    if(last&&!last.junk){const d=+m[2];last.tone=d===0?5:d;
      const rep=syls.map(s=>markSyl(s.base,s.tone)).join('');const nl=left.slice(0,left.length-m[0].length)+rep;v=nl+v.slice(c);c=nl.length}}
  if(v!==el.value){el.value=v;el.setSelectionRange(c,c)}}
function parseList(text){return String(text||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\S+)\s+(.+)$/);if(!m)return{line:l,err:'少了拼音'};const it=makeItem(m[1],m[2]);return it.bad?{line:l,err:'拼音讀不懂',it}:{line:l,it}})}

/* ====== 內建題庫：華語八千詞（國家華語測驗推動工作委員會），資料在 pinyin-words.js ======
   「一」「不」標變調後的聲調；八千詞標「可讀輕聲」的詞，輕聲和原調都算對。 */
const LV8=[['t1','準備一級'],['t2','準備二級'],['t3','入門級'],['t4','基礎級'],['t5','進階級'],['t6','高階級'],['t7','流利級']];
const ITEMS={};LV8.forEach(([k],i)=>{ITEMS[k]=parseList((window.PY8000||[])[i]||'').filter(r=>!r.err).map(r=>r.it)});
const LEVELS=LV8.concat([['custom','老師的詞表']]);

/* ====== 狀態 ====== */
const $=s=>document.querySelector(s);const stage=$('#stage');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={tab:'practice',level:'t1',queue:[],i:0,res:[],done:false};
const me={uid:null,student:null,teacher:false,rec:null,docId:null};
let CUSTOM_TEXT='',CUSTOM=[],ALLOW=[],TASKS=[],COURSE=[];
try{const l=localStorage.getItem('qna-pinyin-level');if(l)st.level=l}catch(e){}
try{st.lesson=localStorage.getItem('qna-pinyin-lesson')||''}catch(e){}

/* ====== 存成績（results，kind:'pinyin'，lesson_id:'__pinyin__'，一位學生一筆） ====== */
function emptyRec(){return{rounds:[],total_q:0,total_ok:0,wrong:{}}}
async function saveRound(){
  if(!me.student||!me.uid||!window.DB||DB.mode!=='firebase')return;
  const rec=me.rec||emptyRec();
  const ok=st.res.filter(r=>r.ok).length,n=st.res.length;
  rec.rounds.push({at:new Date().toISOString(),level:st.level,n,ok,miss:st.res.filter(r=>!r.ok).map(r=>r.it.h)});
  if(rec.rounds.length>100)rec.rounds=rec.rounds.slice(-100);
  rec.total_q+=n;rec.total_ok+=ok;
  st.res.filter(r=>!r.ok).forEach(r=>{rec.wrong[r.it.h]=(rec.wrong[r.it.h]||0)+1});
  reviewUpdate(rec,st.res,st.level==='review');
  if(String(st.level).indexOf('task:')===0){const tid=st.level.slice(5);rec.tasks=rec.tasks||{};const old=rec.tasks[tid];rec.tasks[tid]={at:new Date().toISOString(),ok:Math.max(ok,(old&&old.ok)||0),n:Math.max(n,(old&&old.n)||0),times:((old&&old.times)||0)+1}}
  me.rec=rec;
  const note=$('#saveNote');if(note)note.textContent='正在儲存成績…';
  try{

/* ====== 錯題複習：答錯的詞記在 rec.review，在「複習錯題」答對兩次才拿掉 ====== */
function reviewItems(){const r=(me.rec&&me.rec.review)||{};return Object.keys(r).map(h=>makeItem(h,String(r[h].p||''))).filter(it=>!it.bad)}
function reviewUpdate(rec,res,isReview){rec.review=rec.review||{};
  res.forEach(x=>{const h=x.it.h;if(!x.ok){rec.review[h]={p:plainAnswer(x.it),n:2}}else if(isReview&&rec.review[h]){rec.review[h].n=(rec.review[h].n||1)-1;if(rec.review[h].n<=0)delete rec.review[h]}})}
/* ====== 我的課本：讀學習平台上指派給我的課，拿生詞來練（生詞有標拼音就用課本的，沒有就查華語八千詞） ====== */
const DICT8={};Object.keys(ITEMS).forEach(k=>ITEMS[k].forEach(it=>{if(!DICT8[it.h])DICT8[it.h]=it}));
function vocabLine(raw){
  let s=String(raw||'').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').trim();if(!s)return null;
  if(/^[-－・·→*]/.test(s)||/^例[:：]/.test(s))return null;
  let py='';const grab=x=>String(x||'').replace(/[\[【]([^\]】]*)[\]】]/g,(m,i)=>{if(/[\u3400-\u9fff]/.test(i))return i;if(!py)py=i.trim();return ''});
  let front;
  if(/[｜|]/.test(s)){const cols=s.split(/\s*[｜|]\s*/);front=grab(cols[0]);cols.slice(1).forEach(grab)}
  else{s=grab(s).replace(/[（(][^（）()]{1,10}[）)]/,' ');const p=s.split(/[=＝]/);front=p.length>1?p[0]:s.trim().split(/[：:\t\s]/)[0]}
  const w=String(front||'').replace(/[^\u3400-\u9fff\uf900-\ufaff]/g,'');
  if(!w||[...w].length>6)return null;return {w,py}}
function lessonItems(l){
  const ds=(Array.isArray(l.dialogues)&&l.dialogues.length)?l.dialogues:[{vocabulary:l.vocabulary||''}];const out=[],seen={};
  ds.forEach(d=>String((d&&d.vocabulary)||'').split('\n').forEach(raw=>{const r=vocabLine(raw);if(!r||seen[r.w])return;let it=null;
    if(r.py){const t=makeItem(r.w,r.py.split(/[\/／]/)[0]);if(!t.bad&&t.syls.length===[...r.w].length)it=t}
    if(!it&&DICT8[r.w])it=DICT8[r.w];
    if(it){seen[r.w]=1;out.push(it)}}));
  return out}
const lesLabel=l=>{const tb=(l.textbook||'').trim(),ti=(l.title||'').trim();return (tb?tb+'・':'')+(ti||(l.order_index?'第'+l.order_index+'課':'課'))};
async function loadCourse(){
  try{const fs=firebase.firestore();
    const sn=me.teacher?await fs.collection('lessons').get():await fs.collection('lessons').where('read_uids','array-contains',me.uid).get();
    COURSE=sn.docs.map(d=>Object.assign({id:d.id},d.data())).filter(l=>l&&!l.kind&&!l.deleted_at)
      .map(l=>({id:l.id,label:lesLabel(l),tb:(l.textbook||'').trim(),order:Number(l.order_index)||0,at:String(l.created_at||''),items:lessonItems(l)}))
      .filter(x=>x.items.length).sort((a,b)=>a.tb.localeCompare(b.tb)||a.order-b.order||a.at.localeCompare(b.at));
  }catch(e){COURSE=[]}}
/* ====== 作業：存在 site/pinyin 的 tasks；學生做完一輪記在自己那一筆的 rec.tasks ====== */
function assignedToMeP(t){if(!t||t.deleted_at||!me.student)return false;const g=Array.isArray(me.student.groups)?me.student.groups:[];
  return (t.assigned_ids||[]).indexOf(me.student.id)>=0||(t.assigned_groups||[]).some(x=>g.indexOf(x)>=0)}
function myTasks(){return TASKS.filter(assignedToMeP)}
function taskDone(t){return (me.rec&&me.rec.tasks&&me.rec.tasks[t.id])||null}

/* ====== 練習畫面 ====== */
function curLesson(){return COURSE.find(x=>x.id===st.lesson)||COURSE[COURSE.length-1]||null}
function taskOf(id){return TASKS.find(t=>t&&t.id===id&&!t.deleted_at)||null}
function taskItems(t){return t?parseList(t.items||'').filter(r=>!r.err).map(r=>r.it):[]}
function pool(){

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function progHTML(){const n=st.queue.length;const tt=String(st.level).indexOf('task:')===0?taskOf(st.level.slice(5)):null;return (tt?'<div class="taskbar">作業：'+esc(tt.title)+(tt.due?'　截止 '+esc(tt.due):'')+'</div>':'')+`<div class="prog"><span>第 ${st.i+1} 題／共 ${n} 題</span><div class="dots">${st.queue.map((_,k)=>`<i class="${k<st.res.length?(st.res[k].ok?'ok':'no'):(k===st.i?'now':'')}"></i>`).join('')}</div></div>`}

/* ====== 遊戲：漢字往下掉，打對拼音就消掉 ====== */
const G={on:false,raf:0,items:[],score:0,hits:0,miss:[],lives:3,combo:0,spawnGap:2600,speedK:1,last:0,lastSpawn:0,pool:[]};
/* PINYIN_GAMES_V1 按「遊戲」先選遊戲（pinyin-games.js）；「漢字往下掉」是其中一種 */
function renderGame(){if(window.PYGAMES)return PYGAMES.render();renderFall()}
function renderFall(){
  stopGame();
  $('#cheat').hidden=false;
  const best=(me.rec&&me.rec.game_best)||0;
  stage.innerHTML='<div class="gtop"><button class="btn" type="button" id="gback" style="padding:4px 12px;font-size:14px">← 換遊戲</button><span id="glives"></span><span class="gcombo" id="gcombo"></span><span>分數 <b id="gscore">0</b></span></div>'
   +'<div class="field" id="gfield"><div class="gstart" id="gstart"><b>漢字往下掉</b><p class="tip">漢字掉到底之前，打出它的拼音和聲調，打對就消掉。<br>掉到底會少一顆愛心，三顆用完遊戲就結束。'+(best?'<br>你的最高分：'+best:'')+'</p><button class="btn primary" id="gbegin" type="button">開始遊戲</button></div></div>'
   +'<div class="gmsg" id="gmsg"></div>'
   +'<div class="inrow"><input id="gin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" disabled><button class="ukey" id="gukey" type="button" aria-label="輸入 ü">ü</button></div>';
  drawLives();
  $('#gbegin').onclick=startGame;
  $('#gback').onclick=()=>{stopGame();if(window.PYGAMES)PYGAMES.home()};
  const inp=$('#gin');
  inp.addEventListener('input',e=>{if(e.isComposing)return;autoConvert(inp);tryHit(false)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();tryHit(true)}});
  $('#gukey').onclick=()=>{const c=inp.selectionStart;inp.value=inp.value.slice(0,c)+'ü'+inp.value.slice(inp.selectionEnd);inp.focus();inp.setSelectionRange(c+1,c+1);tryHit(false)};
}
function drawLives(){const el=$('#glives');if(el)el.innerHTML='<span class="heart">♥</span>'.repeat(Math.max(0,G.lives))+'<span class="heart off">♥</span>'.repeat(3-Math.max(0,G.lives))}
function stopGame(){G.on=false;cancelAnimationFrame(G.raf)}
function startGame(){
  if(!pool().length)return;
  Object.assign(G,{on:true,items:[],score:0,hits:0,miss:[],lives:3,combo:0,spawnGap:2600,speedK:1,last:0,lastSpawn:-1e9,pool:[],hitIts:[]});
  const s=$('#gstart');if(s)s.remove();drawLives();$('#gscore').textContent='0';$('#gcombo').textContent='';$('#gmsg').innerHTML='';
  const inp=$('#gin');inp.disabled=false;inp.value='';inp.focus();
  G.raf=requestAnimationFrame(tick)}
function nextWord(){if(!G.pool.length)G.pool=shuffle(pool());return G.pool.pop()}
function spawn(){
  const f=$('#gfield');if(!f)return;const it=nextWord();
  const el=document.createElement('div');el.className='drop'+(it.h.length>4?' long':'');el.textContent=it.h;f.appendChild(el);
  const W=f.clientWidth,w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.max(6,6+Math.random()*(W-w-12))+'px';
  const dur=(6.5+1.3*it.syls.length)/G.speedK;
  const o={it,el,y:-h,v:(f.clientHeight+h)/dur};el.style.transform='translateY('+o.y+'px)';G.items.push(o)}
function tick(ts){
  if(!G.on)return;
  const f=$('#gfield');if(!f){stopGame();return}
  const dt=G.last?Math.min(0.05,(ts-G.last)/1000):0;G.last=ts;
  if(ts-G.lastSpawn>G.spawnGap||!G.items.length){spawn();G.lastSpawn=ts}
  const H=f.clientHeight;
  for(const o of G.items.slice()){o.y+=o.v*dt;o.el.style.transform='translateY('+o.y+'px)';if(o.y+o.el.offsetHeight>=H)missItem(o)}
  if(G.on)G.raf=requestAnimationFrame(tick)}
function showMsg(html){const m=$('#gmsg');if(!m)return;m.innerHTML=html;clearTimeout(G.msgT);G.msgT=setTimeout(()=>{if(m)m.innerHTML=''},3000)}
function missItem(o){
  G.items=G.items.filter(x=>x!==o);G.combo=0;$('#gcombo').textContent='';G.lives--;drawLives();G.miss.push(o.it);
  showMsg('沒接到：'+esc(o.it.h)+' <span class="py">'+answerHTML(o.it)+'</span>');
  o.el.classList.add('gone');setTimeout(()=>o.el.remove(),450);
  if(G.lives<=0)endGame()}
function tryHit(enter){
  const inp=$('#gin');if(!G.on||!inp)return;const v=inp.value.trim();if(!v)return;
  const c=G.items.filter(o=>{const r=checkTyped(v,o.it);return r&&r.ok}).sort((a,b)=>b.y-a.y)[0];
  if(c){
    G.items=G.items.filter(x=>x!==c);G.hits++;(G.hitIts=G.hitIts||[]).push(c.it);G.combo++;
    G.score+=10*c.it.syls.length+(G.combo>=3?5*Math.min(G.combo,10):0);
    $('#gscore').textContent=G.score;$('#gcombo').textContent=G.combo>=3?('連續答對 '+G.combo+' 個！'):'';
    c.el.innerHTML=esc(c.it.h)+'<small>'+answerHTML(c.it)+'</small>';c.el.classList.add('hit');setTimeout(()=>c.el.remove(),800);
    inp.value='';
    if(G.hits%5===0){G.speedK=Math.min(2.4,G.speedK+0.15);G.spawnGap=Math.max(1100,G.spawnGap-200)}
    return}
  if(enter){G.combo=0;$('#gcombo').textContent='';inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake')}}
function endGame(){
  stopGame();const inp=$('#gin');if(inp){inp.disabled=true;inp.value=''}
  G.items.forEach(o=>o.el.remove());G.items=[];
  const old=(me.rec&&me.rec.game_best)||0,best=Math.max(old,G.score);
  const ms=[...new Map(G.miss.map(i=>[i.h,i])).values()];
  $('#gfield').insertAdjacentHTML('beforeend','<div class="gstart"><b>遊戲結束</b><div class="big">'+G.score+'<small> 分</small></div>'
    +'<p class="tip">打對 '+G.hits+' 個'+(G.score>old&&G.score>0?'，新的最高分！':'，最高分 '+best)+'</p>'
    +(ms.length?'<p class="tip">這幾個再看一次：</p><div class="wronglist">'+ms.map(i=>'<div><b>'+esc(i.h)+'</b><span>'+answerHTML(i)+'</span></div>').join('')+'</div>':'')
    +'<p class="save" id="saveNote"></p><button class="btn primary" id="gagain" type="button">再玩一次</button></div>');
  $('#gagain').onclick=()=>{renderFall();startGame()};
  saveGame()}
async function saveGame(){
  if(!me.student||!me.uid||!window.DB||DB.mode!=='firebase'){const n=$('#saveNote');if(n&&me.teacher)n.textContent='老師帳號試玩，不存成績';return}
  const rec=me.rec||emptyRec();rec.wrong=rec.wrong||{};
  rec.game_best=Math.max(rec.game_best||0,G.score);rec.game_n=(rec.game_n||0)+1;
  G.miss.forEach(i=>{rec.wrong[i.h]=(rec.wrong[i.h]||0)+1});reviewUpdate(rec,G.miss.map(it=>({it,ok:false})).concat((G.hitIts||[]).map(it=>({it,ok:true}))),st.level==='review');me.rec=rec;
  const note=$('#saveNote');if(note)note.textContent='正在儲存成績…';
  try{await DB.upsertResult('__pinyin__',me.student.id,{uid:me.uid,kind:'pinyin',student_name:me.student.name||'',rec:JSON.parse(JSON.stringify(rec)),game_best:rec.game_best,game_n:rec.game_n,last_at:new Date().toISOString()});
    if(note)note.textContent='成績已儲存，老師看得到'}
  catch(e){if(note)note.textContent='成績沒存進去，請檢查網路'}}

/* ====== 老師：拼音作業（存在 site/pinyin 的 tasks；指派方式跟課文一樣：學生或整班） ====== */
let TSTU=null;
async function tStudents(){if(TSTU)return TSTU;const snap=await firebase.firestore().collection('students').get();
  TSTU=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(s=>s&&!s.deleted_at).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh-Hant'));return TSTU}
function taskWho(t,stu){const g=t.assigned_groups||[];return stu.filter(s=>(t.assigned_ids||[]).indexOf(s.id)>=0||(Array.isArray(s.groups)&&s.groups.some(x=>g.indexOf(x)>=0)))}
async function saveTasks(){await firebase.firestore().collection('site').doc('pinyin').set({tasks:TASKS,updated_at:new Date().toISOString()},{merge:true})}
async function renderTasks(){
  $('#cheat').hidden=true;
  stage.innerHTML='<p class="tip center" style="margin:auto">正在讀取…</p>';
  let stu=[],docs=[];
  try{stu=await tStudents();const sn=await firebase.firestore().collection('results').where('kind','==','pinyin').get();docs=sn.docs.map(d=>d.data())}
  catch(e){stage.innerHTML='<p class="tip center" style="margin:auto">讀不到資料：'+esc((e&&e.message)||e)+'</p>';return}
  const recOf={};docs.forEach(d=>{if(d.student_id)recOf[d.student_id]=d.rec||{}});
  const tr=(s,t)=>{const r=recOf[s.id];return r&&r.tasks&&r.tasks[t.id]};
  const live=TASKS.filter(t=>t&&!t.deleted_at).slice().reverse();
  const groups=[...new Set([].concat(...stu.map(s=>Array.isArray(s.groups)?s.groups:[])))].sort();
  const list=live.map(t=>{const who=taskWho(t,stu),done=who.filter(s=>tr(s,t));
    return '<div class="tcard"><div class="row"><b style="flex:1">'+esc(t.title)+'</b><span class="twho">'+(t.due?'截止 '+esc(t.due)+'・':'')+parseList(t.items||'').length+' 個詞</span>'
      +'<span class="'+(done.length===who.length&&who.length?'done':'twho')+'">完成 '+done.length+'／'+who.length+'</span>'
      +'<button class="btn" type="button" data-del="'+esc(t.id)+'">收回</button></div>'
      +'<div class="twho">'+who.map(s=>{const r=tr(s,t);return esc(s.name||'')+(r?' <span class="done">✓ '+r.ok+'/'+r.n+'</span>':'（未完成）')}).join('、')+'</div></div>'}).join('');
  stage.innerHTML='<div class="tform"><b>出一份拼音作業</b>'
   +'<div><label class="lbl" for="tSrc">題目從哪裡來</label><select id="tSrc">'+(COURSE.length?'<option value="course">課本的某一課</option>':'')+LV8.map(([k,n])=>'<option value="'+k+'">華語八千詞・'+n+'（隨機 20 個詞）</option>').join('')+(CUSTOM.length?'<option value="custom">老師的詞表</option>':'')+'</select></div>'
   +(COURSE.length?'<div id="tLesBox"><label class="lbl" for="tLes">哪一課</label><select id="tLes">'+COURSE.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.label)+'（'+x.items.length+' 個詞）</option>').join('')+'</select></div>':'')
   +'<div><label class="lbl" for="tTitle">作業名稱</label><input type="text" id="tTitle" style="width:100%"></div>'
   +'<div><label class="lbl" for="tDue">截止日（可以不填）</label><input type="date" id="tDue"></div>'
   +(groups.length?'<div><span class="lbl">發給整班</span><div class="allowlist">'+groups.map(g=>'<label><input type="checkbox" class="tg" value="'+esc(g)+'">'+esc(g)+'</label>').join('')+'</div></div>':'')
   +'<div><span class="lbl">發給學生</span><div class="allowlist">'+stu.map(s=>'<label><input type="checkbox" class="ts" value="'+esc(s.id)+'">'+esc(s.name||'（沒有名字）')+'</label>').join('')+'</div></div>'
   +'<div class="acts"><span class="save" id="tNote"></span><button class="btn primary" id="tMake" type="button">發出作業</button></div></div>'
   +'<hr style="border:none;border-top:2px solid var(--line);margin:6px 0"><b>已經發出的作業</b><div class="tlist">'+(list||'<p class="tip">還沒有作業。</p>')+'</div>';
  const src=$('#tSrc'),les=$('#tLes'),title=$('#tTitle');
  const autoTitle=()=>{const v=src.value;title.value=v==='course'?('拼音・'+((COURSE.find(x=>x.id===(les&&les.value))||{}).label||'')):v==='custom'?'拼音・老師的詞表':('拼音・華語八千詞'+((LV8.find(x=>x[0]===v)||[])[1]||''))};
  src.onchange=()=>{const b=$('#tLesBox');if(b)b.hidden=src.value!=='course';autoTitle()};if(les)les.onchange=autoTitle;src.onchange();
  $('#tMake').onclick=async()=>{const note=$('#tNote');
    const ids=[...stage.querySelectorAll('.ts:checked')].map(x=>x.value),gs=[...stage.querySelectorAll('.tg:checked')].map(x=>x.value);
    if(!ids.length&&!gs.length){note.textContent='請先勾學生或班級';return}
    let items=[];const v=src.value;
    if(v==='course'){const L=COURSE.find(x=>x.id===(les&&les.value));items=L?L.items:[]}
    else if(v==='custom')items=CUSTOM;else items=shuffle(ITEMS[v]||[]).slice(0,20);
    if(!items.length){note.textContent='這個來源沒有可以練的詞';return}
    const t={id:'pt'+Date.now().toString(36),title:title.value.trim()||'拼音作業',items:items.map(it=>it.h+' '+plainAnswer(it)).join('\n'),due:$('#tDue').value||'',assigned_ids:ids,assigned_groups:gs,created_at:new Date().toISOString()};
    note.textContent='正在發出…';
    try{TASKS.push(t);await saveTasks();renderTasks()}catch(e){TASKS.pop();note.textContent='沒發出去：'+String((e&&e.message)||e)}};
  stage.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='確定收回？';return}
    const t=TASKS.find(x=>x.id===b.dataset.del);if(!t)return;t.deleted_at=new Date().toISOString();
    try{await saveTasks();renderTasks()}catch(e){delete t.deleted_at;b.textContent='沒收回去'}})}

function showTab(t){stopGame();try{if(window.PYGAMES)PYGAMES.stop()}catch(e){}st.tab=t;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));renderLevels();
  if(t==='game')renderGame();else if(t==='list')renderList();else if(t==='allow')renderAllow();else if(t==='tasks')renderTasks();else if(t==='scores')renderScores();else startRound()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* 給 pinyin-games.js 用的介面 */
window.PYAPI={pool:()=>pool(),markSyl,plainAnswer,answerHTML,shuffle,esc,me,st,reviewUpdate,emptyRec,stage:()=>stage,renderFall,stopFall:stopGame};

/* ====== 登入（沿用學習平台的帳號） ====== */
function gate(msg,btn){$('#levels').hidden=true;$('#tabs').hidden=true;$('#cheat').hidden=true;
  stage.innerHTML=`<div class="gate"><p>${msg}</p><a class="btn primary" href="student.html">${btn||'去學習平台登入'}</a></div>`}
async function loadCustom(){try{const d=await firebase.firestore().collection('site').doc('pinyin').get();CUSTOM_TEXT=(d.exists&&d.data().text)||'';ALLOW=(d.exists&&Array.isArray(d.data().allow))?d.data().allow:[];TASKS=(d.exists&&Array.isArray(d.data().tasks))?d.data().tasks:[];CUSTOM=parseList(CUSTOM_TEXT).filter(r=>!r.err).map(r=>r.it)}catch(e){}}
(function boot(){
  if(!window.firebase||!firebase.auth||!window.DB||DB.mode!=='firebase'){gate('連不上學習平台，請稍後再試。');$('#who').textContent='';return}
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){$('#who').textContent='還沒登入';gate('請先用學生帳號登入學習平台，再回到這裡練習。');return}
    me.uid=u.uid;
    const em=String(u.email||'').toLowerCase();
    me.teacher=!!(window.TEACHER_EMAIL&&em===String(window.TEACHER_EMAIL).toLowerCase());
    try{const ss=await DB.listWhere('students','uid',u.uid);me.student=ss.find(x=>x&&!x.deleted_at)||null}catch(e){}
    if(!me.student&&!me.teacher){try{const ms=await DB.listWhere('members','uid',u.uid);const m=(ms||[]).find(x=>x&&!x.deleted_at);if(m)me.student={id:'mem_'+m.id,name:m.name||''}}catch(e){}}
    if(!me.student&&!me.teacher){$('#who').textContent='';gate('這個帳號還不是學生帳號，請用老師給你的學生帳號登入。');return}
    if(me.teacher){$('#backLink').href='teacher.html';$('#backLink').textContent='← 回老師後台'}
    $('#tabs').hidden=false;document.querySelectorAll('.tab[data-teacher]').forEach(b=>b.hidden=!me.teacher);
    $('#who').textContent=me.student?(me.student.name||'已登入'):'老師帳號';
    if(me.student){try{const rs=await DB.listWhere('results','uid',u.uid);const d=rs.find(x=>x&&x.kind==='pinyin'&&x.lesson_id==='__pinyin__');if(d&&d.rec)me.rec=Object.assign(emptyRec(),d.rec)}catch(e){}}
    await loadCustom();
    if(!me.teacher&&!myTasks().length){gate('老師派拼音作業給你之後，這裡就會打開。','回學習平台');return}   /* 開放名單拿掉了：有拼音作業的學生才進得來 */
    await loadCourse();
    try{const q=new URLSearchParams(location.search).get('task');if(q&&taskOf(q))st.level='task:'+q;else if(COURSE.length&&!localStorage.getItem('qna-pinyin-level'))st.level='course'}catch(e){}
    const EMB=new URLSearchParams(location.search).get('embed')==='tasks';if(EMB)document.body.classList.add('embed');
    const hs=(location.hash||'').slice(1);   /* 從老師後台「教材與課程」點進來會帶 #allow／#list／#scores */
    showTab(me.teacher&&EMB?'tasks':(hs==='game'||(me.teacher&&['list','scores','tasks'].indexOf(hs)>=0)?hs:'practice'));
  });
})();
})();
</script>
