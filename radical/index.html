<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>部首上課投影片</title>
<link rel="icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="../config.js"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
/* 固定 16:9 舞台：左＝部首與進度，中＝投影片，右＝老師控制。單一淺藍主題（投影片固定配色） */
:root{
  --bg:#dceafa; --stage:#eef5fd; --paper:#ffffff; --ink:#1f3c66; --muted:#5b6b82; --line:#b9d2ee; --soft:#eaf2fc; --accent:#2b6cb0; --hi:#2b8be0; --bad:#b83232;
  --kai:"DFKai-SB","BiauKai","標楷體","LXGW WenKai TC","Kaiti TC",serif; --lat:"Times New Roman",Times,"Liberation Serif",serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--lat),var(--kai)}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{width:1600px;height:900px;flex:none;background:var(--stage);border-radius:28px;display:grid;grid-template-columns:250px 1fr 200px;gap:18px;padding:20px;box-sizing:border-box;position:absolute;left:50%;top:50%;transform-origin:center center;box-shadow:0 10px 30px rgba(31,60,102,.15)}
.zh{font-family:var(--kai)}
/* 左欄 */
.left{display:flex;flex-direction:column;gap:12px;min-height:0}
.brand{font-size:14px;letter-spacing:.14em;color:var(--accent)}.brand b{display:block;font-family:var(--kai);font-size:26px;color:var(--ink);font-weight:normal;letter-spacing:.1em}
select{font-family:var(--kai);font-size:17px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.rads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rads button{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-family:var(--kai);font-size:20px;padding:0;white-space:nowrap;overflow:hidden}
.rads button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:0;position:relative}
.prog li{display:flex;align-items:center;gap:10px;padding:7px 0;position:relative;cursor:pointer}
.prog li:not(:last-child):before{content:"";position:absolute;left:15px;top:36px;height:calc(100% - 22px);width:3px;background:var(--line)}
.prog i{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;font-style:normal;font-size:15px;flex:none;z-index:1}
.prog span{font-family:var(--kai);font-size:19px;color:var(--muted)}
.prog small{display:block;font-size:12px;color:var(--muted)}
.prog li.done i{background:var(--line);color:var(--ink)}
.prog li.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.prog li.on span{color:var(--ink)}
/* 中間投影片 */
.slide{background:var(--paper);border:3px solid var(--line);border-radius:26px;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:26px 34px}
.sh{display:flex;align-items:baseline;gap:14px;border-bottom:3px solid var(--soft);padding-bottom:10px}
.sh b{font-family:var(--kai);font-weight:normal;font-size:34px}
.sh small{font-size:20px;color:var(--muted)}
.sh .tag{margin-left:auto;font-size:16px;color:var(--accent)}
.body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#ink{position:absolute;inset:0;z-index:5;touch-action:none;pointer-events:none}
#ink.on{pointer-events:auto;cursor:crosshair}
ruby rt{font-family:var(--lat);color:var(--accent)}
.nopy rt{visibility:hidden}
.hide{visibility:hidden}
/* 1 部首 */
.s1{display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:center;width:100%}
.s1 .big{font-family:var(--kai);font-size:330px;line-height:1;text-align:center;background:var(--soft);border-radius:30px;padding:20px 0}
.s1 .nm{font-family:var(--kai);font-size:60px}.s1 .nm rt{font-size:26px}
.s1 .vi{font-size:52px;font-weight:bold;margin:10px 0 16px}
.s1 .nt{font-size:26px;line-height:1.5;color:var(--muted)}
.s1 .nt b{font-family:var(--kai);font-weight:normal;color:var(--ink);font-size:1.2em}.s1 .nt u,.s5 u{text-decoration:none;border-bottom:3px solid var(--hi)}
/* 2 生詞 */
.s2{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;width:100%}
.w{background:var(--soft);border-radius:24px;padding:18px 22px;display:flex;gap:22px;align-items:center}
.w .p{width:150px;height:150px;border-radius:20px;background:var(--paper);display:grid;place-items:center;font-size:84px;overflow:hidden;flex:none}
.w .p img{width:100%;height:100%;object-fit:cover}
.w ruby{font-family:var(--kai);font-size:64px}.w rt{font-size:22px}
.w em{display:block;font-size:26px;color:var(--muted);margin-top:6px}
/* 3 找一找 */
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 40px}
.f{width:200px;border:4px solid var(--line);border-radius:26px;background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;position:relative}
.f rt,.f i{font-style:normal;font-size:24px;color:var(--accent)}
.f b{font-family:var(--kai);font-weight:normal;font-size:130px;line-height:1.05}
.f.ring:after{content:"";position:absolute;inset:38px 14px 4px;border:6px solid var(--hi);border-radius:50%}
.f.no{opacity:.35}
/* 4 寫一寫 */
.s4{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
#hw{width:520px;height:520px;background:var(--soft);border-radius:26px;position:relative}
#hw:before,#hw:after{content:"";position:absolute;background:var(--line)}
#hw:before{left:50%;top:5%;bottom:5%;width:2px}#hw:after{top:50%;left:5%;right:5%;height:2px}
#hw svg{position:relative}
.cnt{font-size:30px}.cnt b{font-size:64px;color:var(--accent)}
.sb{display:flex;flex-direction:column;gap:14px;margin-top:20px}
/* 5 字源 */
.s5{display:grid;grid-template-columns:300px 1fr;gap:40px;align-items:center;width:100%}
.g{background:var(--soft);border-radius:26px;padding:20px;text-align:center}.g img{width:240px;height:240px;object-fit:contain;mix-blend-mode:multiply}
.g small{display:block;font-family:var(--kai);font-size:22px;color:var(--muted)}
.s5 dl{display:grid;grid-template-columns:auto 1fr;gap:16px 22px;font-size:28px;line-height:1.4;margin:0 0 26px}
.s5 dt{color:var(--accent);font-weight:bold}.s5 dd{margin:0}.s5 dd b{font-family:var(--kai);font-weight:normal;font-size:1.2em}
.exs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ex{background:var(--soft);border-radius:20px;text-align:center;padding:10px}.ex ruby{font-family:var(--kai);font-size:76px}.ex rt{font-size:22px}.ex em{display:block;font-size:22px;color:var(--muted)}
/* 6・7 故事 */
.s6{display:grid;grid-template-columns:340px 1fr;gap:34px;align-items:center;width:100%}
.s6 img{width:100%;border-radius:22px}.s6 .emo{font-size:150px;text-align:center;background:var(--soft);border-radius:22px;padding:40px 0}
.st{font-family:var(--kai);font-size:40px;text-align:center;margin:0 0 6px}
.tx{font-family:var(--kai);font-size:42px;line-height:2.25;margin:0}
.tx rt,.st rt{font-size:17px}
.tx.long{font-size:36px;line-height:2.1}
.c{border-radius:50%;cursor:pointer;display:inline-block;line-height:1.1;padding:2px}
.c.sel{box-shadow:0 0 0 4px var(--hi) inset}
.c.ans{background:#dcebfb}
.score{font-size:26px;margin-top:10px;min-height:1.3em}
/* 右欄 */
.right{display:flex;flex-direction:column;gap:12px}
.cb{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.cb span{font-family:var(--kai);font-size:20px}.cb small{font-size:12px;color:var(--muted)}
.cb.pri{background:var(--accent);border-color:var(--accent);color:#fff}.cb.pri small{color:#dcebfb}
.cb.on{background:var(--ink);border-color:var(--ink);color:#fff}.cb.on small{color:#dcebfb}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grp{background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.grp h4{margin:0;font-family:var(--kai);font-weight:normal;font-size:17px;color:var(--muted)}
#clock{font-size:46px;text-align:center;font-variant-numeric:tabular-nums}
#clock.end{color:var(--bad)}
.sw{display:flex;gap:8px;justify-content:center}.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.pos{margin-top:auto;text-align:center;font-size:15px;color:var(--muted)}

[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center}
.gate form{background:#fff;border:3px solid var(--line);border-radius:24px;padding:30px 34px;width:min(380px,90vw);display:flex;flex-direction:column;gap:12px;font-family:var(--kai)}
.gate h1{margin:0;font-weight:normal;font-size:28px}.gate p{margin:0;color:var(--muted)}
.gate input{font:inherit;font-family:var(--lat);font-size:16px;padding:8px 10px;border:2px solid var(--line);border-radius:10px}
.gate button{font-family:var(--kai);font-size:18px;padding:8px;border-radius:10px;border:0;background:var(--accent);color:#fff}
.gate .er{color:var(--bad);font-size:14px;min-height:1em}
.back{font-size:14px;color:var(--accent);text-decoration:none}
</style>

</head><body style="margin:0">
<div class="gate" id="gate"><form id="gForm"><h1>部首投影片</h1><p id="gMsg">確認登入中…</p>
<div id="gF" hidden style="display:flex;flex-direction:column;gap:10px"><input id="gEm" type="email" placeholder="Email" autocomplete="username" required><input id="gPw" type="password" placeholder="密碼" autocomplete="current-password" required><button type="submit">登入</button><div class="er" id="gErr"></div></div></form></div>
<div id="fit"><div id="stage">
  <aside class="left">
    <div class="brand">QNA CHINESE<b>常用部首</b></div>
    <a class="back" href="../slides.html">← 回上課投影片</a>
    <select id="unit" aria-label="單元"></select>
    <div class="rads" id="rads"></div>
    <ol class="prog" id="prog"></ol>
  </aside>
  <main class="slide" id="slide"><div id="content" style="display:contents"></div><canvas id="ink"></canvas></main>
  <aside class="right">
    <div class="row"><button class="cb" id="prev"><span>上一步</span><small>←</small></button><button class="cb pri" id="next"><span>下一步</span><small>→</small></button></div>
    <button class="cb" id="ans"><span>顯示答案</span><small>A</small></button>
    <button class="cb on" id="py"><span>拼音</span><small>P</small></button>
    <div class="grp"><h4>計時</h4><div id="clock">0:00</div>
      <div class="row"><button class="cb" data-t="60"><span>1 分</span></button><button class="cb" data-t="180"><span>3 分</span></button><button class="cb" data-t="300"><span>5 分</span></button><button class="cb" id="tstop"><span>停止</span></button></div></div>
    <div class="grp"><h4>畫筆</h4>
      <div class="row"><button class="cb" data-pen="ball"><span>原子筆</span></button><button class="cb" data-pen="nib"><span>鋼筆</span></button><button class="cb" data-pen="mark"><span>螢光筆</span></button><button class="cb" id="pclear"><span>清除</span></button></div>
      <div class="sw" id="sw"><button style="background:#1f3c66" data-c="#1f3c66" class="on" aria-label="深藍"></button><button style="background:#c53030" data-c="#c53030" aria-label="紅"></button><button style="background:#2b8be0" data-c="#2b8be0" aria-label="藍"></button><button style="background:#7a5af5" data-c="#7a5af5" aria-label="紫"></button></div>
      <button class="cb" id="poff"><span>關閉畫筆</span></button></div>
    <div class="pos" id="pos"></div>
  </aside>
</div></div>

<script src="hanzi-writer.min.js"></script>
<script src="rad-data.js"></script>
<script>
const R = window.RAD, S = window.STROKES, $ = s => document.querySelector(s);
const STEPS = [['部首', 'Bộ thủ'], ['生詞', 'Từ vựng'], ['找一找', 'Tìm bộ thủ'], ['寫一寫', 'Viết'], ['字源', 'Nguồn gốc'], ['讀一讀', 'Đọc'], ['圈一圈', 'Khoanh tròn']];
const units = [...new Set(R.map(r => r.unit))];
let cur = 0, step = 0, ans = false, py = true;
try { cur = +localStorage.getItem('sl-cur') || 0; } catch (e) {}
const ruby = (c, p) => `<ruby>${c}<rt>${p || ''}</rt></ruby>`;
const rr = w => w.map(([c, p]) => ruby(c, p)).join('');

function fit() { const w = document.documentElement.clientWidth || innerWidth, h = document.documentElement.clientHeight || innerHeight; const s = Math.min(w / 1630, h / 930); $('#stage').style.transform = `translate(-50%,-50%) scale(${s})`; sizeInk(); }
addEventListener('resize', fit);
$('#unit').innerHTML = units.map((u, i) => `<option value="${i}">${u}</option>`).join('');
$('#unit').onchange = e => pick(R.findIndex(r => r.unit === units[e.target.value]));
function pick(i) { cur = i; step = 0; try { localStorage.setItem('sl-cur', i); } catch (e) {} draw(); }
function move(d) { const n = step + d; if (n < 0) { if (cur > 0) { cur--; step = STEPS.length - 1; } } else if (n >= STEPS.length) { if (cur < R.length - 1) { cur++; step = 0; } } else step = n; draw(); }
$('#prev').onclick = () => move(-1); $('#next').onclick = () => move(1);
$('#ans').onclick = () => { ans = !ans; $('#ans').classList.toggle('on', ans); body(); };
$('#py').onclick = () => { py = !py; $('#py').classList.toggle('on', py); $('#slide').classList.toggle('nopy', !py); };
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowRight' || e.key === 'PageDown') move(1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') move(-1); if (e.key === 'a') $('#ans').click(); if (e.key === 'p') $('#py').click(); });

function draw() {
  const r = R[cur]; ans = false; $('#ans').classList.remove('on'); clearInk();
  $('#unit').value = units.indexOf(r.unit);
  $('#rads').innerHTML = R.map((x, i) => [x, i]).filter(([x]) => x.unit === r.unit).map(([x, i]) => `<button class="${i === cur ? 'on' : ''}" data-i="${i}" title="${x.no}">${x.label.length > 2 ? x.radical : x.label}</button>`).join('');
  $('#rads').querySelectorAll('button').forEach(b => b.onclick = () => pick(+b.dataset.i));
  $('#prog').innerHTML = STEPS.map(([z, v], k) => `<li class="${k === step ? 'on' : k < step ? 'done' : ''}" data-k="${k}"><i>${k + 1}</i><div><span>${z}</span><small>${v}</small></div></li>`).join('');
  $('#prog').querySelectorAll('li').forEach(li => li.onclick = () => { step = +li.dataset.k; draw(); });
  $('#pos').textContent = `${r.no} · ${step + 1} / ${STEPS.length}`;
  body();
}
let writer;
function body() {
  const r = R[cur], [z, v] = STEPS[step];
  const head = (zz, vv) => `<div class="sh"><b>${zz}</b><small>${vv}</small><span class="tag">${r.no}　<span class="zh" style="font-size:22px">${r.label}</span></span></div>`;
  let h = '';
  if (step === 0) h = `<div class="s1"><div class="big">${r.radical}</div><div><div class="nm">${ruby(r.full, r.py)}${r.label !== r.radical ? `<span style="font-size:34px;color:var(--muted)">　${r.label}</span>` : ''}</div><div class="vi">${r.vi}</div><div class="nt">${r.note}</div></div></div>`;
  if (step === 1) h = `<div class="s2">${r.words.map(w => `<div class="w"><div class="p">${w.img ? `<img src="${w.img}" alt="">` : (w.emo || '')}</div><div><div>${rr(w.w)}</div><em class="${ans ? '' : 'hide'}">${w.vi}</em></div></div>`).join('')}</div>`;
  if (step === 2) h = `<div class="s3">${r.find.map(([c, p, y], i) => `<button class="f${ans ? (y ? ' ring' : ' no') : ''}" data-i="${i}"><i>${p}</i><b>${c}</b></button>`).join('')}</div>`;
  if (step === 3) h = `<div class="s4"><div id="hw"></div><div><div class="cnt"><b>${S[r.radical].strokes.length}</b> 畫 · nét</div><div class="sb">
    <button class="cb pri" id="hplay"><span>看筆順</span><small>Xem</small></button><button class="cb" id="hstep"><span>一筆一筆</span><small>Từng nét</small></button><button class="cb" id="hquiz"><span>學生上台寫</span><small>Tự viết</small></button></div><div class="score" id="hmsg"></div></div></div>`;
  if (step === 4) h = `<div class="s5"><div class="g"><img src="${r.origin.glyph}" alt=""><small>${r.origin.script}　${r.origin.src}</small></div><div><dl>${r.origin.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    <div class="exs">${r.origin.ex.map(([c, p, m]) => `<div class="ex">${ruby(c, p)}<em>${m}</em></div>`).join('')}</div></div></div>`;
  if (step >= 5) { const s = r.story, T = new Set([...s.targets]); const long = s.text.length > 62;
    h = `<div class="s6"><div>${s.img ? `<img src="${s.img}" alt="">` : `<div class="emo">${s.emo || '📖'}</div>`}</div><div><h3 class="st">${rr(s.title)}</h3>
    <p class="tx${long ? ' long' : ''}">${s.text.map(([c, p], i) => p ? `<ruby><span class="c${step === 6 && ans && T.has(c) ? ' sel ans' : ''}" data-i="${i}">${c}</span><rt>${p}</rt></ruby>` : c).join('')}</p>
    ${step === 6 ? `<div class="score">${ans ? `Có <b>${s.text.filter(([c]) => T.has(c)).length}</b> chữ có bộ <b class="zh">${r.label}</b>：<span class="zh">${[...T].join('、')}</span>` : `Khoanh tròn các chữ có bộ <b class="zh">${r.label}</b>.`}</div>` : ''}</div></div>`; }
  $('#content').innerHTML = head(z, v) + `<div class="body">${h}</div>`;
  if (step === 2) document.querySelectorAll('.f').forEach(b => b.onclick = () => b.classList.toggle('ring'));
  if (step === 6) document.querySelectorAll('.c').forEach(e => e.onclick = () => e.classList.toggle('sel'));
  if (step === 3) { writer = HanziWriter.create('hw', r.radical, { width: 520, height: 520, padding: 40, charDataLoader: (c, ok) => ok(S[c]), strokeColor: '#1f3c66', outlineColor: '#cfe1f6', drawingColor: '#2b8be0', highlightColor: '#2b8be0', strokeAnimationSpeed: .8, delayBetweenStrokes: 400, drawingWidth: 26 });
    let k = 0; const n = S[r.radical].strokes.length;
    $('#hplay').onclick = () => { k = 0; writer.hideCharacter(); writer.animateCharacter(); $('#hmsg').textContent = ''; };
    $('#hstep').onclick = () => { if (k === 0 || k >= n) { k = 0; writer.hideCharacter(); } writer.animateStroke(k); k++; $('#hmsg').textContent = `第 ${k} 畫 / ${n}`; };
    $('#hquiz').onclick = () => { k = 0; $('#hmsg').textContent = '請寫第 1 畫'; writer.quiz({ onCorrectStroke: s => $('#hmsg').textContent = s.strokesRemaining ? `對了！請寫第 ${s.strokeNum + 2} 畫` : '', onMistake: s => $('#hmsg').textContent = `第 ${s.strokeNum + 1} 畫再試一次`, onComplete: s => $('#hmsg').textContent = `寫好了！錯 ${s.totalMistakes} 次` }); }; }
}
/* 計時 */
let tleft = 0, tid;
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tleft = +b.dataset.t; clearInterval(tid); tick(); tid = setInterval(() => { tleft--; tick(); if (tleft <= 0) clearInterval(tid); }, 1000); });
$('#tstop').onclick = () => { clearInterval(tid); tleft = 0; tick(); };
function tick() { $('#clock').textContent = `${Math.floor(Math.max(tleft, 0) / 60)}:${String(Math.max(tleft, 0) % 60).padStart(2, '0')}`; $('#clock').classList.toggle('end', tleft <= 0 && !!tid); }
/* 畫筆 */
const cv = $('#ink'), cx = cv.getContext('2d'); let pen = null, color = '#1f3c66', last = null;
function sizeInk() { const s = $('#slide'); const img = cv.width ? cx.getImageData(0, 0, cv.width, cv.height) : null; cv.width = s.clientWidth; cv.height = s.clientHeight; if (img) cx.putImageData(img, 0, 0); }
function clearInk() { cx.clearRect(0, 0, cv.width, cv.height); }
function setPen(p) { pen = p; cv.classList.toggle('on', !!p); document.querySelectorAll('[data-pen]').forEach(b => b.classList.toggle('on', b.dataset.pen === p)); }
document.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => setPen(pen === b.dataset.pen ? null : b.dataset.pen));
$('#poff').onclick = () => setPen(null); $('#pclear').onclick = clearInk;
$('#sw').querySelectorAll('button').forEach(b => b.onclick = () => { color = b.dataset.c; $('#sw').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); if (!pen) setPen('ball'); });
const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height, p: e.pressure || .5, t: e.timeStamp }; };
cv.addEventListener('pointerdown', e => { if (!pen) return; cv.setPointerCapture(e.pointerId); last = pt(e); });
cv.addEventListener('pointermove', e => { if (!pen || !last) return; const p = pt(e); cx.lineCap = 'round'; cx.lineJoin = 'round';
  if (pen === 'mark') { cx.globalAlpha = .28; cx.strokeStyle = '#ffd400'; cx.lineWidth = 26; cx.globalCompositeOperation = 'multiply'; }
  else { cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over'; cx.strokeStyle = color;
    if (pen === 'ball') cx.lineWidth = 4; else { const v = Math.hypot(p.x - last.x, p.y - last.y) / Math.max(1, p.t - last.t); cx.lineWidth = Math.max(2.5, Math.min(11, (e.pointerType === 'pen' ? p.p * 14 : 9 - v * 3))); } }
  cx.beginPath(); cx.moveTo(last.x, last.y); cx.lineTo(p.x, p.y); cx.stroke(); last = p; });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => last = null));
fit(); draw();
</script>
