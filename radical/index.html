<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>部首上課投影片｜QNA CHINESE</title>
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="../config.js"></script>
</head><body>
<style>
/* 版面照 slides.html：上方課名＋工具、步驟列、黃色菱形標題、白色主卡、下方工具列 */
:root{--bg:#E3EDFA;--fg:#1F2A44;--ice:#EEF4FB;--line:#D9E3F1;--muted:#5E6B86;--navy:#1E4C86;--navy-ink:#163a68;--panel:#FFFFFF;--sky:#8FB8E8;--yellow:#F5C842;--err:#C23B3B;
  --zh:"Times New Roman","DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC","KaiTi",serif;--lat:"Times New Roman",Times,serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--zh)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#fit{position:fixed;inset:0;display:grid;place-items:center}
#app{width:1600px;height:900px;box-sizing:border-box;background:var(--panel);border-radius:28px;padding:22px 28px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(30,76,134,.12);user-select:none;-webkit-user-select:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--sky);font-family:var(--lat)}
.bname .num{font-size:14px;color:var(--muted)}
.bname .lname{font-size:24px;font-weight:700;white-space:nowrap}
.bname .lname small{font-weight:400;font-size:17px;color:var(--muted);margin-left:8px}
.tools{display:flex;align-items:center;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:3px;position:relative}
.tools>button{border:0;background:transparent;border-radius:10px;height:38px;min-width:40px;padding:0 9px;display:inline-flex;align-items:center;gap:4px;font-size:14px}
.tools>button:hover,.tools>button[aria-expanded=true]{background:var(--ice)}
.tools>button[aria-pressed=true]{background:var(--navy);color:#fff}
.tools svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:1px;height:22px;background:var(--line);margin:0 3px}
#clock{font-family:var(--lat);font-size:17px;font-variant-numeric:tabular-nums;color:var(--navy);padding:0 8px}
#clock.end{color:var(--err)}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(15,30,60,.16);padding:10px;z-index:40}
#rpick{width:470px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pills button{border:0;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--ice)}
.pills button.on{background:var(--navy);color:#fff}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rgrid button{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;text-align:left}
.rgrid button:hover{background:var(--ice)}
.rgrid button.on{background:var(--navy);color:#fff}
.rgrid b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ice);color:var(--navy);display:grid;place-items:center;font-size:19px;font-weight:400}
.rgrid button.on b{background:#fff}
.rgrid span{font-size:16px}.rgrid small{display:block;font-size:12px;color:var(--muted);font-family:var(--lat)}
.rgrid button.on small{color:#dfe8f6}
#tpop,#ppop{width:230px;display:flex;flex-direction:column;gap:8px}
.pop h4{margin:0;font-size:12px;color:var(--muted);font-weight:700}
.row{display:flex;gap:6px}
.row button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;font-size:14px}
.row button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sw button{flex:none;width:28px;height:28px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--navy)}
.track{background:var(--ice);border-radius:999px;padding:6px 8px}
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none}
.steps li{flex:1 1 0;min-width:0}
.steps button{border:0;background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 10px;border-radius:999px;font-size:16px;color:var(--muted);white-space:nowrap}
.steps button:hover{background:rgba(143,184,232,.25)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--sky);background:#fff;color:var(--navy);font-size:12px;font-weight:700;display:grid;place-items:center;font-family:var(--lat);box-sizing:border-box}
.steps .done button{color:var(--navy)}.steps .done .dot{background:var(--sky);border-color:var(--sky);color:#fff}
.steps .cur button{background:var(--navy);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--navy-ink)}
.steps .cur .dot{background:#fff;border-color:#fff}
.head{text-align:center}
.head h1{margin:2px 0 0;font-size:26px;font-weight:400;color:var(--navy)}
.head h1::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--yellow);margin-right:12px;vertical-align:middle;transform:rotate(45deg)}
.stage{flex:1;min-height:0;border-radius:24px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);position:relative;display:flex;align-items:center;justify-content:center;padding:26px 40px;box-sizing:border-box}
.tag{position:absolute;left:34px;top:26px;background:var(--navy);color:#fff;font-size:14px;padding:2px 9px;border-radius:6px}
#ink{position:absolute;inset:0;z-index:5;touch-action:none;pointer-events:none;border-radius:24px}
#ink.on{pointer-events:auto;cursor:crosshair}
.dock{display:flex;align-items:center;gap:12px;border-top:2px dashed var(--line);padding:12px 2px 0;min-height:56px}
.navb{flex:none;border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:9px 22px;font-size:17px;font-weight:700}
.navb:disabled{background:#fff;border-color:var(--line);color:var(--line);cursor:default}
.ctrl{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:9px 18px;font-size:16px;white-space:nowrap}
.chip:hover{background:var(--ice)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.meta{flex:none;font-size:14px;color:var(--muted);font-family:var(--lat)}
ruby rt{font-family:var(--lat);color:var(--navy);font-style:italic}
.nopy rt{visibility:hidden}
.hide{visibility:hidden}
/* 1 部首 */
.s1{display:flex;align-items:center;gap:80px}
.s1 .big{font-size:400px;line-height:1;color:var(--fg)}
.s1 .info{display:flex;flex-direction:column;gap:14px;max-width:560px}
.s1 .nm{font-size:64px}.s1 .nm rt{font-size:26px}
.s1 .nm small{font-size:30px;color:var(--muted);margin-left:16px}
.s1 .vi{font-family:var(--lat);font-size:44px;color:var(--navy)}
.s1 .nt{font-family:var(--lat);font-size:24px;line-height:1.6;color:var(--muted);border-top:2px dashed var(--line);padding-top:16px}
.nt b,.rows b{font-family:var(--zh);font-weight:400;color:var(--fg);font-size:1.15em}
.nt u,.rows u{text-decoration:none;border-bottom:3px solid var(--sky)}
/* 2 生詞（一張一張） */
.s2{display:flex;align-items:center;gap:70px}
.s2 .pic{width:300px;height:300px;border-radius:26px;background:var(--ice);display:grid;place-items:center;font-size:150px;overflow:hidden}
.s2 .pic img{width:100%;height:100%;object-fit:cover}
.s2 .w{text-align:center}
.s2 .w .zh{font-size:130px;line-height:1.1;letter-spacing:.04em}
.s2 .w .py{font-family:var(--lat);font-style:italic;font-size:40px;color:var(--navy)}
.s2 .w .tr{font-family:var(--lat);font-size:30px;color:var(--muted);margin-top:10px;min-height:1.3em}
/* 3 找一找 */
.s3{display:grid;grid-template-columns:repeat(3,230px);gap:26px 48px}
.f{border:3px solid var(--line);border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;position:relative}
.f i{font-family:var(--lat);font-size:26px;color:var(--navy)}
.f b{font-weight:400;font-size:140px;line-height:1.05}
.f.ring::after{content:"";position:absolute;inset:44px 18px 6px;border:6px solid var(--err);border-radius:50%}
.f.no{opacity:.35}
/* 4 寫一寫 */
.s4{display:flex;align-items:center;gap:60px}
#hw{width:540px;height:540px;background:var(--ice);border-radius:26px;position:relative;touch-action:none}
#hw::before,#hw::after{content:"";position:absolute;background:var(--sky);opacity:.5}
#hw::before{left:50%;top:5%;bottom:5%;width:2px}#hw::after{top:50%;left:5%;right:5%;height:2px}
#hw svg{position:relative}
.cnt{text-align:center}.cnt b{display:block;font-family:var(--lat);font-size:110px;color:var(--navy);line-height:1}.cnt span{font-size:26px;color:var(--muted)}
#hmsg{font-size:26px;color:var(--navy);margin-top:24px;min-height:1.3em;text-align:center}
/* 5 字源 */
.s5{display:flex;align-items:center;gap:56px;width:100%;justify-content:center}
.g{background:var(--ice);border-radius:26px;padding:22px;text-align:center}
.g img{width:250px;height:250px;object-fit:contain;mix-blend-mode:multiply}
.g small{display:block;font-size:20px;color:var(--muted)}
.rows{display:grid;grid-template-columns:auto 1fr;gap:14px 22px;font-family:var(--lat);font-size:27px;line-height:1.45;margin:0 0 24px;max-width:720px}
.rows dt{color:var(--navy);font-weight:700}.rows dd{margin:0}
.exs{display:flex;gap:16px}
.ex{background:var(--ice);border-radius:18px;text-align:center;padding:10px 24px}.ex ruby{font-size:70px}.ex rt{font-size:22px}.ex em{display:block;font-family:var(--lat);font-size:20px;color:var(--muted)}
/* 6・7 故事 */
.s6{display:flex;align-items:center;gap:44px;width:100%}
.s6 .im{flex:none;width:360px}
.s6 img{width:100%;border-radius:22px}
.s6 .emo{font-size:150px;text-align:center;background:var(--ice);border-radius:22px;padding:40px 0}
.s6 .tx-wrap{flex:1;min-width:0}
.st{font-size:40px;text-align:center;margin:0 0 6px;font-weight:400;color:var(--navy)}
.tx{font-size:42px;line-height:2.25;margin:0}
.tx.long{font-size:36px;line-height:2.1}
.tx rt,.st rt{font-size:17px}
.c{border-radius:50%;display:inline-block;line-height:1.1;padding:2px}
.cmode .c{cursor:pointer}
.c.sel{box-shadow:0 0 0 4px var(--err) inset}
.score{font-family:var(--lat);font-size:24px;margin-top:8px;min-height:1.3em;color:var(--navy)}
.score b{font-family:var(--zh)}
</style>

<div id="fit"><div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">Q</span><div class="bname"><div class="num" id="bNum"></div><div class="lname" id="bName"></div></div></div>
    <div class="tools" id="tools">
      <a id="bBtn" href="../slides.html" title="回上課投影片" style="display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-size:14px"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>上課投影片</a><span class="tsep"></span>
      <span id="clock" hidden>0:00</span>
      <button id="rBtn" aria-expanded="false" title="換部首"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>▾</button>
      <button id="tBtn" aria-expanded="false" title="計時"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>▾</button>
      <span class="tsep"></span>
      <button id="pBtn" aria-pressed="false" title="畫筆"><svg viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></button>
      <button id="fBtn" title="全螢幕"><svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button>
      <div class="pop" id="rpick" hidden><div class="pills" id="units"></div><div class="rgrid" id="rgrid"></div></div>
      <div class="pop" id="tpop" hidden><h4>計時</h4><div class="row"><button data-t="60">1 分</button><button data-t="180">3 分</button><button data-t="300">5 分</button></div><div class="row"><button id="tstop">停止</button></div></div>
      <div class="pop" id="ppop" hidden><h4>畫筆</h4><div class="row"><button data-pen="ball" class="on">原子筆</button><button data-pen="nib">鋼筆</button><button data-pen="mark">螢光筆</button></div>
        <div class="row sw" id="sw"><button style="background:#1F2A44" data-c="#1F2A44" class="on" aria-label="深藍"></button><button style="background:#C23B3B" data-c="#C23B3B" aria-label="紅"></button><button style="background:#1E4C86" data-c="#1E4C86" aria-label="藍"></button><button style="background:#7a5af5" data-c="#7a5af5" aria-label="紫"></button></div>
        <div class="row"><button id="pclear">清除</button><button id="poff">關閉畫筆</button></div></div>
    </div>
  </header>
  <div class="track"><ol class="steps" id="steps"></ol></div>
  <div class="head"><h1 id="sTitle"></h1></div>
  <main class="stage" id="stage"><div id="content" style="display:contents"></div><canvas id="ink"></canvas></main>
  <footer class="dock"><button class="navb" id="prev">‹ 上一頁</button><div class="ctrl" id="ctrl"></div><span class="meta" id="meta"></span><button class="navb" id="next">下一頁 ›</button></footer>
</div></div>

<script src="hanzi-writer.min.js"></script>
<script src="rad-data.js"></script>
<script>
const R = window.RAD, S = window.STROKES, $ = s => document.querySelector(s);
const STEPS = [['部首', '認識部首'], ['生詞', '生詞卡'], ['找一找', '找一找：圈出部首'], ['寫一寫', '寫一寫'], ['字源', '字源'], ['讀一讀，圈一圈', '讀一讀，圈一圈']];
const units = [...new Set(R.map(r => r.unit))];
let cur = 0, step = 0, sub = 0, ans = false, py = true, tr = false, ui = 0;
try { cur = +localStorage.getItem('sl-cur') || 0; } catch (e) {}
{ const hi = R.findIndex(r => 'r' + r.no === location.hash.slice(1)); if (hi >= 0) cur = hi; }
const ruby = (c, p) => `<ruby>${c}<rt>${p || ''}</rt></ruby>`;
const rr = w => w.map(([c, p]) => ruby(c, p)).join('');
const lab = r => r.label.length > 2 ? r.radical : r.label;

function fit() { const w = document.documentElement.clientWidth || innerWidth, h = document.documentElement.clientHeight || innerHeight; $('#app').style.zoom = Math.min(w / 1630, h / 930); sizeInk(); }
addEventListener('resize', fit);
/* 換部首選單 */
function pick() { $('#units').innerHTML = units.map((u, i) => `<button data-u="${i}" class="${i === ui ? 'on' : ''}">${u.split('　')[0].replace('單元', '')}</button>`).join('');
  $('#rgrid').innerHTML = R.map((x, i) => [x, i]).filter(([x]) => x.unit === units[ui]).map(([x, i]) => `<button data-i="${i}" class="${i === cur ? 'on' : ''}"><b>${lab(x)}</b><span>${x.label}<small>${x.no}　${x.vi}</small></span></button>`).join(''); }
function popToggle(btn, pop) { const open = pop.hidden; document.querySelectorAll('.pop').forEach(p => p.hidden = true); document.querySelectorAll('.tools>button[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); if (open) { pop.hidden = false; btn.setAttribute('aria-expanded', 'true'); } }
$('#rBtn').onclick = e => { e.stopPropagation(); ui = units.indexOf(R[cur].unit); pick(); popToggle($('#rBtn'), $('#rpick')); };
$('#tBtn').onclick = e => { e.stopPropagation(); popToggle($('#tBtn'), $('#tpop')); };
$('#rpick').onclick = e => { e.stopPropagation(); const u = e.target.closest('[data-u]'), b = e.target.closest('[data-i]'); if (u) { ui = +u.dataset.u; pick(); } if (b) { $('#rpick').hidden = true; go(+b.dataset.i, 0); } };
document.querySelectorAll('.pop').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
document.addEventListener('click', () => { document.querySelectorAll('.pop').forEach(p => p.hidden = true); document.querySelectorAll('.tools>button[aria-expanded]').forEach(b => b.setAttribute('aria-expanded', 'false')); });
$('#fBtn').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };

function go(i, s, k) { cur = i; step = s; sub = k || 0; try { localStorage.setItem('sl-cur', i); } catch (e) {} draw(); }
function move(d) { const r = R[cur];
  if (step === 1 && sub + d >= 0 && sub + d < r.words.length) { sub += d; return draw(true); }
  let s = step + d;
  if (s < 0) { if (cur > 0) go(cur - 1, STEPS.length - 1); return; }
  if (s >= STEPS.length) { if (cur < R.length - 1) go(cur + 1, 0); return; }
  step = s; sub = d < 0 && s === 1 ? r.words.length - 1 : 0; draw(); }
$('#prev').onclick = () => move(-1); $('#next').onclick = () => move(1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'PageDown') move(1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') move(-1); });

function draw(keepAns) {
  const r = R[cur]; if (!keepAns) ans = false; tr = false; clearInk();
  $('#bNum').textContent = `常用部首 · ${r.unit.replace('　', ' ')}`;
  $('#bName').innerHTML = `${r.no}　${r.label} 部<small>${r.py} · ${r.vi}</small>`;
  $('#steps').innerHTML = STEPS.map(([z], k) => `<li class="${k === step ? 'cur' : k < step ? 'done' : ''}"><button data-k="${k}"><span class="dot">${k < step ? '✓' : k + 1}</span>${z}</button></li>`).join('');
  $('#steps').querySelectorAll('button').forEach(b => b.onclick = () => { step = +b.dataset.k; sub = 0; draw(); });
  $('#sTitle').textContent = STEPS[step][1];
  $('#prev').disabled = cur === 0 && step === 0 && sub === 0;
  $('#next').disabled = cur === R.length - 1 && step === STEPS.length - 1;
  $('#meta').textContent = `${step + 1} / ${STEPS.length}`;
  body(); dock();
}
let writer;
function body() {
  const r = R[cur]; let h = '';
  if (step === 0) h = `<div class="s1"><div class="big">${r.radical}</div><div class="info"><div class="nm">${ruby(r.full, r.py)}${r.label !== r.radical ? `<small>${r.label}</small>` : ''}</div><div class="vi">${r.vi}</div><div class="nt">${r.note}</div></div></div>`;
  if (step === 1) { const w = r.words[sub]; h = `<span class="tag">生詞 ${sub + 1}</span><div class="s2"><div class="pic">${w.img ? `<img src="${w.img}" alt="">` : (w.emo || '')}</div><div class="w"><div class="zh">${w.w.map(x => x[0]).join('')}</div><div class="py">${w.w.map(x => x[1]).join(' ')}</div><div class="tr${tr ? '' : ' hide'}">${w.vi}</div></div></div>`; }
  if (step === 2) h = `<div class="s3">${r.find.map(([c, p, y], i) => `<button class="f${ans ? (y ? ' ring' : ' no') : ''}" data-i="${i}"><i>${p}</i><b>${c}</b></button>`).join('')}</div>`;
  if (step === 3) h = `<div class="s4"><div id="hw"></div><div><div class="cnt"><b>${S[r.radical].strokes.length}</b><span>畫 · nét</span></div><div id="hmsg"></div></div></div>`;
  if (step === 4) h = `<div class="s5"><div class="g"><img src="${r.origin.glyph}" alt=""><small>${r.origin.script}　${r.origin.src}</small></div><div><dl class="rows">${r.origin.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl><div class="exs">${r.origin.ex.map(([c, p, m]) => `<div class="ex">${ruby(c, p)}<em>${m}</em></div>`).join('')}</div></div></div>`;
  if (step === 5) { const s = r.story, T = new Set([...s.targets]);
    h = `<div class="s6 cmode"><div class="im">${s.img ? `<img src="${s.img}" alt="">` : `<div class="emo">${s.emo || '📖'}</div>`}</div><div class="tx-wrap"><h3 class="st">${rr(s.title)}</h3>
    <p class="tx${s.text.length > 62 ? ' long' : ''}">${s.text.map(([c, p], i) => p ? `<ruby><span class="c${ans && T.has(c) ? ' sel' : ''}" data-i="${i}">${c}</span><rt>${p}</rt></ruby>` : c).join('')}</p>
    ${1 ? `<div class="score">${ans ? `Có <b>${s.text.filter(([c]) => T.has(c)).length}</b> chữ có bộ <b>${r.label}</b>：<b>${[...T].join('、')}</b>` : `Khoanh tròn các chữ có bộ <b>${r.label}</b>.`}</div>` : ''}</div></div>`; }
  $('#content').innerHTML = h;
  $('#stage').classList.toggle('nopy', !py);
  if (step === 2) document.querySelectorAll('.f').forEach(b => b.onclick = () => b.classList.toggle('ring'));
  if (step === 5) document.querySelectorAll('.c').forEach(e => e.onclick = () => e.classList.toggle('sel'));
  if (step === 3) writer = HanziWriter.create('hw', r.radical, { width: 540, height: 540, padding: 44, charDataLoader: (c, ok) => ok(S[c]), strokeColor: '#1F2A44', outlineColor: '#D9E3F1', drawingColor: '#1E4C86', highlightColor: '#8FB8E8', strokeAnimationSpeed: .8, delayBetweenStrokes: 400, drawingWidth: 28 });
}
function chip(id, z, on) { return `<button class="chip" id="${id}"${on === undefined ? '' : ` aria-pressed="${on}"`}>${z}</button>`; }
function dock() {
  const r = R[cur]; let h = '';
  if (step === 1) h = `<span class="chip" style="cursor:default">${sub + 1} / ${r.words.length}</span>` + chip('cPy', '拼音', py) + chip('cTr', '翻譯', tr);
  if (step === 2 || step === 5) h = chip('cAns', '顯示答案', ans) + chip('cPy', '拼音', py);
  if (step === 3) h = chip('cPlay', '看筆順') + chip('cStep', '一筆一筆') + chip('cQuiz', '學生上台寫');
    $('#ctrl').innerHTML = h;
  const on = (id, f) => { const b = $('#' + id); if (b) b.onclick = f; };
  on('cPy', () => { py = !py; $('#cPy').setAttribute('aria-pressed', py); $('#stage').classList.toggle('nopy', !py); });
  on('cTr', () => { tr = !tr; $('#cTr').setAttribute('aria-pressed', tr); const t = document.querySelector('.s2 .tr'); if (t) t.classList.toggle('hide', !tr); });
  on('cAns', () => { ans = !ans; body(); $('#cAns').setAttribute('aria-pressed', ans); });
  let k = 0; const n = S[r.radical].strokes.length;
  on('cPlay', () => { k = 0; writer.hideCharacter(); writer.animateCharacter(); $('#hmsg').textContent = ''; });
  on('cStep', () => { if (k === 0 || k >= n) { k = 0; writer.hideCharacter(); } writer.animateStroke(k); k++; $('#hmsg').textContent = `第 ${k} 畫 / ${n}`; });
  on('cQuiz', () => { k = 0; $('#hmsg').textContent = '請寫第 1 畫'; writer.quiz({ onCorrectStroke: s => $('#hmsg').textContent = s.strokesRemaining ? `對了！請寫第 ${s.strokeNum + 2} 畫` : '', onMistake: s => $('#hmsg').textContent = `第 ${s.strokeNum + 1} 畫再試一次`, onComplete: s => $('#hmsg').textContent = `寫好了！錯 ${s.totalMistakes} 次` }); });
}
/* 計時 */
let tleft = 0, tid;
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tleft = +b.dataset.t; clearInterval(tid); $('#clock').hidden = false; tick(); tid = setInterval(() => { tleft--; tick(); if (tleft <= 0) clearInterval(tid); }, 1000); $('#tpop').hidden = true; });
$('#tstop').onclick = () => { clearInterval(tid); tid = null; $('#clock').hidden = true; $('#tpop').hidden = true; };
function tick() { const t = Math.max(tleft, 0); $('#clock').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; $('#clock').classList.toggle('end', t <= 0); }
/* 畫筆 */
const cv = $('#ink'), cx = cv.getContext('2d'); let pen = null, penType = 'ball', color = '#1F2A44', last = null;
function sizeInk() { const s = $('#stage'); const img = cv.width ? cx.getImageData(0, 0, cv.width, cv.height) : null; cv.width = s.clientWidth; cv.height = s.clientHeight; if (img) cx.putImageData(img, 0, 0); }
function clearInk() { cx.clearRect(0, 0, cv.width, cv.height); }
function setPen(on) { pen = on ? penType : null; cv.classList.toggle('on', !!pen); $('#pBtn').setAttribute('aria-pressed', !!pen); }
$('#pBtn').onclick = e => { e.stopPropagation(); if (!pen) { setPen(true); popToggle($('#pBtn'), $('#ppop')); } else { setPen(false); $('#ppop').hidden = true; } };
document.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { penType = b.dataset.pen; document.querySelectorAll('[data-pen]').forEach(x => x.classList.toggle('on', x === b)); setPen(true); });
$('#poff').onclick = () => { setPen(false); $('#ppop').hidden = true; }; $('#pclear').onclick = clearInk;
$('#sw').querySelectorAll('button').forEach(b => b.onclick = () => { color = b.dataset.c; $('#sw').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); setPen(true); });
const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height, p: e.pressure || .5, t: e.timeStamp }; };
cv.addEventListener('pointerdown', e => { if (!pen) return; cv.setPointerCapture(e.pointerId); last = pt(e); $('#ppop').hidden = true; });
cv.addEventListener('pointermove', e => { if (!pen || !last) return; const p = pt(e); cx.lineCap = 'round'; cx.lineJoin = 'round';
  if (pen === 'mark') { cx.globalAlpha = .28; cx.strokeStyle = '#F5C842'; cx.lineWidth = 26; cx.globalCompositeOperation = 'multiply'; }
  else { cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over'; cx.strokeStyle = color;
    if (pen === 'ball') cx.lineWidth = 4; else { const v = Math.hypot(p.x - last.x, p.y - last.y) / Math.max(1, p.t - last.t); cx.lineWidth = Math.max(2.5, Math.min(11, (e.pointerType === 'pen' ? p.p * 14 : 9 - v * 3))); } }
  cx.beginPath(); cx.moveTo(last.x, last.y); cx.lineTo(p.x, p.y); cx.stroke(); last = p; });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => last = null));
</script>
