<!doctype html>
<html lang="zh-Hant">
<head>
<!-- JCODE_V1 學生輸入作答代碼進課堂 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>輸入作答代碼｜QNA CHINESE</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{--navy:#1E4C86;--navy-ink:#163a68;--ice:#EEF4FB;--bg:#E3EDFA;--fg:#1F2A44;--muted:#5E6B86;--line:#D9E3F1;--err:#C23B3B;
  --zh:"Times New Roman","DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC","KaiTi",serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--zh);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(30,76,134,.12);padding:36px 28px 30px;width:100%;max-width:420px;text-align:center}
.ic{width:64px;height:64px;border-radius:18px;background:var(--ice);display:grid;place-items:center;margin:0 auto 14px;color:var(--navy)}
h1{font-size:28px;margin:0 0 6px;color:var(--navy);letter-spacing:.06em;font-weight:700}
p.sub{margin:0 0 24px;color:var(--muted);font-size:17px;line-height:1.6}
input{width:100%;font:700 34px/1.2 "Times New Roman",serif;letter-spacing:.32em;text-align:center;text-transform:uppercase;color:var(--navy);
  border:2px solid var(--line);border-radius:16px;padding:14px 8px 14px calc(8px + .32em);outline:none;background:var(--ice)}
input:focus{border-color:var(--navy);background:#fff}
input::placeholder{color:#B5C3D8;letter-spacing:.2em;font-size:24px}
button{margin-top:18px;width:100%;border:0;border-radius:999px;background:var(--navy);color:#fff;font:700 20px var(--zh);letter-spacing:.12em;padding:14px;cursor:pointer}
button:hover{background:var(--navy-ink)}
button:disabled{opacity:.45;cursor:default}
.err{min-height:24px;margin-top:12px;color:var(--err);font-size:16px}
.foot{margin-top:6px;color:var(--muted);font-size:15px}
.foot a{color:var(--navy)}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="ic"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18h3"/></svg></div>
  <h1>輸入作答代碼</h1>
  <p class="sub">請輸入老師投影片上的代碼</p>
  <input id="c" inputmode="latin" autocapitalize="characters" spellcheck="false" maxlength="10" placeholder="例如 4ZYCN9" aria-label="作答代碼" autofocus>
  <button type="submit" id="go" disabled>進入作答</button>
  <div class="err" id="e"></div>
  <div class="foot"><a href="/student.html">回學習平台</a></div>
</form>
<script>
(function(){ const c = document.getElementById("c"), go = document.getElementById("go"), e = document.getElementById("e");
  const norm = v => v.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const m = location.search.match(/[?&](?:code|join)=([A-Z0-9]{4,10})/i); if(m) c.value = norm(m[1]);
  const upd = () => { const v = norm(c.value); if(c.value !== v) c.value = v; go.disabled = v.length < 4; e.textContent = ""; };
  c.addEventListener("input", upd); upd();
  document.getElementById("f").addEventListener("submit", ev => { ev.preventDefault(); const v = norm(c.value);
    if(v.length < 4){ e.textContent = "代碼是 4 到 10 個英文字母或數字"; return; }
    location.href = "/slides.html?join=" + encodeURIComponent(v); });
})();
</script>
</body>
</html>
