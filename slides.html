[hidden]{display:none!important}
body{margin:0}
/* 版面：左側課次＋直式進度｜中間主舞台｜右側老師控制面板 */
:root{
  --navy:#1E4C86; --navy-ink:#163a68; --sky:#8FB8E8; --ice:#EEF4FB;
  --pink:#2F64B0; --mint:#6FA3DD; --yellow:#FFD34E; --lav:#B79CED;
  --bg:#E3EDFA; --panel:#FFFFFF; --fg:#1F2A44; --muted:#5E6B86; --line:#D9E3F1;
  --stage:#FFFFFF; --chip:#FFFFFF; --done:#1E4C86; --blank:#1E4C86; --ansc:#1E4C86; --err:#C23B3B;
  color-scheme:light;
  --zh:"Times New Roman","DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC","KaiTi",serif;
}
html,body{height:100%;overflow:hidden}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--zh);font-synthesis-weight:none;font-size:16px;

.fit{position:relative;flex:none}
.fit .app{position:absolute;left:0;top:0;transform-origin:0 0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{width:1280px;height:720px;display:grid;grid-template-columns:200px minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;
  background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 6px 30px rgba(30,76,134,.10)}
/* 左側 */
.side{grid-row:1/4;display:flex;flex-direction:column;gap:6px;border-right:1px dashed var(--line);padding-right:14px;min-width:0}
.side .k{font-size:13px;color:var(--muted);letter-spacing:.1em}
.side .num{font-size:18px;line-height:1.3;font-weight:700;color:var(--navy)}
.side .lname{font-size:18px;font-weight:700;margin-bottom:6px}
.now{font-size:13px;color:var(--muted)} .now b{display:block;color:var(--fg);font-size:15px}
.steps{list-style:none;margin:auto 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:var(--line)}
.steps.many li button{padding:4px 4px;font-size:15px}
.steps li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 4px;width:100%;font-size:16px;color:var(--muted);position:relative;border-radius:8px}
.steps li button:focus-visible{outline:3px solid var(--sky)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--sky);background:var(--panel);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.steps li.done .dot{background:var(--done);border-color:var(--done)}
.steps li.done .dot::after{content:"✓"}
.steps li.cur button{color:var(--fg);font-weight:700}
.steps li.cur .dot{background:var(--pink);border-color:var(--pink);box-shadow:0 0 0 5px color-mix(in srgb,var(--pink) 25%,transparent)}
/* 標題列 */
.head{grid-column:2/4;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;color:var(--navy);text-wrap:balance}
.head .hint{font-size:13px;color:var(--muted)}
/* 舞台 */
.stage{background:var(--stage);border:2px solid var(--line);border-radius:18px;padding:22px 28px;display:flex;flex-direction:column;min-width:0;min-height:340px;overflow:auto;position:relative}

#stage.tzoom > *{zoom:var(--tz,1)}
.tzbar{display:inline-flex;align-items:center;gap:4px}

.big{font-size:52px;font-weight:700;line-height:1.5}

.wq:hover{background:var(--ice)}
.whint{font-size:14px;color:var(--muted);margin-top:4px}
.wblank{color:var(--navy);font-weight:700;letter-spacing:.1em}
.ogrid{display:grid;gap:16px;margin:auto 0;align-items:start}
.ocard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--ice);border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s}
.ocard:hover:not(:disabled){transform:translateY(-3px);border-color:var(--sky)}
.ocard:focus-visible{outline:3px solid var(--sky)}
.ocard img{max-width:100%;object-fit:contain;border-radius:10px;display:block}
.ocard.ok{border-color:var(--navy);border-width:5px;background:#DCE8F7} .ocard.bad{border-color:var(--err);border-width:5px;background:#FBEAEA}
.ocard.bad img{opacity:.55}
.omark{position:absolute;top:-14px;right:-14px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.omark.ok{background:var(--navy)} .omark.bad{background:var(--err)}
.oresult{font-size:20px;font-weight:700;color:var(--navy)} .oresult.bad{color:var(--err)}

.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-weight:700;font-size:15px}
.fld small{color:var(--muted);font-size:12px;line-height:1.5}
.fld input,.fld textarea{font-family:inherit;font-size:15px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg);width:100%}
.fld textarea{min-height:120px;resize:vertical;line-height:1.5;white-space:pre;overflow:auto}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--sky)}
.trio{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px}
.sheet footer{display:flex;gap:10px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex:none;background:var(--panel);position:relative;z-index:1}
.sheet footer .msg{flex:1;font-size:14px;color:var(--muted)}
.sheet footer .msg.err{color:var(--err)}
.sheet .btn{padding:9px 16px;font-size:15px}
.btn.danger{background:transparent;color:var(--err);border:2px solid var(--err)}
.mini{font-size:13px;padding:4px 10px;border-radius:8px;border:2px solid var(--mint);background:var(--panel);color:var(--fg);align-self:flex-start}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .28s ease-out}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i{transition:none}}

/* LAYOUT_V2 新版面：上方課名＋橫向進度｜中間大舞台｜下方老師工具列 */
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px;padding:16px 22px 14px;overflow:hidden;
  background:var(--panel)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--sky)}
.bname{min-width:0}
.bname .num{font-size:13px;color:var(--muted);font-weight:400;line-height:1.2}
.bname .lname{font-size:20px;font-weight:700;color:var(--fg);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.tools .lpick{width:240px}
.lpPanel{left:auto;right:0}
.tmenu{position:relative}
#tmBtn{font:inherit;font-size:14px;padding:7px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
#tmBtn[aria-expanded=true]{border-color:var(--sky)}
.tmPanel{position:absolute;right:0;top:calc(100% + 6px);width:240px;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,60,.16);padding:10px;z-index:45;display:flex;flex-direction:column;gap:8px}
.tmPanel[hidden]{display:none}
.tmPanel .row{display:flex;gap:6px}
.tmPanel .row button{flex:1;font-size:13px;padding:7px 4px;border-radius:10px;border:2px solid var(--navy);background:var(--panel);color:var(--fg)}
.tmPanel .row button.pri{background:var(--navy);color:#fff}
/* TOPBAR_V1 上面的按鈕收成一組：換課、畫筆、全螢幕是小圖示；老師選單改成一行一個的清單 */
.tools{gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:3px}
.tools .lpick{width:auto}
#lpBtn,#tmBtn,.tools .small{width:auto;border:0!important;background:transparent;border-radius:10px;padding:7px 10px;font-size:14px;color:var(--fg);cursor:pointer;line-height:1.2}
#lpBtn:hover,#tmBtn:hover,.tools .small:hover,#lpBtn[aria-expanded=true],#tmBtn[aria-expanded=true]{background:var(--ice)}
#lpLab{display:none}
.tools .ic{width:38px;height:36px;padding:0;display:grid;place-items:center}
.tools .ic svg{width:20px;height:20px}
.tools #penBtn[aria-pressed=true]{background:var(--navy);color:#fff}
/* TBICON_V1 */
.tools #lpBtn,.tools #tmBtn{display:inline-flex;align-items:center;gap:3px;height:36px;padding:0 8px;font-size:11px}
.tools #lpBtn svg,.tools #tmBtn svg,.livepill svg{width:20px;height:20px;flex:none}
.livepill b{font-weight:700;font-size:15px}
.tools .tsep{width:1px;height:22px;background:var(--line);margin:0 3px}
.livepill{font-size:13px;padding:6px 11px;display:inline-flex;align-items:center;gap:6px;margin-right:2px}
.livepill::before{content:"";width:8px;height:8px;border-radius:50%;background:#7CF29A;box-shadow:0 0 0 3px rgba(124,242,154,.3)}
.tmPanel{width:220px;padding:6px;gap:0}
.tmPanel .row{flex-direction:column;gap:0}
.tmPanel .row button,.tmPanel .row button.pri{all:unset;display:block;box-sizing:border-box;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--fg);background:transparent}
.tmPanel .row button:hover{background:var(--ice)}
#editRow::before,#clsRow::before{font-size:12px;color:var(--muted);font-weight:700;padding:6px 10px 2px}
#editRow::before{content:"課程"} #clsRow::before{content:"上課"}
#clsRow{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.track{background:var(--ice);border-radius:999px;padding:6px 8px}
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.steps::before{display:none}
.steps li{flex:1 1 0;min-width:0}
.steps li button,.steps.many li button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:15px;color:var(--muted);white-space:nowrap}
.steps li button:hover{background:color-mix(in srgb,var(--sky) 25%,transparent)}
.steps .dot{width:22px;height:22px;border:2px solid var(--sky);background:var(--panel);color:var(--navy);font-size:12px;font-weight:700}
.steps li.done .dot::after{content:none}
.steps li.done button{color:var(--navy)}
.steps li.done .dot{background:var(--sky);border-color:var(--sky);color:#fff}
.steps li.cur button{background:var(--navy);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--navy-ink)}
.steps li.cur .dot{background:#fff;border-color:#fff;color:var(--navy);box-shadow:none}
.head{grid-column:auto;align-items:center;padding:0 4px}
.head h1{font-size:24px}
.head h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--yellow);margin-right:10px;vertical-align:middle;transform:rotate(45deg)}
.stage{grid-column:auto;border-radius:22px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.dock{display:flex;align-items:center;gap:12px;border-top:2px dashed var(--line);padding:10px 2px 0;min-height:56px}
.navb{flex:none;border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;white-space:nowrap}
.navb.ghost{background:var(--panel);color:var(--navy)}
.navb:disabled{background:var(--panel);border-color:var(--line);color:var(--line);cursor:default}
.dock .meta{flex:none;font-size:13px}
.ctrl{flex:1;min-width:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
.ctrl h3,.ctrl .note{display:none}
.ctrl .btn{padding:9px 16px;font-size:15px;border-radius:999px;white-space:nowrap}
.ctrl .btn.ghost{background:var(--panel)}
.ctrl .chips{flex-wrap:nowrap}
.ctrl .chip{background:#fff;border:2px solid var(--line);color:var(--navy);padding:9px 16px;font-size:15px}
.ctrl .btn.ghost{border:2px solid var(--line);background:#fff;color:var(--navy);font-weight:400;border-radius:999px;padding:9px 18px;font-size:15px}
.ctrl .btn.ghost:hover{background:var(--ice)}
.tgrp.mix:empty{display:none}
.ctrl .chip[aria-pressed=true]{background:var(--navy);color:#fff}
.ctrl .meta{text-align:left}
.wpick{position:relative}
.wlb{font-variant-numeric:tabular-nums;min-width:96px}
.ctrl .wlist{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);width:440px;max-height:300px;grid-template-columns:repeat(4,minmax(0,1fr));overflow-y:auto;padding:8px;box-shadow:0 10px 28px rgba(15,30,60,.18);z-index:30}
.ctrl .wlist[hidden]{display:none}
.ctrl .gap{flex:0 0 6px}
/* DOCKC_V1 工具按鈕置中，上一頁、下一頁在兩邊 */
.dock .ctrl{justify-content:center}
.ctrl .glist{position:absolute;left:0;bottom:calc(100% + 12px);width:380px;max-height:320px;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,60,.18);padding:6px;z-index:30;display:flex;flex-direction:column;gap:2px}
.ctrl .glist[hidden]{display:none}
.glist button{all:unset;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:16px;cursor:pointer;color:var(--fg)}
.glist button b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ice);color:var(--navy);display:grid;place-items:center;font-size:13px}
.glist button:hover{background:var(--ice)}
.glist button[aria-pressed=true]{background:var(--navy);color:#fff}
.glist button[aria-pressed=true] b{background:#fff}
/* DOCK_V2 下方工具列統一成同一種白色膠囊 */
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:7px 16px;font-size:15px;color:var(--navy);white-space:nowrap;border-radius:999px}
.seg button:hover{background:var(--ice)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.head .hint{display:none}
/* HCENTER_V1 頁面標題置中 */
.head{justify-content:center}
.head h1{text-align:center}
.ctrl .timer svg{width:40px;height:40px}
/* LIVEANS_V1 學生作答 */
.sans{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-2px 0 4px 50px}
.sans:not(.open){justify-content:flex-end;align-items:flex-end;height:0;margin:0 12px 0 50px;position:relative;z-index:2;transform:translateY(-40px)}
#stage .gq[data-gq],#stage .qa[data-qa],#stage li[data-wq]{position:relative}
#stage .hasq{padding-right:150px!important}
.sopen{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--navy);padding:3px 4px 3px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}
.sopen.on{padding:3px 12px;color:var(--muted)}
.sopen .nb{min-width:22px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--navy);color:#fff;font-size:13px;display:inline-grid;place-items:center;font-family:"Times New Roman",serif}
#stage .sopen.inq{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:2}
#stage .sopen.inq.add{width:28px;height:28px;padding:0;justify-content:center;color:var(--muted);opacity:.6}
#stage .sopen.inq.add:hover{opacity:1;color:var(--navy)}
.sans.open .schip{font-size:max(18px,calc(22px*var(--gs,1)));padding:5px 12px}
.sans.open .schip b{font-size:15px}
.schip{display:inline-flex;align-items:baseline;gap:6px;background:#fff;border:2px solid var(--sky);border-radius:12px;padding:3px 10px;font-size:calc(20px*var(--gs,1));line-height:1.4;color:var(--fg)}
.schip b{font-size:14px;color:var(--navy)}
.schip.hw{border-style:dashed}
.schip.hw i{font-style:normal;font-size:12px;color:#fff;background:var(--muted);border-radius:6px;padding:0 5px}
.schip .x{all:unset;cursor:pointer;color:var(--muted);font-size:13px;padding:0 2px}
.schip .x:hover{color:var(--err)}
/* LOTHUMB_V1 看圖排序學生答案直接用小圖顯示 */
.lothumbs{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
.lothumbs figure{margin:0;width:78px;border:3px solid var(--navy);border-radius:10px;overflow:hidden;background:#fff}
.lothumbs figure.bad{border-color:var(--err)}
.lothumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.lothumbs figcaption{font-size:12px;text-align:center;padding:2px 0;color:var(--navy);white-space:nowrap}
.lothumbs figure.bad figcaption{color:var(--err)}
.lothumbs .loscore{margin-left:6px;font-size:18px;color:var(--navy)}
/* SCHIP_V2 名字和「作業」標籤不換行，答案自己換行，對齊第一行 */
.schip{max-width:100%;box-sizing:border-box}
.schip i,.schip b,.schip .x{white-space:nowrap;flex:none}
.schip .sx{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.sadd{all:unset;cursor:pointer;font-size:14px;color:var(--navy);border:2px dashed var(--sky);border-radius:12px;padding:3px 10px}
.sform{display:inline-flex;gap:6px;align-items:center}
.sform input{font:inherit;font-size:16px;padding:4px 8px;border:2px solid var(--sky);border-radius:8px;background:#fff;color:var(--fg)}
.sform .nm{width:90px} .sform .tx{width:340px}
.sform button{font:inherit;font-size:14px;padding:5px 12px;border-radius:8px;border:none;background:var(--navy);color:#fff;cursor:pointer}
.scls{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;line-height:18px;vertical-align:1px}
.wmark{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;white-space:nowrap;font-family:"Times New Roman",var(--zh);font-size:72px;font-weight:700;letter-spacing:.08em;color:var(--navy);opacity:.06}
.wmark[hidden]{display:none}
.clschip{font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--navy);cursor:pointer}
.cpcard{background:#fff;border-radius:24px;padding:34px 38px;box-shadow:0 24px 60px rgba(30,76,134,.18);width:min(520px,100%);box-sizing:border-box}
.cpcard h2{margin:0 0 20px;font-size:26px;color:var(--navy);text-align:center}
.cpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cpgrid button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:16px 10px;border-radius:14px;background:var(--ice);color:var(--navy);font-size:20px;border:2px solid transparent}
.cpgrid button:hover{border-color:var(--sky)}
.cpgrid button.on{background:var(--navy);color:#fff}
.livepill{font:inherit;font-size:14px;padding:7px 12px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
.livebox{position:fixed;inset:0;background:rgba(20,40,80,.35);display:grid;place-items:center;z-index:80}
.livebox[hidden]{display:none}
.livecard{position:relative;background:#fff;border-radius:24px;padding:28px 32px 26px;width:min(600px,92vw);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:18px;color:var(--fg);font-family:var(--zh);box-shadow:0 18px 50px rgba(20,50,100,.25)}
.livecard.wide{width:min(760px,94vw)}
.livecard.wide.lo{width:min(1180px,96vw)}
.livecard.lo td:last-child{min-width:220px}
.livecard .lx{all:unset;position:absolute;top:16px;right:18px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.livecard .lx:hover{background:var(--ice);color:var(--navy)}
.livecard .lhead{display:flex;align-items:center;gap:14px}
.livecard .lico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--ice);display:grid;place-items:center}
.livecard .lico svg{width:28px;height:28px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.livecard h2{margin:0;font-size:26px;color:var(--navy);font-weight:700}
.livecard .sub{font-size:15px;color:var(--muted);margin-top:2px}
.livecard .lsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.livecard .lsteps li{display:flex;align-items:center;gap:14px;background:var(--ice);border-radius:14px;padding:12px 16px;font-size:18px}
.livecard .lsteps b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:15px}
.livecard .lbtn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-size:18px;padding:12px 22px;border-radius:999px;background:var(--navy);color:#fff}
.livecard .lbtn:hover{background:var(--navy-ink)}
.livecard .lbtn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);padding:10px 20px}
.livecard .lbtn.ghost:hover{border-color:var(--sky)}
.livecard .lbtn.warn{background:#fff;color:var(--err);border:2px solid #F0CACA;padding:10px 20px}
.livecard .lbtn.full{width:100%}
.livecard .lfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.livecard .msg{font-size:15px;color:var(--muted)}
.livecard .msg:empty{display:none}
.livecard .msg.err{color:var(--err);background:#FBEDED;border-radius:12px;padding:10px 14px}
.livecard .lgrid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.livecard .qr{width:230px;height:230px;border:2px solid var(--line);border-radius:18px;display:grid;place-items:center;background:#fff}
.livecard .qr svg{width:210px;height:210px}
.livecard .lcode{font-size:14px;color:var(--muted)}
.livecard .code{font-size:52px;letter-spacing:.14em;color:var(--navy);font-weight:700;line-height:1.1;margin:2px 0 10px;font-family:"Times New Roman",serif}
.livecard .lhint{font-size:15px;color:var(--muted);margin:-4px 0 12px;line-height:1.5}
.livecard .lhint b{color:var(--navy);font-weight:700}
.livecard .lnk{font-size:14px;word-break:break-all;background:var(--ice);border-radius:12px;padding:10px 12px;color:var(--fg);margin-bottom:12px}
.livecard .lcount{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--navy);background:var(--ice);border-radius:999px;padding:6px 14px}
.livecard .lcount i{width:8px;height:8px;border-radius:50%;background:var(--navy);display:inline-block;animation:lpulse 1.6s infinite}
@keyframes lpulse{50%{opacity:.25}}
.livecard table{border-collapse:collapse;width:100%;font-size:18px}
.livecard th,.livecard td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.livecard th{font-size:14px;color:var(--muted);font-weight:400}
.livecard td.ok{color:var(--navy);font-weight:700} .livecard td.bad{color:var(--err)}
@media (max-width:640px){.livecard .lgrid{grid-template-columns:1fr;justify-items:center;text-align:center}}
.joinmode #fit{display:none}
html.joinmode,.joinmode body{height:auto;overflow:auto}
.joinmode body{display:block;min-height:100vh;padding:0;width:auto}
#joinApp{width:100%;max-width:640px;margin:0 auto;padding:16px;box-sizing:border-box;font-family:var(--zh);color:var(--fg)}
#joinApp .jh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
#joinApp .jh .logo{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
#joinApp .jh b{font-size:20px;color:var(--navy)}
#joinApp .jh .jwho{margin-left:auto;white-space:nowrap;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
#joinApp .jh .jwho button{all:unset;cursor:pointer;text-decoration:underline;margin-left:6px}
#joinApp .jcard{background:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
#joinApp h2{margin:0;font-size:20px;color:var(--navy)}
#joinApp .instr{font-size:16px;color:var(--muted)}
#joinApp .opts{border:2px dashed var(--sky);border-radius:12px;padding:8px 12px;font-size:17px;line-height:1.7}
#joinApp .lines{font-size:18px;line-height:1.8;background:var(--ice);border-radius:12px;padding:8px 12px}
#joinApp .item{display:flex;flex-direction:row;gap:12px;align-items:flex-start;background:var(--ice);border-radius:14px;padding:14px 16px}
#joinApp .item .no{font-style:normal;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;font-family:"Times New Roman",serif;margin-top:3px}
#joinApp .qb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#joinApp .dl{display:flex;gap:8px;font-size:18px;line-height:1.9}
#joinApp .dl b{flex:none;color:var(--navy);font-family:"Times New Roman",serif;font-weight:700;width:18px}
#joinApp .dl span{flex:1;min-width:0}
#joinApp .jh .jwho{flex:none}
#joinApp input.bl{width:7em;max-width:100%;border:none;border-bottom:2px solid var(--navy);border-radius:0;background:transparent;padding:0 4px;font-size:18px;color:var(--navy);text-align:center;vertical-align:baseline}
#joinApp input.bl:focus{outline:none;background:#fff}
#joinApp .jpick{display:flex;gap:8px;margin-top:6px}

/* 抽卡 */
function pool(){ return LESSON.cards.filter(c => filter==="全部" || c[0]===filter) }
function shuffle(){ deck = pool().slice().sort(()=>Math.random()-.5); drawn = 0; cur = null; }

}
function renderDraw(){

    <button class="btn pink" data-a="timer" ${cur?'':'disabled'}>${timerId?'停止計時':'計時 20 秒'}</button>
    <div class="timer" id="timerBox" ${timerId?'':'hidden'}>
      <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--ice)" stroke-width="4"/>
      <circle id="ring" cx="18" cy="18" r="15" fill="none" stroke="var(--pink)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="0" transform="rotate(-90 18 18)"/></svg>

function updRing(){ const r = document.getElementById("ring"); if(r) r.setAttribute("stroke-dashoffset", 94.2*(1-left/20)); const t=document.getElementById("tLeft"); if(t) t.textContent=left; }

/* 事件 */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.i) return go(+b.dataset.i);

  if(b.dataset.oi !== undefined && $("#modal").hidden){ const i = +b.dataset.oi, p = oPick.indexOf(i); if(p >= 0) oPick.splice(p, 1); else oPick.push(i); oCheck = false; return oTap(); }

  if(b.dataset.dw !== undefined){ const w = b.dataset.dw, ds = DICT(LESSON), dW = dWords(LESSON), sel = dPicked(LESSON, ds, dW); sel.has(w) ? sel.delete(w) : sel.add(w); dSave(LESSON, sel); return render(); }
  if(b.dataset.db !== undefined){ const id = +b.dataset.db; dRev[id] = !dRev[id]; return render(); }
  if(b.dataset.rate){ aRate = +b.dataset.rate; if(AUD) AUD.playbackRate = aRate; return render(); }
  if(b.dataset.g && $("#modal").hidden){ gi = +b.dataset.g; gp = 0; gShow = false; gRev = {}; return render(); }
  if(b.dataset.gp !== undefined && $("#modal").hidden){ gp = +b.dataset.gp; gShow = false; gRev = {}; return render(); }
  if(b.dataset.gq !== undefined && $("#modal").hidden){ const i = +b.dataset.gq; gRev[i] = !gRev[i]; return render(); }
  if(b.dataset.f){ filter = b.dataset.f; stopTimer(); shuffle(); return renderDraw(); }
  if(b.dataset.t){ if(b.dataset.t==="py") showPy=!showPy; else showTr=!showTr; return STEPS[step].key==="draw"?renderDraw():render(); }
  const a = b.dataset.a;
  if(a==="next") go(step+1);
  if(a==="restart") go(0);
  if(a==="dmode0" || a==="dmode1"){ dPickMode = a==="dmode1"; dShow = false; dRev = {}; return render(); }
  if(a==="dall"){ dSave(LESSON, new Set(dWords(LESSON))); return render(); }
  if(a==="dnone"){ dSave(LESSON, new Set()); return render(); }
  if(a==="wcover"){ wCover = true; wOpen = -1; return render(); }
  if(a==="wshow"){ wCover = false; wOpen = -1; return render(); }
  if(a==="wopen"){ wOpen = wi; return render(); }
  if(a==="oshuf"){ oPerm = null; oPick = []; oCheck = false; return render(); }
  if(a==="oclear"){ oPick = []; oCheck = false; return render(); }
  if(a==="ocheck"){ oCheck = !oCheck; return render(); }
  if(a==="ostory"){ oStory = !oStory; return render(); }
  if(a==="wprev"){ const n = Math.max(1,WG(LESSON).length); wi = (wi-1+n)%n; render(); }
  if(a==="wnext"){ wi = (wi+1)%Math.max(1,WG(LESSON).length); render(); }
  if(a==="wrand"){ wi = Math.floor(Math.random()*WG(LESSON).length); render(); }
  if(a==="lnext"){ const DL = (STEPS[step]||{}).key==="text2" ? (LESSON.dialog2||[]) : LESSON.dialog; li = (li+1)%Math.max(1, DL.length); render(); }
  if(a==="lall"){ li = -1; render(); }

  if(a==="aback" && AUD){ AUD.currentTime = Math.max(0, AUD.currentTime - 5); }
  if(a==="arestart" && AUD){ AUD.currentTime = 0; AUD.play().catch(()=>{}); }
  if(a==="dshow"){ dShow = !dShow; dRev = {}; render(); }
  if(a==="rnext"){ const n = ((LESSON.read||{}).paras||[]).length; if(n){ ri = (ri+1) % n; render(); } }
  if(a==="rall"){ ri = -2; render(); }
  if(a==="qnext"){ const n = (LESSON[STEPS[step].key==="qa2"?"qa2":"qa"]||[]).length; if(n){ qi = (qi+1) % n; render(); } }
  if(a==="qall"){ qi = -1; render(); }
  if(a==="qshow"){ qShow = !qShow; qRev = {}; render(); }
  if(a==="tnext" || a==="tprev"){ const n = (LESSON.textImgs||[]).length; if(n){ ti = (ti + (a==="tnext"?1:n-1)) % n; render(); } }

  if(a==="gnext"){ if(!gStep(1)){ gi = gIds(LESSON, STEPS[step].key)[0] || 0; gp = 0; } render(); }
  if(a==="gshow"){ gShow = !gShow; gRev = {}; render(); }
  if(a==="draw") draw();
  if(a==="ans"){ showAns=!showAns; renderDraw(); }
  if(a==="timer"){ timerId ? (stopTimer(), renderDraw()) : startTimer(); }
});
/* ONENAV_V1 只有一組上一頁／下一頁：先換步驟裡的生詞、句子、段落、語法頁，換完才到下一步 */
function advance(d){ const k = STEPS[step].key;
  if(k==="words" || k==="words2"){ const n = WG(LESSON).length; if(d>0 && wCover && wOpen !== wi){ wOpen = wi; return render(); } if(d>0 && wi<n-1){ wi++; return render(); } if(d<0 && wi>0){ wi--; return render(); } }
  if(k==="text" || k==="text2"){ const n = (k==="text2" ? (LESSON.dialog2||[]) : LESSON.dialog).length; if(d>0 && li<n-1){ li++; return render(); } if(d<0 && li>0){ li--; return render(); } }
  if(k==="read"){ const n = isClL() ? clGroups((LESSON.read||{}).paras||[]).length : ((LESSON.read||{}).paras||[]).length; if(d>0 && ri<n-1){ ri++; return render(); } if(d<0 && ri>0){ ri--; return render(); } }
  if(k==="qa" || k==="qa2"){ const n = (LESSON[k]||[]).length; if(d>0 && qi<n-1){ qi++; return render(); } if(d<0 && qi>0){ qi--; return render(); } }
  /* GREVEAL_V1 語法練習：按下一頁先一題一題顯示答案，全部顯示完才換頁；上一頁先一題一題收回 */

    if(d > 0){ const nx = idx.find(i => !gRev[i]); if(nx != null){ gRev[nx] = true; return render(); } }
    else { const sh = idx.filter(i => gRev[i]); if(sh.length){ gRev[sh[sh.length-1]] = false; return render(); } } }
  if(isGK(k) && gStep(d)) return render();
  go(step+d); }

function fit(){

  const w=document.body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=document.body.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const k=Math.max(.1,Math.min(w/1280,h/720));
  const f=$("#fit"); f.style.width=1280*k+"px"; f.style.height=720*k+"px";

  e.preventDefault();

    rows(txt).forEach((line,k)=>{ const parts=line.split(/\s*[\t｜|]\s*/); const row = g.gex[r0+k] || (g.gex[r0+k]=blank(2)); parts.forEach((v,j)=>{ if(c0+j<2) row[c0+j]=v; }); });

  const isNew = !editingId || editingId==="sample";
  const id = isNew ? ED._id : editingId;
  const body = { ...d, num: Number(d.num)||0, updatedAt: Date.now() };
  { const prev = lessons.find(x=>x.id===id); if(prev && prev.readAudio && prev.readAudio.url) body.readAudio = {url: prev.readAudio.url, name: prev.readAudio.name||""}; }

/* TZOOM_V1 對話、短文頁：A− A＋ 放大縮小（記在這台電腦） */
var TZ; try { TZ = +localStorage.getItem("slides-tz") || 1; } catch(e){ TZ = 1; }
function tzApply(){ const k = STEPS[step] && STEPS[step].key, on = ["text","text2","read"].includes(k), st = $("#stage"); if(!st) return; st.classList.toggle("tzoom", on && TZ !== 1); st.style.setProperty("--tz", TZ);
  const ct = $("#ctrl"); if(!on || !ct || ct.querySelector(".tzbar")) return; const b = document.createElement("span"); b.className = "tzbar";
  b.innerHTML = `<button type="button" class="btn ghost" data-tz="-1" title="字變小" aria-label="字變小">A−</button><span class="tzv">${Math.round(TZ*100)}%</span><button type="button" class="btn ghost" data-tz="1" title="字變大" aria-label="字變大">A＋</button>`;
  const gap = ct.querySelector(".gap"); gap ? ct.insertBefore(b, gap) : ct.appendChild(b); }

/* 學生端：slides.html?join=代碼 */
/* JOINAUTH_V1 學生用學習平台的帳號登入再作答；答案會自動存進他自己的練習題 */
(function joinApp(){ const m = location.search.match(/[?&]join=([A-Z0-9]{4,10})/i); if(!m) return;
  const code = m[1].toUpperCase(), fs = liveDb(); const root = document.createElement("div"); root.id = "joinApp"; document.body.appendChild(root);
  const jg = document.createElement("div"); jg.className = "gate"; jg.hidden = true; document.body.appendChild(jg);
  let me = null, cur = null, state = "load", auth = "wait", lerr = "";
  /* JNAV_V1 學生可以回到前面出過的題目；老師換題時，正在寫的不會被切走 */
  let live = null, Q = {}, ORD = [], view = null, lastLive = null, sig = "";
  const dk = k => "join-" + code + "-" + k; const draft = k => { try { return JSON.parse(localStorage.getItem(dk(k)) || "{}"); } catch(e){ return {}; } };
  const sentOf = k => { try { return localStorage.getItem(dk(k) + "-sent"); } catch(e){ return null; } };
  const markSent = k => { try { localStorage.setItem(dk(k) + "-sent", JSON.stringify(draft(k))); } catch(e){} };
  const dirty = k => { const d = JSON.stringify(draft(k)); return d !== "{}" && d !== sentOf(k); };
  const shortT = t => String(t || "").replace(/：[^・]*・/, "・");
  const navHtml = () => { const ks = ORD.filter(k => Q[k]); if(ks.length < 2 && !(live && view && live.key !== view)) return "";
    return `<nav class="jnav">${ks.map(k => `<button type="button" data-jv="${esc(k)}" class="${k === view ? "on" : ""}">${sentOf(k) ? "✓ " : ""}${esc(shortT(Q[k].title))}${live && live.key === k && k !== view ? `<i class="jlive"></i>` : ""}</button>`).join("")}</nav>`
      + (live && view && live.key !== view ? `<button type="button" class="jnew" data-jv="${esc(live.key)}">老師在：${esc(shortT(live.title))}　前往 ›</button>` : ""); };
  /* JOINUI_V2 對話分行、A/B 標在前面；空格直接打在線上 */
  const BL = /[＿_]{2,}/g;
  const jItem = (q, i, dv) => { const pk = (cur.pick || [])[i]; if(pk){ const n = Math.abs(pk), sel = String(dv || "").toLowerCase();
      const lines = String(q).split(/\s*(?=[AB甲乙][：:])/).map(x => x.trim()).filter(Boolean).map(l => { const m = l.match(/^([AB甲乙])[：:]\s*(.*)$/), t = esc(m ? m[2] : l).replace(BL, `<span class="jline"></span>`); return m ? `<div class="dl"><b>${m[1]}</b><span>${t}</span></div>` : `<div class="dl"><span>${t}</span></div>`; }).join("");
      return `<div class="item"><i class="no">${i+1}</i><div class="qb">${lines}<div class="jpick">${[...Array(n).keys()].map(k => { const c = String.fromCharCode(97 + k); return `<button type="button" class="${sel.includes(c) ? "on" : ""}" data-pi="${i}" data-pc="${c}" data-one="${pk < 0 ? 1 : ""}">${c}</button>`; }).join("")}<input type="hidden" data-i="${i}" data-b="-1" value="${esc(sel)}"></div></div></div>`; }
    const parts = String(dv || "").split("／"); let b = 0;
    const lines = String(q).split(/\s*(?=[AB甲乙][：:])/).map(x => x.trim()).filter(Boolean);
    const body = lines.map(l => { const m = l.match(/^([AB甲乙])[：:]\s*(.*)$/); const wide = !String(m ? m[2] : l).replace(BL, "").replace(/[\s。，！？、,.!?；;…]/g, ""); const t = esc(m ? m[2] : l).replace(BL, () => { const v = parts[b] || ""; return `<input class="bl${wide ? " wide" : ""}" data-i="${i}" data-b="${b++}" value="${esc(v)}" style="${wide ? "" : `width:${Math.max(7, [...v].length + 1.5)}em`}" maxlength="80" aria-label="第 ${i+1} 題空格">`; }), tt = wide ? (t.match(/<input[^>]*>/g) || []).join("") : t;
      return m ? `<div class="dl"><b>${m[1]}</b><span>${tt}</span></div>` : `<div class="dl"><span>${tt}</span></div>`; }).join("");
    return `<div class="item${b ? "" : " open"}"><i class="no">${i+1}</i><div class="qb">${body}${b ? "" : `<textarea data-i="${i}" data-b="-1" maxlength="500" placeholder="寫你的回答">${esc(dv || "")}</textarea>`}</div></div>`; };
  /* JDICT_V1 聽寫：跟投影片一樣，空格直接挖在對話裡 */
  const jDict = d => `<div class="jdict">${(cur.lines||[]).map(l => { const m = l.match(/^([^：:]{1,8})[：:](.*)$/), body = esc(m ? m[2] : l).replace(/（(\d+)）/g, (x, n) => { const i = +n - 1, v = d[i] || ""; return `<input class="bl db" data-i="${i}" value="${esc(v)}" maxlength="40" style="width:${Math.max(4, [...v].length + 1.5)}em" aria-label="第 ${n} 格" placeholder="${n}">`; });
    return m ? `<div class="dl"><b>${esc(m[1])}</b><span>${body}</span></div>` : `<div class="dl"><span>${body}</span></div>`; }).join("")}</div>`;
  /* LORDER_V1 看圖排序：照順序點圖片 */
  const jOrder = d => { const pk = String(d.pk || "").split(",").filter(x => x !== "").map(Number);
    return `<div class="jord">${(cur.imgs||[]).map((u, k) => { const p = pk.indexOf(k); return `<button type="button" class="jo${p >= 0 ? " on" : ""}" data-ok="${k}"><img src="${esc(u)}" alt="" decoding="async"><span class="jb">${p >= 0 ? p + 1 : ""}</span></button>`; }).join("")}</div>
      <div class="jometa">已排 ${pk.length} / ${(cur.imgs||[]).length}<button type="button" data-j="oclr">重排</button></div>`; };
  const jVal = (f, i) => { const xs = [...f.querySelectorAll(`[data-i="${i}"]`)]; if(xs.length === 1 && xs[0].dataset.b !== "0") return xs[0].value.trim(); const vs = xs.map(x => x.value.trim()); return vs.some(Boolean) ? vs.join("／") : ""; };
  function draw(msg, cls){ const head = `<header class="jh"><span class="logo">Q</span><b>課堂作答</b>${me ? `<span class="jwho">${esc(me.name)}<button type="button" data-j="out">登出</button></span>` : ""}</header>`;
    if(auth === "wait"){ root.innerHTML = head + `<div class="jcard"><div class="note">連線中…</div></div>`; return; }
    /* JGATE_V1 學生登入畫面：跟老師登入一樣的樣子，但分開、不帶老師帳號 */
    const lg = auth === "out" || auth === "nostu"; jg.hidden = !lg; root.hidden = lg;
    if(lg){ const msg = auth === "nostu" ? "這個帳號不是學生帳號，請用學生帳號登入。" : lerr;
      if(!jg.querySelector("form")){ jg.innerHTML = `<div class="gtcard"><div class="gside"><div><span class="gtq">Q</span><div class="gbrand">QNA CHINESE</div><h1>課堂作答</h1></div><div class="gzh">華語</div></div>
        <form class="gform" data-j="login"><h2>學生登入</h2><div class="gfield"><label for="jem">Email</label><input id="jem" type="email" autocomplete="username" required></div>
        <div class="gfield"><label for="jpw">密碼</label><input id="jpw" type="password" autocomplete="current-password" required></div><button type="submit">登入</button><div class="ge" id="jerr"></div></form></div>`; }
      $("#jerr").textContent = msg; return; }
    if(state === "load"){ root.innerHTML = head + `<div class="jcard"><div class="note">連線中…</div></div>`; return; }
    if(state === "closed"){ root.innerHTML = head + `<div class="jcard"><div class="note">找不到代碼「${esc(code)}」，或這次作答已經結束了。</div><p style="text-align:center;margin:14px 0 0"><a href="/join/" style="color:var(--navy);font-weight:700">重新輸入代碼</a></p></div>`; return; }
    if(!cur){ root.innerHTML = head + navHtml() + `<div class="jcard"><div class="note">等老師出題…</div></div>`; return; }
    const d = draft(cur.key);
    root.innerHTML = head + navHtml() + `<form class="jcard" data-j="send"><h2>${esc(cur.title || "")}</h2>${cur.instr ? `<div class="instr">${esc(cur.instr)}</div>` : ""}
      ${(cur.opts||[]).length ? `<div class="opts">${cur.opts.map(o => `<div>${esc(o)}</div>`).join("")}</div>` : ""}
      ${cur.kind === "dict" ? jDict(d) : cur.kind === "order" ? jOrder(d) : ((cur.imgs||[]).length ? `<div class="jimgs">${cur.imgs.map((u, i) => `<figure><img src="${esc(u)}" alt=""><figcaption>${i+1}</figcaption></figure>`).join("")}</div>` : "") + (cur.items||[]).map((q, i) => jItem(q, i, d[i])).join("")}
      <button class="send" type="submit">送出</button><div class="note ${cls || ""}" id="jmsg">${msg || ""}</div></form>`; }
  jg.addEventListener("submit", async e => { e.preventDefault(); const f = e.target, b = f.querySelector("button"); b.disabled = true; lerr = ""; $("#jerr").textContent = "";
    try { await firebase.auth().signInWithEmailAndPassword($("#jem").value.trim(), $("#jpw").value); $("#jpw").value = ""; }
    catch(err){ lerr = /network/i.test(err && err.code || "") ? "連不上網路，請再試一次。" : "Email 或密碼不對。"; draw(); }
    b.disabled = false; });
  root.addEventListener("input", e => { const t = e.target; if(!cur || t.dataset.i === undefined) return; if(t.classList.contains("bl") && !t.classList.contains("wide")) t.style.width = Math.max(7, [...t.value].length + 1.5) + "em"; const d = draft(cur.key); d[t.dataset.i] = t.dataset.b === undefined ? t.value : jVal(t.form, t.dataset.i); try { localStorage.setItem(dk(cur.key), JSON.stringify(d)); } catch(err){} });
  root.addEventListener("click", e => { if(e.target.closest("[data-j='out']")){ firebase.auth().signOut(); return; }
    const pb = e.target.closest("[data-pi]"); if(pb && cur){ const i = pb.dataset.pi, c = pb.dataset.pc, d = draft(cur.key); let v = String(d[i] || "");
      v = pb.dataset.one ? (v === c ? "" : c) : (v.includes(c) ? v.replace(c, "") : [...(v + c)].sort().join("")); d[i] = v; try { localStorage.setItem(dk(cur.key), JSON.stringify(d)); } catch(err){}
      pb.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", v.includes(x.dataset.pc))); pb.parentNode.querySelector("input").value = v; return; }
    const jv = e.target.closest("[data-jv]"); if(jv){ view = jv.dataset.jv; cur = Q[view] || null; sig = ""; draw(); window.scrollTo(0, 0); return; }
    const o = e.target.closest("[data-ok]"), clr = e.target.closest("[data-j='oclr']"); if(!(o || clr) || !cur) return;
    const d = draft(cur.key); let pk = String(d.pk || "").split(",").filter(x => x !== "").map(Number);
    if(clr) pk = []; else { const k = +o.dataset.ok, p = pk.indexOf(k); if(p >= 0) pk.splice(p, 1); else pk.push(k); }
    d.pk = pk.join(","); try { localStorage.setItem(dk(cur.key), JSON.stringify(d)); } catch(err){}
    /* JOFAST_V1 點圖片只改號碼，不重畫整頁（重畫會把圖片全部重新載入，手機很卡） */
    const box = root.querySelector(".jord"); if(!box) return draw();
    box.querySelectorAll("[data-ok]").forEach(b => { const p = pk.indexOf(+b.dataset.ok); b.classList.toggle("on", p >= 0); const jb = b.querySelector(".jb"); if(jb) jb.textContent = p >= 0 ? p + 1 : ""; });
    const mt = root.querySelector(".jometa"); if(mt && mt.firstChild) mt.firstChild.textContent = `已排 ${pk.length} / ${(cur.imgs||[]).length}`; });
  root.addEventListener("submit", async e => { e.preventDefault(); const f = e.target;
    if(f.dataset.j === "send" && cur && me && cur.kind === "order"){ const pk = String(draft(cur.key).pk || "").split(",").filter(x => x !== "").map(Number), n = (cur.imgs||[]).length;
      if(pk.length < n){ $("#jmsg").textContent = "請把每一張圖都排好。"; $("#jmsg").className = "note err"; return; }
      const a = {0: pk.map(k => (cur.perm||[])[k]).join(",")}, btn = f.querySelector(".send"); btn.disabled = true;
      try { await fs.collection("slide_live").doc(code).collection("answers").doc(("u_" + me.uid + "__" + cur.key).replace(/\//g, "_").slice(0, 300)).set({name: me.name, q: cur.key, a, t: Date.now()});
        markSent(cur.key); $("#jmsg").textContent = "已送出 ✓（改了可以再送出一次）"; $("#jmsg").className = "note ok"; } catch(err){ $("#jmsg").textContent = "送出失敗，請再試一次。"; $("#jmsg").className = "note err"; }
      btn.disabled = false; return; }
    if(f.dataset.j === "send" && cur && me){ const a = {}; [...new Set([...f.querySelectorAll("[data-i]")].map(x => x.dataset.i))].forEach(i => { const x = f.querySelector(`[data-i="${i}"]`); const v = (x.dataset.b === undefined ? x.value.trim() : jVal(f, i)).slice(0, 500); if(v && v.replace(/／/g, "")) a[i] = v; });
      if(!Object.keys(a).length){ $("#jmsg").textContent = "請先寫答案。"; return; }
      const btn = f.querySelector(".send"); btn.disabled = true;
      try { await fs.collection("slide_live").doc(code).collection("answers").doc(("u_" + me.uid + "__" + cur.key).replace(/\//g, "_").slice(0, 300)).set({name: me.name, q: cur.key, a, t: Date.now()});
        markSent(cur.key); const sm = $("#jmsg"), nv = root.querySelector("nav.jnav button.on"); if(nv && !/^✓/.test(nv.textContent)) nv.textContent = "✓ " + nv.textContent; sm.textContent = "已送出 ✓（改了可以再送出一次）"; sm.className = "note ok"; }
      catch(err){ $("#jmsg").textContent = "送出失敗，請再試一次。"; $("#jmsg").className = "note err"; }
      btn.disabled = false; } });
  draw();
  if(!fs){ auth = "on"; state = "closed"; return draw(); }
  let unS = null;
  const listen = () => { if(unS) return; unS = fs.collection("slide_live").doc(code).onSnapshot(s => { if(!s.exists || !s.data().open){ state = "closed"; cur = null; return draw(); }
    const D = s.data(); state = "on"; live = D.cur || null; Q = Object.assign({}, D.qs || {}); if(live) Q[live.key] = live;
    ORD = (Array.isArray(D.order) ? D.order : []).filter(k => Q[k]); if(live && !ORD.includes(live.key)) ORD.push(live.key);
    /* JSAMEL_V1 同一個作答代碼如果用過別課，學生只看得到老師現在這一課的題目 */
    { const lp = k => String(k || "").split(":")[0]; if(live){ ORD = ORD.filter(k => lp(k) === lp(live.key)); if(view && lp(view) !== lp(live.key)) view = null; } }
