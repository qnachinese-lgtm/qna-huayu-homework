<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上課投影片｜QNA CHINESE</title>
<link rel="icon" href="icon-192.png">
<!-- IMPORT_V1 從教材與課程匯入 -->
<!-- RTITLE_V1 匯入短文標題 -->
<!-- QAIMPORT_V1 匯入問題與討論 -->
<!-- GFONT_V1 語法說明例句同大小 -->
<!-- NAVSAME_V1 上一頁下一頁同色 -->
<!-- GDOCK_V1 語法工具列；IMPAUDIO_V1 匯入音檔 -->
<!-- GQIMPORT_V1 匯入語法練習題 -->
<!-- READFIT_V1 短文放進同一個框 -->
<!-- ORDER_V1 看圖排序；WCOVER_V1 生詞先遮住 -->
<!-- ONENAV_V1 只留一組上一頁下一頁 -->
<!-- DOCK_V2 下方工具列改成一般按鈕 -->
<!-- WDOCK_V1 生詞工具列重做、拿掉提示字 -->
<!-- EXCENTER_V1 例句置中 -->
<!-- LAYOUT_V2 版面重新設計 -->
<!-- KAIFONT_V1 全部用標楷體＋Times New Roman -->
<!-- EXAB_V1 例句對話分行 -->
<!-- NOFLOWNOTE_V1 拿掉右邊重複的上課流程 -->
<!-- PTOPT_V1 拼音翻譯欄可隱藏、句子框變大 -->
<!-- WFIX_V1 生詞卡位置固定；拿掉對話標題 -->
<!-- WLIST_V1 生詞清單精簡 -->
<!-- LPICK_V1 課次選單重做 -->
<!-- WORDBOOK_V1 相關詞照課本排列 -->
<!-- WORDGRP_V1 生詞可加相關詞與多個例句 -->
<!-- SMALLNUM_V1 課次數字縮小 -->
<!-- SHORTTIP_V1 說明文字精簡 -->
<!-- AVDRAG_V1 拖曳圓框選臉 -->
<!-- AVATAR_V1 人物頭像照片 -->
<!-- BLUE_V1 不用粉紅綠，改藍色系 -->
<!-- NOPH_V1 輸入框不放範例 -->
<!-- SLIDES_V1 上課投影片：課程內容存在 Firestore 的 slide_lessons（不碰 lessons 和漢字遊戲） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
/* 版面：左側課次＋直式進度｜中間主舞台｜右側老師控制面板 */
:root{
  --navy:#1E4C86; --navy-ink:#163a68; --sky:#8FB8E8; --ice:#EEF4FB;
  --pink:#2F64B0; --mint:#6FA3DD; --yellow:#FFD34E; --lav:#B79CED;
  --bg:#E3EDFA; --panel:#FFFFFF; --fg:#1F2A44; --muted:#5E6B86; --line:#D9E3F1;
  --stage:#FFFFFF; --chip:#FFFFFF; --done:#1E4C86; --blank:#1E4C86; --ansc:#1E4C86; --err:#C23B3B;
  color-scheme:light;
  --zh:"Times New Roman","DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC","KaiTi",serif;
}
html,body{height:100%;overflow:hidden}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--zh);font-synthesis-weight:none;font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;display:grid;place-items:center}
.fit{position:relative;flex:none}
.fit .app{position:absolute;left:0;top:0;transform-origin:0 0}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{width:1280px;height:720px;display:grid;grid-template-columns:200px minmax(0,1fr) 250px;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;
  background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 6px 30px rgba(30,76,134,.10)}
/* 左側 */
.side{grid-row:1/4;display:flex;flex-direction:column;gap:6px;border-right:1px dashed var(--line);padding-right:14px;min-width:0}
.side .k{font-size:13px;color:var(--muted);letter-spacing:.1em}
.side .num{font-size:18px;line-height:1.3;font-weight:700;color:var(--navy)}
.side .lname{font-size:18px;font-weight:700;margin-bottom:6px}
.now{font-size:13px;color:var(--muted)} .now b{display:block;color:var(--fg);font-size:15px}
.steps{list-style:none;margin:auto 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:2px;background:var(--line)}
.steps.many li button{padding:4px 4px;font-size:15px}
.steps li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 4px;width:100%;font-size:16px;color:var(--muted);position:relative;border-radius:8px}
.steps li button:focus-visible{outline:3px solid var(--sky)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--sky);background:var(--panel);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.steps li.done .dot{background:var(--done);border-color:var(--done)}
.steps li.done .dot::after{content:"✓"}
.steps li.cur button{color:var(--fg);font-weight:700}
.steps li.cur .dot{background:var(--pink);border-color:var(--pink);box-shadow:0 0 0 5px color-mix(in srgb,var(--pink) 25%,transparent)}
/* 標題列 */
.head{grid-column:2/4;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;color:var(--navy);text-wrap:balance}
.head .hint{font-size:13px;color:var(--muted)}
/* 舞台 */
.stage{background:var(--stage);border:2px solid var(--line);border-radius:18px;padding:22px 28px;display:flex;flex-direction:column;min-width:0;min-height:340px;overflow:auto;position:relative}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tag span{background:var(--navy);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700}
.big{font-size:52px;font-weight:700;line-height:1.5}
.py{font-size:22px;color:var(--navy);font-style:italic}
.tr{font-size:15px;color:var(--muted)}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--blank);margin:0 .15em}
.ans{border-top:2px dashed var(--line);padding-top:14px;margin-top:auto}
.ans .big{font-size:34px;color:var(--ansc)}
.center{margin:auto 0;display:flex;flex-direction:column;gap:6px}
.wlist{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:30px;align-content:start;gap:4px;max-height:230px;overflow:auto;padding:6px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.wlist button{all:unset;display:block;line-height:22px;font-size:14px;padding:4px 6px;border-radius:7px;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.wlist button:hover{background:var(--ice)}
.wlist button[aria-pressed=true]{background:var(--navy);color:#fff}
.wbook{display:flex;flex-direction:column;gap:16px;margin:auto 0}
.whead{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 18px;background:var(--ice);border-radius:12px;padding:6px 18px}
.whead .ww{font-size:60px;font-weight:700;line-height:1.25}
.wbk.sub .whead .ww{font-size:48px}
.whead .py{font-size:26px}
.whead .wpos{font-size:20px;color:var(--muted)}
.whead .tr{font-size:20px}
.wex{padding:8px 18px 0}
.wex .zh{font-size:28px}
.wq{all:unset;cursor:pointer;font-weight:700;line-height:1.2;color:var(--sky);border:4px dashed var(--sky);border-radius:22px;padding:0 .25em;letter-spacing:.1em}
.wq:hover{background:var(--ice)}
.wblank{color:var(--navy);font-weight:700;letter-spacing:.1em}
.ogrid{display:grid;gap:16px;margin:auto 0;align-items:start}
.ocard{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--ice);border:3px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s,border-color .15s}
.ocard:hover:not(:disabled){transform:translateY(-3px);border-color:var(--sky)}
.ocard:focus-visible{outline:3px solid var(--sky)}
.ocard img{max-width:100%;object-fit:contain;border-radius:10px;display:block}
.ocard.ok{border-color:var(--navy)} .ocard.bad{border-color:var(--err)}
.obadge{position:absolute;top:-12px;left:-12px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:3px dashed var(--sky);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--navy)}
.obadge.on{background:var(--navy);border:3px solid var(--navy);color:#fff}
.obadge.on.bad{background:var(--err);border-color:var(--err)}
.ofix{font-size:15px;color:var(--err);font-weight:700}
.ocap{font-size:20px;text-align:center;line-height:1.5}
.oedit{display:flex;flex-direction:column;gap:10px}
.orow{display:grid;grid-template-columns:28px 140px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:8px}
.orow img{width:140px;height:90px;object-fit:contain;background:var(--ice);border-radius:8px}
.orow input{font:inherit;font-size:15px;border:2px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.orow .obtns{display:flex;gap:4px}
.orow .obtns button{width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
.wexc .wexs{display:inline-flex;text-align:left}
.wexs{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:1.4em}
.wexs li .zh{font-size:24px}
.wexs .py{font-size:17px}
.wsubs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.wsub{background:var(--ice);border-radius:12px;padding:8px 14px;text-align:left;max-width:100%}
.wsub b{font-size:26px;font-weight:700;margin-right:8px}
.wsub .py{font-size:17px}
.wsub .wexs li .zh{font-size:18px}
.wtype{width:52px;height:32px;border-radius:9px;border:none;font:inherit;font-size:13px;font-weight:700;color:#fff;cursor:pointer}
.tbl input.subin{border-left:5px solid var(--sky)}
.hidePy .py{visibility:hidden} .hideTr .tr{visibility:hidden}
/* 右側 */
.ctrl{display:flex;flex-direction:column;gap:10px;min-width:0}
.ctrl h3{margin:0;font-size:13px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--navy);background:var(--chip);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.btn{border:none;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:700;background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--navy)}
.btn.pink{background:var(--pink);color:#fff}
.btn.mint{background:var(--mint);color:#0f2a4d}
.meta{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.note{margin-top:auto;font-size:13px;color:var(--muted);background:var(--ice);border-radius:12px;padding:10px 12px;line-height:1.6}
.note b{color:var(--fg)}
.timer{display:flex;align-items:center;gap:10px;justify-content:center}
.timer svg{width:54px;height:54px}
.timer .t{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:2ch}
/* 底部 */
.foot{grid-column:2/4;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.foot .pager{display:flex;gap:8px;align-items:center}
.bar{flex:1;min-width:120px;height:8px;background:var(--ice);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--navy));transition:width .35s}
.small{font-size:14px;padding:7px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg)}
/* 內容樣式 */
.goals{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:g}
.goals li{counter-increment:g;display:flex;gap:12px;align-items:flex-start;background:var(--ice);border-radius:12px;padding:10px 14px;font-size:20px;line-height:1.5}
.goals li::before{content:counter(g);flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:700;margin-top:2px}
.dlg{display:flex;flex-direction:column;gap:10px;margin:auto 0}
.line{display:flex;gap:12px;align-items:flex-start;transition:opacity .2s}
.line.r{flex-direction:row-reverse}
.line.dim{opacity:.35}
.av{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:3px}
.who{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff}
.av .nm{font-size:12px;color:var(--muted)}
.bub{max-width:68%;background:var(--panel);border:2px solid var(--pink);border-radius:16px;padding:8px 16px;line-height:1.35;transition:box-shadow .2s,transform .2s}
.line.r .bub{background:var(--ice);border-color:var(--mint)}
.line.on .bub{box-shadow:0 6px 18px rgba(30,76,134,.18);transform:scale(1.02)}
.bub .zh{font-size:25px}
.bub .py{font-size:16px}
.bub .tr{font-size:13px}
.pattern{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:24px;font-weight:700;margin:14px 0 20px}
.pattern span{padding:6px 18px;border-radius:999px;color:#1F2A44}
.exs{display:flex;flex-direction:column;gap:12px}
.ex .zh{font-size:28px}
.check{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.check label{display:flex;gap:10px;align-items:center;background:var(--ice);border-radius:12px;padding:12px;font-size:18px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--mint)}
.app{position:relative}
.lsel{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.lsel select{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);max-width:100%}
.lsel .row{display:flex;gap:6px}
.lpick{position:relative}
#lpBtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;font:inherit;font-size:14px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);cursor:pointer;text-align:left}
#lpBtn:hover,#lpBtn[aria-expanded=true]{border-color:var(--sky)}
#lpLab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lpPanel{position:absolute;left:0;top:calc(100% + 6px);width:300px;max-height:440px;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,60,.16);padding:6px;z-index:40}
.lpPanel .gh{font-size:12px;color:var(--muted);font-weight:700;padding:10px 10px 4px}
.lpPanel button{all:unset;display:block;width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;font-size:15px;cursor:pointer;color:var(--fg)}
.lpPanel button:hover{background:var(--ice)}
.lpPanel button.on{background:var(--navy);color:#fff}
.lsel .row button{flex:1;font-size:13px;padding:6px 4px;border-radius:10px;border:2px solid var(--navy);background:var(--panel);color:var(--fg)}
.lsel .row button.pri{background:var(--navy);color:#fff}
.modal{position:fixed;inset:0;background:var(--panel);display:flex;z-index:50}
.imp{position:fixed;inset:0;background:rgba(15,30,60,.35);display:flex;align-items:center;justify-content:center;z-index:60;font-family:var(--zh)}
.imp[hidden]{display:none}
.impcard{background:var(--panel);border-radius:16px;width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;gap:10px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.impcard h2{margin:0;font-size:20px;color:var(--navy)}
.impcard select{font:inherit;font-size:15px;padding:6px 8px;border:2px solid var(--line);border-radius:10px}
.implist{overflow:auto;flex:1;border:2px solid var(--line);border-radius:12px;padding:6px 10px;min-height:120px}
.implist label{display:flex;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:16px;cursor:pointer}
.implist label:last-child{border-bottom:none}
.implist small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap}
.impfoot{display:flex;gap:8px;align-items:center}
.impfoot .msg{flex:1;font-size:13px;color:var(--muted)}
.sheet{width:100%;height:100%;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:12px}
.sheet header h2{margin:0;font-size:22px;color:var(--navy)}
.edwrap{flex:1;display:flex;min-height:0;overflow:hidden}
.edtabs{width:200px;flex:none;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;background:var(--ice);overflow-y:auto;min-height:0}
.edtabs button{all:unset;flex:none;cursor:pointer;padding:8px 12px;border-radius:10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;color:var(--fg)}
.edtabs button:focus-visible{outline:3px solid var(--sky)}
.edtabs button[aria-selected="true"]{background:var(--navy);color:#fff;font-weight:700}
.edtabs .cnt{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.sheet .body{flex:1;overflow:auto;padding:22px 32px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{margin:0;font-size:20px;color:var(--navy);white-space:nowrap}
.sec-h small{color:var(--muted);font-size:13px}
.tbl{display:grid;gap:6px;align-items:center}
.tbl .th{font-size:13px;color:var(--muted);font-weight:700;padding:0 4px}
.tbl input{font-family:inherit;font-size:15px;border:2px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel);color:var(--fg);width:100%;min-width:0}
.tbl input:focus{outline:none;border-color:var(--sky)}
.tbl .no{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tbl .x{border:none;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;border-radius:8px}
.tbl .x:hover{background:var(--ice);color:var(--err)}
.role{width:40px;height:34px;border-radius:50%;border:none;font-weight:700;color:#fff;font-size:15px}
.wrow{display:flex;gap:24px;align-items:flex-start;margin:auto 0}
.wimg{max-width:44%;max-height:430px;border-radius:14px;object-fit:contain;background:var(--ice)}
.paras{display:flex;flex-direction:column;gap:12px}
.para{padding:10px 14px;border-radius:12px;border:2px solid transparent;transition:opacity .2s}
.para.on{background:var(--ice);border-color:var(--sky)}
.para.dim{opacity:.35}
.para .zh{font-size:var(--rfs,24px);line-height:1.6}
.paras{display:flex;flex-direction:column;gap:4px}
.paras .para{padding:6px 14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.split .basic,.split .flowbox{max-width:none}
.flowbox{display:flex;flex-direction:column;gap:8px;max-width:760px}
.flowrow{display:flex;align-items:center;gap:8px;background:var(--ice);border-radius:10px;padding:6px 10px}
.flowrow b{flex:1;font-size:16px}
.flowrow button{border:none;background:var(--panel);border-radius:8px;width:30px;height:28px;cursor:pointer;color:var(--fg)}
.tsplit{display:grid;grid-template-columns:40% minmax(0,1fr);gap:20px;align-items:center;margin:auto 0}
.tsplit .bub{max-width:84%;padding:6px 12px}
.tsplit .bub .zh{font-size:21px}
.tsplit .bub .py{font-size:14px}
.tsplit .bub .tr{font-size:12px}
.tsplit .dlg{gap:6px;max-height:560px;overflow:auto}
.tsplit .who{width:38px;height:38px;font-size:16px}
.tsplit .av{width:48px}
.tpic{display:flex;align-items:center;justify-content:center;min-height:300px;background:var(--ice);border-radius:14px;overflow:hidden}
.tpic img{max-width:100%;max-height:520px;object-fit:contain;display:block}
.thumb{position:relative;display:inline-block}
.thumb img{height:72px;border-radius:8px;display:block}

.tbl textarea.grow:focus{outline:none;border-color:var(--sky)}

.excard{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}

.gsec{display:flex;gap:14px;align-items:flex-start}
.gtag{flex:none;background:var(--navy);color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;font-weight:700;margin-top:4px}

.gqs{display:flex;flex-direction:column;gap:10px}
.gq{all:unset;cursor:pointer;display:flex;gap:14px;align-items:flex-start;background:var(--ice);border-radius:14px;padding:10px 14px}
.gq:focus-visible{outline:3px solid var(--sky)}
.qblank{display:inline-block;min-width:5em;border-bottom:2px solid var(--blank);margin:0 .2em;vertical-align:baseline;height:1em}
.dblank{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;height:1.35em;margin:0 .12em;padding:0 .3em;border:none;border-bottom:3px solid var(--blank);background:var(--ice);border-radius:6px 6px 0 0;font:inherit;color:var(--fg);cursor:pointer;vertical-align:baseline}
.dblank i{font-style:normal;font-size:.55em;color:var(--muted)}
.dblank.on{color:var(--ansc);font-weight:700;background:transparent}
.gcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.gcard .basic{max-width:none}
.addrow{align-self:flex-start;border:2px dashed var(--sky);background:transparent;color:var(--navy);border-radius:10px;padding:8px 16px;font-size:15px}
.basic{display:grid;grid-template-columns:120px 1fr;gap:12px 14px;align-items:center;max-width:760px}
.basic label{font-weight:700}
.basic input{font-family:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--fg);width:100%}
.basic small{grid-column:2;color:var(--muted);font-size:12px;margin-top:-8px}
.pv{display:flex;gap:6px;flex-wrap:wrap;grid-column:2}
.pv span{padding:4px 14px;border-radius:999px;font-weight:700;color:#1F2A44}
.sheet .full{grid-column:1/3}

.fld label{font-weight:700;font-size:15px}

.pop{animation:pop .28s ease-out}

/* LAYOUT_V2 新版面：上方課名＋橫向進度｜中間大舞台｜下方老師工具列 */
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px;padding:16px 22px 14px;overflow:hidden;
  background:var(--panel)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.tools .lpick{width:240px}
.lpPanel{left:auto;right:0}
.tmenu{position:relative}
#tmBtn{font:inherit;font-size:14px;padding:7px 12px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg)}
#tmBtn[aria-expanded=true]{border-color:var(--sky)}
.tmPanel{position:absolute;right:0;top:calc(100% + 6px);width:240px;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,60,.16);padding:10px;z-index:45;display:flex;flex-direction:column;gap:8px}
.tmPanel[hidden]{display:none}
.tmPanel .row{display:flex;gap:6px}
.tmPanel .row button{flex:1;font-size:13px;padding:7px 4px;border-radius:10px;border:2px solid var(--navy);background:var(--panel);color:var(--fg)}
.tmPanel .row button.pri{background:var(--navy);color:#fff}
.track{background:var(--ice);border-radius:999px;padding:6px 8px}
.steps{display:flex;gap:4px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
.steps::before{display:none}
.steps li{flex:1 1 0;min-width:0}
.steps li button,.steps.many li button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:6px 10px;border-radius:999px;font-size:15px;color:var(--muted);white-space:nowrap}
.steps li button:hover{background:color-mix(in srgb,var(--sky) 25%,transparent)}
.steps .dot{width:22px;height:22px;border:2px solid var(--sky);background:var(--panel);color:var(--navy);font-size:12px;font-weight:700}
.steps li.done .dot::after{content:none}
.steps li.done button{color:var(--navy)}
.steps li.done .dot{background:var(--sky);border-color:var(--sky);color:#fff}
.steps li.cur button{background:var(--navy);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--navy-ink)}
.steps li.cur .dot{background:#fff;border-color:#fff;color:var(--navy);box-shadow:none}
.head{grid-column:auto;align-items:center;padding:0 4px}
.head h1{font-size:24px}
.head h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--yellow);margin-right:10px;vertical-align:middle;transform:rotate(45deg)}
.stage{grid-column:auto;border-radius:22px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.dock{display:flex;align-items:center;gap:12px;border-top:2px dashed var(--line);padding:10px 2px 0;min-height:56px}
.navb{flex:none;border:2px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;white-space:nowrap}
.navb.ghost{background:var(--panel);color:var(--navy)}
.navb:disabled{background:var(--panel);border-color:var(--line);color:var(--line);cursor:default}
.dock .meta{flex:none;font-size:13px}
.ctrl{flex:1;min-width:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
.ctrl h3,.ctrl .note{display:none}
.ctrl .btn{padding:9px 16px;font-size:15px;border-radius:999px;white-space:nowrap}
.ctrl .btn.ghost{background:var(--panel)}
.ctrl .chips{flex-wrap:nowrap}
.ctrl .chip{background:var(--panel)}
.ctrl .chip[aria-pressed=true]{background:var(--navy);color:#fff}
.ctrl .meta{text-align:left}
.wpick{position:relative}
.wlb{font-variant-numeric:tabular-nums;min-width:96px}
.ctrl .wlist{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translateX(-50%);width:440px;max-height:300px;grid-template-columns:repeat(4,minmax(0,1fr));overflow-y:auto;padding:8px;box-shadow:0 10px 28px rgba(15,30,60,.18);z-index:30}
.ctrl .wlist[hidden]{display:none}
.ctrl .gap{flex:1}
.ctrl .glist{position:absolute;left:0;bottom:calc(100% + 12px);width:380px;max-height:320px;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(15,30,60,.18);padding:6px;z-index:30;display:flex;flex-direction:column;gap:2px}
.ctrl .glist[hidden]{display:none}
.glist button{all:unset;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:16px;cursor:pointer;color:var(--fg)}
.glist button b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ice);color:var(--navy);display:grid;place-items:center;font-size:13px}
.glist button:hover{background:var(--ice)}
.glist button[aria-pressed=true]{background:var(--navy);color:#fff}
.glist button[aria-pressed=true] b{background:#fff}
.seg{display:flex;background:var(--panel);border:2px solid var(--navy);border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font-size:15px;color:var(--navy);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
.head .hint{display:none}
.ctrl .timer svg{width:40px;height:40px}
</style>
</head>

<div class="fit" id="fit"><div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">Q</span><div class="bname"><div class="num" id="sNum"></div><div class="lname" id="sName"></div></div></div>
    <div class="tools">
      <div class="lpick"><button id="lpBtn" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="lpLab"></span><span aria-hidden="true">▾</span></button><div class="lpPanel" id="lpPanel" role="listbox" hidden></div></div>
      <select id="lessonSel" aria-label="選擇課次" hidden></select>
      <div class="tmenu"><button id="tmBtn" type="button" aria-expanded="false">老師 ▾</button>
        <div class="tmPanel" id="tmPanel" hidden>
          <div class="row" id="editRow" hidden><button id="editBtn" class="pri">編輯／匯入</button><button id="newBtn">＋新的一課</button></div>
          <div class="row" id="impRow" hidden><button id="impBtn">從教材與課程匯入</button></div>
          <div class="row" id="loginRow"><button id="loginBtn">老師登入</button></div>
          <form id="loginForm" hidden style="display:flex;flex-direction:column;gap:6px">
            <input id="lg-email" type="email" placeholder="Email" autocomplete="username" style="font:inherit;font-size:13px;padding:6px 8px;border:2px solid var(--line);border-radius:8px">
            <input id="lg-pw" type="password" placeholder="密碼" autocomplete="current-password" style="font:inherit;font-size:13px;padding:6px 8px;border:2px solid var(--line);border-radius:8px">
            <button class="btn" type="submit" style="padding:6px;font-size:14px">登入</button>
            <span id="lg-err" style="font-size:12px;color:var(--err)"></span>
          </form>
          <button id="logoutBtn" hidden style="all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline;align-self:flex-start">登出</button>
        </div></div>
      <button class="small" id="fs">全螢幕</button>
    </div>
  </header>
  <nav class="track" aria-label="上課進度"><ol class="steps" id="steps"></ol><span class="now" hidden><b id="nowName"></b></span></nav>
  <header class="head">
    <h1 id="title"></h1>
    <span class="hint" id="hint"></span>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="dock">
    <button class="navb" id="prev">‹ 上一頁</button>
    <section class="ctrl" id="ctrl" aria-label="老師控制面板"></section>
    <span class="meta" id="pageNo"></span><div class="bar" aria-hidden="true" hidden><i id="barFill"></i></div>
    <button class="navb" id="next">下一頁 ›</button>
  </footer>
  <div class="modal" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edTitle">
      <header><h2 id="edTitle">編輯課程內容</h2><span class="hint">一格填一個欄位・可以從 Excel／Google 試算表直接貼上多行</span></header>
      <div class="edwrap">
        <nav class="edtabs" id="edTabs" aria-label="編輯分類"></nav>
        <div class="body" id="edBody"></div>
      </div>
      <footer>
        <button class="btn danger" id="edDel" type="button">刪除這一課</button>
        <span class="msg" id="edMsg" aria-live="polite"></span>
        <button class="btn ghost" id="edCancel" type="button">取消</button>
        <button class="btn" id="edSave" type="button">儲存</button>
      </footer>
    </div>
  </div>
</div></div>

<script>

  if(b.dataset.rate){ aRate = +b.dataset.rate; if(AUD) AUD.playbackRate = aRate; return render(); }
  if(b.dataset.g && $("#modal").hidden){ gi = +b.dataset.g; gp = 0; gShow = false; gRev = {}; return render(); }
  if(b.dataset.gp !== undefined && $("#modal").hidden){ gp = +b.dataset.gp; gShow = false; gRev = {}; return render(); }
  if(b.dataset.gq !== undefined && $("#modal").hidden){ const i = +b.dataset.gq; gRev[i] = !gRev[i]; return render(); }
  if(b.dataset.f){ filter = b.dataset.f; stopTimer(); shuffle(); return renderDraw(); }
  if(b.dataset.t){ if(b.dataset.t==="py") showPy=!showPy; else showTr=!showTr; return STEPS[step].key==="draw"?renderDraw():render(); }

  if(a==="next") go(step+1);

  if(a==="wcover"){ wCover = !wCover; wOpen = -1; return render(); }
  if(a==="wopen"){ wOpen = wi; return render(); }
  if(a==="oshuf"){ oPerm = null; oPick = []; oCheck = false; return render(); }
  if(a==="oclear"){ oPick = []; oCheck = false; return render(); }
  if(a==="ocheck"){ oCheck = !oCheck; return render(); }
  if(a==="ostory"){ oStory = !oStory; return render(); }
  if(a==="wprev"){ const n = Math.max(1,WG(LESSON).length); wi = (wi-1+n)%n; render(); }
  if(a==="wnext"){ wi = (wi+1)%Math.max(1,WG(LESSON).length); render(); }

  if(a==="lnext"){ li = (li+1)%LESSON.dialog.length; render(); }
  if(a==="lall"){ li = -1; render(); }

  if(a==="aback" && AUD){ AUD.currentTime = Math.max(0, AUD.currentTime - 5); }
  if(a==="arestart" && AUD){ AUD.currentTime = 0; AUD.play().catch(()=>{}); }

  if(a==="rnext"){ const n = ((LESSON.read||{}).paras||[]).length; if(n){ ri = (ri+1) % n; render(); } }
  if(a==="rall"){ ri = -1; render(); }
  if(a==="qnext"){ const n = (LESSON.qa||[]).length; if(n){ qi = (qi+1) % n; render(); } }
  if(a==="qall"){ qi = -1; render(); }
  if(a==="qshow"){ qShow = !qShow; qRev = {}; render(); }
  if(a==="tnext" || a==="tprev"){ const n = (LESSON.textImgs||[]).length; if(n){ ti = (ti + (a==="tnext"?1:n-1)) % n; render(); } }

  if(a==="gnext"){ if(!gStep(1)){ gi = 0; gp = 0; } render(); }
  if(a==="gshow"){ gShow = !gShow; gRev = {}; render(); }
  if(a==="draw") draw();
  if(a==="ans"){ showAns=!showAns; renderDraw(); }
  if(a==="timer"){ timerId ? (stopTimer(), renderDraw()) : startTimer(); }
});
/* ONENAV_V1 只有一組上一頁／下一頁：先換步驟裡的生詞、句子、段落、語法頁，換完才到下一步 */
function advance(d){ const k = STEPS[step].key;
  if(k==="words"){ const n = WG(LESSON).length; if(d>0 && wi<n-1){ wi++; return render(); } if(d<0 && wi>0){ wi--; return render(); } }
  if(k==="text"){ const n = LESSON.dialog.length; if(d>0 && li<n-1){ li++; return render(); } if(d<0 && li>0){ li--; return render(); } }
  if(k==="read"){ const n = ((LESSON.read||{}).paras||[]).length; if(d>0 && ri<n-1){ ri++; return render(); } if(d<0 && ri>0){ ri--; return render(); } }
  if(k==="qa"){ const n = (LESSON.qa||[]).length; if(d>0 && qi<n-1){ qi++; return render(); } if(d<0 && qi>0){ qi--; return render(); } }
  if(k==="grammar" && gStep(d)) return render();
  go(step+d); }

  let s = String(sentence||""); if(/【/.test(s)) return s;
  const ws = (words||[]).map(w=>w[0]).filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const w of ws){ const i = s.indexOf(w); if(i>=0 && !inB(s,i)) s = s.slice(0,i)+"【"+w+"】"+s.slice(i+w.length); }

fillSel(); LESSON = lessons.find(x=>x.id===curId) || SAMPLE; applyFlow();
shuffle(); render(); fit();
</script>
</body>
